vas generalmente están muy sobreprotegidas por su familia.", "f": "D"}, {"id": "t5-057", "t": "t5", "lv": 1, "q": "Según el tema 5, ¿por qué todo centro educativo debe tener una política de actuación ante el acoso?", "o": ["Porque solo un abordaje integral del centro, no solo actuaciones de profesores, logra una resolución óptima", "Porque así la responsabilidad del caso se transfiere a la Inspección educativa desde el primer momento", "Porque solo con una política escrita puede expulsarse directamente al agresor del centro"], "e": "Todo centro debe tener una política de actuación: solamente un abordaje integral y la actuación global en el centro (no solo actuaciones concretas de los profesores) logrará una resolución óptima.", "f": "D"}, {"id": "t5-058", "t": "t5", "lv": 1, "q": "¿Qué tres obligaciones del centro educativo ante el acoso recoge el tema 5?", "o": ["Tener una política de actuación, apoyar al alumno acosado y a su familia, e intervenir con todo el grupo", "Sancionar al agresor, cambiar de grupo a la víctima e informar a la Inspección en un plazo de 24 horas", "Esperar a que el acoso se repita, informar a la familia del agresor y derivar el caso a la policía"], "e": "El centro debe: 1) tener una política de actuación integral; 2) al detectar un caso, proporcionar seguridad y apoyo emocional al alumno y apoyo a la familia; 3) realizar una intervención psicoeducativa con todo el grupo para que tome conciencia.", "f": "D"}, {"id": "t5-059", "t": "t5", "lv": 1, "q": "Según el protocolo de actuación del tema 5, ¿cuál es el primer paso que debe dar la dirección del centro?", "o": ["Entrevistar a la familia y al alumno acosado para conocer el alcance del problema", "Informar al Servicio de Inspección según el modelo que aporte dicho servicio", "Entrevistar a la familia y al alumno acosador"], "e": "El protocolo es: 1) entrevistar a la familia y al alumno acosado; 2) entrevistar a la familia y al alumno acosador; 3) convocar al Equipo Docente, Orientación y/o Comisión de Convivencia; 4) solicitar apoyo técnico del orientador; 5) informar al Servicio de Inspección.", "f": "D"}, {"id": "t5-060", "t": "t5", "lv": 1, "q": "¿Cuál es el último paso del protocolo de actuación ante el acoso recogido en el tema 5?", "o": ["Informar al Servicio de Inspección según el modelo que aporte dicho servicio", "Entrevistar a la familia y al alumno acosador para conocer su versión", "Convocar al Equipo Docente y al Departamento de Orientación"], "e": "El quinto y último paso es informar al Servicio de Inspección según el modelo que aporte el citado servicio. La diapositiva menciona además la figura del Coordinador de bienestar.", "f": "D"}, {"id": "t5-061", "t": "t5", "lv": 1, "q": "¿Quién debe activar el protocolo de actuación ante el acoso según el tema 5?", "o": ["La dirección del centro o la persona en quien delegue", "El tutor del alumno acosado, sin informar a nadie", "La familia del alumno acosado"], "e": "La diapositiva indica que la dirección del centro o la persona en quien delegue deberá seguir los pasos del protocolo.", "f": "D"}, {"id": "t5-062", "t": "t5", "lv": 1, "q": "¿Qué conductas deben distinguirse del acoso y denunciarse ante la policía o la fiscalía de menores según el tema 5?", "o": ["Robos, agresiones con armas, abusos sexuales y amenazas graves o con peligro para la vida", "Insultos, motes y burlas reiteradas entre compañeros del mismo grupo", "Exclusión de los juegos del recreo y difusión de rumores en el centro"], "e": "Hay que distinguir el acoso de las conductas antisociales o criminales, que deben denunciarse: robos, agresiones con armas u objetos punzantes, abusos sexuales y amenazas graves o en las que la vida de la víctima corra peligro.", "f": "D"}, {"id": "t5-063", "t": "t5", "lv": 1, "q": "La técnica del «sistema del amigo» consiste en:", "o": ["Elegir al compañero mejor predispuesto para que ayude al niño con dificultades a imitar habilidades interpersonales y reducir su estigmatización", "Que varios compañeros voluntarios acompañen al alumno en cambios de clase, entradas, salidas, excursiones y patio", "Que el agresor y la víctima trabajen juntos en clase para mejorar su relación y resolver el conflicto"], "e": "El sistema del amigo consiste en elegir al compañero mejor predispuesto para ayudar al niño con dificultades; ayuda a imitar habilidades interpersonales, potenciar el compañerismo y reducir la estigmatización. El acompañamiento por varios voluntarios es el círculo de amigos.", "f": "D"}, {"id": "t5-064", "t": "t5", "lv": 1, "q": "La técnica del «círculo de amigos» implica:", "o": ["Que varios compañeros voluntarios acompañen al alumno en cambios de clase, entradas, salidas, excursiones y patio", "Elegir al compañero mejor predispuesto para que ayude al niño a imitar habilidades interpersonales", "Que el alumno con dificultades elija a sus amigos para formar un grupo cerrado de trabajo en el aula"], "e": "En el círculo de amigos varios compañeros realizan voluntariamente actividades con el alumno para favorecer su integración social: supervisar cambios de clase, entradas, salidas y excursiones, y en el patio vigilar, proteger y promover su integración en juegos.", "f": "D"}, {"id": "t5-065", "t": "t5", "lv": 1, "q": "Según el tema 5, si alguien presencia una agresión y dice «¡Basta ya!»:", "o": ["En la mitad de los casos se termina la agresividad", "La agresión siempre se intensifica", "No tiene ningún efecto sobre el agresor"], "e": "La diapositiva indica que si alguien presencia una agresión y dice «¡Basta ya!», en la mitad de los casos se termina la agresividad. Presenciar el acoso y no hacer nada es aprobar la agresividad.", "f": "D"}, {"id": "t5-066", "t": "t5", "lv": 1, "q": "¿Qué pauta da el tema 5 a quien presencia un acoso y no puede intervenir directamente?", "o": ["Buscar al adulto más cercano, porque eso no es acusar", "Vengarse del agresor por su cuenta", "No intervenir para no convertirse en víctima"], "e": "Si quien observa no puede decir nada, debe buscar al adulto más cercano: «¡Eso no es acusar!». No debe usar la violencia ni vengarse, debe apoyar a la víctima e involucrar a tanta gente como pueda.", "f": "D"}, {"id": "t5-067", "t": "t5", "lv": 1, "q": "¿Cuál de las siguientes NO es una necesidad del alumnado acosado según el tema 5?", "o": ["Resolver la situación sin que lo sepan sus padres para no empeorarla", "Saber que se le cree y se confía en su testimonio", "Reforzar su autoestima elogiando sus capacidades personales"], "e": "El alumnado acosado necesita contar lo que sucede, saber que se le cree, que se le atiende y apoya, tener en cuenta que sus padres pueden ayudar a resolverlo y no a empeorarlo, ganar confianza, aprender a defenderse, reforzar su autoestima, ampliar su grupo de amigos, comunicarse con el profesorado y recibir educación emocional.", "f": "D"}, {"id": "t5-068", "t": "t5", "lv": 1, "q": "¿Qué entiende el tema 5 por educación emocional como necesidad del alumnado acosado?", "o": ["Capacitar en estrategias como la empatía, el autocontrol, la asertividad y el conocimiento emocional", "Enseñar a la víctima a reprimir sus emociones negativas para no dar satisfacción a quien acosa", "Derivar a todo el alumnado implicado a terapia psicológica externa al centro"], "e": "La educación emocional consiste en capacitar a los alumnos con conocimientos y estrategias emocionales (empatía, autocontrol, asertividad, conocimiento de las propias emociones) que ayuden a afrontar la vida y aumenten su bienestar en salud y convivencia.", "f": "D"}, {"id": "t5-069", "t": "t5", "lv": 1, "q": "Si un acosador le dice a la víctima «Eres tonto», ¿qué respuesta recomienda el tema 5?", "o": ["Decirle con firmeza: «¡No, eso es lo que tú crees!»", "Responder con otro insulto para defenderse", "Llorar para que intervenga un adulto"], "e": "El tema recomienda no llorar ni enfadarse, no dar satisfacción al agresor y, ante un insulto, responder con firmeza «¡No, eso es lo que tú crees!». También ignorarle o tratarlo con humor e ironía.", "f": "D"}, {"id": "t5-070", "t": "t5", "lv": 1, "q": "¿Qué mensaje final debe interiorizar la víctima de acoso según el tema 5?", "o": ["No tiene la culpa, no tiene que afrontarlo sola y es quien agrede quien tiene el problema", "Debe resolver la situación por sí misma para fortalecerse y no depender de los adultos", "Debe guardar el secreto hasta tener pruebas, para no empeorar la situación"], "e": "La víctima debe recordar que no tiene la culpa de ser agredida, que no tiene que hacer frente a la situación sola, que ella no es el problema (lo tiene quien agrede) y que debe tratar a los demás como quiera ser tratada.", "f": "D"}, {"id": "t5-071", "t": "t5", "lv": 1, "q": "¿Cuál de las siguientes medidas anti-acoso recoge el tema 5 para los centros?", "o": ["Concienciar a los alumnos de la obligación de informar si son testigos o víctimas de intimidación", "Evitar hablar del acoso en clase para no dar ideas al alumnado", "Dejar que los alumnos resuelvan los conflictos sin intervención adulta"], "e": "Las medidas anti-acoso incluyen promover la comunicación alumno-tutor, concienciar de la obligación de informar, charlas sobre convivencia y no agresión, vigilantes en el centro, fomentar la aceptación de la diversidad y educar en cooperación, tolerancia, empatía, solidaridad y resolución pacífica de conflictos.", "f": "D"}, {"id": "t5-072", "t": "t5", "lv": 1, "q": "Según el tema 5, ¿qué clima de aula deben fomentar los profesores para prevenir el acoso?", "o": ["Un clima de aceptación de la diversidad", "Un clima competitivo para fortalecer el carácter", "Un clima de neutralidad que no intervenga en las relaciones"], "e": "La diapositiva indica que los profesores deben fomentar que el clima del aula sea de aceptación a la diversidad, y que el centro y los padres deben promover comportamientos sociales.", "f": "D"}, {"id": "t5-073", "t": "t5", "lv": 1, "q": "Una alumna te cuenta que la acosan, pero te pide que no se lo digas a nadie. Desde el tema 5, la actuación correcta es:", "o": ["Creerla, darle seguridad, explicarle que no puede quedar en secreto y comunicarlo a la dirección", "Guardar el secreto para no perder su confianza y vigilar discretamente al agresor", "Pedirle que ignore al agresor y esperar a ver si la situación se repite antes de actuar"], "e": "El alumnado acosado necesita saber que se le cree y que se le apoya, y el tema insiste en no guardar el secreto. La dirección debe activar el protocolo de actuación.", "f": "D"}, {"id": "t5-074", "t": "t5", "lv": 1, "q": "El tema 5 menciona una nueva propuesta legal asociada al protocolo de acoso. ¿Qué figura?", "o": ["El Coordinador de bienestar", "El mediador judicial escolar", "El inspector de convivencia de aula"], "e": "Junto al último paso del protocolo, la diapositiva añade entre paréntesis: «Nueva propuesta de ley: Coordinador de bienestar».", "f": "D"}, {"id": "t5-a001", "t": "t5", "lv": 2, "q": "Una alumna de 15 años ha perdido mucho peso, rechaza la comida en las excursiones, dice verse gorda aunque está muy delgada y ha dejado de tener la regla. Otra, de 19, se da atracones a escondidas y después provoca el vómito, con miedo a engordar. ¿Qué cuadros sugieren los rasgos que recoge el tema 5?", "o": ["La primera, anorexia; la segunda, bulimia", "La primera, bulimia; la segunda, anorexia", "Ambas, anorexia en distintas fases de la enfermedad"], "e": "La anorexia se caracteriza por pérdida considerable de peso, rechazo de la comida, miedo obsesivo a engordar, distorsión de la imagen corporal (sobreestiman su tamaño) y pérdida del periodo. La bulimia, por atracones seguidos de arrepentimiento y conductas para eliminar el exceso, y aparece más tarde.", "f": "D"}, {"id": "t5-a002", "t": "t5", "lv": 2, "q": "¿Qué rasgo NO permite distinguir la anorexia de la bulimia, porque ambas lo comparten según el tema 5?", "o": ["La obsesión por la delgadez y el miedo a engordar", "Los atracones seguidos de arrepentimiento", "La edad de aparición más temprana"], "e": "El tema indica que la bulimia comparte con la anorexia la obsesión por la delgadez y que en ambas hay miedo a engordar. Los atracones son propios de la bulimia, y la anorexia aparece antes.", "f": "D"}, {"id": "t5-a003", "t": "t5", "lv": 2, "q": "Una tutora quiere prevenir los trastornos alimentarios en su grupo de 3.º de ESO. ¿Qué propuesta es más coherente con las recomendaciones del tema 5?", "o": ["Analizar críticamente los mensajes de la moda y valorar lo que el cuerpo permite hacer", "Organizar un concurso de dietas saludables con control de peso semanal del grupo", "Evitar hablar del cuerpo en clase para no generar inseguridades ni comparaciones"], "e": "Las recomendaciones incluyen desarrollar sentido crítico hacia la presión a la esbeltez de la moda, no valorarse principalmente por el físico, abandonar las dietas de adelgazamiento, valorar las posibilidades del cuerpo y hacer deporte para disfrutar.", "f": "D"}, {"id": "t5-a004", "t": "t5", "lv": 2, "q": "Un profesor de Educación Física anima a una alumna a hacer deporte «para quemar lo que come y mantener la línea». Según el tema 5, ¿qué problema tiene ese mensaje?", "o": ["Presenta el deporte como sacrificio para mantener una figura delgada, en lugar de como disfrute", "Ninguno: es un mensaje adecuado, porque el ejercicio previene los trastornos alimentarios", "Solo sería un problema si la alumna tuviera ya un diagnóstico de bulimia o anorexia"], "e": "El tema recomienda hacer deporte para disfrutar y no como sacrificio para mantener una figura más delgada, y revisar los mensajes que exigen un determinado aspecto físico. Además, el ejercicio extenuante es una de las vías de pérdida de peso en la anorexia.", "f": "D"}, {"id": "t5-a005", "t": "t5", "lv": 2, "q": "Un alumno de 13 años, antes sociable, se aísla en el recreo, dice que «nada merece la pena» y ha empezado a tener problemas de conducta en clase. Según el tema 5, ¿qué debe considerar el profesorado?", "o": ["Que pueden ser señales tempranas de depresión, que en la pubertad incluye trastornos de conducta", "Que se trata de indisciplina y que conviene responder con sanciones más firmes y rápidas", "Que son cambios normales de la edad que no requieren ninguna atención especial del tutor"], "e": "En la pubertad la depresión se caracteriza por aislamiento social, pesimismo y trastornos de conducta, y pensamientos relacionados con la muerte. Un objetivo del tema es identificar las primeras señales de un posible trastorno.", "f": "D"}, {"id": "t5-a006", "t": "t5", "lv": 2, "q": "Según el tema 5, ¿qué perfil de trastornos sería más esperable en un grupo de chicas adolescentes frente a uno de chicos?", "o": ["Chicas: depresivos, de conducta y de ansiedad; chicos: de conducta, del desarrollo, drogas y agresividad", "Chicas: abuso de drogas, agresividad y trastornos del desarrollo; chicos: depresivos y de ansiedad", "Chicas y chicos: los mismos trastornos y con la misma frecuencia, porque el sexo no influye"], "e": "La diapositiva de diferencias entre sexos recoge en el género femenino trastornos depresivos, de conducta y de ansiedad; en el masculino, trastornos de conducta, del desarrollo (autismo, hiperactividad), abuso de drogas y agresividad.", "f": "D"}, {"id": "t5-a007", "t": "t5", "lv": 2, "q": "Un alumno empezó a beber con su grupo los fines de semana porque «se lo pasa bien y se olvida de los problemas». ¿En qué etapa del consumo se encuentra?", "o": ["Etapa 1, aprendizaje: consumo en grupo, presión grupal y alivio temporal de los problemas", "Etapa 2, búsqueda: consumo individual para buscar un estado de ánimo", "Etapa 3, preocupación: obsesión por la sustancia y pérdida de control"], "e": "En la etapa de aprendizaje el consumo tiene lugar dentro de las actividades del grupo, cuya presión es muy importante; se experimenta sobre todo los fines de semana, con sensaciones positivas y alivio temporal de los problemas.", "f": "D"}, {"id": "t5-a008", "t": "t5", "lv": 2, "q": "El mismo alumno empieza ahora a consumir solo entre semana, sus notas bajan, tiene cambios bruscos de humor y discute con sus padres. ¿Qué ha cambiado respecto a la etapa anterior?", "o": ["Ha pasado a la búsqueda: consume de forma individual para conseguir el estado de ánimo que le produce", "Ha pasado a la destrucción: necesita la sustancia aunque ya no le produce euforia", "Ha vuelto a la curiosidad: prueba nuevas sustancias por primera vez"], "e": "La etapa de búsqueda se caracteriza por buscar el estado de ánimo que produce la droga, aumentar el consumo, consumir de forma individual, modificar la conducta y el rendimiento, cambios de humor, altercados con los padres y aislamiento.", "f": "D"}, {"id": "t5-a009", "t": "t5", "lv": 2, "q": "¿Qué rasgo diferencia la etapa de preocupación de la de destrucción en el consumo de drogas?", "o": ["En la destrucción la droga ya no produce euforia y se necesita para evitar la abstinencia", "En la preocupación el consumo es solo de fin de semana y siempre dentro del grupo", "En la destrucción desaparecen los problemas de salud física, pero aumentan los psicológicos"], "e": "En la preocupación hay obsesión por la sustancia, pérdida de control, policonsumo, absentismo, robos y cambios emocionales marcados. En la destrucción se necesita la sustancia a cualquier precio para no llegar a la abstinencia, pero ya no produce euforia, con grave deterioro de la salud.", "f": "D"}, {"id": "t5-a010", "t": "t5", "lv": 2, "q": "Integrando los temas 4 y 5, ¿qué explica mejor que la presión del grupo sea clave en la etapa de aprendizaje del consumo de drogas, pero que también pueda retrasarlo?", "o": ["El grupo modela conductas, y su presión puede tener efectos negativos o positivos, como retrasar el consumo", "El grupo de iguales solo influye en la ropa y la música de sus miembros, nunca en los consumos de riesgo", "La presión del grupo solo actúa en la etapa de destrucción, cuando el consumo ya es diario y continuado"], "e": "El tema 5 señala que en la etapa de aprendizaje la presión grupal es muy importante. El tema 4 indica que la presión del grupo también puede tener efectos positivos, como reducir o retrasar el consumo de tabaco y drogas.", "f": "D"}, {"id": "t5-a011", "t": "t5", "lv": 2, "q": "¿Por qué el alcohol, aunque sea legal, se considera en el tema 5 la droga más importante?", "o": ["Por ser la más consumida, la que más dependientes genera y la que más problemas causa", "Por ser la droga ilegal más consumida entre los estudiantes de 14 a 18 años", "Por ser la única droga que actúa sobre los receptores cannabinoides del cerebro"], "e": "El tema considera el alcohol la más importante de todas las drogas por ser la más consumida, con mayor número de dependientes y la que más problemas causa. La droga ilegal más consumida es la marihuana.", "f": "D"}, {"id": "t5-a012", "t": "t5", "lv": 2, "q": "Un alumno llega a clase tras haber bebido: tarda en entender, juzga mal las situaciones y pierde el equilibrio. Según el tema 5, ¿por qué?", "o": ["Porque el alcohol es un depresor del sistema nervioso central que enlentece funciones cognitivas, motoras y emocionales", "Porque el alcohol es un estimulante que acelera el ritmo cardíaco y altera el sentido del tiempo", "Porque el alcohol actúa sobre los receptores cannabinoides del cerebro"], "e": "El alcohol es un depresor del sistema nervioso central que enlentece las funciones cognoscitivas (percepción y juicio), motoras (equilibrio y reflejos) y emocionales (sensatez y madurez). Alterar el sentido del tiempo y actuar sobre receptores cannabinoides es propio de la marihuana.", "f": "D"}, {"id": "t5-a013", "t": "t5", "lv": 2, "q": "Un alumno que consume marihuana de forma habitual muestra problemas de memoria, de concentración y de coordinación, y dice que «se le pasa el tiempo volando». ¿Qué explica estos efectos según el tema 5?", "o": ["El THC se parece a los cannabinoides naturales y actúa sobre sus receptores cerebrales", "El THC es un depresor del sistema nervioso central que actúa igual que el alcohol", "El THC bloquea por completo la producción de dopamina en el sistema de recompensa"], "e": "El THC es similar a los cannabinoides que produce el cuerpo y actúa sobre sus receptores. Entre sus efectos están la reducción de la memoria y la comprensión, la alteración del sentido del tiempo y la menor capacidad para tareas de concentración y coordinación.", "f": "D"}, {"id": "t5-a014", "t": "t5", "lv": 2, "q": "Una madre cuenta en tutoría que su hijo duerme cuatro horas por estar conectado, miente sobre el tiempo que pasa en línea, se irrita mucho si falla el wifi y ha dejado el fútbol. Según Echeburúa y Corral (2010), ¿qué indica?", "o": ["Varias señales de dependencia de las TIC", "Un uso normal para su edad, sin señales de alarma", "Señales de un trastorno alimentario"], "e": "Reducir horas de sueño, mentir sobre el tiempo conectado, irritarse cuando falla la conexión y abandonar actividades importantes son señales de dependencia de las TIC según Echeburúa y Corral (2010).", "f": "D"}, {"id": "t5-a015", "t": "t5", "lv": 2, "q": "¿Qué recomendación daría un tutor a esa familia según las estrategias de prevención del tema 5?", "o": ["Pactar con el adolescente un horario de uso y fomentar aficiones, deporte y relaciones", "Retirar todos los dispositivos de forma indefinida sin dar explicaciones", "Dejar que se autorregule sin intervenir para no generar conflicto"], "e": "Las estrategias de prevención incluyen limitar el tiempo de uso pactando un horario con el adolescente, fomentar la relación con personas y amigos, las aficiones, el deporte, las actividades de equipo y grupales, y la comunicación en la familia.", "f": "D"}, {"id": "t5-a016", "t": "t5", "lv": 2, "q": "¿Qué enfoque recomienda el Ministerio de Sanidad, según el tema 5, para hablar de drogas con los hijos?", "o": ["Diálogo con críticas constructivas, basado en la información y no en la prohibición", "Prohibición clara y castigo inmediato ante cualquier consumo, sin excepciones", "Evitar el tema en casa para no despertar la curiosidad de los hijos por probar"], "e": "El Ministerio propone transmitir la importancia del diálogo con los hijos, con críticas constructivas, sin dejarse arrastrar por la ira, sin acogerse a la prohibición sino a la información y a la inculcación de actitudes saludables, además de impulsar un ocio sin drogas.", "f": "D"}, {"id": "t5-a017", "t": "t5", "lv": 2, "q": "Dos alumnos se pelean un día por un balón y se reconcilian al día siguiente. Otro alumno lleva semanas recibiendo burlas de un grupo y no sabe cómo salir de ello. Según la definición del tema 5, ¿cuál es acoso?", "o": ["Solo el segundo: maltrato reiterado del que la víctima no puede salir por sí sola", "Solo el primero, porque hubo agresión física y eso es lo que define el acoso", "Ambos, porque en los dos casos hay conducta agresiva entre alumnos del centro"], "e": "El acoso son situaciones de maltrato psicológico o físico entre escolares, de forma reiterada, de las que la víctima no puede salir por sus propios medios. Una pelea puntual entre iguales no es acoso.", "f": "D"}, {"id": "t5-a018", "t": "t5", "lv": 2, "q": "Un grupo pone motes a un compañero y le imita la tartamudez; además, convence al resto de la clase para que no se siente con él. ¿Qué formas de maltrato psicológico se combinan?", "o": ["Degradar y aislar", "Rechazo y aterrorizar", "Manipular y causar daños materiales"], "e": "Poner motes, ridiculizar o imitar una discapacidad es degradar. Restringir sus relaciones y desacreditarle para que los demás no se relacionen con él es aislar.", "f": "D"}, {"id": "t5-a019", "t": "t5", "lv": 2, "q": "Un alumno obliga a otro a hacerle los deberes y a comprarle el almuerzo, amenazándole con contar un secreto. ¿Qué forma de maltrato psicológico predomina?", "o": ["Manipular o utilizar", "Degradar a la víctima", "Aislar socialmente a la víctima"], "e": "Manipular o utilizar es inducir a una persona a realizar conductas que van en contra de sus intereses y en beneficio de otros.", "f": "D"}, {"id": "t5-a020", "t": "t5", "lv": 2, "q": "Una alumna aislada y sin amigos, muy ansiosa, que se culpa de lo que le pasa y niega estar sufriendo acoso, y cuya familia la sobreprotege. ¿Qué tipo de víctima describe el tema 5?", "o": ["Víctima pasiva", "Víctima activa", "Agresora con baja autoestima"], "e": "La víctima pasiva tiene aislamiento social, no tiene amigos, problemas de comunicación, conducta pasiva, miedo, ansiedad y baja autoestima; se culpa, se niega a reconocer la situación y suele estar sobreprotegida por su familia.", "f": "D"}, {"id": "t5-a021", "t": "t5", "lv": 2, "q": "Un alumno aislado e impopular responde a las burlas con insultos y conductas provocadoras, por lo que algunos profesores le ven como el problema. ¿Qué error de interpretación podría estar cometiendo el profesorado?", "o": ["Confundir una víctima activa con un agresor, aunque el tema 5 la reconoce como víctima", "Confundir una víctima pasiva con una activa por su forma de reaccionar a las burlas", "Ninguno: si responde con agresividad no puede considerarse víctima de acoso"], "e": "La víctima activa también sufre aislamiento e impopularidad, pero actúa de forma impulsiva, con conductas agresivas, irritantes y provocadoras. Sigue siendo víctima y requiere protección.", "f": "D"}, {"id": "t5-a022", "t": "t5", "lv": 2, "q": "¿Qué rasgo de las personas agresoras recoge el tema 5 y conviene tener en cuenta al diseñar la intervención con ellas?", "o": ["Inteligencia emocional deficitaria: poca empatía, escasas habilidades sociales y baja tolerancia a la frustración", "Alta empatía y buen manejo emocional, que utilizan para manipular a sus víctimas sin ser descubiertos", "Respeto a las normas, buen rendimiento y actitud positiva hacia la escuela, que les protegen de sospechas"], "e": "Las características más frecuentes de las personas agresoras incluyen inteligencia emocional deficitaria (ausencia de empatía, mal manejo emocional, escasas habilidades sociales, baja tolerancia a la frustración), impulsividad, baja autoestima, problemas con las normas, desafío a los adultos y actitud negativa hacia la escuela.", "f": "D"}, {"id": "t5-a023", "t": "t5", "lv": 2, "q": "La dirección de un centro recibe la denuncia de un posible acoso. ¿Cuál es el orden correcto de los primeros pasos del protocolo del tema 5?", "o": ["Entrevistar a la víctima y su familia, después al agresor y su familia, y luego convocar al equipo", "Informar a Inspección, después entrevistar al agresor y por último a la víctima y su familia", "Convocar al Equipo Docente, sancionar al agresor y después hablar con la víctima y su familia"], "e": "El protocolo es: 1) entrevistar a la familia y al alumno acosado; 2) entrevistar a la familia y al alumno acosador; 3) convocar al Equipo Docente, Orientación y/o Comisión de Convivencia; 4) solicitar apoyo técnico del orientador; 5) informar al Servicio de Inspección.", "f": "D"}, {"id": "t5-a024", "t": "t5", "lv": 2, "q": "Un alumno amenaza a otro con una navaja en la salida del instituto. Según el tema 5, ¿cómo debe tratarse?", "o": ["Como conducta criminal que debe denunciarse (policía, fiscalía), además de proteger a la víctima", "Como un caso de acoso que se resuelve solo con el protocolo interno del centro educativo", "Como un conflicto entre iguales que conviene resolver mediante una mediación entre ambos"], "e": "El tema distingue el acoso de las conductas antisociales o criminales que deben denunciarse: robos, agresiones con armas u objetos punzantes, abusos sexuales y amenazas graves o en las que la vida de la víctima corra peligro.", "f": "D"}, {"id": "t5-a025", "t": "t5", "lv": 2, "q": "Un alumno con TEA tiene dificultades para relacionarse. La tutora elige a un compañero muy empático para que le ayude a imitar habilidades sociales; además, varios voluntarios le acompañan en los cambios de clase y en el patio. ¿Qué técnicas combina?", "o": ["El sistema del amigo (un compañero elegido) y el círculo de amigos (varios voluntarios)", "El círculo de amigos (un compañero elegido) y el sistema del amigo (varios voluntarios)", "Dos versiones del sistema del amigo"], "e": "El sistema del amigo consiste en elegir al compañero mejor predispuesto para que ayude al niño con dificultades. El círculo de amigos implica que varios compañeros realicen voluntariamente actividades con el alumno (cambios de clase, entradas, salidas, excursiones, patio).", "f": "D"}, {"id": "t5-a026", "t": "t5", "lv": 2, "q": "¿Qué dato del tema 5 justifica una vigilancia especial del alumnado con NEAE ante el acoso?", "o": ["Que la tasa de acoso pasa del 13 % general al 90 % en el alumnado con NEAE", "Que el alumnado con NEAE sufre aproximadamente el mismo acoso que el resto", "Que el acoso al alumnado con NEAE suele aparecer solo en Bachillerato"], "e": "La diapositiva indica que mientras el 13 % de la población infantil sufre acoso escolar, la cifra asciende al 90 % en los niños con NEAE.", "f": "D"}, {"id": "t5-a027", "t": "t5", "lv": 2, "q": "Un alumno ve cómo insultan a un compañero en el pasillo. Según el tema 5, ¿qué actuación sería la más adecuada si no se atreve a intervenir directamente?", "o": ["Buscar al adulto más cercano y contarlo, porque eso no es acusar", "Grabar la escena para difundirla y que el agresor quede en evidencia", "Vengarse del agresor más tarde, cuando no haya profesores"], "e": "Si quien observa no puede decir nada, debe buscar al adulto más cercano: «¡Eso no es acusar!». No debe usar la violencia ni vengarse. Grabar y difundir imágenes de maltrato es una forma de ciberacoso.", "f": "D"}, {"id": "t5-a028", "t": "t5", "lv": 2, "q": "Según el tema 5, ¿qué ocurre en la mitad de los casos si un testigo le dice al agresor «¡Basta ya!»?", "o": ["Que la agresión se termina", "Que el testigo se convierte en la nueva víctima", "Que el agresor aumenta la intensidad del ataque"], "e": "La diapositiva indica que si alguien presencia una agresión y dice «¡Basta ya!», en la mitad de los casos se termina la agresividad. Presenciar el acoso y no hacer nada es aprobar la agresividad.", "f": "D"}, {"id": "t5-a029", "t": "t5", "lv": 2, "q": "Una alumna acosada le dice a su tutora que no quiere que se entere su familia «porque lo empeorará». ¿Qué necesidad del alumnado acosado recoge el tema 5 que la tutora debe trabajar?", "o": ["Comprender que sus padres pueden ayudarle a resolverlo, no a empeorarlo", "Guardar el secreto para conservar la confianza que ha depositado en ella", "Aprender a resolverlo sola para fortalecer su autoestima y su autonomía"], "e": "Entre las necesidades del alumnado acosado figura tener en cuenta que sus padres pueden ayudarle a resolverlo, no a empeorarlo, junto con contar lo que sucede, saber que se le cree y se le apoya, y no guardar el secreto.", "f": "D"}, {"id": "t5-a030", "t": "t5", "lv": 2, "q": "¿Qué estrategia de la víctima ante el acoso verbal recomienda el tema 5?", "o": ["No dar satisfacción al agresor: no llorar, ignorarle o responder con firmeza o con humor", "Responder siempre con un insulto más fuerte para que el agresor no se atreva a repetirlo", "Esperar a que el agresor se canse, sin contárselo a nadie para no empeorar la situación"], "e": "El tema recomienda no llorar ni enfadarse, no dar satisfacción a quien acosa, ignorarle, responder con firmeza («¡No, eso es lo que tú crees!») o con humor, no guardar el secreto y buscar ayuda.", "f": "D"}, {"id": "t5-a031", "t": "t5", "lv": 2, "q": "¿Por qué el tema 5 insiste en que solo un abordaje integral del centro resuelve el acoso?", "o": ["Porque las actuaciones aisladas no bastan: hace falta una política global, apoyo a la víctima e intervención con el grupo", "Porque el acoso solo puede resolverlo la Inspección educativa, que es quien debe dirigir la intervención", "Porque basta con sancionar al agresor para que el problema desaparezca y el grupo recupere la normalidad"], "e": "Todo centro debe tener una política de actuación: solamente un abordaje integral y la actuación global, no solo actuaciones concretas de los profesores, logra una resolución óptima. Incluye apoyo a la víctima y a su familia e intervención psicoeducativa con el grupo.", "f": "D"}, {"id": "t5-a032", "t": "t5", "lv": 2, "q": "Integrando los temas 4 y 5, ¿qué tipo de agresividad caracteriza al acoso escolar?", "o": ["Agresividad hostil, porque busca causar daño intencional y demostrar poder", "Agresividad instrumental, porque el agresor busca obtener un objeto o privilegio", "Agresividad accidental, porque no existe intención de dañar a la víctima"], "e": "El tema 5 define el acoso como descargar la agresividad en la víctima con el fin de demostrar poder y molestar. El tema 4 define la agresividad hostil como la que busca causar daño intencional, en sus formas abierta, relacional y cibernética.", "f": "D"}, {"id": "t5-a033", "t": "t5", "lv": 2, "q": "¿Qué edad de inicio del acoso escolar recoge el tema 5 y con qué cambio del tema 4 coincide?", "o": ["12-13 años, coincidiendo con el cambio de centro y la reorganización del grupo", "8-9 años, coincidiendo con la aparición de los trastornos del aprendizaje", "17-18 años, coincidiendo con la presión por la elección de carrera"], "e": "El acoso es más frecuente al inicio de la adolescencia (12-13 años). Coincide con el paso a Secundaria, cuando hay que adaptarse a nuevos compañeros y el grupo de iguales se vuelve clave (tema 4).", "f": "D"}, {"id": "t5-a034", "t": "t5", "lv": 2, "q": "¿Qué trastornos sitúa el tema 5 entre los 6 y los 9 años y por qué?", "o": ["Del aprendizaje, hiperactividad y atención, por coincidir con el inicio de la escolarización", "Trastornos alimentarios, porque coinciden con los primeros cambios de la pubertad", "Conductas adictivas, porque coinciden con el primer acceso a la tecnología"], "e": "La introducción del tema indica que algunos trastornos son más frecuentes entre los 6 y los 9 años (aprendizaje, hiperactividad y atención), coincidiendo con los primeros años de escolarización.", "f": "D"}, {"id": "t5-a035", "t": "t5", "lv": 2, "q": "¿Cuál de estas conductas de un testigo de acoso desaconseja el tema 5?", "o": ["Usar la violencia contra el agresor o vengarse por su cuenta", "Decirle al agresor que pare y que eso no tiene gracia", "Ofrecer apoyo y compañía a la víctima"], "e": "El tema recomienda que los testigos digan al agresor que pare, busquen a un adulto, usen los canales del centro, apoyen a la víctima e involucren a más personas, pero que no usen la violencia ni se venguen por su cuenta.", "f": "D"}, {"id": "t5-a036", "t": "t5", "lv": 2, "q": "Una alumna con anorexia muestra grandes cambios emocionales. Integrando los temas 3 y 5, ¿qué relación con la imagen corporal y la autoestima es más coherente?", "o": ["Valorarse sobre todo por el físico liga la autoestima a una imagen corporal distorsionada", "Una autoestima elevada es la causa principal de la anorexia en la adolescencia", "La imagen corporal no influye en la autoestima del adolescente, solo el rendimiento"], "e": "El tema 5 recomienda no valorarse principalmente por el aspecto físico y señala la distorsión de la imagen corporal. El tema 3 indica que la autoestima depende de cómo nos desempeñamos en lo que consideramos importante: si lo central es el cuerpo, la autoestima queda ligada a él.", "f": "D"}, {"id": "t6-001", "t": "t6", "lv": 1, "q": "¿Qué tres tipos de contenidos del aprendizaje organiza el tema 6?", "o": ["Sucesos y conductas; verbal y conceptual; procedimientos y estrategias", "Hechos y datos; conceptos y principios; actitudes, valores y normas", "Memorístico y significativo; por recepción y por descubrimiento; observacional"], "e": "El tema 6 se organiza en: 1) aprendizaje de sucesos y conductas, 2) aprendizaje verbal y conceptual y 3) aprendizaje de procedimientos y estrategias.", "f": "D"}, {"id": "t6-002", "t": "t6", "lv": 1, "q": "¿Por qué el tema 6 denomina «aprendizajes básicos» al aprendizaje de sucesos y conductas?", "o": ["Porque los compartimos con muchas especies", "Porque son los primeros que se enseñan en Primaria", "Porque no requieren ningún tipo de experiencia"], "e": "La diapositiva indica que son aprendizajes básicos porque los compartimos con muchas especies. Nos permiten hacer predicciones sobre lo que puede ocurrir.", "f": "D"}, {"id": "t6-003", "t": "t6", "lv": 1, "q": "¿Qué diferencia establece el tema 6 entre el aprendizaje de sucesos y el de conductas?", "o": ["En el de sucesos predecimos por la presencia de estímulos (clásico); en el de conductas, por sus consecuencias (operante)", "El de sucesos se basa en las consecuencias de la conducta (operante) y el de conductas en la asociación de estímulos (clásico)", "El de sucesos es exclusivo de los humanos y el de conductas lo compartimos con muchas otras especies"], "e": "Ambos generan predicciones: por la presencia de estímulos (condicionamiento clásico, aprendizaje de sucesos) o porque hemos emitido una conducta que depara consecuencias (condicionamiento operante, aprendizaje de conductas o instrumental).", "f": "D"}, {"id": "t6-004", "t": "t6", "lv": 1, "q": "En el experimento clásico de Pavlov, la comida y la salivación ante ella son:", "o": ["Estímulo incondicionado y respuesta incondicionada", "Estímulo condicionado y respuesta condicionada", "Estímulo neutro y respuesta operante"], "e": "La comida es un estímulo incondicionado que provoca de forma natural la salivación (respuesta incondicionada). Tras emparejarla con la campana, la campana pasa a ser estímulo condicionado y la salivación ante ella, respuesta condicionada.", "f": "D"}, {"id": "t6-005", "t": "t6", "lv": 1, "q": "Tras el condicionamiento, el perro saliva al oír la campana. En este caso, la salivación es:", "o": ["Una respuesta condicionada", "Una respuesta incondicionada", "Una respuesta operante reforzada"], "e": "La campana es el estímulo condicionado y la salivación ante ella, la respuesta condicionada (aprendida por asociación).", "f": "D"}, {"id": "t6-006", "t": "t6", "lv": 1, "q": "Un alumno que suspendió varios exámenes en un aula concreta siente ansiedad con solo entrar en ella. Este aprendizaje se explica mejor por:", "o": ["Condicionamiento clásico (aprendizaje de sucesos)", "Condicionamiento operante (aprendizaje de conductas)", "Aprendizaje significativo de Ausubel"], "e": "El aula, inicialmente neutra, se ha asociado a una experiencia aversiva y ahora provoca por sí sola una respuesta emocional: es un aprendizaje de sucesos por condicionamiento clásico. El tema lo ilustra con el caso del pequeño Albert y el condicionamiento del miedo.", "f": "D"}, {"id": "t6-007", "t": "t6", "lv": 1, "q": "El caso del «pequeño Albert», que aparece en el tema 6, ilustra:", "o": ["El condicionamiento clásico del miedo", "El aprendizaje por observación", "La sobrecorrección"], "e": "El vídeo del pequeño Albert ilustra el condicionamiento del miedo: un estímulo neutro asociado a un estímulo aversivo pasa a provocar miedo por sí solo.", "f": "D"}, {"id": "t6-008", "t": "t6", "lv": 1, "q": "¿Cuál es el esquema del condicionamiento operante según el tema 6?", "o": ["Estímulo – respuesta operante – consecuencias (reforzamiento o castigo)", "Estímulo incondicionado – respuesta incondicionada – estímulo condicionado", "Organizador previo – nuevo contenido – anclaje en lo que ya se sabe"], "e": "El aprendizaje de conductas (instrumental) sigue el esquema estímulo – respuesta operante – consecuencias, que pueden ser reforzamiento o castigo.", "f": "D"}, {"id": "t6-009", "t": "t6", "lv": 1, "q": "Según la tabla del tema 6, la presentación de un estímulo apetitivo tras una conducta es:", "o": ["Reforzamiento positivo", "Castigo negativo", "Reforzamiento negativo"], "e": "Tabla: apetitivo + presentación = reforzamiento positivo; apetitivo + retirada = castigo negativo; aversivo + presentación = castigo positivo; aversivo + retirada = reforzamiento negativo.", "f": "D"}, {"id": "t6-010", "t": "t6", "lv": 1, "q": "Según la tabla del tema 6, la retirada de un estímulo aversivo tras una conducta es:", "o": ["Reforzamiento negativo", "Castigo negativo", "Castigo positivo"], "e": "Retirar un estímulo aversivo contingente a una conducta aumenta su probabilidad: es reforzamiento negativo. «Negativo» indica retirada, no que sea algo malo.", "f": "D"}, {"id": "t6-011", "t": "t6", "lv": 1, "q": "Según la tabla del tema 6, la retirada de un estímulo apetitivo tras una conducta es:", "o": ["Castigo negativo", "Reforzamiento negativo", "Reforzamiento positivo"], "e": "Retirar algo apetitivo contingente a una conducta reduce su frecuencia: es castigo negativo (por ejemplo, tiempo fuera o coste de respuesta).", "f": "D"}, {"id": "t6-012", "t": "t6", "lv": 1, "q": "«Quien levante la mano y espere su turno no tendrá que recoger el material de deporte al final del recreo». Según el tema 6, este es un ejemplo de:", "o": ["Reforzamiento negativo", "Castigo negativo", "Reforzamiento positivo"], "e": "Es el ejemplo que da la diapositiva de reforzamiento negativo: aumenta la probabilidad de la conducta (levantar la mano) retirando un estímulo aversivo (recoger el material).", "f": "D"}, {"id": "t6-013", "t": "t6", "lv": 1, "q": "¿Qué tienen en común el reforzamiento positivo y el negativo?", "o": ["Ambos aumentan la probabilidad de que se repita la respuesta", "Ambos reducen la frecuencia de la respuesta", "Ambos consisten en presentar un estímulo agradable"], "e": "Todo reforzamiento aumenta la probabilidad de la respuesta. El positivo presenta un estímulo apetitivo; el negativo retira uno aversivo.", "f": "D"}, {"id": "t6-014", "t": "t6", "lv": 1, "q": "Un error frecuente es confundir reforzamiento negativo con castigo. ¿Cuál es la diferencia clave?", "o": ["El reforzamiento negativo aumenta la conducta al retirar algo aversivo; el castigo la reduce", "Son sinónimos: ambos reducen la conducta mediante un estímulo desagradable", "El reforzamiento negativo reduce la conducta y el castigo la aumenta"], "e": "Reforzamiento (positivo o negativo) = aumenta la conducta. Castigo (positivo o negativo) = la reduce. El adjetivo indica si se presenta (+) o se retira (−) un estímulo.", "f": "D"}, {"id": "t6-015", "t": "t6", "lv": 1, "q": "Según el origen de su valor, ¿qué es un reforzador secundario o condicionado?", "o": ["Un estímulo de valor aprendido, como el dinero", "Un estímulo de valor innato, como la comida o el afecto", "Un estímulo que surge del propio orgullo por haber hecho algo bien"], "e": "Por su origen, los reforzadores son primarios o incondicionados (valor innato: dormir, comer, afecto) o secundarios o condicionados (valor aprendido: dinero).", "f": "D"}, {"id": "t6-016", "t": "t6", "lv": 1, "q": "Según el proceso de reforzamiento, un reforzador intrínseco es:", "o": ["Un estímulo interno, como el orgullo por haber realizado algo bien", "Un estímulo externo, como una golosina o un juguete, que se entrega tras la conducta", "Un estímulo de valor aprendido, como el dinero, que se puede canjear más tarde"], "e": "Según el proceso, el reforzamiento es extrínseco (estímulo externo: golosina, juguete) o intrínseco (estímulo interno: orgullo por haber hecho algo bien).", "f": "D"}, {"id": "t6-017", "t": "t6", "lv": 1, "q": "Según su naturaleza, ¿qué tres tipos de reforzadores positivos distingue el tema 6?", "o": ["Materiales o tangibles, sociales y de actividad", "Primarios, secundarios y simbólicos o canjeables", "Intrínsecos, extrínsecos y sociales"], "e": "Por su naturaleza: materiales o tangibles (juguetes, dinero, comida), sociales (elogios, afecto) y de actividad (jugar, ir a la playa, leer). La tabla de ventajas añade los simbólicos o canjeables.", "f": "D"}, {"id": "t6-018", "t": "t6", "lv": 1, "q": "«Como recompensa, este fin de semana te llevaremos al parque de atracciones». Según la clasificación del tema 6, este reforzador es:", "o": ["Secundario, extrínseco y de actividad", "Primario, intrínseco y social", "Secundario, extrínseco y material"], "e": "La diapositiva clasifica este ejemplo como secundario, extrínseco y de actividad.", "f": "D"}, {"id": "t6-019", "t": "t6", "lv": 1, "q": "«Te compré este juguete porque te estás esforzando mucho». Según la clasificación del tema 6, este reforzador es:", "o": ["Secundario, extrínseco y material", "Primario, intrínseco y social", "Secundario, intrínseco y de actividad"], "e": "La diapositiva lo clasifica como secundario, extrínseco y material.", "f": "D"}, {"id": "t6-020", "t": "t6", "lv": 1, "q": "¿Cómo clasifica la diapositiva del tema 6 el reforzador «¡Lo estás haciendo muy bien!»?", "o": ["Primario, intrínseco y social", "Secundario, extrínseco y material", "Secundario, extrínseco y de actividad"], "e": "La diapositiva clasifica el elogio «¡Lo estás haciendo muy bien!» como primario, intrínseco y social. Sigue la clasificación tal y como aparece en las diapositivas del profesor.", "f": "D"}, {"id": "t6-021", "t": "t6", "lv": 1, "q": "Según la tabla de ventajas e inconvenientes del tema 6, ¿qué inconveniente tienen los reforzadores materiales?", "o": ["Fácil saciación, interrumpen el programa y exigen acordar que se den solo tras la respuesta deseada", "Son fáciles de olvidar por el administrador y tienen baja potencia al principio", "Tienen difícil administración inmediata y se retrasan en el tiempo"], "e": "Materiales: ventajas: gran potencia, muy útiles en niños pequeños y con discapacidad intelectual, casi universales. Inconvenientes: requieren acordar que se administren solo tras la respuesta deseada, interrumpen la aplicación del programa y se sacian fácilmente.", "f": "D"}, {"id": "t6-022", "t": "t6", "lv": 1, "q": "¿Para qué perfil resultan especialmente útiles los reforzadores materiales según el tema 6?", "o": ["Niños pequeños y con discapacidad intelectual", "Adolescentes con alta motivación intrínseca", "Adultos en contextos laborales"], "e": "La tabla indica que los reforzadores materiales tienen gran potencia y son muy útiles en niños pequeños y con discapacidad intelectual.", "f": "D"}, {"id": "t6-023", "t": "t6", "lv": 1, "q": "¿Qué tipo de reforzador, según el tema 6, promueve la autoestima, induce motivación intrínseca y no interrumpe el programa, pero tiene baja potencia al principio?", "o": ["Social", "Material", "Simbólico o canjeable"], "e": "Los reforzadores sociales (sonrisas, gestos, caricias, comentarios verbales) son de difícil saciación, fácil administración, promueven la autoestima, inducen motivación intrínseca, no interrumpen el programa y son variados y poco costosos. Inconvenientes: fáciles de olvidar por el administrador y baja potencia al principio.", "f": "D"}, {"id": "t6-024", "t": "t6", "lv": 1, "q": "¿Cuál es el principal inconveniente de los reforzadores de actividad según el tema 6?", "o": ["Difícil administración en el momento inmediato y retraso en el tiempo", "Fácil saciación y necesidad de acordar que se administren solo tras la respuesta deseada", "Son fáciles de olvidar por el administrador y tienen baja potencia al principio"], "e": "Los reforzadores de actividad son muy variados, de fácil elección, difícil saciación, naturales y poco intrusivos, pero tienen difícil administración inmediata y se retrasan en el tiempo.", "f": "D"}, {"id": "t6-025", "t": "t6", "lv": 1, "q": "La economía de fichas es un ejemplo de reforzador:", "o": ["Simbólico o canjeable", "Social y de actividad", "Primario e intrínseco"], "e": "Los reforzadores simbólicos o canjeables (economía de fichas) son fácilmente administrables, permiten retrasar el reforzamiento natural y evitan la saciación. Inconvenientes: uso incorrecto y que permiten acumulación.", "f": "D"}, {"id": "t6-026", "t": "t6", "lv": 1, "q": "¿Qué ventaja específica tienen los reforzadores simbólicos o canjeables?", "o": ["Permiten retrasar el reforzamiento natural y evitan la saciación", "Tienen gran potencia en niños pequeños sin necesidad de canje", "Inducen siempre motivación intrínseca"], "e": "Los simbólicos (fichas) son fácilmente administrables, permiten el retraso del reforzamiento natural y evitan la saciación. Su riesgo es el uso incorrecto y la acumulación.", "f": "D"}, {"id": "t6-027", "t": "t6", "lv": 1, "q": "¿Cómo define el tema 6 el castigo?", "o": ["Presentación de un estímulo contingente a una respuesta que reduce su frecuencia, duración o intensidad", "Retirada de un estímulo aversivo contingente a una respuesta, que aumenta su frecuencia", "Cualquier consecuencia desagradable tras una conducta, aunque no cambie su frecuencia"], "e": "El castigo es la presentación de un estímulo contingente a una respuesta de forma que produce una reducción en su frecuencia, duración o intensidad. Puede ser presentación de un aversivo o retirada de un reforzador.", "f": "D"}, {"id": "t6-028", "t": "t6", "lv": 1, "q": "Según el tema 6, ¿de qué depende la eficacia del castigo?", "o": ["Del modo de aplicarlo y del tipo de respuesta castigada", "Exclusivamente de su intensidad y de la autoridad de quien lo aplica", "De que se aplique en público para que sirva de ejemplo al grupo"], "e": "La diapositiva indica que la eficacia del castigo dependerá del modo de aplicarlo y del tipo de respuesta castigada.", "f": "D"}, {"id": "t6-029", "t": "t6", "lv": 1, "q": "¿Cuál es la principal limitación pedagógica del castigo según el tema 6?", "o": ["Es útil para suprimir respuestas inadecuadas, pero no para enseñar las deseables", "No consigue suprimir conductas inadecuadas, aunque sí enseña conductas alternativas", "Solo funciona con estímulos materiales y pierde eficacia con la edad"], "e": "El castigo es útil para suprimir respuestas inadecuadas, pero no para enseñar las deseables: no ofrece un patrón de conducta alternativo.", "f": "D"}, {"id": "t6-030", "t": "t6", "lv": 1, "q": "¿Qué inconvenientes atribuye el tema 6 al castigo positivo?", "o": ["Es menos eficaz que el reforzamiento positivo, no enseña una alternativa y genera frustración e ira", "Tarda en eliminar la conducta y no resulta reforzante para quien lo aplica", "Es más eficaz que el reforzamiento positivo, pero genera dependencia del adulto que lo aplica"], "e": "Ventajas del castigo positivo: elimina la conducta rápidamente y es reforzante para quien lo aplica. Inconvenientes: menos eficaz que el reforzamiento positivo, solo enseña lo que no hay que hacer y provoca frustración e ira.", "f": "D"}, {"id": "t6-031", "t": "t6", "lv": 1, "q": "¿Qué riesgo implica que el castigo positivo sea «reforzante para quien lo aplica»?", "o": ["Que el docente lo use cada vez más por su efecto inmediato, aunque sea menos eficaz", "Que el alumno castigado perciba el castigo como atención y aumente su autoestima", "Que el castigo se convierta en reforzamiento negativo y aumente la conducta castigada"], "e": "El castigo elimina la conducta rápidamente, lo que refuerza a quien lo aplica y puede llevar a abusar de él, pese a ser menos eficaz que el reforzamiento positivo y no enseñar alternativas.", "f": "D"}, {"id": "t6-032", "t": "t6", "lv": 1, "q": "Cuando se usa el castigo, ¿cómo recomienda aplicarlo el tema 6?", "o": ["Junto a otras técnicas: reforzando conductas alternativas y prefiriendo el castigo negativo al positivo", "Como única técnica, para que la consecuencia sea clara y no se mezcle con premios", "Prefiriendo el castigo positivo al negativo por su rapidez en eliminar la conducta"], "e": "Por sus inconvenientes, cuando se usa el castigo se combina con el reforzamiento de conductas alternativas, y se prefiere el castigo negativo antes que el positivo.", "f": "D"}, {"id": "t6-033", "t": "t6", "lv": 1, "q": "La sobrecorrección es una técnica de castigo positivo propuesta por:", "o": ["Foxx y Azrin (1972)", "Pavlov (1927)", "Rescorla (1980)"], "e": "La sobrecorrección es de Foxx y Azrin (1972) y tiene dos modalidades: restitución y práctica positiva.", "f": "D"}, {"id": "t6-034", "t": "t6", "lv": 1, "q": "Un alumno que ha tirado papeles al suelo debe recogerlos y, además, ordenar toda el aula. Es una sobrecorrección de tipo:", "o": ["Restitución", "Práctica positiva", "Coste de respuesta"], "e": "La restitución exige restaurar el daño producido y mejorar el estado original anterior al acto (el ejemplo de la diapositiva: el niño recoge lo que ha tirado y además ordena la habitación).", "f": "D"}, {"id": "t6-035", "t": "t6", "lv": 1, "q": "Un alumno que ha cerrado la puerta de un portazo debe practicar varias veces cerrarla con suavidad. Es una sobrecorrección de tipo:", "o": ["Práctica positiva", "Restitución", "Coste de respuesta"], "e": "La práctica positiva consiste en practicar repetidamente una respuesta positiva, alternativa a la inadecuada.", "f": "D"}, {"id": "t6-036", "t": "t6", "lv": 1, "q": "Las sentencias del juez Emilio Calatayud se presentan en el tema 6 como ejemplos de:", "o": ["Castigos con práctica positiva", "Reforzamiento negativo", "Condicionamiento clásico"], "e": "La diapositiva presenta las sentencias de Emilio Calatayud (impartir clases de informática, trabajar con bomberos, visitar a personas parapléjicas…) como ejemplos de castigos con práctica positiva.", "f": "D"}, {"id": "t6-037", "t": "t6", "lv": 1, "q": "El juez Calatayud condenó a un joven que había crackeado empresas granadinas a impartir cien horas de clases de informática. ¿Qué principio de la sobrecorrección ilustra?", "o": ["Sustituir el estímulo aversivo por una tarea socialmente apropiada relacionada con la falta", "Retirar un reforzador positivo de forma contingente a la conducta inadecuada", "Apartar al infractor de su entorno durante un tiempo breve para que no obtenga refuerzo"], "e": "El tema indica que en el castigo positivo deben sustituirse los estímulos aversivos por tareas socialmente apropiadas o que corrijan la situación problema; las sentencias de Calatayud son ejemplos de práctica positiva.", "f": "D"}, {"id": "t6-038", "t": "t6", "lv": 1, "q": "El castigo negativo consiste en:", "o": ["Retirar reforzadores positivos de forma contingente a una conducta inadecuada", "Presentar un estímulo aversivo contingente a la conducta", "Retirar un estímulo aversivo para aumentar la conducta"], "e": "El castigo negativo es retirar reforzadores positivos contingentes a una conducta no adecuada. Sus tipos más utilizados son el tiempo fuera y el coste de respuesta.", "f": "D"}, {"id": "t6-039", "t": "t6", "lv": 1, "q": "¿Cuáles son los dos tipos de castigo negativo más utilizados según el tema 6?", "o": ["Tiempo fuera y coste de respuesta", "Restitución y práctica positiva", "Economía de fichas y elogio"], "e": "Los tipos más utilizados de castigo negativo son el tiempo fuera y el coste de respuesta.", "f": "D"}, {"id": "t6-040", "t": "t6", "lv": 1, "q": "El tiempo fuera consiste en:", "o": ["Retirar al alumno la posibilidad de obtener reforzamiento apartándolo durante un tiempo breve", "Retirar puntos o privilegios ya ganados de forma proporcional a la falta cometida", "Hacer que el alumno repare el daño y mejore el estado anterior a la falta"], "e": "El tiempo fuera retira al sujeto la posibilidad de obtener reforzamiento apartándolo durante un tiempo breve. Quitar puntos o privilegios es coste de respuesta.", "f": "D"}, {"id": "t6-041", "t": "t6", "lv": 1, "q": "¿Cuál de las siguientes NO es una premisa del tiempo fuera según el tema 6?", "o": ["Aplicarlo durante periodos largos para que sea eficaz", "Que el lugar no sea reforzante", "Comunicarlo de manera neutra y consistente"], "e": "Las premisas del tiempo fuera son: un lugar que no sea reforzante, tiempos breves y comunicarlo de forma neutra y consistente, al margen de la respuesta emocional.", "f": "D"}, {"id": "t6-042", "t": "t6", "lv": 1, "q": "Un alumno que molesta durante una dinámica se queda en el aula, pero sin participar en la actividad. ¿Qué tipo de tiempo fuera es?", "o": ["Observación contingente", "Tiempo fuera por aislamiento", "Tiempo fuera por exclusión"], "e": "Tipos de tiempo fuera: aislamiento («al pasillo»), exclusión («rincón de pensar») y observación contingente («se queda, pero no participa en la actividad»).", "f": "D"}, {"id": "t6-043", "t": "t6", "lv": 1, "q": "Mandar al alumno «al pasillo» es, según el tema 6, un tiempo fuera de tipo:", "o": ["Aislamiento", "Exclusión", "Observación contingente"], "e": "La diapositiva identifica «al pasillo» con el aislamiento y el «rincón de pensar» con la exclusión.", "f": "D"}, {"id": "t6-044", "t": "t6", "lv": 1, "q": "Un profesor manda a un alumno disruptivo al pasillo, donde se encuentra con amigos de otra clase y se lo pasa bien. Según el tema 6, ¿qué premisa del tiempo fuera se ha incumplido?", "o": ["Que el lugar no sea reforzante", "Que el tiempo sea breve", "Que existan reforzadores que retirar"], "e": "El tiempo fuera exige que el lugar no sea reforzante. Si el alumno obtiene reforzamiento en el pasillo, deja de ser un castigo y puede aumentar la conducta disruptiva.", "f": "D"}, {"id": "t6-045", "t": "t6", "lv": 1, "q": "El coste de respuesta consiste en:", "o": ["Retirar un reforzador de forma contingente a una conducta inadecuada, de forma proporcionada y recuperable", "Apartar al alumno de la situación durante un tiempo breve para que no obtenga reforzamiento", "Presentar un estímulo aversivo, como una tarea extra, tras la conducta inadecuada"], "e": "El coste de respuesta retira un reforzador contingente a la conducta inadecuada. Premisas: el sujeto debe poseer reforzadores, la retirada debe ser contingente y proporcional, sin respuesta emocional de quien la aplica, y los reforzadores deben ser fácilmente recuperables con conductas adecuadas.", "f": "D"}, {"id": "t6-046", "t": "t6", "lv": 1, "q": "En una economía de fichas, un profesor quita todas las fichas acumuladas en el trimestre por una falta leve. Según las premisas del coste de respuesta, el error es:", "o": ["No respetar la proporción entre la falta y lo retirado, ni que los reforzadores sean recuperables", "Retirar los reforzadores de forma contingente a la conducta problema", "Aplicar la retirada sin mostrar una respuesta emocional ante el alumno"], "e": "El coste de respuesta exige proporción entre la falta y lo retirado, y que los reforzadores sean fácilmente recuperables al realizar conductas adecuadas.", "f": "D"}, {"id": "t6-047", "t": "t6", "lv": 1, "q": "El aprendizaje verbal y conceptual se caracteriza, según el tema 6, por ser:", "o": ["El mediado por la comunicación verbal y el que recibe mayor atención de los agentes educativos", "Un aprendizaje básico que compartimos con muchas especies y que genera predicciones", "La adquisición de secuencias de pasos que con la práctica se ejecutan de forma automática"], "e": "El aprendizaje verbal y conceptual es el mediado por la comunicación verbal y el que recibe la mayor atención por los agentes educativos.", "f": "D"}, {"id": "t6-048", "t": "t6", "lv": 1, "q": "¿Qué teoría utiliza el tema 6 para explicar cómo se aprende lo que escuchamos o leemos en un texto?", "o": ["La teoría del aprendizaje significativo de Ausubel", "El condicionamiento operante de Skinner", "La teoría de la disonancia cognitiva de Festinger"], "e": "Ante la pregunta «¿cómo se aprende lo que escuchamos o leemos en un texto?», el tema recurre a la teoría del aprendizaje significativo de Ausubel (1963).", "f": "D"}, {"id": "t6-049", "t": "t6", "lv": 1, "q": "En el experimento de Newton del tema 6, ¿en qué grupo se recordó con mayor frecuencia la primera frase («Cuando era niño, Newton era algo extraño»)?", "o": ["En el grupo cuyas frases añadidas tenían relación semántica con ella (la muerte del padre, el abandono de la madre)", "En el grupo cuyas frases añadidas no tenían relación con ella (Cambridge, la casa de la moneda)", "En todos los grupos por igual"], "e": "Las frases con relación semántica (tristeza) facilitan la elaboración y el aprendizaje significativo, por lo que la primera frase se recuerda mejor. Las frases sin relación no facilitan la elaboración e interfieren con el recuerdo.", "f": "D"}, {"id": "t6-050", "t": "t6", "lv": 1, "q": "En el experimento de Newton, ¿por qué las frases «Estudió en Cambridge» y «Fue nombrado guardián de la casa de la moneda» no ayudan a recordar la primera frase?", "o": ["Porque no guardan relación semántica con ella y no facilitan la elaboración", "Porque son datos históricos falsos que el alumnado reconoce y descarta", "Porque son frases más largas que la primera y saturan la memoria de trabajo"], "e": "La diapositiva señala que la ausencia de relación semántica no facilita la elaboración ni el aprendizaje significativo (Ausubel). Las frases relacionadas (tristeza) sí lo facilitan.", "f": "D"}, {"id": "t6-051", "t": "t6", "lv": 1, "q": "¿Qué concepto explica que se recuerde mejor la información nueva cuando se relaciona de forma significativa con lo que ya se sabe?", "o": ["La elaboración, base del aprendizaje significativo", "La extinción de la respuesta condicionada", "La sobrecorrección por práctica positiva"], "e": "El experimento de Newton muestra que la relación semántica facilita la elaboración y, con ella, el aprendizaje significativo de Ausubel.", "f": "D"}, {"id": "t6-052", "t": "t6", "lv": 1, "q": "Una profesora introduce un tema nuevo conectándolo con experiencias y conocimientos previos de su alumnado. Desde el tema 6, favorece:", "o": ["El aprendizaje significativo (Ausubel)", "El condicionamiento clásico", "El aprendizaje de procedimientos automatizados"], "e": "Relacionar lo nuevo con lo que el alumno ya sabe facilita la elaboración y el aprendizaje significativo, frente al aprendizaje memorístico.", "f": "D"}, {"id": "t6-053", "t": "t6", "lv": 1, "q": "Según los apuntes en PDF, ¿qué dos ejes o dimensiones se distinguen en el aprendizaje según Ausubel?", "o": ["Memorístico-significativo (eje vertical) y recepción-descubrimiento (eje horizontal)", "Clásico-operante (eje vertical) y positivo-negativo (eje horizontal)", "Intrínseco-extrínseco (eje vertical) y primario-secundario (eje horizontal)"], "e": "Los apuntes en PDF recogen el eje vertical (aprendizaje memorístico – significativo) y el eje horizontal (aprendizaje por recepción – por descubrimiento). Este contenido no aparece como texto en las diapositivas.", "f": "A"}, {"id": "t6-054", "t": "t6", "lv": 1, "q": "«Si un barco tenía 26 ovejas y 10 cabras a bordo, ¿cuántos años tiene el capitán?». Muchos alumnos responden 36. ¿Qué ilustra este problema en el tema 6?", "o": ["Que aplicar rutinas sin comprender el problema no es aprendizaje significativo: la edad no puede saberse", "Que los alumnos dominan el cálculo mental y aplican correctamente la suma de los datos del enunciado", "Que el condicionamiento clásico explica la resolución de problemas matemáticos en el aula"], "e": "La respuesta correcta es que con esos datos no puede determinarse la edad. Sumar las cifras muestra un aprendizaje mecánico de rutinas sin comprensión, lo contrario del aprendizaje significativo.", "f": "D"}, {"id": "t6-055", "t": "t6", "lv": 1, "q": "El aprendizaje de procedimientos y estrategias se define en el tema 6 como:", "o": ["La adquisición de una secuencia de pasos (motriz, técnica o mental) que con la práctica se automatiza", "La asociación entre un estímulo neutro y uno incondicionado que acaba provocando una respuesta condicionada", "El aprendizaje de conceptos a partir de textos, relacionándolos de forma significativa con lo que ya se sabe"], "e": "Es la adquisición de una secuencia de pasos repetida, ya sean secuencias motrices, de detalle técnico o internas del pensamiento; mediante la práctica se logra ejecutar de manera automática.", "f": "D"}, {"id": "t6-056", "t": "t6", "lv": 1, "q": "¿Qué elemento es clave, según el tema 6, para que un procedimiento se ejecute de forma automática?", "o": ["La práctica", "El castigo negativo", "La relación semántica con conocimientos previos"], "e": "La diapositiva indica que mediante la práctica se logra ejecutar lo aprendido de manera automática.", "f": "D"}, {"id": "t6-057", "t": "t6", "lv": 1, "q": "«¿Aprendemos de la misma manera a hacer una raíz cuadrada que sobre un hecho histórico?». Desde el tema 6, la respuesta es:", "o": ["No: uno es sobre todo un procedimiento y el otro verbal-conceptual, por lo que conviene enseñar según el tipo de contenido", "Sí: todos los contenidos escolares se aprenden por condicionamiento operante, mediante refuerzo de las respuestas correctas", "Sí: ambos se aprenden por memorización literal, porque el aprendizaje verbal es el que más atención recibe"], "e": "El tema abre con esta pregunta para mostrar que los contenidos difieren (sucesos y conductas, verbal-conceptual, procedimientos) y que es útil enseñar en función del tipo de contenido.", "f": "D"}, {"id": "t6-058", "t": "t6", "lv": 1, "q": "¿Qué modelo teórico sería más útil para explicar el aprendizaje de conductas, según el planteamiento del tema 6?", "o": ["El conductismo, mediante el condicionamiento operante", "El constructivismo social de Vygotsky", "La teoría del aprendizaje significativo de Ausubel"], "e": "El tema relaciona el aprendizaje de sucesos con el condicionamiento clásico y el de conductas con el operante, ambos del modelo conductista. El aprendizaje verbal y conceptual se explica desde modelos cognitivos (Ausubel).", "f": "D"}, {"id": "t6-059", "t": "t6", "lv": 1, "q": "¿Qué estímulo se presenta y cómo se clasifica el castigo cuando un profesor pone una tarea extra a un alumno por hablar en clase?", "o": ["Se presenta un estímulo aversivo: castigo positivo", "Se retira un estímulo apetitivo: castigo negativo", "Se retira un estímulo aversivo: reforzamiento negativo"], "e": "Añadir una tarea no deseada contingente a la conducta es presentar un estímulo aversivo: castigo positivo.", "f": "D"}, {"id": "t6-060", "t": "t6", "lv": 1, "q": "Una profesora retira cinco minutos de recreo a quien no entrega la tarea. ¿Qué es?", "o": ["Castigo negativo (coste de respuesta)", "Reforzamiento negativo (tiempo fuera)", "Castigo positivo (sobrecorrección)"], "e": "Retirar un reforzador (recreo) contingente a la conducta inadecuada es castigo negativo, en concreto coste de respuesta.", "f": "D"}, {"id": "t6-061", "t": "t6", "lv": 1, "q": "Un alumno deja de recibir reprimendas cuando entrega puntualmente los trabajos, y desde entonces entrega siempre a tiempo. ¿Qué proceso ha operado?", "o": ["Reforzamiento negativo", "Castigo negativo", "Condicionamiento clásico"], "e": "La conducta (entregar a tiempo) aumenta porque se retira un estímulo aversivo (las reprimendas): reforzamiento negativo.", "f": "D"}, {"id": "t6-a001", "t": "t6", "lv": 2, "q": "Una profesora anuncia: «Quien termine las actividades en clase no tendrá deberes para casa». A partir de entonces, casi todos terminan en clase. ¿Qué procedimiento ha aplicado?", "o": ["Reforzamiento negativo: se retira un estímulo aversivo y aumenta la conducta", "Castigo negativo: se retira algo para reducir la conducta de no trabajar", "Reforzamiento positivo: se presenta un estímulo apetitivo tras la conducta"], "e": "La conducta de terminar en clase aumenta porque se retira algo aversivo (los deberes). Es la misma lógica que el ejemplo de la diapositiva sobre no recoger el material de deporte.", "f": "D"}, {"id": "t6-a002", "t": "t6", "lv": 2, "q": "Un alumno se queda sin el móvil durante el recreo cada vez que lo usa en clase, y deja de usarlo. ¿Qué procedimiento es y qué tipo concreto?", "o": ["Castigo negativo, en la modalidad de coste de respuesta", "Castigo positivo, en la modalidad de sobrecorrección", "Reforzamiento negativo, en la modalidad de tiempo fuera"], "e": "Se retira un reforzador (el móvil en el recreo) de forma contingente a la conducta inadecuada y la conducta disminuye: castigo negativo, en concreto coste de respuesta.", "f": "D"}, {"id": "t6-a003", "t": "t6", "lv": 2, "q": "Un alumno que molesta en clase es enviado al pasillo, donde charla con amigos de otros grupos. Su conducta disruptiva aumenta. ¿Qué ha ocurrido técnicamente?", "o": ["El supuesto tiempo fuera ha actuado como reforzamiento positivo, porque el lugar era reforzante", "El tiempo fuera ha funcionado correctamente como castigo negativo y la conducta acabará bajando", "Se ha aplicado un coste de respuesta sin respetar la proporcionalidad entre falta y retirada"], "e": "Una premisa del tiempo fuera es que el lugar no sea reforzante. Si en el pasillo obtiene atención y diversión, la consecuencia aumenta la conducta: funciona como reforzamiento positivo.", "f": "D"}, {"id": "t6-a004", "t": "t6", "lv": 2, "q": "Un alumno odia la clase de Educación Física. Cada vez que se porta mal, el profesor le manda al banquillo y su conducta disruptiva aumenta. Desde el tema 6, ¿cómo se explica?", "o": ["Salir de la actividad le retira algo aversivo: funciona como reforzamiento negativo", "El banquillo le resulta aversivo: es un castigo positivo que reducirá la conducta", "La exclusión es un coste de respuesta proporcionado que retira un reforzador"], "e": "Si la actividad es aversiva para el alumno, apartarle de ella retira algo aversivo y aumenta la conducta que lo provoca (reforzamiento negativo). El valor de un estímulo depende de la persona, no de la intención del docente.", "f": "D"}, {"id": "t6-a005", "t": "t6", "lv": 2, "q": "¿Qué tipo de tiempo fuera es más adecuado para un alumno que puede aprender observando a sus compañeros pero no debe participar durante unos minutos en una dinámica de grupo?", "o": ["Observación contingente: se queda en el aula, pero no participa", "Aislamiento: se le envía fuera del aula", "Exclusión: se le sitúa en el rincón de pensar sin ver la actividad"], "e": "Los tres tipos de tiempo fuera son aislamiento («al pasillo»), exclusión («rincón de pensar») y observación contingente («se queda, pero no participa»). La observación contingente le permite observar sin acceso al reforzamiento de participar.", "f": "D"}, {"id": "t6-a006", "t": "t6", "lv": 2, "q": "Un profesor aplica tiempo fuera durante 45 minutos y lo comunica gritando visiblemente enfadado. ¿Qué premisas incumple?", "o": ["Emplear tiempos breves y comunicarlo de forma neutra y consistente", "Que el alumno posea reforzadores y que estos sean recuperables", "Que el lugar sea reforzante y que se combine con castigo positivo"], "e": "Las premisas del tiempo fuera son: lugar no reforzante, tiempos breves y comunicación neutra y consistente, al margen de la respuesta emocional. Poseer reforzadores recuperables es una premisa del coste de respuesta.", "f": "D"}, {"id": "t6-a007", "t": "t6", "lv": 2, "q": "Una profesora quiere aplicar coste de respuesta a un alumno que no tiene puntos, privilegios ni nada que perder en el aula. ¿Qué premisa falla?", "o": ["Que el alumno debe poseer reforzadores que se le puedan retirar", "Que el lugar elegido para el tiempo fuera no resulte reforzante para el alumno", "Que la retirada se aplique durante un tiempo breve y con una comunicación neutra"], "e": "El coste de respuesta exige que el sujeto posea reforzadores, que su retirada sea contingente y proporcional, sin respuesta emocional de quien la aplica, y que sean fácilmente recuperables con conductas adecuadas.", "f": "D"}, {"id": "t6-a008", "t": "t6", "lv": 2, "q": "Dos profesores castigan el mismo insulto: uno pone una tarea extra de copia y el otro obliga al alumno a pedir disculpas y a ayudar al compañero en una actividad. ¿Qué diferencia los dos castigos según el tema 6?", "o": ["El segundo sustituye el castigo aversivo por una tarea apropiada que corrige el problema", "El primero es una sobrecorrección por restitución y el segundo, un coste de respuesta", "Ambos son castigos negativos, porque los dos retiran tiempo libre al alumno"], "e": "El tema indica que en el castigo positivo deben sustituirse los estímulos aversivos por tareas socialmente apropiadas o que corrijan la situación problema, como en la sobrecorrección (restitución y práctica positiva) de Foxx y Azrin.", "f": "D"}, {"id": "t6-a009", "t": "t6", "lv": 2, "q": "Un alumno pinta una mesa. ¿Qué consecuencia corresponde a la restitución y no a la práctica positiva?", "o": ["Limpiar su mesa y además dejar en mejor estado otras mesas del aula", "Escribir cien veces que no debe pintar las mesas", "Practicar varias veces cómo usar correctamente el material de dibujo"], "e": "La restitución exige restaurar el daño producido y mejorar el estado original anterior al acto. La práctica positiva consiste en practicar repetidamente una conducta positiva alternativa. Escribir cien veces es un castigo aversivo sin relación con la reparación.", "f": "D"}, {"id": "t6-a010", "t": "t6", "lv": 2, "q": "¿Por qué el tema 6 recomienda usar el castigo negativo antes que el positivo y siempre junto al refuerzo de conductas alternativas?", "o": ["El castigo positivo genera frustración e ira, y ningún castigo enseña la conducta deseada", "El castigo negativo elimina la conducta más rápido que el positivo y no requiere más técnicas", "El castigo positivo no reduce la frecuencia de ninguna conducta en el contexto escolar"], "e": "El castigo positivo es menos eficaz que el reforzamiento positivo, no ofrece un patrón alternativo y provoca respuestas emocionales negativas. El castigo, en general, sirve para suprimir conductas, pero no para enseñar las deseables.", "f": "D"}, {"id": "t6-a011", "t": "t6", "lv": 2, "q": "Un profesor elogia a un alumno muy tímido delante de toda la clase cada vez que participa, y el alumno participa cada vez menos. ¿Qué conclusión técnica es correcta?", "o": ["Para ese alumno el elogio público no es reforzante; puede funcionar como estímulo aversivo", "El elogio siempre es reforzamiento positivo, así que la conducta aumentará con el tiempo", "Se trata de reforzamiento negativo, porque la participación disminuye"], "e": "Un estímulo se define como reforzador por su efecto: si la conducta disminuye, no está reforzando. Para un alumno tímido, la exposición pública puede ser aversiva, y presentarla tras la conducta actúa como castigo.", "f": "D"}, {"id": "t6-a012", "t": "t6", "lv": 2, "q": "Un docente trabaja con un alumno de 1.º de ESO con discapacidad intelectual y necesita un reforzador muy potente al principio. Según la tabla del tema 6, ¿cuál es el más adecuado y qué inconveniente debe vigilar?", "o": ["Material, por su gran potencia; vigilar la saciación y darlo solo tras la conducta", "Social, por su gran potencia inicial; vigilar que el docente no se olvide de darlo", "De actividad, por su inmediatez; vigilar que no se produzca la saciación"], "e": "Los reforzadores materiales tienen gran potencia y son muy útiles en niños pequeños y con discapacidad intelectual. Sus inconvenientes son la fácil saciación, que interrumpen el programa y que hay que acordar que se den solo tras la respuesta deseada. Los sociales tienen baja potencia al principio.", "f": "D"}, {"id": "t6-a013", "t": "t6", "lv": 2, "q": "¿Qué tipo de reforzador conviene ir introduciendo para que el alumno desarrolle motivación intrínseca y autoestima, según el tema 6?", "o": ["Social (elogios, gestos), porque promueve la autoestima y la motivación intrínseca", "Material (premios y regalos), porque tiene más potencia y es casi universal", "Simbólico (fichas canjeables), porque evita la saciación y permite acumularse"], "e": "Los reforzadores sociales son de difícil saciación y fácil administración, promueven la autoestima, inducen motivación intrínseca, no interrumpen el programa y son variados y poco costosos.", "f": "D"}, {"id": "t6-a014", "t": "t6", "lv": 2, "q": "Un programa de economía de fichas fracasa porque algunos alumnos acumulan muchas y luego dejan de esforzarse. ¿Qué inconveniente de los reforzadores simbólicos recoge la tabla del tema 6?", "o": ["Permiten la acumulación y pueden usarse de forma incorrecta", "Tienen baja potencia al principio y son fáciles de olvidar por quien los administra", "Interrumpen la aplicación del programa y se sacian con mucha facilidad"], "e": "La tabla indica que los reforzadores simbólicos o canjeables son fácilmente administrables, permiten retrasar el reforzamiento natural y evitan la saciación, pero tienen como inconvenientes el uso incorrecto y que permiten la acumulación.", "f": "D"}, {"id": "t6-a015", "t": "t6", "lv": 2, "q": "«Si terminas los ejercicios, el viernes jugaremos al fútbol». ¿Qué ventaja e inconveniente tiene este reforzador según el tema 6?", "o": ["De actividad: natural y de difícil saciación, pero difícil de dar de inmediato", "Material: gran potencia, pero fácil saciación", "Social: fácil administración, pero baja potencia al principio"], "e": "Los reforzadores de actividad son muy variados, de fácil elección, de difícil saciación y naturales, pero tienen difícil administración inmediata y se retrasan en el tiempo.", "f": "D"}, {"id": "t6-a016", "t": "t6", "lv": 2, "q": "Integrando los temas 6 y 7-8, ¿qué riesgo tiene basar toda la motivación de un grupo en reforzadores materiales y extrínsecos?", "o": ["Fomentar la regulación externa y la saciación sin desarrollar motivación intrínseca", "Aumentar automáticamente la regulación integrada y la motivación por la tarea", "Eliminar la necesidad de dar retroalimentación sobre el progreso del alumnado"], "e": "Los reforzadores materiales se sacian e interrumpen el programa (tema 6), y la conducta basada en recompensas externas corresponde a la regulación externa, la menos autodeterminada (tema 7-8). Los sociales sí inducen motivación intrínseca.", "f": "D"}, {"id": "t6-a017", "t": "t6", "lv": 2, "q": "Un alumno siente ansiedad cada vez que oye el timbre de la clase de Matemáticas, porque en esa clase le han humillado varias veces. ¿Qué tipo de aprendizaje es y cuál es el estímulo condicionado?", "o": ["Condicionamiento clásico; el timbre de la clase", "Condicionamiento operante; la humillación", "Condicionamiento clásico; la ansiedad"], "e": "El timbre, inicialmente neutro, se ha asociado a una experiencia aversiva (la humillación, estímulo incondicionado) y ahora provoca por sí solo ansiedad (respuesta condicionada). Es aprendizaje de sucesos, como el pequeño Albert.", "f": "D"}, {"id": "t6-a018", "t": "t6", "lv": 2, "q": "¿Qué diferencia esencial hay entre el aprendizaje del pequeño Albert y el de un alumno que estudia más porque así recibe elogios?", "o": ["Albert asocia estímulos (clásico); el alumno aprende por las consecuencias de su conducta (operante)", "Albert aprende por consecuencias (operante); el alumno asocia estímulos (clásico)", "Ambos son condicionamiento operante con refuerzo positivo"], "e": "En el condicionamiento clásico se aprende a predecir por la presencia de estímulos (sucesos). En el operante se aprende porque la conducta emitida depara ciertas consecuencias (reforzamiento o castigo).", "f": "D"}, {"id": "t6-a019", "t": "t6", "lv": 2, "q": "En el experimento de Newton, ¿qué grupo recordó peor la frase «Cuando era niño, Newton era algo extraño»?", "o": ["El que la recibió junto con frases sin relación semántica (Cambridge y la casa de la moneda)", "El que la recibió junto con frases relacionadas (la muerte del padre y el abandono de la madre)", "El que la recibió sola, sin ninguna frase añadida"], "e": "Las frases sin relación semántica no facilitan la elaboración e interfieren con el recuerdo. Las frases relacionadas (tristeza) facilitan la elaboración y el aprendizaje significativo, por lo que ese grupo recordó mejor la primera frase.", "f": "D"}, {"id": "t6-a020", "t": "t6", "lv": 2, "q": "Un profesor de Economía quiere que su alumnado recuerde el concepto de inflación. ¿Qué estrategia aplica mejor la lección del experimento de Newton?", "o": ["Relacionarlo con experiencias suyas, como la subida del precio de productos que compran", "Añadir datos curiosos sin relación, como la historia de la moneda en la Edad Media", "Pedirles que repitan la definición literal varias veces"], "e": "Lo que se relaciona semánticamente con lo que ya se sabe facilita la elaboración y el aprendizaje significativo (Ausubel). Los datos añadidos sin relación interfieren; la repetición literal produce aprendizaje memorístico.", "
