  view="quiz"; sideOpen=false; render(); window.scrollTo(0,0);
}
function choose(i){
  const it = session.items[session.idx];
  if(session.mode==="practice"){
    if(it.done) return;
    it.chosen=i; it.done=true;
    record(it.id, it.perm[i]===0 ? 1 : 0);
  } else {
    if(session.finished) return;
    it.chosen = (it.chosen===i) ? null : i;
  }
  saveLS(LS_SESS,session); render();
}
function leaveBlank(){
  const it = session.items[session.idx];
  if(session.mode==="practice"){ if(it.done) return; it.chosen=null; it.done=true; record(it.id,-1); }
  else { it.chosen=null; }
  saveLS(LS_SESS,session); render();
}
function go(d){
  const n=session.items.length;
  const ni=session.idx+d;
  if(ni<0) return;
  if(ni>=n){ if(session.mode==="practice") finish(); else confirmFinish(); return; }
  session.idx=ni; saveLS(LS_SESS,session); render(); focusQuestion();
}
function jump(i){ session.idx=i; saveLS(LS_SESS,session); view="quiz"; render(); focusQuestion(); }
function confirmFinish(){
  const st=sessionStats(session);
  const left=st.n-st.ans;
  showDialog(left ? `Te quedan ${left} preguntas sin contestar; contarán como en blanco. ¿Entregar el simulacro?` : "¿Entregar el simulacro y ver la corrección?",
    [{t:"Seguir respondiendo"},{t:"Entregar",primary:true,fn:finish}]);
}
function finish(){
  if(session.mode==="exam"){
    for(const it of session.items){ it.done=true; record(it.id, it.chosen==null ? -1 : (it.perm[it.chosen]===0?1:0)); }
  } else {
    for(const it of session.items){ if(!it.done){ it.done=true; } }
  }
  session.finished=true; session.ended=Date.now();
  saveLS(LS_SESS,session); view="result"; render(); window.scrollTo(0,0);
}
function focusQuestion(){ const el=document.getElementById("qtext"); if(el) el.focus({preventScroll:false}); }

/* ---------- exportar / importar progreso ---------- */
function encodeProgress(){
  const o={}; for(const k in progress){const p=progress[k]; o[k]=[p.c,p.w,p.b,p.l===null?-1:p.l,p.t];}
  return "ADP1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decodeProgress(code){
  code=code.trim(); if(!code.startsWith("ADP1:")) throw new Error("formato");
  const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(5))))); const out={};
  for(const k in o){ if(!byId[k]) continue; const a=o[k]; out[k]={c:+a[0]||0,w:+a[1]||0,b:+a[2]||0,l:a[3]===-1?null:a[3],t:+a[4]||0}; }
  return out;
}
function exportProgress(){
  const code=encodeProgress();
  const d=document.getElementById("dlg");
  d.innerHTML=`<div class="dialog-back" role="dialog" aria-modal="true"><div class="dialog" style="max-width:520px"><p><b>Tu código de progreso</b><br>Cópialo y pégalo en «Pegar progreso» en el otro dispositivo. Se combina con lo que ya haya allí.</p><textarea id="expcode" readonly style="width:100%;height:120px;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)">${code}</textarea><p id="expmsg" class="hint"></p><div class="row" style="justify-content:flex-end"><button class="btn quiet" id="expclose">Cerrar</button><button class="btn" id="expcopy">Copiar</button></div></div></div>`;
  const ta=document.getElementById("expcode"); ta.focus(); ta.select();
  document.getElementById("expclose").onclick=()=>d.innerHTML="";
  document.getElementById("expcopy").onclick=async()=>{
    const msg=document.getElementById("expmsg");
    try{ await navigator.clipboard.writeText(code); msg.textContent="Copiado."; }
    catch(e){ ta.select(); try{ document.execCommand("copy"); msg.textContent="Copiado."; }catch(_){ msg.textContent="Selecciona el texto y cópialo a mano."; } }
  };
}
function importProgress(){
  const d=document.getElementById("dlg");
  d.innerHTML=`<div class="dialog-back" role="dialog" aria-modal="true"><div class="dialog" style="max-width:520px"><p><b>Pegar progreso</b><br>Pega aquí el código copiado en el otro dispositivo.</p><textarea id="impcode" style="width:100%;height:120px;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)"></textarea><p id="impmsg" class="hint"></p><div class="row" style="justify-content:flex-end"><button class="btn quiet" id="impclose">Cancelar</button><button class="btn" id="impok">Cargar</button></div></div></div>`;
  document.getElementById("impcode").focus();
  document.getElementById("impclose").onclick=()=>d.innerHTML="";
  document.getElementById("impok").onclick=()=>{
    try{
      const inc=decodeProgress(document.getElementById("impcode").value);
      progress=mergeProgress(progress,inc); saveLS(LS_PROG,progress); scheduleSync();
      d.innerHTML=""; render();
    }catch(e){ document.getElementById("impmsg").textContent="El código no es válido. Cópialo completo, empieza por ADP1:"; }
  };
}

/* ---------- diálogos ---------- */
function showDialog(text, buttons){
  const d=document.getElementById("dlg");
  d.innerHTML=`<div class="dialog-back" role="dialog" aria-modal="true"><div class="dialog"><p>${esc(text)}</p><div class="row" style="justify-content:flex-end">${buttons.map((b,i)=>`<button class="btn ${b.primary?'':'quiet'}" id="dlgb${i}">${esc(b.t)}</button>`).join("")}</div></div></div>`;
  buttons.forEach((b,i)=>document.getElementById("dlgb"+i).onclick=()=>{d.innerHTML=""; if(b.fn)b.fn();});
  const last=document.getElementById("dlgb"+(buttons.length-1)); if(last) last.focus();
}

/* ---------- render ---------- */
function render(){ renderMain(); renderSide(); }

function renderSide(){
  const side=document.getElementById("side");
  side.className = sideOpen ? "open" : "";
  const g=globalStats();
  const pend=g.ko, nuevas=g.n-g.ok-g.ko;
  let html="";
  if(session && (view==="quiz"||view==="result")){
    const st=sessionStats(session);
    const exam = session.mode==="exam" && !session.finished;
    html+=`<section class="panel"><h2>${session.mode==="exam"?"Simulacro":"Sesión de práctica"} · ${st.n} preguntas</h2>`;
    if(exam){
      html+=`<div class="big"><div class="b-ok" style="background:var(--accent-soft)"><b style="color:var(--accent)">${st.ans}</b><span>contestadas</span></div><div class="b-bl"><b>${st.n-st.ans}</b><span>pendientes</span></div><div class="b-bl"><b>${session.idx+1}</b><span>actual</span></div></div>
      <p class="hint">La corrección se muestra al entregar, como en el examen.</p>`;
    } else {
      const done=st.ok+st.ko+st.bl;
      html+=`<div class="big"><div class="b-ok"><b>${st.ok}</b><span>aciertos</span></div><div class="b-ko"><b>${st.ko}</b><span>fallos</span></div><div class="b-bl"><b>${st.bl}</b><span>en blanco</span></div></div>
      <div class="note"><span>Nota con penalización (${done} de ${st.n})</span><strong>${fmt(grade(st.ok,st.ko,done||1))}</strong></div>`;
    }
    html+=`<div class="tiles" style="margin-top:12px" aria-label="Mapa de preguntas de la sesión">`;
    session.items.forEach((it,i)=>{
      let c="";
      if(session.mode==="exam" && !session.finished){ c = it.chosen!=null ? "ans":""; }
      else if(it.done){ c = it.chosen==null ? "bl" : (it.perm[it.chosen]===0 ? "ok":"ko"); }
      if(view==="quiz" && i===session.idx) c+=" cur";
      html+=`<button class="tile ${c}" data-jump="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`;
    });
    html+=`</div></section>`;
  }
  html+=`<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Tu progreso global</h2><button class="btn quiet mobile-toggle" id="sidetoggle" style="padding:4px 10px;font-size:.8rem">${sideOpen?"Ocultar temas":"Ver temas"}</button></div>
    <div class="big" style="margin-top:10px"><div class="b-ok"><b>${g.ok}</b><span>dominadas</span></div><div class="b-ko"><b>${pend}</b><span>falladas</span></div><div class="b-bl"><b>${nuevas}</b><span>sin ver</span></div></div>
    <div class="note"><span>Respuestas totales: ${g.c} bien · ${g.w} mal</span><strong>${g.c+g.w?Math.round(g.c/(g.c+g.w)*100):0}%</strong></div>
    <div class="collapsible" style="margin-top:12px">`;
  for(const t of TOPICS){
    const s=topicStats(t.id);
    html+=`<button class="topicrow" data-topic="${t.id}" title="Practicar ${esc(t.name)}"><span>${esc(t.short)}</span><span class="n">${s.ok}✓ ${s.ko}✗ / ${s.n}</span>
      <span class="bar"><i class="g" style="width:${s.ok/s.n*100}%"></i><i class="r" style="width:${s.ko/s.n*100}%"></i></span></button>`;
  }
  html+=`<p class="hint">Verde: última respuesta correcta. Rojo: última respuesta fallada. Pulsa un tema para practicarlo.</p></div>
    <div class="sync" style="margin-top:8px"><span class="dot ${sync.state==="cloud"?"on":""}"></span>${sync.state==="cloud"?"Progreso guardado en tu cuenta (ordenador e iPad)":sync.state==="error"?"No se pudo sincronizar; se guarda en este navegador":"Progreso guardado en este navegador"}</div>
    <div class="row" style="margin-top:10px"><button class="btn quiet" id="exp" style="padding:5px 10px;font-size:.8rem">Copiar mi progreso</button><button class="btn quiet" id="imp" style="padding:5px 10px;font-size:.8rem">Pegar progreso</button></div>
  </section>`;
  side.innerHTML=html;
  side.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ if(view==="result"){ jump(+b.dataset.jump); } else jump(+b.dataset.jump); });
  side.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{
    const go=()=>{cfg.topics=[b.dataset.topic]; cfg.filter="all"; saveLS(LS_CFG,cfg); view="home"; render(); window.scrollTo(0,0);};
    if(view==="quiz" && session && !session.finished) showDialog("¿Salir de la sesión actual para elegir este tema? La sesión quedará guardada sin terminar.",[{t:"Cancelar"},{t:"Salir",primary:true,fn:go}]); else go();
  });
  const tg=document.getElementById("sidetoggle"); if(tg) tg.onclick=()=>{sideOpen=!sideOpen; renderSide();};
  document.getElementById("exp").onclick=exportProgress;
  document.getElementById("imp").onclick=importProgress;
}

function renderMain(){
  const m=document.getElementById("main");
  if(view==="quiz" && session) return renderQuiz(m);
  if(view==="result" && session) return renderResult(m);
  return renderHome(m);
}

function renderHome(m){
  const g=globalStats();
  const sel = cfg.topics;
  const avail = pool(sel,cfg.filter,cfg.level).length;
  const advAll = BANK.filter(q=>q.lv===2).length;
  const pendAll = pool(TOPICS.map(t=>t.id),"wrong").length;
  const newAll = pool(TOPICS.map(t=>t.id),"new").length;
  const resume = session && !session.finished;
  let h="";
  if(resume){
    const st=sessionStats(session);
    h+=`<div class="card"><h2>Tienes una sesión a medias</h2><p class="lead">${session.mode==="exam"?"Simulacro":"Práctica"} de ${st.n} preguntas, vas por la ${session.idx+1}.</p>
    <div class="row"><button class="btn" id="resume">Continuar</button><button class="btn quiet" id="discard">Descartarla</button></div></div>`;
  }
  h+=`<div class="card"><h2>Accesos rápidos</h2><p class="lead">Atajos con todos los temas.</p><div class="shortcuts">
    <button class="shortcut" id="sc-exam"><b>Simulacro de 40</b><span>Todos los temas, corrección al final</span></button>
    <button class="shortcut" id="sc-wrong" ${pendAll?"":"disabled"}><b>Repasar falladas (${pendAll})</b><span>Preguntas cuya última respuesta fue errónea</span></button>
    <button class="shortcut" id="sc-new" ${newAll?"":"disabled"}><b>Preguntas sin ver (${newAll})</b><span>Práctica con corrección inmediata</span></button>
    <button class="shortcut" id="sc-adv" ${advAll?"":"disabled"}><b>Avanzadas (${advAll})</b><span>Casos de aula, conceptos que se confunden y relaciones entre temas</span></button>
    <button class="shortcut" id="sc-all"><b>Todo el banco (${BANK.length})</b><span>Práctica aleatoria completa</span></button>
  </div></div>`;
  h+=`<div class="card"><h2>Configurar una sesión</h2><p class="lead">Elige temas, qué preguntas incluir, cuántas y cómo se corrigen.</p>
  <fieldset><legend>Temas</legend><div class="chips" id="chips-topics">`;
  for(const t of TOPICS){ const s=topicStats(t.id); h+=`<button class="chip" aria-pressed="${sel.includes(t.id)}" data-t="${t.id}">${esc(t.name)}<small>${s.n}</small></button>`; }
  h+=`</div><div class="row" style="margin-top:8px"><button class="btn ghost" id="all-t" style="padding:4px 10px;font-size:.85rem">Todos</button><button class="btn ghost" id="none-t" style="padding:4px 10px;font-size:.85rem">Ninguno</button></div></fieldset>
  <fieldset><legend>Preguntas</legend><div class="chips" data-group="filter">
    ${[["all","Todas"],["new","Solo sin ver"],["wrong","Solo falladas"]].map(([v,l])=>`<button class="chip" aria-pressed="${cfg.filter===v}" data-v="${v}">${l}</button>`).join("")}</div></fieldset>
  <fieldset><legend>Dificultad</legend><div class="chips" data-group="level">
    ${[["all","Todas"],["adv","Solo avanzadas"],["basic","Solo básicas"]].map(([v,l])=>`<button class="chip" aria-pressed="${cfg.level===v}" data-v="${v}">${l}</button>`).join("")}</div></fieldset>
  <fieldset><legend>Cantidad</legend><div class="chips" data-group="count">
    ${[["10","10"],["20","20"],["40","40"],["60","60"],["all","Todas"]].map(([v,l])=>`<button class="chip" aria-pressed="${cfg.count===v}" data-v="${v}">${l}</button>`).join("")}</div></fieldset>
  <fieldset><legend>Corrección</legend><div class="chips" data-group="mode">
    <button class="chip" aria-pressed="${cfg.mode==="practice"}" data-v="practice">Práctica: corrección inmediata</button>
    <button class="chip" aria-pressed="${cfg.mode==="exam"}" data-v="exam">Simulacro: corrección al final</button></div></fieldset>
  <div class="row"><button class="btn" id="go" ${avail?"":"disabled"}>Empezar (${cfg.count==="all"?avail:Math.min(avail,+cfg.count)} preguntas)</button><span class="muted" style="font-size:.85rem">${avail} disponibles con esta selección</span></div>
  </div>`;
  h+=`<div class="card"><h2>Cómo puntúa</h2><p class="lead" style="margin:0">Cada pregunta tiene 3 opciones. La nota usa la fórmula del examen: (aciertos − fallos ÷ 2) ÷ preguntas × 10. Las preguntas en blanco no suman ni restan. Contestar al azar da de media 0 puntos; si descartas una opción con seguridad, contestar te compensa. Atajos de teclado: A, B, C (o 1, 2, 3) para responder, Intro para avanzar.</p>
  <div class="row" style="margin-top:14px"><button class="btn quiet" id="reset">Borrar mi progreso</button></div></div>`;
  m.innerHTML=h;
  m.querySelectorAll("#chips-topics .chip").forEach(b=>b.onclick=()=>{
    const id=b.dataset.t; cfg.topics = cfg.topics.includes(id)? cfg.topics.filter(x=>x!==id) : cfg.topics.concat(id);

  document.getElementById("all-t").onclick=()=>{cfg.topics=TOPICS.map(t=>t.id);saveLS(LS_CFG,cfg);renderMain();};
  document.getElementById("none-t").onclick=()=>{cfg.topics=[];saveLS(LS_CFG,cfg);renderMain();};
  document.getElementById("go").onclick=()=>start();
  const all=TOPICS.map(t=>t.id);
  document.getElementById("sc-exam").onclick=()=>start({topics:all,filter:"all",level:"all",count:"40",mode:"exam"});
  document.getElementById("sc-wrong").onclick=()=>start({topics:all,filter:"wrong",level:"all",count:"all",mode:"practice"});
  document.getElementById("sc-new").onclick=()=>start({topics:all,filter:"new",level:"all",count:"all",mode:"practice"});
  const sa=document.getElementById("sc-adv"); if(sa) sa.onclick=()=>start({topics:all,filter:"all",level:"adv",count:"40",mode:"practice"});
  document.getElementById("sc-all").onclick=()=>start({topics:all,filter:"all",level:"all",count:"all",mode:"practice"});
  document.getElementById("reset").onclick=()=>showDialog("Se borrarán todos tus aciertos y fallos guardados, también en tu cuenta. ¿Seguro?",[{t:"Cancelar"},{t:"Borrar",primary:true,fn:()=>{progress={};saveLS(LS_PROG,progress);session=null;saveLS(LS_SESS,null);if(sync.db)pushSync();render();}}]);
  if(resume){ document.getElementById("resume").onclick=()=>{view="quiz";render();}; document.getElementById("discard").onclick=()=>{session=null;saveLS(LS_SESS,null);render();}; }
}

function renderQuiz(m){
  const it=session.items[session.idx], q=byId[it.id];
  if(!q){ session=null; saveLS(LS_SESS,null); view="home"; return renderHome(m); }
  const t=TOPICS.find(x=>x.id===q.t);
  const practice=session.mode==="practice";
  const revealed = it.done && (practice || session.finished);
  let h=`<div class="card"><div class="qmeta"><span>Pregunta ${session.idx+1} de ${session.items.length} · ${esc(t?t.name:"")}</span><span class="row" style="gap:6px">${q.lv===2?'<span class="tag" style="background:var(--ko-soft);color:var(--ko)">Avanzada</span>':""}<span class="tag">${practice?"Práctica":"Simulacro"}</span></span></div>
  <p class="qtext" id="qtext" tabindex="-1">${esc(q.q)}</p><div class="opts" role="group" aria-label="Opciones">`;
  it.perm.forEach((oi,i)=>{
    let c="";
    if(revealed){ if(oi===0) c="right"; else if(it.chosen===i) c="wrong"; }
    else if(it.chosen===i) c="sel";
    h+=`<button class="opt ${c}" data-i="${i}" ${revealed?"disabled":""}><span class="k">${KEYS[i]}</span><span>${esc(q.o[oi])}</span></button>`;
  });
  h+=`</div>`;
  if(revealed){
    const res = it.chosen==null ? "bl" : (it.perm[it.chosen]===0?"ok":"ko");
    const head = res==="ok"?"Correcto": res==="ko"?"Incorrecto: la respuesta correcta está en verde":"En blanco: la respuesta correcta está en verde";
    h+=`<div class="feedback ${res}"><b>${head}</b><p>${esc(q.e)}</p><p class="hint" style="margin-top:8px">Fuente: ${SRC[q.f]||q.f}</p></div>`;
  }
  const last = session.idx===session.items.length-1;
  h+=`<div class="nav"><div class="row">`;
  if(!practice && !session.finished) h+=`<button class="btn quiet" id="prev" ${session.idx===0?"disabled":""}>Anterior</button>`;
  if(!revealed && !session.finished) h+=`<button class="btn quiet" id="blank">${practice?"Dejar en blanco":"Quitar respuesta"}</button>`;
  h+=`</div><div class="row"><button class="btn quiet" id="exit">Salir</button>`;
  if(session.finished) h+=`<button class="btn" id="toresult">Volver a resultados</button>`;
  else if(practice) h+= revealed ? `<button class="btn" id="next">${last?"Ver resultados":"Siguiente"}</button>` : "";
  else h+= last ? `<button class="btn" id="deliver">Entregar</button>` : `<button class="btn" id="next">Siguiente</button>`;
  if(!practice && !last && !session.finished) h+=`<button class="btn ghost" id="deliver">Entregar</button>`;
  h+=`</div></div><p class="hint">${practice?"Elige una opción para ver la corrección. Atajos: A/B/C, Intro para seguir.":"Puedes cambiar la respuesta o quitarla. El mapa del panel lateral muestra las contestadas."}</p></div>`;
  m.innerHTML=h;
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const on=(id,fn)=>{const e=document.getElementById(id); if(e) e.onclick=fn;};
  on("next",()=>go(1)); on("prev",()=>go(-1)); on("blank",leaveBlank); on("deliver",confirmFinish);
  on("exit",()=>{view="home";render();window.scrollTo(0,0);});
  on("toresult",()=>{view="result";render();window.scrollTo(0,0);});
  if(revealed){ const n=document.getElementById("next"); if(n) n.focus({preventScroll:true}); }
}

function renderResult(m){
  const st=sessionStats(session);
  const answered=st.ok+st.ko+st.bl;
  const nota=grade(st.ok,st.ko,st.n);
  let h=`<div class="card"><h2>Resultado ${session.mode==="exam"?"del simulacro":"de la sesión"}</h2>
  <div class="result-score"><div class="grade">${fmt(nota)}<small> / 10</small></div>
  <div class="muted">${st.ok} aciertos · ${st.ko} fallos · ${st.bl} en blanco<br>Puntos: ${st.ok} − ${st.ko}÷2 = ${fmt(Math.max(0,st.ok-st.ko/2))} de ${st.n}</div></div>
  <div class="row"><button class="btn" id="again">Nueva sesión</button><button class="btn quiet" id="redo-wrong" ${st.ko+st.bl?"":"disabled"}>Repetir las falladas y en blanco (${st.ko+st.bl})</button><button class="btn quiet" id="home">Inicio</button></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Revisión</h2><div class="chips"><button class="chip" aria-pressed="${!window._onlyWrong}" id="f-all">Todas</button><button class="chip" aria-pressed="${!!window._onlyWrong}" id="f-wrong">Solo errores y blancos</button></div></div><div class="review">`;
  session.items.forEach((it,i)=>{
    const q=byId[it.id]; if(!q) return;
    const res = it.chosen==null ? "bl" : (it.perm[it.chosen]===0?"ok":"ko");
    if(window._onlyWrong && res==="ok") return;
    const yours = it.chosen==null ? "En blanco" : `${KEYS[it.chosen]}) ${q.o[it.perm[it.chosen]]}`;
    const ci = it.perm.indexOf(0);
    h+=`<div class="rv ${res}"><p class="q">${i+1}. ${esc(q.q)}</p>
      <p class="a"><span class="muted">Tu respuesta:</span> ${esc(yours)}</p>
      ${res!=="ok"?`<p class="a"><span class="muted">Correcta:</span> ${KEYS[ci]}) ${esc(q.o[0])}</p>`:""}
      <p class="e">${esc(q.e)} <em>(${SRC[q.f]||q.f})</em></p></div>`;
  });
  h+=`</div></div>`;
  m.innerHTML=h;
  document.getElementById("again").onclick=()=>{view="home";session=null;saveLS(LS_SESS,null);render();window.scrollTo(0,0);};
  document.getElementById("home").onclick=()=>{view="home";render();window.scrollTo(0,0);};
  document.getElementById("f-all").onclick=()=>{window._onlyWrong=false;renderMain();};
  document.getElementById("f-wrong").onclick=()=>{window._onlyWrong=true;renderMain();};
  document.getElementById("redo-wrong").onclick=()=>{
    const ids=session.items.filter(it=>it.chosen==null||it.perm[it.chosen]!==0).map(it=>it.id);
    session={mode:"practice",idx:0,finished:false,started:Date.now(),items:shuffle(ids).map(id=>({id,perm:shuffle([0,1,2]),chosen:null,done:false}))};
    saveLS(LS_SESS,session); view="quiz"; render(); window.scrollTo(0,0);
  };
}

/* ---------- teclado ---------- */
document.addEventListener("keydown",e=>{
  if(document.getElementById("dlg").innerHTML) return;
  if(view!=="quiz"||!session) return;
  if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="SELECT")) return;
  const k=e.key.toLowerCase();
  const map={a:0,b:1,c:2,"1":0,"2":1,"3":2};
  if(k in map){ e.preventDefault(); choose(map[k]); return; }
  if(k==="enter"){
    const it=session.items[session.idx];
    if(session.mode==="practice" && it.done){ e.preventDefault(); go(1); }
    else if(session.mode==="exam"){ e.preventDefault(); go(1); }
  }
  if(k==="arrowright" && session.mode==="exam"){ go(1); }
  if(k==="arrowleft" && session.mode==="exam"){ go(-1); }
});

if(view==="result") view="home";
render();
initSync();
</script>
</body>
</html>
