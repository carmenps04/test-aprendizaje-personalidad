 forma de vestir"], "e": "La diapositiva indica que las relaciones se basan en la intimidad y la comprensión interpersonal, en el intercambio de pensamientos y sentimientos, con apoyo mutuo, confianza y lealtad recíprocas.", "f": "D"}, {"id": "t4-032", "t": "t4", "lv": 1, "q": "¿En qué cuestiones suelen influir más los padres y profesores que el grupo de iguales?", "o": ["Moralidad, elección de carrera y religión", "Vestimenta, música y ocio", "Lenguaje, gustos estéticos y aficiones"], "e": "Aunque el grupo de iguales modela conductas, hábitos, creencias y valores, los padres y profesores suelen influir más en moralidad, elección de carrera y religión.", "f": "D"}, {"id": "t4-033", "t": "t4", "lv": 1, "q": "Las pandillas se definen como:", "o": ["Grupos con valores, conductas y códigos similares que confieren identidad de grupo y sentido de pertenencia", "Grupos delictivos organizados en torno a un líder que promueven conductas de riesgo", "Grupos de trabajo cooperativo que el profesorado forma según los intereses del alumnado"], "e": "Las pandillas son grupos con valores, conductas, actividades y códigos similares que confieren a sus miembros identidad de grupo y sentido de pertenencia.", "f": "D"}, {"id": "t4-034", "t": "t4", "lv": 1, "q": "¿Cómo evolucionan las pandillas según el tema 4?", "o": ["Primero son del mismo sexo, luego mixtas, y se disuelven tras la adolescencia cuando los jóvenes se vuelven más selectivos", "Primero son mixtas, luego del mismo sexo, y se mantienen estables en la adultez temprana", "No cambian de composición y se mantienen durante la juventud como principal apoyo"], "e": "Las pandillas son primero del mismo sexo y luego heterosexuales, y se disuelven tras la adolescencia, cuando los jóvenes se vuelven más selectivos en cuanto a quién y en qué les influye.", "f": "D"}, {"id": "t4-035", "t": "t4", "lv": 1, "q": "¿Cuál de los siguientes es un efecto positivo de la presión del grupo según el tema 4?", "o": ["Reducir o retrasar el consumo de tabaco y drogas y las relaciones sexuales inseguras", "Adaptar la forma de vestir, la música y la actitud a las del grupo", "Aumentar la dependencia del grupo para el apoyo emocional y social"], "e": "La presión de grupo conduce a adaptarse a los pares (comportamiento, vestido, actitud, música), pero también puede tener efectos positivos: participar en deportes, estudiar para exámenes, reducir o retrasar consumos y relaciones inseguras, aprovechar el tiempo libre o seguir estudios universitarios.", "f": "D"}, {"id": "t4-036", "t": "t4", "lv": 1, "q": "Según Woolfolk (2014), ¿qué características valoran los alumnos en su relación con el profesor?", "o": ["Empatía, contacto visual y postura relajada", "Autoridad, distancia y exigencia", "Humor, juventud y uso de tecnología"], "e": "La diapositiva cita a Woolfolk (2014): empatía, contacto visual y postura relajada.", "f": "D"}, {"id": "t4-037", "t": "t4", "lv": 1, "q": "¿Qué efectos propicia una relación profesor-alumno basada en la empatía, el contacto visual y la postura relajada?", "o": ["Más interés por el curso, más motivación de logro y mejor aceptación del profesor", "Menor exigencia académica, más permisividad y mayor dependencia del profesor", "Más paternalismo, menos motivación de logro y bajo rendimiento"], "e": "Este tipo de relaciones propicia más interés por el curso, más motivación de logro (capacidad para orientar la conducta hacia un objetivo) y mejor aceptación del profesor.", "f": "D"}, {"id": "t4-038", "t": "t4", "lv": 1, "q": "El interés académico del profesor, relacionado con tener expectativas altas y ayudar a alcanzarlas, es especialmente importante para:", "o": ["Los alumnos con alto rendimiento", "Los alumnos con dificultades", "Los alumnos con NEAE exclusivamente"], "e": "El interés académico es importante para alumnos con alto rendimiento; el interés personal (paciencia, respeto, humor, escucha, interés por sus problemas) es relevante para alumnos con dificultades.", "f": "D"}, {"id": "t4-039", "t": "t4", "lv": 1, "q": "Un profesor muy cercano, que escucha los problemas personales de sus alumnos pero les exige poco «porque bastante tienen», obtiene bajos resultados. Según el tema 4, se produce:", "o": ["Paternalismo y bajo rendimiento por interés personal alto sin expectativas adecuadas", "Bajo rendimiento por expectativas altas sin suficiente interés personal", "Alto rendimiento por el equilibrio entre interés personal y académico"], "e": "Niveles de interés personal altos sin expectativas adecuadas provocan paternalismo y bajo rendimiento. Las expectativas altas sin interés personal provocan bajo rendimiento por falta de apoyo.", "f": "D"}, {"id": "t4-040", "t": "t4", "lv": 1, "q": "Una profesora exige mucho y tiene expectativas muy altas, pero no muestra ningún interés por las circunstancias personales de su alumnado. Según el tema 4, el resultado esperable es:", "o": ["Bajo rendimiento por no disponer de apoyo suficiente", "Paternalismo y bajo rendimiento por exceso de cercanía", "Alto rendimiento generalizado gracias a las expectativas altas"], "e": "Las expectativas altas sin interés personal provocan bajo rendimiento del alumno al no disponer de apoyo suficiente.", "f": "D"}, {"id": "t4-041", "t": "t4", "lv": 1, "q": "¿Qué rasgo NO forma parte del sentido de moralidad que los padres esperan que desarrollen sus hijos según el tema 4?", "o": ["Obedecer siempre las normas aunque nadie las explique", "Hacer lo correcto cuando nadie supervisa", "Preocupación prosocial y altruismo"], "e": "Se espera que tengan valores personales que les permitan distinguir el bien del mal y actuar en consecuencia, hacer lo correcto cuando nadie supervisa, respetar los derechos de los demás, preocupación prosocial y altruismo, y compromiso personal con las reglas sociales.", "f": "D"}, {"id": "t4-042", "t": "t4", "lv": 1, "q": "«No hay cultura sin moral». En el tema 4 esta idea se vincula con que:", "o": ["Las personas adquirimos hábitos estables que no son solo intelectuales, sino también afectivos o morales", "La moral es un rasgo innato que la cultura se limita a expresar, por lo que apenas se aprende", "La moral depende sobre todo de la religión y la escuela no debe intervenir en su desarrollo"], "e": "La diapositiva de desarrollo moral señala que adquirimos hábitos estables no únicamente intelectuales, sino también afectivos o morales, y que no hay cultura sin moral.", "f": "D"}, {"id": "t4-043", "t": "t4", "lv": 1, "q": "Según la diapositiva de Kohlberg, ¿qué caracteriza el nivel I (moralidad preconvencional)?", "o": ["Control externo de la conducta y obediencia para evitar castigos u obtener recompensas por interés propio", "Cierta internalización de las normas y su cumplimiento para agradar a otros y obtener aprobación social", "Control interno de la conducta y principios personales que pueden contradecir las normas establecidas"], "e": "Nivel I (4-10 años): control externo y obediencia para evitar castigos o conseguir recompensas, por intereses propios o para satisfacer necesidades personales.", "f": "D"}, {"id": "t4-044", "t": "t4", "lv": 1, "q": "¿Qué edades atribuye la diapositiva a los niveles de Kohlberg?", "o": ["Preconvencional 4-10 años; convencional 10-13; posconvencional a partir de 13", "Preconvencional 0-2; convencional 2-7; posconvencional 7-12", "Preconvencional 12-14; convencional 14-16; posconvencional a partir de 18"], "e": "La diapositiva recoge: nivel I (4-10 años), nivel II (10-13 años) y nivel III (a partir de 13 años).", "f": "D"}, {"id": "t4-045", "t": "t4", "lv": 1, "q": "Un alumno de 12 años no copia en el examen «porque la profesora se pondría triste y mis padres se decepcionarían». Según Kohlberg, se sitúa en:", "o": ["La moral convencional", "La moral preconvencional", "La moral posconvencional"], "e": "El nivel II (convencional) implica cierta internalización de normas y su observancia para agradar a otros, con refuerzos y castigos sociales.", "f": "D"}, {"id": "t4-046", "t": "t4", "lv": 1, "q": "Una alumna decide participar en una protesta no autorizada porque considera que defender los derechos humanos está por encima de la norma del centro. Según Kohlberg, su razonamiento es:", "o": ["Posconvencional", "Convencional", "Preconvencional"], "e": "El nivel III (posconvencional o autonomía moral) implica control interno y decisión personal sobre lo correcto, que puede ser contraria a normas o leyes establecidas, y considerar la naturaleza relativa de los valores.", "f": "D"}, {"id": "t4-047", "t": "t4", "lv": 1, "q": "Un niño no pega a su hermano «para que no me castiguen sin tele». ¿En qué nivel de Kohlberg se sitúa?", "o": ["Preconvencional", "Convencional", "Posconvencional"], "e": "Evitar el castigo como motivo de la conducta moral es propio del nivel preconvencional: control externo y obediencia para evitar castigos o conseguir recompensas.", "f": "D"}, {"id": "t4-048", "t": "t4", "lv": 1, "q": "¿Cuáles son los dos factores que influyen en la conducta moral según el tema 4?", "o": ["Modelamiento e internalización", "Asimilación y acomodación", "Refuerzo y castigo"], "e": "El modelamiento (modelos interesados por los demás y generosos) y la internalización (adoptar como propios los estándares externos de las figuras de autoridad) influyen en la conducta moral.", "f": "D"}, {"id": "t4-049", "t": "t4", "lv": 1, "q": "Según Eisenberg y Morris (2004), ¿qué técnica promueve el desarrollo moral?", "o": ["La inducción: explicar por qué una conducta es reprobable, sus consecuencias para otros y cómo reparar el daño", "La afirmación del poder parental: imponer la norma con firmeza y sin explicaciones", "La retirada de afecto: mostrar distancia emocional hasta que el hijo corrija su conducta"], "e": "La inducción consiste en explicar por qué un comportamiento es reprobable, destacando sus consecuencias y cómo afecta a otros, y sugerir formas de reparar el daño. La retirada de afecto y la afirmación del poder no ayudan y pueden interferir.", "f": "D"}, {"id": "t4-050", "t": "t4", "lv": 1, "q": "Un alumno ha insultado a un compañero. ¿Cuál de las siguientes respuestas docentes aplica la inducción?", "o": ["Preguntarle cómo se sentiría si él fuera el insultado y acordar cómo reparar el daño", "Dejar de hablarle durante una semana para que note el rechazo", "Imponerle el castigo con firmeza y sin explicaciones para que obedezca"], "e": "La inducción incluye preguntar cómo se sentiría si hubiese sido la persona agredida y sugerir formas de reparar. Dejar de hablarle es retirada de afecto y gritar es afirmación del poder; ambas interfieren con el desarrollo moral.", "f": "D"}, {"id": "t4-051", "t": "t4", "lv": 1, "q": "¿Qué diferencia establece el tema 4 entre prosocialidad global y prosocialidad contextual?", "o": ["La global equivale al razonamiento prosocial y la contextual a la conducta prosocial", "La global se da en el deporte colectivo y la contextual en la familia", "La global es la conducta prosocial y la contextual el razonamiento prosocial"], "e": "La diapositiva identifica la prosocialidad global con el razonamiento prosocial y la prosocialidad contextual con la conducta prosocial.", "f": "D"}, {"id": "t4-052", "t": "t4", "lv": 1, "q": "¿Qué relación establece el tema 4 entre el deporte y la prosocialidad?", "o": ["El deporte colectivo fomenta la conducta y el pensamiento prosocial", "El deporte individual es el que más fomenta la prosocialidad", "El deporte reduce la prosocialidad por la competitividad"], "e": "La diapositiva indica que el deporte colectivo fomenta la conducta y el pensamiento prosocial, y que la calidad es menor cuando los estándares personales son altos o hay más dudas y miedos ante las tareas deportivas.", "f": "D"}, {"id": "t4-053", "t": "t4", "lv": 1, "q": "¿Cuáles son las tres tareas del desarrollo que destaca la diapositiva de prosocialidad?", "o": ["Formación de la identidad («yo integral»), autonomía respecto a los padres y moral autónoma", "Elección de la profesión, independencia económica y formación de una pareja estable", "Adquisición de las operaciones formales, metacognición y moral heterónoma"], "e": "La diapositiva señala: formación de la identidad, es decir, un «yo integral» que combine armoniosamente los componentes de la personalidad; logro de autonomía e independencia respecto a los padres; y formación de una moral autónoma.", "f": "D"}, {"id": "t4-054", "t": "t4", "lv": 1, "q": "En el modelo de valores humanos universales de Schwartz que aparece en el tema 4, ¿qué valores forman la dimensión de autotrascendencia?", "o": ["Benevolencia y universalismo", "Poder y logro", "Seguridad, tradición y conformidad"], "e": "En el círculo de Schwartz: autopromoción (poder, logro), conservación (seguridad, tradición, conformidad), autotrascendencia (benevolencia, universalismo) y apertura al cambio (autodirección, estimulación, hedonismo).", "f": "D"}, {"id": "t4-055", "t": "t4", "lv": 1, "q": "En el modelo de Schwartz, ¿qué dimensión agrupa la autodirección, la estimulación y el hedonismo?", "o": ["Apertura al cambio", "Conservación", "Autotrascendencia"], "e": "La apertura al cambio agrupa autodirección (creatividad, libertad), estimulación (vida excitante) y hedonismo (placer). Se opone a la conservación.", "f": "D"}, {"id": "t4-056", "t": "t4", "lv": 1, "q": "Según la diapositiva de valores (Lee y Whitehead, 2008), ¿con qué contexto se han asociado valores como el juego limpio, la cooperación o la tolerancia en la niñez y la juventud?", "o": ["La participación en contextos deportivos", "El uso de videojuegos cooperativos en línea", "La educación religiosa en la familia"], "e": "La diapositiva indica que una variedad de valores y actitudes (juego limpio, respeto, cooperación, autorrealización, cohesión, tolerancia) se han asociado a la participación en contextos deportivos en la niñez y la juventud.", "f": "D"}, {"id": "t4-057", "t": "t4", "lv": 1, "q": "Un alumno empuja a otro para quitarle el balón y poder jugar. Según el tema 4, es agresividad:", "o": ["Instrumental", "Hostil abierta", "Relacional"], "e": "La agresividad instrumental tiene como finalidad obtener un privilegio o un objeto. La hostil busca causar daño intencionalmente.", "f": "D"}, {"id": "t4-058", "t": "t4", "lv": 1, "q": "Unas alumnas convencen al resto de la clase de no invitar a una compañera a ningún plan para hacerle daño. ¿Qué tipo de agresividad es?", "o": ["Hostil relacional", "Instrumental", "Hostil abierta"], "e": "La agresividad hostil busca causar daño intencionalmente. La relacional consiste en amenazas o daño en las relaciones sociales; la abierta incluye ofensas, amenazas verbales o ataque físico; la cibernética se produce a través de redes y móviles.", "f": "D"}, {"id": "t4-059", "t": "t4", "lv": 1, "q": "Difundir rumores sobre un compañero en redes sociales es, según el tema 4, agresividad:", "o": ["Hostil cibernética", "Instrumental", "Hostil abierta"], "e": "La agresividad cibernética, subtipo de la hostil, consiste en difundir rumores de compañeros en redes sociales, el móvil, etc.", "f": "D"}, {"id": "t4-060", "t": "t4", "lv": 1, "q": "¿Cuál de estas conclusiones sobre las trampas académicas es correcta según el tema 4?", "o": ["Los estudiantes con metas de desempeño (notas) copian más que los que tienen metas de aprendizaje", "Los buenos estudiantes copian más que los de bajo rendimiento por la presión de mantener sus notas", "Los estudiantes con alta autoeficacia copian más porque confían en no ser descubiertos"], "e": "Las conclusiones son: los chicos copian más que las chicas; los de bajo rendimiento más que los buenos estudiantes; los de metas de desempeño más que los de metas de aprendizaje; y los de baja autoeficacia más que los de alta.", "f": "D"}, {"id": "t4-061", "t": "t4", "lv": 1, "q": "¿Cuál de estas condiciones aumenta la tasa de trampas en el aula?", "o": ["Inculcar la competitividad y valorar las calificaciones por encima de todo", "Poner el énfasis en la comprensión y el dominio de lo enseñado", "Permitir demostrar lo aprendido de formas distintas fuera del examen"], "e": "Las trampas aumentan cuando se inculca la competitividad, la exigencia es demasiado alta, se valoran las calificaciones por encima de todo y la probabilidad de ser descubierto es baja con consecuencias poco importantes. Disminuyen cuando se enfatiza la comprensión y el dominio.", "f": "D"}, {"id": "t4-062", "t": "t4", "lv": 1, "q": "Un docente quiere reducir que su alumnado copie. Según el tema 4, la estrategia más fundamentada es:", "o": ["Enfatizar la comprensión y el dominio, con ejemplos, aplicación y otras formas de demostrar lo aprendido", "Aumentar la dificultad de los exámenes y la vigilancia para que copiar no resulte útil", "Publicar un ranking de notas para que la competencia entre el alumnado motive a estudiar"], "e": "La tasa de trampas disminuye cuando los profesores hacen hincapié en la comprensión y el dominio de lo enseñado. Aumentar la exigencia o fomentar la competitividad incrementa las trampas.", "f": "D"}, {"id": "t4-063", "t": "t4", "lv": 1, "q": "Los objetivos 2 y 3 del tema 4 sostienen que la mejora de la autoestima:", "o": ["Es consecuencia del desempeño en las áreas que nos importan, y el autoconcepto influye mucho en la motivación y en las decisiones de futuro", "Debe trabajarse directamente con técnicas de elogio, porque es la causa de la motivación y de las decisiones de futuro", "Depende de la influencia de los iguales y apenas guarda relación con el autoconcepto ni con la motivación"], "e": "El objetivo 2 indica que la investigación sugiere que la mejora de la autoestima es consecuencia del desempeño en las áreas que nos importan. El objetivo 3 destaca la gran influencia del autoconcepto sobre la motivación y las decisiones de futuro.", "f": "D"}, {"id": "t4-064", "t": "t4", "lv": 1, "q": "Según la diapositiva de modelos familiares, ¿cuál de las siguientes NO aparece entre los modelos familiares actuales?", "o": ["Familia tribal", "Familia reconstituida", "Familia de acogida"], "e": "La diapositiva recoge, entre otros, familias biparentales con o sin hijos, extensas, homoparentales, adoptivas, monoparentales, reconstituidas y de acogida.", "f": "D"}, {"id": "t4-065", "t": "t4", "lv": 1, "q": "Según el tema 4, ¿qué papel sigue teniendo la familia pese a los conflictos de la adolescencia?", "o": ["Es un ancla de seguridad y apoyo si mantiene la comunicación y el equilibrio entre supervisión y autonomía", "Pierde su función protectora, que pasa al grupo de iguales como principal fuente de apoyo", "Debe ceder la supervisión al centro educativo para no aumentar los conflictos en casa"], "e": "La diapositiva de equilibrio familiar indica que la familia sigue siendo un ancla fundamental de seguridad y apoyo, y que mantener la comunicación y el equilibrio supervisión-autonomía permite a padres y docentes guiar al adolescente.", "f": "D"}, {"id": "t4-a001", "t": "t4", "lv": 2, "q": "Los padres de Marta (14 años) fijan la hora de llegada sin escucharla y la castigan sin salir si se retrasa cinco minutos. En el instituto Marta cumple todas las normas, pero apenas toma iniciativas y se infravalora. ¿Qué estilo y qué consecuencia describe mejor el caso?", "o": ["Autoritario: buena adaptación a las normas con baja autoestima y escasa autonomía", "Democrático: normas firmes que generan autocontrol y alta autoestima", "Negligente: falta de control que produce baja autoestima y desobediencia"], "e": "Alta exigencia, poco diálogo y castigos rígidos definen el estilo autoritario (+ control, − afecto). Sus hijos suelen mostrar buena adaptación escolar y respeto a las normas, pero baja autoestima, sumisión y escasa iniciativa. El democrático también pone límites, pero razonando y con afecto.", "f": "D"}, {"id": "t4-a002", "t": "t4", "lv": 2, "q": "Dos familias ponen la misma norma: volver a casa a las 22:00. ¿Qué diferencia a una familia democrática de una autoritaria según el tema 4?", "o": ["La democrática explica la norma, escucha y la mantiene con coherencia; la autoritaria la impone sin diálogo", "La democrática no sanciona nunca el incumplimiento para preservar el vínculo; la autoritaria sí lo sanciona", "La democrática deja que el hijo decida la hora según su criterio; la autoritaria la fija ella sin consultar"], "e": "Ambos estilos tienen alto control (normas y límites). La diferencia está en el afecto y la comunicación: el democrático prefiere el razonamiento y la explicación a la imposición, y sus normas son coherentes pero no rígidas. Dejar decidir al hijo sin límites sería permisivo.", "f": "D"}, {"id": "t4-a003", "t": "t4", "lv": 2, "q": "Un alumno muy creativo, con buena autoestima y muchos amigos, interrumpe constantemente, no acepta un «no» y no entrega las tareas. Si su conducta se relaciona con el estilo familiar, ¿cuál es el más probable?", "o": ["Permisivo", "Negligente", "Autoritario"], "e": "Espontaneidad, creatividad, buenas relaciones sociales y autoestima elevada, junto con dificultades para controlar impulsos, desobediencia y baja implicación en responsabilidades, son las características de los hijos de padres permisivos. El negligente se asocia a baja autoestima y poca competencia social.", "f": "D"}, {"id": "t4-a004", "t": "t4", "lv": 2, "q": "¿Qué rasgo permite distinguir con mayor seguridad a los hijos de familias permisivas de los de familias negligentes, si ambos tienen dificultades para cumplir normas?", "o": ["La autoestima: elevada en los de familias permisivas y baja en los de familias negligentes", "El control de impulsos: bueno en los permisivos y malo en los negligentes", "El rendimiento escolar: alto en los permisivos y bajo en los negligentes"], "e": "Ambos estilos comparten bajo control. Lo que cambia es el afecto: alto en el permisivo y bajo en el negligente. Por eso los hijos de permisivos tienen autoestima elevada y buenas relaciones sociales, mientras que los de negligentes presentan baja autoestima y poca competencia social. Ambos tienen problemas de control de impulsos.", "f": "D"}, {"id": "t4-a005", "t": "t4", "lv": 2, "q": "Los padres de Leo trabajan muchas horas, han delegado su cuidado en los abuelos y le compran todo lo que pide para evitar discusiones. Leo tiene bajo rendimiento y ya ha tenido problemas con la policía local. ¿Qué estilo y qué concepto de la diapositiva de transformación familiar encajan?", "o": ["Negligente; familia «abandónica» producto de una sociedad trabajo-adicta", "Permisivo; familia surgida como reacción ante las autoritarias de los años sesenta", "Autoritario; familia sobreprotectora producto de una sociedad con angustia"], "e": "Delegar la función educativa, poca dedicación y complacer peticiones materiales para evitar el llanto o la ira describen el estilo negligente, asociado a bajo rendimiento y riesgo delictivo. La diapositiva relaciona las familias abandónicas con una sociedad «trabajo-adicta».", "f": "D"}, {"id": "t4-a006", "t": "t4", "lv": 2, "q": "¿Qué combinación de características de los hijos es IMPOSIBLE según los cuadros del tema 4?", "o": ["Hijos de padres autoritarios con alta autoestima y gran autonomía personal", "Hijos de padres permisivos con autoestima elevada e inmadurez", "Hijos de padres negligentes con baja autoestima y riesgo de conductas delictivas"], "e": "Los hijos de padres autoritarios presentan bajos niveles de autoestima y escasa autonomía (sumisión). Las otras dos combinaciones aparecen tal cual en los cuadros del permisivo y del negligente.", "f": "D"}, {"id": "t4-a007", "t": "t4", "lv": 2, "q": "Una adolescente de 15 años discute a diario con sus padres sobre la hora de llegada y el uso del móvil, pero les pide ayuda cuando tiene un problema serio. ¿Cómo interpreta el tema 4 esta conducta?", "o": ["Como la ambivalencia del adolescente entre reafirmar su independencia y conservar el apoyo de los padres", "Como la ambivalencia de los padres entre fomentar su desarrollo y mantener el control", "Como un indicador de estilo negligente que conviene comunicar a Orientación"], "e": "La ambivalencia del adolescente consiste en oscilar entre reafirmar la identidad e independencia y conservar el apoyo de los padres. Los conflictos sobre independencia, reglas y tiempo libre son esperables y forman parte de la individuación (Collins y Laursen, 2004).", "f": "D"}, {"id": "t4-a008", "t": "t4", "lv": 2, "q": "Unos padres revisan cada mensaje del móvil de su hijo de 16 años, eligen sus amistades y le acompañan a todas partes. Según el balance supervisión-autonomía del tema 4, ¿qué riesgo principal implica?", "o": ["Que la sobresupervisión restrinja el desarrollo de su autonomía", "Que la sobreautonomía le exponga a conductas de riesgo", "Que el exceso de afecto produzca autoestima elevada e inmadurez"], "e": "El tema distingue sobresupervisión (restringe el desarrollo de la autonomía), balance (desarrollo saludable) y sobreautonomía (puede llevar a riesgos). Controlar cada mensaje y cada amistad es sobresupervisión.", "f": "D"}, {"id": "t4-a009", "t": "t4", "lv": 2, "q": "Javier, profesor de Economía, tiene expectativas muy altas, pero nunca pregunta a sus alumnos cómo están. Su compañera Ana es muy cercana, pero les exige poco «porque bastante tienen». Según el tema 4, ¿qué resultado cabe esperar en cada caso?", "o": ["Javier: bajo rendimiento por falta de apoyo; Ana: paternalismo y bajo rendimiento", "Javier: alto rendimiento por sus expectativas; Ana: alto rendimiento por su cercanía", "Javier: paternalismo y bajo rendimiento; Ana: bajo rendimiento por falta de apoyo"], "e": "Expectativas altas sin interés personal provocan bajo rendimiento por no disponer de apoyo suficiente. Interés personal alto sin expectativas adecuadas provoca paternalismo y bajo rendimiento. El tema propone combinar ambos intereses.", "f": "D"}, {"id": "t4-a010", "t": "t4", "lv": 2, "q": "En una clase de 2.º de Bachillerato hay un grupo de alumnos con muy buenas notas y otro con dificultades. Según el tema 4, ¿qué tipo de interés del profesor resulta más relevante para cada grupo?", "o": ["Interés académico para el de alto rendimiento e interés personal para el de dificultades", "Interés personal para el de alto rendimiento e interés académico para el de dificultades", "Interés académico para ambos, porque Bachillerato es una etapa propedéutica"], "e": "El interés académico (expectativas altas y ayuda para alcanzarlas) es importante para los alumnos de alto rendimiento; el interés personal (paciencia, respeto, escucha, interés por sus problemas) es relevante para los alumnos con dificultades.", "f": "D"}, {"id": "t4-a011", "t": "t4", "lv": 2, "q": "Laura, de 16 años, se niega a fumar porque considera que dañar su salud va contra sus propios principios, aunque todo su grupo fume y aunque sus padres nunca lo sabrían. Según Kohlberg, ¿qué nivel refleja su razonamiento?", "o": ["Posconvencional: decisión basada en principios personales internalizados", "Convencional: cumplimiento de la norma para agradar a otros", "Preconvencional: obediencia para evitar un castigo"], "e": "Decidir desde principios propios, con control interno de la conducta y sin depender de castigos ni de la aprobación ajena, es propio del nivel posconvencional o autonomía moral. El convencional busca agradar a otros y el preconvencional evitar castigos u obtener recompensas.", "f": "D"}, {"id": "t4-a012", "t": "t4", "lv": 2, "q": "Un alumno de 13 años devuelve una cartera encontrada «para que el profesor vea que soy buena persona». Otro la devuelve «para que no me pillen y me castiguen». Según Kohlberg, ¿en qué nivel está cada uno?", "o": ["El primero en el convencional y el segundo en el preconvencional", "El primero en el posconvencional y el segundo en el convencional", "Ambos en el preconvencional, porque buscan una consecuencia externa"], "e": "Actuar para agradar a otros y obtener aprobación social es moral convencional. Actuar para evitar castigos es moral preconvencional. Ninguno decide desde principios propios, que sería el nivel posconvencional.", "f": "D"}, {"id": "t4-a013", "t": "t4", "lv": 2, "q": "Un orientador observa que un alumno de 16 años solo cumple las normas cuando hay un profesor delante y su único argumento es «si no me pillan, no pasa nada». ¿Qué conclusión es más ajustada desde el tema 4?", "o": ["Su razonamiento corresponde al nivel preconvencional, por debajo de lo esperable para su edad según la diapositiva", "Su razonamiento es posconvencional, porque cuestiona la autoridad de la norma establecida", "Su razonamiento es convencional, propio de quien sigue la norma para ser aceptado por el grupo"], "e": "Guiarse por el control externo y por evitar castigos es moral preconvencional (4-10 años en la diapositiva). A los 16 años sería esperable un control más interno. La diapositiva sitúa el nivel posconvencional a partir de los 13 años.", "f": "D"}, {"id": "t4-a014", "t": "t4", "lv": 2, "q": "Una madre, al saber que su hijo ha insultado a un compañero, le dice: «Ya no te quiero igual; hasta que no cambies no te hablo». Según Eisenberg y Morris (2004), ¿qué consecuencia tiene esta respuesta?", "o": ["Es retirada de afecto, que no ayuda al desarrollo moral y puede interferir en él", "Es inducción, porque hace ver al hijo las consecuencias de su conducta", "Es modelamiento, porque ofrece al hijo un ejemplo de conducta correcta"], "e": "La retirada de afecto y la afirmación del poder no solo no ayudan al desarrollo moral, sino que pueden interferir. La inducción explicaría por qué la conducta es reprobable, cómo afecta al otro y cómo reparar el daño.", "f": "D"}, {"id": "t4-a015", "t": "t4", "lv": 2, "q": "¿Qué diferencia hay entre modelamiento e internalización como factores de la conducta moral?", "o": ["El modelamiento parte de observar modelos generosos; la internalización, de hacer propios los estándares de la autoridad", "El modelamiento consiste en explicar por qué una conducta es incorrecta; la internalización, en castigarla después", "El modelamiento es propio del nivel posconvencional y la internalización, del nivel preconvencional de Kohlberg"], "e": "Según el tema 4, el modelamiento opera cuando los niños han tenido modelos interesados por los demás y generosos; la internalización ocurre cuando los adolescentes adoptan como propios los estándares externos transmitidos por figuras de autoridad. Explicar las consecuencias es la técnica de inducción.", "f": "D"}, {"id": "t4-a016", "t": "t4", "lv": 2, "q": "En un partido de baloncesto del centro, un alumno que juega en equipo empieza a ayudar a compañeros con dificultades también fuera de la pista. Según el tema 4, ¿qué explica mejor este cambio?", "o": ["El deporte colectivo fomenta la conducta y el pensamiento prosocial", "El deporte individual reduce la prosocialidad por la competición", "La prosocialidad aumenta cuando los estándares personales son muy altos"], "e": "La diapositiva indica que el deporte colectivo fomenta la conducta y el pensamiento prosocial, y que la calidad de la respuesta prosocial es menor cuando los estándares personales son altos o hay más dudas y miedos ante las tareas deportivas.", "f": "D"}, {"id": "t4-a017", "t": "t4", "lv": 2, "q": "Un alumno razona con mucha corrección sobre la importancia de ayudar a los demás en un debate de clase, pero en el patio nunca ayuda a nadie. Según la terminología del tema 4:", "o": ["Muestra prosocialidad global (razonamiento prosocial) sin prosocialidad contextual (conducta prosocial)", "Muestra prosocialidad contextual (conducta prosocial) sin prosocialidad global (razonamiento prosocial)", "Muestra moral posconvencional plena, porque razona sobre principios universales en público"], "e": "El tema distingue la prosocialidad global o razonamiento prosocial de la prosocialidad contextual o conducta prosocial. Razonar bien no garantiza actuar de forma prosocial.", "f": "D"}, {"id": "t4-a018", "t": "t4", "lv": 2, "q": "Un grupo de alumnas deja de hablar a una compañera y convence a otras para que no la inviten a ningún plan. Otra alumna empuja a un compañero para quedarse con su sitio en la fila del comedor. ¿Qué tipos de agresividad son, respectivamente?", "o": ["Hostil relacional e instrumental", "Instrumental y hostil abierta", "Hostil cibernética y hostil relacional"], "e": "Dañar las relaciones sociales de la víctima de forma intencionada es agresividad hostil relacional. Empujar para obtener un privilegio u objeto (el sitio en la fila) es agresividad instrumental, cuya finalidad no es dañar sino conseguir algo.", "f": "D"}, {"id": "t4-a019", "t": "t4", "lv": 2, "q": "¿Qué criterio permite diferenciar la agresividad instrumental de la hostil según el tema 4?", "o": ["La finalidad: obtener un privilegio u objeto frente a causar daño de forma intencional", "El medio empleado: física en la agresividad instrumental y verbal o relacional en la hostil", "La frecuencia: aislada en la agresividad instrumental y repetida a lo largo del tiempo en la hostil"], "e": "La clasificación del tema se basa en la finalidad: la instrumental busca obtener un privilegio o un objeto; la hostil busca causar daño intencionalmente, de forma abierta, relacional o cibernética. Una agresión física puede ser de ambos tipos.", "f": "D"}, {"id": "t4-a020", "t": "t4", "lv": 2, "q": "Un profesor organiza un concurso semanal en el que solo el alumno con mejor nota recibe un premio, y los exámenes son tipo test sin vigilancia. Según el tema 4, ¿qué cabe esperar?", "o": ["Un aumento de las trampas, por inculcar la competitividad y por la baja probabilidad de ser descubierto", "Una reducción de las trampas, porque la competencia aumenta la motivación de aprendizaje", "Ningún efecto, porque las trampas dependen solo de la personalidad del alumno"], "e": "La tasa de trampas aumenta cuando se inculca la competitividad, la exigencia es muy alta, se valoran las calificaciones por encima de todo y la probabilidad de ser descubierto es baja con consecuencias poco importantes.", "f": "D"}, {"id": "t4-a021", "t": "t4", "lv": 2, "q": "Integrando los temas 4 y 7-8, ¿qué perfil de estudiante tiene más probabilidad de copiar?", "o": ["Un alumno con metas de rendimiento y baja autoeficacia", "Un alumno con metas de aprendizaje y alta autoeficacia", "Un alumno con metas sociales de honrar a la familia y buen rendimiento"], "e": "El tema 4 señala que copian más los estudiantes con metas de desempeño (notas) y con bajo sentido de autoeficacia. El tema 7-8 explica que las metas de rendimiento llevan a un procesamiento superficial y a valorar el resultado por encima del aprendizaje.", "f": "D"}, {"id": "t4-a022", "t": "t4", "lv": 2, "q": "Un alumno de 1.º de ESO que llega de otro centro se viste, habla y escucha la misma música que su nuevo grupo de amigos, y también empieza a estudiar más porque ellos lo hacen. ¿Qué conclusión es más correcta según el tema 4?", "o": ["La presión del grupo adapta su conducta en ambos sentidos y puede tener efectos positivos, como estudiar más", "La presión del grupo es siempre negativa en la adolescencia, así que conviene separarlo de esos amigos", "El grupo influye en su forma de vestir y en la música, pero nunca en sus hábitos de estudio"], "e": "La presión del grupo conduce a adaptarse en comportamiento, vestido, actitud y música, pero también puede tener efectos positivos: participar en deportes, estudiar para los exámenes, retrasar consumos o seguir estudios universitarios.", "f": "D"}, {"id": "t4-a023", "t": "t4", "lv": 2, "q": "Una alumna de 15 años sigue a su pandilla en la ropa y el ocio, pero en la elección de su itinerario de Bachillerato decide según lo que le aconsejan sus padres y su tutora. ¿Es coherente con el tema 4?", "o": ["Sí: el grupo influye en muchos hábitos, pero padres y profesores pesan más en carrera, moralidad y religión", "No: en la adolescencia el grupo de iguales sustituye por completo la influencia de la familia en las decisiones", "No: los padres influyen más en la ropa y el ocio, y el grupo de iguales en la elección de estudios"], "e": "El tema indica que el grupo de iguales modela conductas, hábitos, creencias, valores y expectativas, pero padres y profesores suelen influir más en moralidad, elección de carrera y religión.", "f": "D"}, {"id": "t4-a024", "t": "t4", "lv": 2, "q": "Un tutor detecta que la pandilla de 4.º de ESO, antes formada solo por chicos, ahora es mixta y cada vez más estable. Según el tema 4, ¿qué cabe esperar en los próximos años?", "o": ["Que se disuelva tras la adolescencia, cuando sus miembros se vuelvan más selectivos", "Que vuelva a ser del mismo sexo al llegar a la juventud", "Que se mantenga sin cambios durante la vida adulta como principal apoyo"], "e": "Las pandillas son primero del mismo sexo, luego heterosexuales, y se disuelven tras la adolescencia, cuando los jóvenes se vuelven más selectivos en cuanto a quién y en qué les influye.", "f": "D"}, {"id": "t4-a025", "t": "t4", "lv": 2, "q": "Un alumno con alto rendimiento comenta que su profesora favorita es la que «nos mira cuando habla, está tranquila y se pone en nuestro lugar». Según Woolfolk (2014), ¿qué efectos tiene ese tipo de relación?", "o": ["Más interés por el curso, más motivación de logro y mejor aceptación del profesor", "Menos exigencia, más permisividad y, a la larga, peor rendimiento del grupo", "Más dependencia afectiva del profesor y menos autonomía en las tareas"], "e": "Empatía, contacto visual y postura relajada son las características que valora el alumnado; propician más interés por el curso, más motivación de logro (orientar la conducta hacia un objetivo) y mejor aceptación del profesor.", "f": "D"}, {"id": "t4-a026", "t": "t4", "lv": 2, "q": "Un profesor de 1.º de ESO observa que sus alumnos recién llegados del colegio están desorientados. Según el tema 4, ¿cuál de estos cambios NO es uno de los retos que afrontan?", "o": ["Un trato más individualizado y cercano del profesorado que en Primaria", "Nuevos compañeros, nuevos profesores y normas diferentes", "Mayor nivel y exigencia educativa"], "e": "Los retos del cambio de etapa son: cambio de centro (compañeros, profesores, normas), cambios en el nivel y la exigencia, trato del profesorado menos individualizado y el grupo de iguales como elemento clave. El trato es menos individualizado, no más.", "f": "D"}, {"id": "t4-a027", "t": "t4", "lv": 2, "q": "Según la diapositiva de transformación familiar, ¿qué consecuencia tiene que los niños crezcan con menos hermanos, más pantallas y menor mediación familiar?", "o": ["Aprenden menos a resolver conflictos y son más frágiles y menos autónomos", "Desarrollan antes la autonomía porque pasan más tiempo solos y resuelven sus problemas", "Fortalecen el «nosotros» porque dependen más del grupo de iguales que de la familia"], "e": "La diapositiva indica que, con familias más reducidas y la era de las pantallas, se debilitan los vínculos, los niños crecen más encerrados en casa con menor mediación, no aprenden a resolver conflictos y son más frágiles y menos autónomos. Con los hijos únicos se fortalece el «yo» y se debilita el «nosotros».", "f": "D"}, {"id": "t4-a028", "t": "t4", "lv": 2, "q": "¿Qué estilo educativo aplica mejor la herramienta de disciplina positiva «amabilidad y firmeza al mismo tiempo»?", "o": ["Democrático, porque combina alto control y alto afecto", "Permisivo, porque prioriza el afecto sobre las normas", "Autoritario, porque prioriza la firmeza en el cumplimiento"], "e": "La disciplina positiva parte del balance entre firmeza y amabilidad, que corresponde a la combinación de alto control y alto afecto del estilo democrático. El permisivo tiene afecto sin firmeza y el autoritario firmeza sin afecto.", "f": "D"}, {"id": "t4-a029", "t": "t4", "lv": 2, "q": "Un alumno ha roto el material de un compañero. ¿Qué respuesta docente combina mejor la inducción (tema 4) con la restitución (tema 6)?", "o": ["Explicarle cómo se siente el compañero y pedirle que reponga el material y mejore la situación", "Retirarle la palabra durante la semana para que note el rechazo y reflexione por su cuenta", "Reñirle con dureza delante de la clase para que sirva de ejemplo y no se repita"], "e": "La inducción explica por qué la conducta es reprobable, cómo afecta al otro y sugiere formas de reparar el daño. La restitución (sobrecorrección) exige restaurar el daño y mejorar el estado anterior. Retirar la palabra es retirada de afecto y gritar es afirmación del poder.", "f": "D"}, {"id": "t4-a030", "t": "t4", "lv": 2, "q": "El tema 4 afirma que la mejora de la autoestima es consecuencia del desempeño en las áreas que importan. ¿Qué intervención es coherente con esa idea en un alumno que se considera «negado para el deporte»?", "o": ["Plantearle retos deportivos ajustados a su nivel en los que pueda progresar y comprobar su mejora", "Elogiarle a diario aunque no mejore, para que se sienta bien consigo mismo y se anime", "Eximirle de las actividades más exigentes de Educación Física para que no vuelva a fracasar"], "e": "Si la autoestima depende del desempeño en lo que importa, lo eficaz es crear oportunidades de éxito real y progresivo. El elogio sin desempeño aborda la autoestima directamente, lo que el tema considera menos eficaz.", "f": "D"}, {"id": "t4-a031", "t": "t4", "lv": 2, "q": "Una alumna dice: «Mis padres me dejan hacer lo que quiera y me dicen que me quieren, pero nunca me preguntan por los deberes». ¿Qué rasgo del estilo de sus padres aparece literalmente en el cuadro del tema 4?", "o": ["Baja implicación de los padres en las tareas escolares, propia del estilo permisivo", "Delegación de la función educativa en otros, propia del estilo negligente", "Padres muy comprometidos con su tarea educativa, propio del estilo autoritario"], "e": "El cuadro del estilo permisivo recoge poca exigencia, altos niveles de afecto, altos niveles de comunicación y baja implicación en las tareas escolares. La alumna percibe afecto, lo que descarta el negligente.", "f": "D"}, {"id": "t4-a032", "t": "t4", "lv": 2, "q": "¿Cuál de estas afirmaciones sobre los hijos de padres democráticos es correcta según el tema 4?", "o": ["Son más competentes socialmente, con mayor autoestima, autonomía, autorregulación y desarrollo moral", "Tienen una autoestima elevada y buenas relaciones sociales, pero dificultades para controlar sus impulsos", "Muestran buena adaptación escolar y respeto por las normas, aunque con sumisión y menor iniciativa"], "e": "Los hijos de padres democráticos tienen más probabilidad de éxito académico, son más felices y generosos, más competentes socialmente, con mayor autoestima, autonomía, responsabilidad, autorregulación y desarrollo moral, y son persistentes. Las otras opciones describen hijos de padres permisivos y autoritarios.", "f": "D"}, {"id": "t4-a033", "t": "t4", "lv": 2, "q": "¿Qué dimensiones del modelo de Schwartz se oponen entre sí en el círculo de valores de la diapositiva?", "o": ["Autopromoción frente a autotrascendencia, y apertura al cambio frente a conservación", "Autopromoción frente a conservación, y apertura al cambio frente a autotrascendencia", "Hedonismo frente a estimulación, y poder frente a logro"], "e": "En el círculo de Schwartz, la autopromoción (poder, logro) se opone a la autotrascendencia (benevolencia, universalismo), y la apertura al cambio (autodirección, estimulación) se opone a la conservación (seguridad, tradición, conformidad). Hedonismo y estimulación, o poder y logro, son valores vecinos.", "f": "D"}, {"id": "t4-a034", "t": "t4", "lv": 2, "q": "Un entrenador del equipo del instituto quiere fomentar valores de autotrascendencia según Schwartz. ¿Qué propuesta se ajusta mejor?", "o": ["Actividades de cooperación y ayuda a compañeros y a la comunidad (benevolencia y universalismo)", "Premiar al máximo goleador para potenciar el logro y el poder", "Mantener rituales y normas tradicionales del equipo (conformidad y tradición)"], "e": "La autotrascendencia agrupa la benevolencia y el universalismo (justicia social, igualdad). El logro y el poder pertenecen a la autopromoción; la tradición y la conformidad, a la conservación.", "f": "D"}, {"id": "t4-a035", "t": "t4", "lv": 2, "q": "Según la diapositiva de prosocialidad, ¿qué tres tareas del desarrollo se ponen en juego en la adolescencia?", "o": ["Formar un «yo integral», lograr autonomía respecto a los padres y construir una moral autónoma", "Alcanzar las operaciones formales, superar el egocentrismo y adquirir la conservación", "Elegir estudios, encontrar empleo y formar una pareja"], "e": "La diapositiva indica: formación de la identidad (un «yo integral» que combine armoniosamente los componentes de la personalidad), logro de la autonomía e independencia respecto de los padres y formación de una moral autónoma.", "f": "D"}, {"id": "t4-a036", "t": "t4", "lv": 2, "q": "Un padre comenta en tutoría: «Desde que mi hijo tiene 13 años discutimos más que nunca; ¿es que lo estamos haciendo mal?». ¿Qué respuesta del tutor se ajusta al tema 4?", "o": ["Que el aumento de conflicto acompaña a la búsqueda de autonomía y suele disminuir con la edad", "Que indica un estilo negligente en la familia, que conviene revisar con el Departamento de Orientación", "Que es una señal temprana de un trastorno de conducta y que el caso debe derivarse cuanto antes"], "e": "La diapositiva de transformación familiar señala que la individuación se acompaña de un aumento del conflicto, que es parte natural del desarrollo, y que los conflictos con los padres disminuyen con la edad. Lo clave es mantener la comunicación y el equilibrio supervisión-autonomía.", "f": "D"}, {"id": "t4-a037", "t": "t4", "lv": 2, "q": "Un docente detecta a un alumno que copia. ¿Qué medida es más coherente con la evidencia del tema 4 para reducir las trampas a medio plazo?", "o": ["Diversificar la evaluación con tareas de aplicación y comprensión fuera del examen", "Endurecer las sanciones para aumentar las consecuencias", "Aumentar la dificultad de los exámenes para que copiar no compense"], "e": "Las trampas disminuyen cuando el profesorado hace hincapié en la comprensión y el dominio: poner ejemplos, aplicar conocimientos y demostrarlo de formas distintas fuera del examen. Aumentar la exigencia de la tarea incrementa las trampas.", "f": "D"}, {"id": "t4-a038", "t": "t4", "lv": 2, "q": "¿Qué conclusión sobre las trampas académicas NO aparece en el tema 4?", "o": ["Los alumnos con metas de aprendizaje copian más porque buscan aprobar como sea", "Los chicos suelen copiarse más que las chicas", "Los estudiantes con bajo rendimiento copian más que los buenos estudiantes"], "e": "El tema indica lo contrario: los estudiantes con metas de desempeño (notas) copian más que los de metas de aprendizaje. Las otras dos conclusiones sí aparecen.", "f": "D"}, {"id": "t4-a039", "t": "t4", "lv": 2, "q": "Una familia con un hijo único observa que el niño tiene dificultades para compartir y trabajar en grupo. ¿Qué idea de la diapositiva de transformación familiar se relaciona con ello?", "o": ["Con los hijos únicos se fortalece el «yo» y se debilita el «nosotros»", "Con los hijos únicos se fortalece el «nosotros» por la atención de los padres", "El número de hermanos no influye en la configuración familiar"], "e": "La diapositiva sobre configuración y estructura familiar señala que se reduce el número de hijos y hermanos y que con los hijos únicos se fortalece el «yo» y se debilita el «nosotros».", "f": "D"}, {"id": "t4-a040", "t": "t4", "lv": 2, "q": "¿Por qué el tema 4 incluye el grupo de iguales como «elemento clave para la adaptación» al llegar a Secundaria?", "o": ["Porque aumenta la dependencia del grupo para el apoyo emocional y el grupo modela hábitos y valores", "Porque en esta etapa el grupo sustituye por completo a la familia en todas las decisiones importantes", "Porque al llegar a Secundaria el profesorado deja de influir en las decisiones del alumnado adolescente"], "e": "En la adolescencia hay mayor dependencia del grupo para el apoyo emocional y social, y el grupo modela conductas, hábitos, creencias, valores, deseos, expectativas y habilidades. Familia y profesorado siguen influyendo, sobre todo en moralidad, carrera y religión.", "f": "D"}, {"id": "t4-a041", "t": "t4", "lv": 2, "q": "Una tutora pregunta a un alumno que ha excluido a otro de un trabajo: «¿Cómo te sentirías si te lo hicieran a ti? ¿Qué podrías hacer para arreglarlo?». ¿Qué técnica aplica y qué efecto busca?", "o": ["Inducción: promover el desarrollo moral a través de la empatía y la reparación", "Afirmación del poder: asegurar la obediencia a la norma", "Coste de respuesta: retirar un reforzador por la conducta inadecuada"], "e": "Preguntar cómo se sentiría si fuera la víctima y sugerir formas de reparar el daño es la inducción de Eisenberg y Morris (2004), que promueve el desarrollo moral.", "f": "D"}, {"id": "t4-a042", "t": "t4", "lv": 2, "q": "Según el tema 4, ¿qué rasgo NO forma parte del sentido de moralidad que los padres esperan en sus hijos?", "o": ["Cumplir las normas solo cuando hay un adulto que supervisa", "Hacer lo correcto cuando nadie supervisa", "Compromiso personal para respetar las reglas sociales"], "e": "Se espera que tengan valores propios, que hagan lo correcto cuando nadie supervisa, que respeten los derechos de los demás, que muestren preocupación prosocial y altruismo, y que tengan un compromiso personal con las reglas sociales. Cumplir solo con supervisión es control externo, propio de la moral preconvencional.", "f": "D"}, {"id": "t5-001", "t": "t5", "lv": 1, "q": "Según el tema 5, ¿qué relación existe entre la edad cronológica y los problemas de conducta?", "o": ["La edad cronológica se relaciona con el nivel evolutivo, lo que hace que ciertos problemas sean más probables que otros", "No existe relación: los trastornos aparecen con la misma probabilidad a cualquier edad", "Todos los trastornos de conducta aparecen por primera vez en la adolescencia"], "e": "La introducción del tema indica que la edad cronológica está relacionada con el nivel evolutivo, y esto hace que ciertos problemas de conducta sean más probables que otros.", "f": "D"}, {"id": "t5-002", "t": "t5", "lv": 1, "q": "¿Qué trastornos señala el tema 5 como más frecuentes entre los 6 y los 9 años?", "o": ["Trastornos del aprendizaje, hiperactividad y atención, coincidiendo con los primeros años de escolarización", "Trastornos de la conducta alimentaria y de ansiedad, por la presión del cambio de etapa", "Conductas adictivas y depresión, por el inicio temprano del uso de pantallas"], "e": "Algunos trastornos son más frecuentes entre los 6 y los 9 años (trastornos del aprendizaje, hiperactividad y atención), coincidiendo con los primeros años de escolarización.", "f": "D"}, {"id": "t5-003", "t": "t5", "lv": 1, "q": "¿Qué porcentaje de la población en edad escolar requiere enseñanza especial por dificultades de aprendizaje según la mayoría de las estimaciones citadas?", "o": ["Entre el 10 y el 15 %", "Entre el 1 y el 3 %", "Entre el 30 y el 40 %"], "e": "La mayoría de las estimaciones varían entre el 10 y el 15 % de la población en edad escolar.", "f": "D"}, {"id": "t5-004", "t": "t5", "lv": 1, "q": "¿Cuál de los siguientes NO figura entre los trastornos más frecuentes de la adolescencia según el tema 5?", "o": ["Trastornos del aprendizaje y del lenguaje oral", "Trastornos de ansiedad", "Trastornos del comportamiento alimentario"], "e": "Entre los trastornos más frecuentes de la adolescencia destacan: trastornos de conducta (delictivas y agresivas), de ansiedad, depresión y suicidio, trastornos del comportamiento alimentario y conductas adictivas (drogas, nuevas tecnologías, apuestas, otros). Los trastornos del aprendizaje se asocian a los 6-9 años.", "f": "D"}, {"id": "t5-005", "t": "t5", "lv": 1, "q": "¿Qué conductas adictivas incluye el tema 5 entre los trastornos frecuentes de la adolescencia?", "o": ["Drogas, nuevas tecnologías, apuestas y otras como móviles o sexo", "Exclusivamente el consumo de alcohol y tabaco, por ser las drogas más consumidas", "Únicamente las drogas ilegales, ya que las tecnologías no generan adicción"], "e": "La diapositiva incluye en las conductas adictivas: drogas, nuevas tecnologías, apuestas y otros (móviles, sexo…).", "f": "D"}, {"id": "t5-006", "t": "t5", "lv": 1, "q": "Según el tema 5, ¿qué trastornos presenta con más frecuencia el género femenino en la adolescencia?", "o": ["Depresivos, de conducta y de ansiedad", "Trastornos del desarrollo como el autismo o la hiperactividad", "Abuso de drogas y agresividad"], "e": "En el género femenino los más frecuentes son los trastornos depresivos, de conducta y de ansiedad. En el masculino: trastornos de conducta, del desarrollo (autismo, hiperactividad), abuso de drogas y agresividad.", "f": "D"}, {"id": "t5-007", "t": "t5", "lv": 1, "q": "¿Qué trastorno aparece como frecuente en ambos sexos en la diapositiva de diferencias entre sexos?", "o": ["Trastornos de conducta", "Trastornos depresivos", "Abuso de drogas"], "e": "Los trastornos de conducta aparecen en ambas listas. Los depresivos y de ansiedad solo en la femenina; el abuso de drogas, la agresividad y los trastornos del desarrollo solo en la masculina.", "f": "D"}, {"id": "t5-008", "t": "t5", "lv": 1, "q": "En la pubertad, la depresión se caracteriza según el tema 5 por:", "o": ["Aislamiento social, pesimismo y trastornos de conducta, y pensamientos relacionados con la muerte", "Euforia, hiperactividad y aumento de la sociabilidad como forma de compensación", "Tristeza verbalizada y llanto frecuente, sin alteraciones de la conducta"], "e": "La diapositiva señala que en la pubertad la depresión se caracteriza por aislamiento social, pesimismo y trastornos de conducta, y pensamientos relacionados con la muerte. Puede manifestarse con conductas disruptivas, no solo con tristeza.", "f": "D"}, {"id": "t5-009", "t": "t5", "lv": 1, "q": "Un alumno de 13 años que antes era sociable se aísla, se muestra pesimista y empieza a tener problemas de conducta. Desde el tema 5, el docente debería considerar:", "o": ["Que pueden ser señales tempranas de depresión, que en la pubertad incluye trastornos de conducta", "Que se trata de indisciplina propia de la edad y debe responderse con sanciones", "Que es un cambio evolutivo normal de la pubertad que no requiere atención"], "e": "Uno de los objetivos del tema es aprender a identificar las primeras señales de un posible trastorno. En la pubertad, la depresión incluye aislamiento social, pesimismo y trastornos de conducta.", "f": "D"}, {"id": "t5-010", "t": "t5", "lv": 1, "q": "¿Cuál es uno de los tres objetivos del tema 5?", "o": ["Aprender a identificar algunas de las primeras señales de que un adolescente puede estar desarrollando un trastorno", "Aprender a diagnosticar y tratar clínicamente los trastornos más frecuentes desde el aula", "Conocer los criterios diagnósticos del DSM para cada trastorno de la adolescencia"], "e": "Los objetivos son: conocer los problemas más importantes que afectan al desarrollo adolescente y a la enseñanza-aprendizaje; aprender a identificar las primeras señales; y conocer pautas de prevención desde las aulas. El diagnóstico no es función docente.", "f": "D"}, {"id": "t5-011", "t": "t5", "lv": 1, "q": "La anorexia se define en el tema 5 como:", "o": ["Un estado de inanición voluntaria que puede llevar a la muerte, con pérdida considerable de peso y distorsión de la imagen corporal", "Un trastorno caracterizado por atracones seguidos de arrepentimiento y conductas para eliminar el exceso", "Una pérdida de apetito causada por enfermedades físicas que se recupera al tratar la causa orgánica"], "e": "La anorexia es un estado de inanición voluntaria que puede incluso llevar a la muerte, con pérdida considerable de peso, distorsión de la imagen corporal, rechazo de la comida y miedo obsesivo a engordar.", "f": "D"}, {"id": "t5-012", "t": "t5", "lv": 1, "q": "¿Cómo se produce la pérdida de peso en la anorexia según el tema 5?", "o": ["Por ayuno o restricción y/o vómitos, laxantes o diuréticos y ejercicio extenuante", "Exclusivamente por la reducción de la comida, sin conductas compensatorias", "Por alteraciones metabólicas de origen genético que impiden ganar peso"], "e": "Las pérdidas de peso se deben a ayunos o reducción de la comida y/o al vómito autoinducido, el abuso de laxantes y/o diuréticos y el ejercicio extenuante.", "f": "D"}, {"id": "t5-013", "t": "t5", "lv": 1, "q": "La distorsión de la imagen corporal en la anorexia consiste en que las personas afectadas:", "o": ["Sobreestiman el tamaño de su cuerpo", "Subestiman el tamaño de su cuerpo", "Perciben su cuerpo con total exactitud pero lo rechazan"], "e": "La diapositiva indica que en la anorexia hay distorsión de la imagen corporal: sobreestiman el tamaño de su cuerpo.", "f": "D"}, {"id": "t5-014", "t": "t5", "lv": 1, "q": "¿Cuál es la edad de riesgo de la anorexia según el tema 5?", "o": ["Entre los 12 y los 25 años, especialmente entre los 14 y los 18", "Entre los 6 y los 9 años, coincidiendo con el inicio de la escolarización", "A partir de los 18 años, especialmente entre los 20 y los 25"], "e": "La edad de riesgo se sitúa entre los 12 y los 25 años, especialmente entre los 14 y los 18.", "f": "D"}, {"id": "t5-015", "t": "t5", "lv": 1, "q": "¿Cuál de los siguientes rasgos se asocia a la anorexia en el tema 5?", "o": ["Grandes cambios emocionales y pérdida del interés sexual y del periodo", "Aumento del apetito y de la vida social, con estabilidad emocional", "Aparición más tardía que la bulimia y ausencia de cambios en el periodo"], "e": "La diapositiva indica que muestran grandes cambios emocionales y pierden el interés sexual y el periodo. La bulimia aparece más tarde que la anorexia, no al revés.", "f": "D"}, {"id": "t5-016", "t": "t5", "lv": 1, "q": "La bulimia se caracteriza por:", "o": ["Atracones seguidos de arrepentimiento, que puede llevar a eliminar el exceso con vómitos o laxantes", "Restricción alimentaria extrema y distorsión de la imagen corporal, sin episodios de atracón", "Ingesta compulsiva sin miedo a engordar ni conductas compensatorias posteriores"], "e": "La bulimia consiste en atracones seguidos de un periodo de arrepentimiento que puede llevar a eliminar el exceso de alimento mediante vómitos o laxantes. Hay miedo a engordar.", "f": "D"}, {"id": "t5-017", "t": "t5", "lv": 1, "q": "¿Qué tienen en común la anorexia y la bulimia según el tema 5?", "o": ["La obsesión por la delgadez y el miedo a engordar", "La edad de aparición, que es idéntica en ambos trastornos", "Los atracones como síntoma principal de ambos"], "e": "La bulimia comparte con la anorexia la obsesión por la delgadez, y en ambas hay miedo a engordar. La bulimia aparece de forma más tardía y se caracteriza por atracones.", "f": "D"}, {"id": "t5-018", "t": "t5", "lv": 1, "q": "¿En qué difieren la anorexia y la bulimia en cuanto a su aparición?", "o": ["La bulimia aparece de forma más tardía que la anorexia", "La anorexia aparece más tarde que la bulimia", "Ambas aparecen siempre a la misma edad"], "e": "La diapositiva indica que la bulimia aparece de forma más tardía que la anorexia.", "f": "D"}, {"id": "t5-019", "t": "t5", "lv": 1, "q": "¿Cuál de las siguientes recomendaciones para prevenir los trastornos alimentarios recoge el tema 5?", "o": ["Abandonar las dietas y comer según el hambre y la saciedad, no según un peso ideal", "Hacer deporte como sacrificio para mantener una figura delgada y saludable", "Seguir dietas de adelgazamiento supervisadas para alcanzar un peso ideal"], "e": "Entre las recomendaciones: desarrollar sentido crítico ante la presión de la moda, abandonar dietas de adelgazamiento y comer según hambre y saciedad, no valorarse principalmente por el físico, compartir sentimientos, hacer deporte para disfrutar y no como sacrificio, y relacionarse con los demás.", "f": "D"}, {"id": "t5-020", "t": "t5", "lv": 1, "q": "El tema 5 recomienda revisar mensajes recibidos desde niñas como «qué guapa estás con ese pelo». ¿Con qué finalidad?", "o": ["Descubrir los mensajes que exigen un determinado aspecto físico y potenciar los que ayudan a sentirse mejor", "Eliminar cualquier elogio en la relación con las alumnas para no influir en su imagen", "Reforzar los mensajes positivos sobre el aspecto físico para mejorar su autoestima"], "e": "La recomendación consiste en revisar los mensajes y valoraciones recibidos desde niñas para descubrir los que exigen un determinado aspecto físico y potenciar los que ayudan a sentirse mejor.", "f": "D"}, {"id": "t5-021", "t": "t5", "lv": 1, "q": "¿Qué enfoque sobre el cuerpo propone el tema 5 para prevenir los trastornos alimentarios?", "o": ["Valorar lo que el cuerpo permite: comunicarse, expresar, sentir, pensar, moverse o trabajar", "Centrar la prevención en el control del peso y en la información nutricional", "Evitar hablar del cuerpo en el aula para no generar comparaciones entre alumnas"], "e": "Una de las recomendaciones es valorar las posibilidades que el cuerpo ofrece (comunicarse, expresar, sentir, pensar, imaginar, moverse, trabajar y dar y recibir placer), en lugar de centrarse en su aspecto.", "f": "D"}, {"id": "t5-022", "t": "t5", "lv": 1, "q": "¿Qué estudio recoge cada dos años las tendencias de consumo de alcohol y otras drogas en estudiantes de 14 a 18 años?", "o": ["La encuesta ESTUDES, de la Delegación del Gobierno para el Plan Nacional sobre Drogas", "El informe PISA de la OCDE, que evalúa el rendimiento y los hábitos del alumnado", "La Encuesta de Salud Escolar del Ministerio de Educación, de periodicidad anual"], "e": "La Delegación del Gobierno para el Plan Nacional sobre Drogas realiza cada dos años la Encuesta sobre Uso de Drogas en Enseñanzas Secundarias (ESTUDES); la diapositiva cita la de 2021.", "f": "D"}, {"id": "t5-023", "t": "t5", "lv": 1, "q": "¿Cuál es el orden correcto de las etapas del consumo de drogas según el tema 5?", "o": ["Curiosidad → aprendizaje → búsqueda → preocupación → destrucción", "Aprendizaje → curiosidad → preocupación → búsqueda → destrucción", "Curiosidad → búsqueda → aprendizaje → destrucción → preocupación"], "e": "Las etapas son: 0 curiosidad, 1 aprendizaje, 2 búsqueda, 3 preocupación y 4 destrucción.", "f": "D"}, {"id": "t5-024", "t": "t5", "lv": 1, "q": "En la etapa 0 (curiosidad) del consumo de drogas:", "o": ["Alguien ofrece una droga y al consumirla la persona se encuentra bien, sin consecuencias desagradables", "El consumo se produce en grupo los fines de semana y la presión del grupo es muy importante", "La persona empieza a consumir sola para buscar el estado de ánimo que produce la sustancia"], "e": "En la etapa de curiosidad alguien le ofrece una droga y, al consumirla, se encuentra bien, sin consecuencias desagradables.", "f": "D"}, {"id": "t5-025", "t": "t5", "lv": 1, "q": "¿Qué caracteriza la etapa 1 (aprendizaje) del consumo de drogas?", "o": ["El consumo se produce dentro de las actividades del grupo, cuya presión es muy importante, sobre todo en fines de semana", "El consumo pasa a ser individual y aumenta, con cambios bruscos de humor y bajada de las notas", "El consumo es diario, existe policonsumo y aparecen absentismo, robos y mentiras patológicas"], "e": "En la etapa de aprendizaje el consumo tiene lugar en las actividades del grupo, con mucha presión grupal; se experimenta sobre todo en fines de semana, con sensaciones positivas y alivio temporal de los problemas.", "f": "D"}, {"id": "t5-026", "t": "t5", "lv": 1, "q": "Un adolescente empieza a consumir solo, sin necesidad de estar con el grupo, aumenta el consumo, bajan sus notas y tiene cambios bruscos de humor y altercados con sus padres. ¿En qué etapa se encuentra?", "o": ["Etapa 2: búsqueda", "Etapa 1: aprendizaje", "Etapa 4: destrucción"], "e": "La etapa de búsqueda se caracteriza por buscar el estado de ánimo que produce la droga, aumentar el consumo, usarla de forma individual, cambios de conducta y bajada de rendimiento, cambios de humor, altercados con los padres y tendencia al aislamiento.", "f": "D"}, {"id": "t5-027", "t": "t5", "lv": 1, "q": "¿Qué rasgo diferencia la etapa 2 (búsqueda) de la etapa 1 (aprendizaje) en el consumo de drogas?", "o": ["En la búsqueda se empieza a consumir de forma individual, sin necesidad de las actividades grupales", "En la búsqueda el consumo sigue ligado al grupo, pero aumenta la frecuencia a los días laborables", "En la búsqueda desaparecen los efectos positivos y solo se consume para evitar la abstinencia"], "e": "En la etapa 1 el consumo está ligado a las actividades del grupo; en la 2 se empieza a usar la droga de forma individual, sin estar dentro de las actividades grupales.", "f": "D"}, {"id": "t5-028", "t": "t5", "lv": 1, "q": "Absentismo y abandono escolar, robos, peleas, mentiras patológicas, distanciamiento de amigos no consumidores y policonsumo diario caracterizan la etapa de:", "o": ["Preocupación (etapa 3)", "Búsqueda (etapa 2)", "Curiosidad (etapa 0)"], "e": "La etapa 3 (preocupación) incluye obsesión por la sustancia, pérdida de control, cambios emocionales marcados (de euforia a depresión, con ideas suicidas), absentismo, fracaso y abandono escolar, robos, peleas, mentiras patológicas, distanciamiento de amigos no consumidores y uso diario con policonsumo.", "f": "D"}, {"id": "t5-029", "t": "t5", "lv": 1, "q": "¿Qué caracteriza la etapa 4 (destrucción) del consumo de drogas?", "o": ["Necesitar la sustancia a cualquier precio para evitar la abstinencia, aunque ya no produce euforia", "Obsesión por la sustancia, absentismo y policonsumo, con euforia intensa en cada consumo", "Consumo en grupo durante el fin de semana con alivio temporal de los problemas"], "e": "En la etapa de destrucción se necesita la sustancia a cualquier precio para no llegar al síndrome de abstinencia (físico o psicológico), pero ya no produce euforia; hay depresión, culpa, remordimiento y vergüenza, deterioro físico y mental, uso diario y riesgo de sobredosis.", "f": "D"}, {"id": "t5-030", "t": "t5", "lv": 1, "q": "¿Por qué el tema 5 considera el alcohol «la más importante de todas las drogas»?", "o": ["Por ser la más consumida, con más dependientes y la que más problemas sanitarios y psicosociales causa", "Por ser la droga ilegal más consumida y la de inicio más temprano entre los adolescentes", "Porque es la única droga que produce dependencia física y psicológica a la vez"], "e": "El alcohol es la más importante por ser la más consumida, con mayor número de dependientes y la que más problemas causa, tanto sanitarios como psicosociales.", "f": "D"}, {"id": "t5-031", "t": "t5", "lv": 1, "q": "El alcohol es un depresor del sistema nervioso central. ¿Qué funciones enlentece según el tema 5?", "o": ["Cognoscitivas (percepción y juicio), motoras (equilibrio y reflejos) y emocionales (sensatez y madurez)", "Únicamente las motoras (equilibrio y reflejos), sin afectar a la percepción ni al juicio", "Las cognitivas (memoria y comprensión) y el sentido del tiempo, como la marihuana"], "e": "La diapositiva indica que, al ser un depresor del SNC, el alcohol enlentece las funciones cognoscitivas (percepción y juicio), motoras (equilibrio y reflejos) y emocionales (sensatez y madurez).", "f": "D"}, {"id": "t5-032", "t": "t5", "lv": 1, "q": "¿Cuál de los siguientes es un efecto a largo plazo del alcohol según el tema 5?", "o": ["Riesgo de enfermedades hepáticas y del sistema nervioso, presión sanguínea elevada y fuerte dependencia física y psicológica", "Reducción de la memoria y de la comprensión, alteración del sentido del tiempo y aumento del apetito", "Intoxicación de varias horas de duración con euforia y desinhibición"], "e": "A corto plazo se produce una intoxicación de varias horas. A largo plazo: riesgo de enfermedades hepáticas, presión sanguínea elevada, enfermedades del sistema nervioso y fuerte dependencia física y psicológica.", "f": "D"}, {"id": "t5-033", "t": "t5", "lv": 1, "q": "Según el tema 5, la marihuana es:", "o": ["La droga ilegal más consumida", "La droga más consumida en términos absolutos", "Una droga sin efectos sobre la cognición"], "e": "La marihuana es la droga ilegal más consumida. La más consumida en general es el alcohol.", "f": "D"}, {"id": "t5-034", "t": "t5", "lv": 1, "q": "¿Por qué el THC actúa sobre el cerebro según el tema 5?", "o": ["Porque se parece a los cannabinoides naturales del cuerpo y actúa sobre sus receptores cerebrales", "Porque bloquea la producción de dopamina y altera el sistema de recompensa de forma inmediata", "Porque se une a los receptores del alcohol y potencia sus efectos depresores sobre el sistema nervioso"], "e": "El THC es similar a los neurotransmisores cannabinoides que produce el cuerpo, por lo que actúa sobre los receptores cannabinoides en varias regiones del cerebro.", "f": "D"}, {"id": "t5-035", "t": "t5", "lv": 1, "q": "¿Cuál de los siguientes NO es un efecto de la marihuana recogido en el tema 5?", "o": ["Aumento de la capacidad de concentración y coordinación", "Alteración del sentido del tiempo y de la memoria", "Aumento del apetito y somnolencia"], "e": "Efectos recogidos: reduce la memoria y la comprensión, altera el sentido del tiempo, disminuye la capacidad para tareas de concentración y coordinación, acelera el ritmo cardíaco, aumenta el apetito, psicosis, somnolencia, ciclos menstruales irregulares y menor fecundidad (Brown y Dobs, 2002).", "f": "D"}, {"id": "t5-036", "t": "t5", "lv": 1, "q": "¿Qué efecto de la marihuana sobre la reproducción citan las diapositivas (Brown y Dobs, 2002)?", "o": ["Disminución de la fecundidad en ambos sexos y ciclos menstruales irregulares en las mujeres", "Aumento de la fecundidad en los hombres y ausencia de efectos en las mujeres", "Alteraciones del ciclo menstrual solo con consumos diarios superiores a los cinco años"], "e": "Las diapositivas recogen que en las mujeres puede producir ciclos menstruales irregulares y en ambos sexos disminución de la fecundidad (Brown y Dobs, 2002).", "f": "D"}, {"id": "t5-037", "t": "t5", "lv": 1, "q": "¿Qué autores proponen las señales de dependencia de las TIC que recoge el tema 5?", "o": ["Echeburúa y Corral (2010)", "Brown y Dobs (2002)", "Eisenberg y Morris (2004)"], "e": "Las señales de dependencia de las TIC son de Echeburúa y Corral (2010).", "f": "D"}, {"id": "t5-038", "t": "t5", "lv": 1, "q": "¿Cuál de las siguientes es una señal de dependencia de las TIC según Echeburúa y Corral (2010)?", "o": ["Mentir sobre el tiempo real que se está conectado", "Usar el ordenador para hacer los deberes", "Tener redes sociales"], "e": "Señales: reducir horas de sueño, abandonar actividades importantes, quejas de la familia, pensar constantemente en conectarse e irritarse si falla la conexión, intentos fallidos de reducir el tiempo, mentir sobre el tiempo conectado, aislarse, bajar el rendimiento, volverse irritable y sentirse eufórico ante el ordenador.", "f": "D"}, {"id": "t5-039", "t": "t5", "lv": 1, "q": "Una alumna duerme cada vez menos por estar conectada, ha intentado sin éxito reducir el tiempo de uso y se irrita mucho cuando falla la conexión. Según el tema 5:", "o": ["Presenta varias señales de dependencia de las TIC", "Hace un uso normal de la tecnología propio de su edad", "Presenta síntomas de un trastorno alimentario"], "e": "Reducir horas de sueño, intentos fallidos de reducir el tiempo e irritabilidad ante fallos de conexión son señales de dependencia de las TIC según Echeburúa y Corral (2010).", "f": "D"}, {"id": "t5-040", "t": "t5", "lv": 1, "q": "¿Cuál de las siguientes NO es una estrategia de prevención de la adicción a las TIC que recoge el tema 5?", "o": ["Prohibir por completo el uso de dispositivos sin dar explicaciones", "Pactar un horario de uso con el adolescente", "Estimular el deporte y las actividades de equipo"], "e": "Las estrategias son: limitar el tiempo de uso y pactar un horario con el adolescente, fomentar la relación con personas y amigos, fomentar aficiones, estimular el deporte y las actividades de equipo, actividades grupales como el voluntariado e incrementar la comunicación en la familia.", "f": "D"}, {"id": "t5-041", "t": "t5", "lv": 1, "q": "¿Qué medida destaca el Ministerio de Sanidad, según el tema 5, para combatir el consumo de drogas?", "o": ["Impulsar un ocio sin drogas y el diálogo con los hijos basado en la información, no en la prohibición", "Endurecer las sanciones a los menores consumidores y prohibir el ocio nocturno juvenil", "Evitar hablar de drogas con los hijos para no despertar su curiosidad por consumirlas"], "e": "El Ministerio propone impulsar una cultura del ocio sin drogas para adolescentes y jóvenes, y transmitir la importancia del diálogo con los hijos, con críticas constructivas, sin dejarse llevar por la ira, sin acogerse a la prohibición sino a la información y a la inculcación de actitudes saludables.", "f": "D"}, {"id": "t5-042", "t": "t5", "lv": 1, "q": "¿Cómo define el tema 5 el acoso escolar o bullying?", "o": ["Maltrato psicológico o físico entre escolares, reiterado, del que la víctima no puede salir por sí misma", "Cualquier conflicto puntual entre dos alumnos que termina en agresión física o verbal", "Una pelea entre iguales con fuerzas equilibradas que se repite durante el curso"], "e": "El acoso escolar son situaciones de maltrato psicológico o físico producido entre escolares de forma reiterada, de las cuales la víctima no puede salir por sus propios medios.", "f": "D"}, {"id": "t5-043", "t": "t5", "lv": 1, "q": "Según el tema 5, el acosador descarga en la víctima su agresividad o resentimiento con el fin de:", "o": ["Demostrar su poder y molestar a la víctima", "Resolver un conflicto previo de forma justa", "Obtener un objeto material concreto"], "e": "El acoso se produce cuando el agresor descarga en la víctima su agresividad o resentimiento aplicando maltrato con el fin de demostrar su poder y de molestar a la víctima.", "f": "D"}, {"id": "t5-044", "t": "t5", "lv": 1, "q": "Romper los libros o el móvil de un compañero de forma intencionada es, según el tema 5:", "o": ["Causar daños materiales", "Maltrato físico indirecto", "Manipulación o utilización"], "e": "El tema distingue maltrato físico (daño físico o enfermedad), maltrato psicológico y causar daños materiales (romper o dañar posesiones: ropa, libros, móvil…).", "f": "D"}, {"id": "t5-045", "t": "t5", "lv": 1, "q": "Poner motes, ridiculizar o imitar la discapacidad de un compañero es una forma de maltrato psicológico denominada:", "o": ["Degradar", "Aislar", "Aterrorizar"], "e": "Degradar incluye insultar, ridiculizar, burlarse, humillar, poner motes, dar gritos o imitar la discapacidad de una persona.", "f": "D"}, {"id": "t5-046", "t": "t5", "lv": 1, "q": "Desacreditar a una alumna para que los demás dejen de relacionarse con ella es una forma de maltrato psicológico denominada:", "o": ["Aislar", "Rechazo", "Manipular"], "e": "Aislar incluye el confinamiento físico, restringir las relaciones, limitar la libertad en su entorno y desacreditar para que los demás dejen de relacionarse con la víctima.", "f": "D"}, {"id": "t5-047", "t": "t5", "lv": 1, "q": "Amenazar a un compañero con dejarlo en un lugar peligroso es una forma de maltrato psicológico denominada:", "o": ["Aterrorizar", "Degradar", "Aislar"], "e": "Aterrorizar consiste en inducir miedo extremo, presionar con intimidación o amenazar con dejarlo en un lugar peligroso.", "f": "D"}, {"id": "t5-048", "t": "t5", "lv": 1, "q": "Inducir a un compañero a realizar conductas contrarias a sus intereses y en beneficio de otros es:", "o": ["Manipular o utilizar", "Aislar a la víctima", "Degradar a la víctima"], "e": "Manipular/utilizar es inducir a una persona a realizar conductas que van en contra de sus intereses y en beneficio de otros.", "f": "D"}, {"id": "t5-049", "t": "t5", "lv": 1, "q": "«Negarse a reconocer la presencia, valía o cualidades de una persona y no tener en cuenta sus pensamientos y sentimientos» define la forma de maltrato psicológico denominada:", "o": ["Rechazo", "Aterrorizar", "Manipular"], "e": "El rechazo consiste en negarse a reconocer la presencia, valía o cualidades de una persona, despreciarla, darle a entender que es inútil o inferior y no tener en cuenta sus pensamientos y sentimientos.", "f": "D"}, {"id": "t5-050", "t": "t5", "lv": 1, "q": "¿A qué edad suele ser más frecuente el acoso escolar según el tema 5?", "o": ["Al inicio de la adolescencia (12-13 años)", "Al final del Bachillerato (17-18 años)", "En Educación Infantil (3-5 años)"], "e": "El acoso escolar suele ser más frecuente al inicio de la adolescencia (12-13 años).", "f": "D"}, {"id": "t5-051", "t": "t5", "lv": 1, "q": "Según el tema 5, ¿qué dato se ofrece sobre el acoso en el alumnado con NEAE?", "o": ["Mientras el 13 % de la población infantil sufre acoso, la cifra asciende al 90 % en los niños con NEAE", "El alumnado con NEAE sufre menos acoso que el resto por estar más supervisado", "El 50 % de la población infantil sufre acoso, igual que el alumnado con NEAE"], "e": "La diapositiva indica que mientras el 13 % de la población infantil sufre acoso escolar, la cifra asciende al 90 % en los niños con NEAE.", "f": "D"}, {"id": "t5-052", "t": "t5", "lv": 1, "q": "¿Qué rasgo NO forma parte de las características del acoso que recoge el tema 5?", "o": ["Es un hecho aislado entre iguales con fuerzas equilibradas", "Es un comportamiento agresivo sobre alguien percibido como más débil", "Se compone de muchos ataques de distinta naturaleza repetidos en el tiempo"], "e": "El acoso no es un hecho aislado: se compone de muchos ataques repetidos sobre alguien percibido como más débil, al que se domina e intimida. El acosador busca víctimas vulnerables y actúa sin motivo justificado.", "f": "D"}, {"id": "t5-053", "t": "t5", "lv": 1, "q": "¿Cuál de las siguientes características atribuye el tema 5 a las personas agresoras?", "o": ["Inteligencia emocional deficitaria, impulsividad elevada, baja autoestima y actitud negativa hacia la escuela", "Alta empatía, buenas habilidades sociales y buen rendimiento académico", "Alta tolerancia a la frustración, respeto por las normas y actitud positiva hacia la escuela"], "e": "Las características más frecuentes de las personas agresoras son: inteligencia emocional deficitaria (ausencia de empatía, mal manejo emocional, escasas habilidades sociales, baja tolerancia a la frustración), impulsividad elevada, baja autoestima, problemas para cumplir normas, desafío a los adultos, bajo rendimiento, actitud negativa hacia la escuela y tendencia a abusar de su fuerza.", "f": "D"}, {"id": "t5-054", "t": "t5", "lv": 1, "q": "La víctima pasiva de acoso, según el tema 5, se caracteriza por:", "o": ["Aislamiento, ansiedad y baja autoestima; se culpa, niega la situación y suele estar sobreprotegida", "Aislamiento e impopularidad, pero conducta impulsiva, agresiva y provocadora, con bajo rendimiento", "Buena popularidad y habilidades de comunicación, aunque baja autoestima y miedo a la violencia"], "e": "La víctima pasiva tiene aislamiento social, no tiene amigos, problemas de comunicación, baja popularidad, conducta muy pasiva, miedo a la violencia, ansiedad y poca autoestima; se culpa y se niega a reconocerla, y suele estar sobreprotegida por su familia.", "f": "D"}, {"id": "t5-055", "t": "t5", "lv": 1, "q": "Un alumno aislado e impopular responde a las burlas con conductas agresivas, irritantes y provocadoras, y tiene bajo rendimiento. Según el tema 5, es:", "o": ["Una víctima activa", "Una víctima pasiva", "Un agresor sin condición de víctima"], "e": "La víctima activa también sufre aislamiento e impopularidad, pero actúa de manera impulsiva, con conductas agresivas, irritantes y provocadoras, y bajo rendimiento escolar.", "f": "D"}, {"id": "t5-056", "t": "t5", "lv": 1, "q": "¿Qué rasgo familiar asocia el tema 5 a la víctima pasiva?", "o": ["Suele estar muy sobreprotegida por su familia", "Suele proceder de familias negligentes", "Suele tener padres autoritarios que la castigan físicamente"], "e": "La diapositiva indica que las víctimas pasi
