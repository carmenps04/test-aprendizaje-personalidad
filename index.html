les y la mediación digital"], "e": "El ciberacoso es una agresión intencional, repetida en el tiempo, por un individuo o grupo mediante dispositivos electrónicos sobre alguien que no puede defenderse fácilmente; es una extensión del acoso tradicional al espacio virtual.", "f": "G"}, {"id": "g1-009", "t": "g1", "lv": 1, "q": "¿Cuál de las siguientes NO es una característica diferencial del ciberacoso según la guía?", "o": ["Que no deja pruebas, a diferencia del acoso presencial", "El acceso 24/7, sin refugio para la víctima", "La viralidad del contenido"], "e": "Características diferenciales: acceso 24/7 (sin refugio), viralidad, efecto de desinhibición digital, anonimato e impunidad, y evidencias. A diferencia del acoso psicológico presencial, el ciberacoso deja pruebas digitales (capturas, URL, metadatos).", "f": "G"}, {"id": "g1-010", "t": "g1", "lv": 1, "q": "El «efecto de desinhibición digital» se refiere a que:", "o": ["La falta de contacto físico y de lenguaje no verbal reduce la empatía de quien agrede, que no percibe directamente el dolor causado", "La víctima se desinhibe en el entorno digital y denuncia con más facilidad que en el acoso presencial", "Los observadores intervienen más en internet porque el anonimato reduce su miedo a convertirse en víctimas"], "e": "La desinhibición digital reduce la empatía del agresor por la ausencia de contacto físico y lenguaje no verbal: no percibe el dolor causado y actúa de forma más impulsiva.", "f": "G"}, {"id": "g1-011", "t": "g1", "lv": 1, "q": "Según la guía, ¿qué porcentaje aproximado de víctimas de ciberacoso lo son también en el entorno físico (Andrade et al., 2021)?", "o": ["El 72,9 %", "El 13,4 %", "El 90,0 %"], "e": "La guía indica que aproximadamente el 72,9 % de las víctimas de ciberacoso también lo son en el entorno físico, lo que muestra el solapamiento entre ambos (acoso híbrido).", "f": "G"}, {"id": "g1-012", "t": "g1", "lv": 1, "q": "En la dinámica del acoso, la guía distingue tres perfiles de observadores. ¿Cuáles?", "o": ["Pasivos, reforzadores y defensores activos", "Directos, indirectos y anónimos", "Pasivos, reforzadores y agresores secundarios"], "e": "Observadores pasivos (conocen la situación pero no intervienen), reforzadores (ríen, animan, validan o comparten) y defensores activos (frenan la situación y apoyan a la víctima).", "f": "G"}, {"id": "g1-013", "t": "g1", "lv": 1, "q": "Un alumno no participa en las agresiones, pero se ríe y comparte en el grupo de WhatsApp el vídeo humillante. Según la guía, su rol es:", "o": ["Observador reforzador", "Observador pasivo", "Defensor activo"], "e": "Los reforzadores participan indirectamente riendo, animando, validando o compartiendo contenidos denigrantes, lo que aumenta la visibilidad y la viralización del daño. En el ámbito digital, la guía amplía incluso el concepto de agresor a quien visualiza o comparte.", "f": "G"}, {"id": "g1-014", "t": "g1", "lv": 1, "q": "Según la guía, ¿cuál debe ser el objetivo de la intervención educativa con los observadores?", "o": ["Transformar al espectador pasivo en un agente activo de defensa que rompa la ley del silencio", "Mantenerlos al margen del proceso para no exponerlos y evitar que se conviertan en nuevas víctimas del agresor", "Sancionarlos con la misma gravedad que al agresor, porque su silencio los convierte en responsables directos"], "e": "La intervención educativa debe transformar al espectador pasivo en un agente activo de defensa, promover el rechazo a la violencia y la corresponsabilidad. En ciberacoso pueden actuar como «cortafuegos digital».", "f": "G"}, {"id": "g1-015", "t": "g1", "lv": 1, "q": "¿Qué programa cita la guía como ejemplo de que la intervención de los observadores puede frenar el acoso?", "o": ["El programa KiVa de la Universidad de Turku", "El programa ESTUDES del Plan Nacional sobre Drogas", "El programa PISA de la OCDE sobre convivencia"], "e": "La guía cita el programa KiVa, desarrollado por la Universidad de Turku, como evidencia de que el papel de los observadores es clave para frenar el acoso.", "f": "G"}, {"id": "g1-016", "t": "g1", "lv": 1, "q": "¿Qué mito desmonta la guía sobre el perfil de las personas agresoras?", "o": ["Que solo acosan quienes tienen baja autoestima o problemas familiares, cuando muchos buscan poder y estatus con autoestima media o alta", "Que los agresores actúan siempre en solitario y sin apoyo del grupo, por lo que basta con intervenir sobre ellos", "Que los agresores suelen ser mayores que sus víctimas, por lo que el acoso se concentra entre cursos distintos"], "e": "La guía indica que el acoso no es consecuencia exclusiva de carencias personales: también lo protagonizan estudiantes con habilidades sociales y autoestima media o alta que buscan poder y reconocimiento (Díaz-Aguado et al., 2023).", "f": "G"}, {"id": "g1-017", "t": "g1", "lv": 1, "q": "El tema 5 de las diapositivas atribuye baja autoestima a los agresores, mientras que la guía del Ministerio lo presenta como un mito. ¿Cómo se concilian ambas fuentes?", "o": ["La baja autoestima puede aparecer en algunos agresores, pero no es un rasgo exclusivo de su perfil", "Las dos fuentes coinciden: los agresores presentan siempre baja autoestima y problemas familiares graves", "La guía sostiene que ningún agresor tiene baja autoestima, por lo que contradice por completo la diapositiva"], "e": "La diapositiva del tema 5 recoge la baja autoestima entre las características frecuentes de los agresores. La guía matiza que no es exclusiva y que muchos tienen autoestima media o alta. En el examen, para preguntas del tema 5, sigue lo que dicen las diapositivas.", "f": "G"}, {"id": "g1-018", "t": "g1", "lv": 1, "q": "Según la guía, ¿a partir de qué edad pueden los menores asumir responsabilidad penal por acoso?", "o": ["A partir de los 14 años; antes existe responsabilidad civil y medidas educativas", "A partir de los 18 años; antes solo pueden aplicarse medidas educativas internas del centro escolar", "A partir de los 12 años, coincidiendo con el inicio de la Educación Secundaria Obligatoria"], "e": "La guía desmonta el mito de que los menores no tienen responsabilidad legal: desde los 14 años hay responsabilidad penal y, antes, responsabilidad civil y medidas educativas.", "f": "G"}, {"id": "g1-019", "t": "g1", "lv": 1, "q": "«Si no se identifica al agresor, el centro no puede actuar». Según la guía, esto es:", "o": ["Un mito: el centro debe actuar siempre, proteger a la víctima y activar los protocolos (culpa in vigilando)", "Correcto: sin autor identificado no puede confirmarse el acoso, por lo que el centro debe esperar a nuevas pruebas", "Correcto solo en el ciberacoso, porque el anonimato impide aplicar el protocolo hasta que la policía identifique al autor"], "e": "El centro tiene la obligación de proteger a la víctima y activar el protocolo aunque no se identifique al autor. Ignorar o dilatar la intervención expone al centro a responsabilidad por culpa in vigilando.", "f": "G"}, {"id": "g1-020", "t": "g1", "lv": 1, "q": "¿Qué significa «culpa in vigilando» en el contexto de la guía?", "o": ["La responsabilidad del centro por omisión de sus deberes de protección y custodia del alumnado", "La culpa del alumnado observador que conoce el acoso y no lo comunica a ningún adulto del centro", "La responsabilidad de la familia del agresor por no haber supervisado sus dispositivos digitales"], "e": "La guía advierte que ignorar o dilatar la intervención sitúa a la institución en riesgo jurídico por omisión de sus deberes de protección y custodia (culpa in vigilando).", "f": "G"}, {"id": "g1-021", "t": "g1", "lv": 1, "q": "Según la guía, ¿qué tipos de víctima se distinguen?", "o": ["Víctima pasiva y víctima activa o agresiva, con perfiles mixtos y la denominada «víctima provocadora»", "Víctima directa e indirecta, según sufra el daño en persona o lo presencie como observadora pasiva", "Víctima presencial y víctima digital, según el acoso se produzca en el centro o a través de las redes"], "e": "La guía distingue la víctima pasiva (no se defiende y se resigna) y la víctima activa o agresiva (se defiende de forma agresiva), con perfiles mixtos y la «víctima provocadora», cuyas conductas generan rechazo sin que eso justifique el maltrato.", "f": "G"}, {"id": "g1-022", "t": "g1", "lv": 1, "q": "¿Qué tres finalidades persigue la intervención con la persona agresora según la guía?", "o": ["Reflexión sobre el impacto, empatía con la víctima y compromiso de reparación", "Sanción proporcional, cambio de grupo y comunicación a la Inspección educativa", "Aislamiento del grupo, vigilancia en el patio y derivación a salud mental"], "e": "La figura de la guía recoge: reflexión sobre el impacto de sus actos, empatía con la víctima y compromiso de reparación mediante acciones concretas.", "f": "G"}, {"id": "g1-023", "t": "g1", "lv": 1, "q": "La «desconexión moral» del agresor, según la guía, consiste en:", "o": ["Atribuir la responsabilidad a la víctima o legitimar sus propias conductas", "Perder el contacto con el grupo de iguales y aislarse tras la intervención del centro", "No recordar las agresiones cometidas por la impulsividad con la que se produjeron"], "e": "Los mecanismos de desconexión moral permiten a la persona agresora atribuir la responsabilidad a la víctima o legitimar sus propias conductas.", "f": "G"}, {"id": "g1-024", "t": "g1", "lv": 1, "q": "¿Qué aporta la perspectiva interseccional al análisis del acoso según la guía?", "o": ["Reconocer que varios ejes de desigualdad (origen, orientación, clase, discapacidad…) pueden combinarse y generar formas específicas de discriminación", "Analizar el acoso como un hecho aislado y neutro, centrándose en las características individuales de quien agrede", "Asumir que cada caso de acoso responde a una única causa identificable, lo que simplifica el diagnóstico del equipo"], "e": "La interseccionalidad reconoce que la violencia puede derivar de la combinación de varios factores de identidad y condición, generando formas específicas de discriminación, más intensas y difíciles de detectar.", "f": "G"}, {"id": "g1-025", "t": "g1", "lv": 1, "q": "Según la guía, si un insulto hace referencia a una categoría protegida (raza, orientación, religión…), el acoso debe tipificarse como:", "o": ["Acoso discriminatorio", "Conflicto entre iguales", "Agresividad instrumental"], "e": "La guía indica que, si la agresión hace referencia a una categoría protegida, debe tipificarse como acoso discriminatorio. Tratar insultos racistas o tránsfobos como un «conflicto entre iguales» invisibiliza el problema y revictimiza.", "f": "G"}, {"id": "g1-026", "t": "g1", "lv": 1, "q": "Según la forma, ¿qué tipo de acoso incluye miradas intimidantes, chantajes, gestos obscenos o ignorar deliberadamente para excluir?", "o": ["Social o relacional", "Físico indirecto", "Verbal"], "e": "Según la forma, el acoso puede ser físico (directo o indirecto), verbal (insultos, motes, amenazas, difamación), social o relacional (miradas, chantajes, gestos, exclusión), sexual y ciberacoso.", "f": "G"}, {"id": "g1-027", "t": "g1", "lv": 1, "q": "Esconder o robar las cosas de un compañero es, según la clasificación por la forma de la guía, acoso:", "o": ["Físico indirecto", "Verbal", "Social o relacional"], "e": "La guía distingue el acoso físico directo (agresiones físicas) del indirecto (esconder cosas, robar…).", "f": "G"}, {"id": "g1-028", "t": "g1", "lv": 1, "q": "Crear un perfil falso en nombre de la víctima para enviar mensajes ofensivos a sus amigos es un tipo de ciberacoso denominado:", "o": ["Suplantación de identidad (masquerading)", "Ghosting o exclusión social digital", "Cancelación social digital coordinada"], "e": "La suplantación de identidad (masquerading) consiste en crear perfiles falsos o usar cuentas ajenas para enviar mensajes en nombre de la víctima, dañando sus relaciones.", "f": "G"}, {"id": "g1-029", "t": "g1", "lv": 1, "q": "Excluir deliberadamente a una alumna de los grupos de mensajería de la clase e ignorarla sistemáticamente es, según la guía:", "o": ["Exclusión social digital", "Suplantación de identidad", "Sextorsión"], "e": "La exclusión social digital consiste en denegar deliberadamente el acceso a grupos, ignorar sistemáticamente en chats o practicar el ghosting como daño relacional intencionado.", "f": "G"}, {"id": "g1-030", "t": "g1", "lv": 1, "q": "Controlar las contraseñas y exigir la geolocalización a la pareja adolescente es, según la guía:", "o": ["Cibercontrol y violencia digital de género", "Exclusión social digital en la pareja", "Difamación y ataques al honor"], "e": "El cibercontrol es el uso de las TIC dentro de la pareja adolescente para espiar, controlar contraseñas, exigir geolocalización o manipular, y constituye la base de la violencia de género.", "f": "G"}, {"id": "g1-031", "t": "g1", "lv": 1, "q": "¿Qué tipo de ciberacoso considera la guía «la frontera más actual y virulenta de la manipulación digital»?", "o": ["Los riesgos derivados de la inteligencia artificial, como los deepfakes", "El envío reiterado de correos ofensivos y mensajes amenazantes a través de la mensajería instantánea", "La exclusión deliberada de grupos de mensajería y la práctica sistemática del ghosting"], "e": "Los riesgos derivados de la IA (deepfakes e IA generativa para manipular fotos y convertirlas en material denigrante o sexualizado) representan la frontera más actual y virulenta.", "f": "G"}, {"id": "g1-032", "t": "g1", "lv": 1, "q": "La sextorsión se define en la guía como:", "o": ["Chantaje en el que se amenaza con difundir imágenes sexuales enviadas previamente si la víctima no hace lo que se le pide", "El envío consentido de imágenes íntimas entre adolescentes, sin amenaza posterior ni coacción", "La difusión de rumores en redes sobre la vida sexual de un compañero para dañar su reputación"], "e": "Tras ganarse la confianza (a menudo con identidades falsas generadas por IA), el agresor obtiene contenido íntimo y amenaza con hacerlo público para que la víctima realice una acción: sextorsión.", "f": "G"}, {"id": "g1-033", "t": "g1", "lv": 1, "q": "El grooming, según la guía, es:", "o": ["Acoso sexual a menores basado en establecer una relación de confianza a través de medios informáticos o telemáticos", "El envío de mensajes de contenido sexual entre adolescentes de la misma edad con su consentimiento", "El acoso presencial entre iguales basado en la orientación sexual real o percibida de la víctima"], "e": "La guía define el grooming como el acoso sexual a menores basado en establecer con ellos una relación de confianza a través de medios informáticos o telemáticos, sobre todo chats y redes sociales.", "f": "G"}, {"id": "g1-034", "t": "g1", "lv": 1, "q": "La «indefensión aprendida», que la guía recoge como consecuencia psicológica del acoso, es:", "o": ["Una condición en la que la víctima aprende a comportarse pasivamente y siente que carece de control tras situaciones aversivas repetidas", "Una estrategia de afrontamiento activa en la que la víctima aprende a defenderse de forma agresiva", "Un trastorno físico producido por el cortisol elevado que debilita el sistema inmunológico de la víctima"], "e": "La indefensión aprendida es la condición en la que la víctima aprende a comportarse pasivamente y siente que carece de control tras experimentar situaciones aversivas repetidas.", "f": "G"}, {"id": "g1-035", "t": "g1", "lv": 1, "q": "¿Cuál de las siguientes es una consecuencia física del acoso según la guía?", "o": ["Manifestaciones psicosomáticas como cefaleas tensionales o problemas gastrointestinales", "Fobia social y retraimiento por miedo a que se repita el patrón de agresión en nuevos grupos", "Absentismo escolar y déficit de atención y concentración en las tareas complejas"], "e": "Consecuencias físicas: alteraciones del sueño, manifestaciones psicosomáticas (cefaleas, migrañas, colitis, gastritis, fatiga crónica), debilidad inmunológica por cortisol elevado y abuso de sustancias.", "f": "G"}, {"id": "g1-036", "t": "g1", "lv": 1, "q": "La prevención primaria del acoso, según la guía, se centra en:", "o": ["Fortalecer los factores protectores y construir una cultura de paz y un marco común de convivencia", "Mantener una vigilancia activa y detectar de forma temprana las primeras señales de exclusión y violencia", "Aplicar las siete fases del protocolo cuando ya existe una víctima identificada y un dictamen firmado"], "e": "La prevención primaria es el nivel más deseable y se centra en fortalecer factores protectores (cultura de paz, pertenencia, cohesión). La secundaria se centra en la vigilancia activa y la detección temprana.", "f": "G"}, {"id": "g1-037", "t": "g1", "lv": 1, "q": "¿En qué marco organiza la guía las medidas de prevención primaria?", "o": ["En los tres ejes del Diseño Universal para el Aprendizaje (DUA): acceso, participación y aprendizaje", "En las siete fases del protocolo: detección, inicio, recogida, análisis, notificación, intervención y seguimiento", "En los tres niveles de prevención: primaria, secundaria y terciaria, de menor a mayor gravedad"], "e": "Las medidas de prevención primaria se ordenan según los tres ejes del DUA: acceso, participación y aprendizaje, desde el nivel macro (cultura de centro) al micro (intervención individual).", "f": "G"}, {"id": "g1-038", "t": "g1", "lv": 1, "q": "¿Por qué la guía considera prioritaria la transición de Primaria a Secundaria?", "o": ["Porque las transiciones son momentos de especial vulnerabilidad en los que aumenta el acoso al reconfigurarse los grupos", "Porque en Secundaria los menores pasan a tener responsabilidad penal y el centro debe notificar a la Fiscalía", "Porque es la etapa en que desaparece la supervisión adulta y el acoso se traslada por completo al entorno digital"], "e": "Las transiciones escolares son momentos de especial vulnerabilidad asociados a un aumento del acoso (Díaz-Aguado et al., 2023), por lo que deben planificarse el traspaso de información, la composición de grupos y la continuidad de medidas.", "f": "G"}, {"id": "g1-039", "t": "g1", "lv": 1, "q": "¿Cuál de las siguientes es una señal de alerta que la guía recomienda difundir en la prevención secundaria?", "o": ["Somatizaciones: malestar físico sin causa aparente", "Aumento repentino del rendimiento académico", "Mayor participación en actividades grupales"], "e": "Señales de alerta: cambios conductuales (en ciberacoso, uso compulsivo o abandono de dispositivos), aislamiento social (priorizar el contacto online, tristeza, desgana) y somatizaciones.", "f": "G"}, {"id": "g1-040", "t": "g1", "lv": 1, "q": "¿Cuántas fases tiene el protocolo de acoso y ciberacoso que propone la guía?", "o": ["Siete", "Cinco", "Tres"], "e": "El protocolo tiene siete fases: 1) detección y comunicación; 2) inicio y medidas de protección inmediatas; 3) recogida de información y evidencias; 4) análisis y toma de decisiones; 5) notificaciones; 6) plan de intervención integrado y restaurativo; 7) seguimiento y evaluación.", "f": "G"}, {"id": "g1-041", "t": "g1", "lv": 1, "q": "En la fase 1 del protocolo (detección y comunicación), ¿en qué plazo máximo debe comunicarse la sospecha a la Dirección o Jefatura de estudios?", "o": ["24 horas", "72 horas", "10 días"], "e": "La comunicación a la Dirección o Jefatura de estudios es obligatoria en un plazo máximo de 24 horas desde que se tiene conocimiento del hecho. La fase dura como máximo 24 horas.", "f": "G"}, {"id": "g1-042", "t": "g1", "lv": 1, "q": "¿Quién es responsable de la detección y alerta inicial de un posible caso de acoso según la guía?", "o": ["Cualquier miembro de la comunidad educativa o agente externo que tenga constancia del indicio", "La Dirección o Jefatura de estudios, única figura que puede registrar formalmente un indicio de acoso", "El orientador del centro, ya que es quien tiene formación técnica para valorar si existe acoso"], "e": "Cualquier miembro de la comunidad educativa (docentes, PAS, familias) o agentes externos con constancia del indicio son responsables de la detección y alerta. La Dirección o Jefatura recibe formalmente la alerta.", "f": "G"}, {"id": "g1-043", "t": "g1", "lv": 1, "q": "En la fase 2 del protocolo, las medidas que se adoptan de forma urgente son:", "o": ["Medidas cautelares de protección y cuidado, no punitivas, para detener el daño", "Sanciones disciplinarias inmediatas y cautelares sobre el presunto agresor", "Notificación a la Fiscalía de Menores y a la Inspección en todos los casos"], "e": "La fase 2 abre formalmente el procedimiento: se constituye el equipo de intervención y se adoptan, en un máximo de 24 horas, medidas cautelares de protección y cuidado (no punitivas) para detener el daño.", "f": "G"}, {"id": "g1-044", "t": "g1", "lv": 1, "q": "¿Por qué la guía recomienda que en el equipo de intervención participe, si es posible, profesorado que no dé clase a los implicados?", "o": ["Por objetividad, y porque la presencia del tutor puede dañar las relaciones posteriores con alumnado y familias", "Porque el tutor carece de formación específica en acoso y la normativa exige perfiles especializados", "Porque la ley prohíbe que participe en la comisión cualquier docente que conozca a los implicados"], "e": "Lo más objetivo es que participe profesorado que no imparta clase a los implicados: son procesos dolorosos y la presencia del tutor puede dañar las relaciones posteriores.", "f": "G"}, {"id": "g1-045", "t": "g1", "lv": 1, "q": "¿Cuánto dura la fase 3 del protocolo (recogida de información y evidencias)?", "o": ["Entre 3 y 5 días hábiles", "24 horas", "Un mínimo de 6 meses"], "e": "La fase 3 se desarrolla de forma intensiva durante los 3 a 5 días hábiles posteriores al inicio del protocolo, preferentemente con entrevistas en parejas pedagógicas.", "f": "G"}, {"id": "g1-046", "t": "g1", "lv": 1, "q": "¿Cuál es el plazo máximo de la fase 4 (análisis y toma de decisiones) para emitir el dictamen?", "o": ["48 horas", "24 horas", "10 días"], "e": "La fase 4 evalúa colegiadamente la información para dirimir si es acoso confirmado o un conflicto puntual, con un plazo máximo de 48 horas para el dictamen.", "f": "G"}, {"id": "g1-047", "t": "g1", "lv": 1, "q": "¿Cuál es la duración máxima del plan de intervención integrado y restaurativo (fase 6)?", "o": ["10 días", "48 horas", "6 meses"], "e": "El índice de la guía indica que la fase 6 (plan de intervención integrado y restaurativo) tiene un máximo de 10 días.", "f": "G"}, {"id": "g1-048", "t": "g1", "lv": 1, "q": "¿Cuánto debe durar como mínimo el seguimiento y evaluación (fase 7) del protocolo?", "o": ["Seis meses lectivos", "Un trimestre lectivo", "Un curso escolar completo"], "e": "La fase 7 prevé un seguimiento sistemático durante un periodo mínimo de 6 meses lectivos y termina con una memoria técnica que retroalimenta el Plan de Igualdad y Convivencia.", "f": "G"}, {"id": "g1-049", "t": "g1", "lv": 1, "q": "En la fase 5 (notificaciones), ¿a quién debe informarse desde el primer momento si los hechos pueden constituir delito?", "o": ["A la Fiscalía de Menores", "Solo a la familia del agresor", "A los medios de comunicación"], "e": "En la fase 5 se notifica a familias, Inspección, unidades de convivencia y, si puede constituir delito, a la Fiscalía de Menores desde el primer momento, o a las fuerzas y cuerpos de seguridad según la LOPIVI.", "f": "G"}, {"id": "g1-050", "t": "g1", "lv": 1, "q": "¿Qué enfoque debe articular todas las fases del protocolo según la guía?", "o": ["El enfoque restaurativo: reparar el daño, responsabilizar a quien acosa y reintegrar a todas las partes", "El enfoque sancionador: delimitar responsabilidades y aplicar medidas disciplinarias proporcionales", "El enfoque de mediación entre iguales: acordar soluciones entre víctima y agresor en un plano de igualdad"], "e": "La guía pide aplicar todas las fases bajo la lente del enfoque restaurativo: ir más allá del castigo, reorganizar las relaciones y buscar la sanación y reintegración de las partes.", "f": "G"}, {"id": "g1-051", "t": "g1", "lv": 1, "q": "¿Qué leyes cita el prólogo de la guía como base para contar con protocolos frente a la violencia?", "o": ["La LOMLOE (LO 3/2020) y la LOPIVI (LO 8/2021)", "La LOE (2006) y la LOGSE (1990)", "El Código Civil y la Ley de Enjuiciamiento Criminal"], "e": "El prólogo cita la Ley Orgánica 3/2020 (LOMLOE) y la Ley Orgánica 8/2021 de protección integral a la infancia y la adolescencia frente a la violencia (LOPIVI).", "f": "G"}, {"id": "g1-052", "t": "g1", "lv": 1, "q": "«El protocolo es el mapa, pero el buen trato es el territorio que queremos construir». ¿Qué idea expresa esta frase de la guía?", "o": ["Que el protocolo guía la actuación, pero el objetivo es construir relaciones de buen trato", "Que el protocolo es más importante que el clima del centro, porque garantiza la seguridad jurídica", "Que el buen trato se consigue sobre todo aplicando sanciones claras recogidas en el protocolo"], "e": "La guía presenta el protocolo como guía estructurada y camino a seguir, y el buen trato como la realidad humana que se quiere construir, desplazando el foco de la sanción a la reparación.", "f": "G"}, {"id": "g1-a001", "t": "g1", "lv": 2, "q": "Dos alumnos de igual fuerza y popularidad discuten un día por un trabajo de grupo y se insultan mutuamente. Según la guía, ¿cómo debe tratarse y por qué?", "o": ["Como conflicto: hay igualdad de poder y es puntual, así que caben el diálogo y la mediación", "Como acoso: hay insultos, así que debe activarse el protocolo y evitarse la mediación", "Como ciberacoso: el trabajo de grupo se coordina por mensajería"], "e": "La guía distingue el conflicto (poder equilibrado, puntual, sin intención de daño permanente; se aborda con mediación y diálogo) del acoso (desequilibrio de poder, reiteración e intencionalidad). Un insulto aislado requiere corrección, pero no es acoso.", "f": "G"}, {"id": "g1-a002", "t": "g1", "lv": 2, "q": "Un grupo de cuatro alumnos insulta por segunda vez a un compañero menor y aislado, con clara intención de humillarle. Un profesor propone esperar a ver si se repite más veces antes de actuar. Según la guía, ¿qué error comete?", "o": ["La reiteración empieza con la primera repetición: con intención y desigualdad, dos episodios bastan", "Ninguno: la guía exige que las agresiones se prolonguen varios meses para hablar de acoso", "Ninguno: hasta que no haya una agresión física no puede considerarse acoso escolar"], "e": "La «regla de oro» de la guía es que la reiteración comienza con la primera repetición. Si hay intención de dañar y desigualdad, dos episodios son señal suficiente para activar el protocolo de inmediato. La reiteración es un criterio diagnóstico, no una invitación a la pasividad.", "f": "G"}, {"id": "g1-a003", "t": "g1", "lv": 2, "q": "Un tutor organiza una reunión cara a cara entre una alumna acosada desde hace meses y sus acosadoras para que «hagan las paces». Según la guía, ¿qué riesgo implica?", "o": ["Revictimizar a la alumna, al tratar como conflicto entre iguales una relación de dominio", "Ninguno: la mediación es la vía prioritaria en cualquier caso de acoso escolar", "Incumplir el plazo máximo de 24 horas de la fase de detección y comunicación"], "e": "Tratar el acoso como un conflicto ordinario, con encuentros cara a cara o mediación, puede revictimizar al alumnado afectado. En el acoso la prioridad es proteger a la víctima y restablecer su seguridad, sin negociación en plano de igualdad.", "f": "G"}, {"id": "g1-a004", "t": "g1", "lv": 2, "q": "Durante el recreo, varios alumnos se ríen y graban cómo otro humilla a un compañero; uno lo sube a un grupo de clase y otros lo reenvían. Según los roles de la guía, ¿qué papel tienen quienes ríen y reenvían?", "o": ["Observadores reforzadores, que dan visibilidad al daño y favorecen su viralización", "Observadores pasivos, porque no participan directamente en la agresión física", "Defensores activos, porque dejan constancia de los hechos para denunciarlos"], "e": "Los reforzadores participan indirectamente riendo, animando, validando o compartiendo contenidos denigrantes. En el ámbito digital la guía amplía incluso el concepto de agresor a quien visualiza o comparte el contenido.", "f": "G"}, {"id": "g1-a005", "t": "g1", "lv": 2, "q": "¿Qué objetivo educativo plantea la guía respecto al alumnado observador pasivo?", "o": ["Convertirlo en defensor activo que rompa la ley del silencio", "Mantenerlo al margen del proceso para que no se convierta en víctima", "Sancionarlo igual que al agresor por no haber intervenido"], "e": "La guía propone transformar al espectador pasivo en un agente activo de defensa: que rechace la conducta, no difunda, apoye a la víctima y comunique la situación a adultos. En ciberacoso puede actuar como cortafuegos digital.", "f": "G"}, {"id": "g1-a006", "t": "g1", "lv": 2, "q": "Un alumno con autoestima alta, buenas notas y popular en su grupo es señalado como acosador. Un profesor duda: «Es imposible, los acosadores tienen baja autoestima». ¿Qué responde la guía?", "o": ["Que es un mito: muchos agresores tienen autoestima media o alta y usan la violencia para ganar estatus y poder", "Que tiene razón: el acoso solo lo ejercen alumnos con baja autoestima y problemas familiares", "Que solo puede ser acosador si también ha sido víctima previamente"], "e": "La guía desmonta el mito del perfil del agresor: el acoso también lo protagonizan estudiantes con habilidades sociales y autoestima media o alta que usan la violencia para obtener poder y reconocimiento (Díaz-Aguado et al., 2023).", "f": "G"}, {"id": "g1-a007", "t": "g1", "lv": 2, "q": "Una alumna recibe a diario, también de madrugada, mensajes humillantes desde perfiles falsos, y un montaje de ella circula por varios grupos. ¿Qué características diferenciales del ciberacoso aparecen?", "o": ["Acceso 24/7 sin refugio, anonimato e impunidad, y viralidad", "Desinhibición física, mediación y reparación", "Puntualidad, igualdad de poder y ausencia de pruebas"], "e": "La guía señala como rasgos diferenciales del ciberacoso el acceso 24/7 (sin refugio), la viralidad, la desinhibición digital, el anonimato e impunidad y la existencia de evidencias digitales.", "f": "G"}, {"id": "g1-a008", "t": "g1", "lv": 2, "q": "En el caso anterior, la familia quiere borrar todos los mensajes para que la alumna no los vea más. ¿Qué rasgo del ciberacoso recuerda la guía y qué conviene hacer antes?", "o": ["Deja evidencias digitales; conviene conservarlas (capturas, URL, fechas) antes de eliminarlas", "No deja pruebas; da igual borrarlas o no", "Solo la policía puede ver los mensajes, por lo que no hay que hacer nada"], "e": "A diferencia del acoso psicológico presencial, el ciberacoso deja evidencias (capturas, URL, metadatos) fundamentales para la intervención y la certificación de los hechos. En la fase 3 es especialmente importante conservar y custodiar esas evidencias.", "f": "G"}, {"id": "g1-a009", "t": "g1", "lv": 2, "q": "Un alumno crea un perfil de Instagram con el nombre y la foto de una compañera y publica comentarios ofensivos hacia sus amigas. ¿Qué tipo de ciberacoso es?", "o": ["Suplantación de identidad (masquerading)", "Exclusión social digital (ghosting)", "Cibercontrol en la pareja"], "e": "La suplantación de identidad consiste en crear perfiles falsos o usar cuentas ajenas para enviar mensajes en nombre de la víctima, dañando sus relaciones.", "f": "G"}, {"id": "g1-a010", "t": "g1", "lv": 2, "q": "Un chico de 16 años exige a su novia la contraseña del móvil y la ubicación en tiempo real, y se enfada si no responde en minutos. Según la guía, ¿qué es?", "o": ["Cibercontrol, base de la violencia de género en parejas adolescentes", "Exclusión social digital mediante el control de sus grupos de amigos", "Una muestra normal de preocupación en una relación de pareja adolescente"], "e": "El cibercontrol es el uso de las TIC en la pareja adolescente para espiar, controlar contraseñas, exigir geolocalización o manipular, y constituye la base de la violencia de género.", "f": "G"}, {"id": "g1-a011", "t": "g1", "lv": 2, "q": "Un grupo genera con IA un vídeo falso en el que un compañero aparece diciendo cosas humillantes. ¿Por qué la guía considera este riesgo especialmente grave?", "o": ["Es la frontera más virulenta de la manipulación digital: hiperrealista y difícil de desmentir", "Porque es una forma de exclusión digital que no llega a dañar la reputación de la víctima", "Porque los vídeos generados con IA no dejan rastro digital y no pueden investigarse"], "e": "La guía considera los deepfakes y la IA generativa la frontera más actual y virulenta de la manipulación digital: suplantan con gran realismo la imagen o la voz, generando una doble victimización difícil de distinguir de la realidad.", "f": "G"}, {"id": "g1-a012", "t": "g1", "lv": 2, "q": "Un alumno es insultado por su acento y por llevar ropa tradicional de su país. Según la guía, ¿cómo debe tipificarse y qué debe incluir la reparación?", "o": ["Como acoso discriminatorio, con una reparación que actúe contra el prejuicio que lo motivó", "Como un conflicto entre iguales que se resuelve con una disculpa pública del agresor", "Como acoso por búsqueda de estatus, sin relación con el origen cultural de la víctima"], "e": "Si la conducta hace referencia a una categoría protegida (origen, etnia, religión…), debe tipificarse como acoso discriminatorio. La reparación no puede ser solo punitiva: debe incluir sensibilización comunitaria, empoderamiento de la víctima y revisión del currículo.", "f": "G"}, {"id": "g1-a013", "t": "g1", "lv": 2, "q": "¿Qué aporta la perspectiva interseccional al análisis de un caso de acoso a una alumna migrante con discapacidad?", "o": ["Reconocer que varios ejes de desigualdad combinados generan un acoso más intenso y difícil de detectar", "Analizar solo el factor más visible, el origen o la discapacidad, para simplificar la intervención", "Considerar que la discapacidad y el origen migrante no influyen en la probabilidad de sufrir acoso"], "e": "La interseccionalidad reconoce que el acoso puede derivar de la interacción de varios factores (origen, discapacidad, orientación, clase…) y que su combinación genera formas específicas de discriminación, más intensas, persistentes y difíciles de detectar.", "f": "G"}, {"id": "g1-a014", "t": "g1", "lv": 2, "q": "Un profesor conoce el lunes por la tarde, por un comentario de un alumno, una sospecha de acoso. Según la fase 1 del protocolo, ¿qué plazo tiene para comunicarlo y a quién?", "o": ["Máximo 24 horas, a la Dirección o Jefatura de estudios", "Máximo 72 horas, a la Inspección educativa", "Máximo 10 días, a la familia de la presunta víctima"], "e": "En la fase de detección y comunicación, la comunicación a la Dirección o Jefatura de estudios es obligatoria en un plazo máximo de 24 horas desde que se tiene conocimiento del hecho, ante la mera sospecha fundada, rumor o evidencia.", "f": "G"}, {"id": "g1-a015", "t": "g1", "lv": 2, "q": "Ordena correctamente las fases del protocolo de la guía.", "o": ["Detección → inicio y protección → recogida de información → análisis → notificaciones → plan restaurativo → seguimiento", "Detección → análisis → recogida de información → notificaciones → inicio y protección → seguimiento → plan restaurativo", "Inicio y protección → detección → notificaciones → recogida de información → análisis → plan restaurativo → seguimiento"], "e": "Las siete fases son: 1) detección y comunicación; 2) inicio y medidas de protección inmediatas; 3) recogida de información y evidencias; 4) análisis y toma de decisiones; 5) notificaciones; 6) plan de intervención integrado y restaurativo; 7) seguimiento y evaluación.", "f": "G"}, {"id": "g1-a016", "t": "g1", "lv": 2, "q": "¿Qué carácter tienen las medidas de la fase 2 del protocolo y por qué?", "o": ["Cautelares, de protección y no punitivas, para detener el daño mientras se investiga", "Disciplinarias, porque el acoso se considera probado desde que se abre el protocolo", "Mediadoras, porque su objetivo es reconciliar a las partes desde el primer momento"], "e": "La fase 2 abre formalmente el procedimiento y adopta, en un máximo de 24 horas, medidas cautelares de protección y cuidado no punitivas para detener el daño y garantizar un entorno seguro mientras se recoge información.", "f": "G"}, {"id": "g1-a017", "t": "g1", "lv": 2, "q": "¿Qué plazos marca la guía para las fases 3 y 4 del protocolo?", "o": ["Fase 3: entre 3 y 5 días hábiles; fase 4: dictamen en un máximo de 48 horas", "Fase 3: un máximo de 24 horas; fase 4: un máximo de 10 días hábiles", "Fase 3: un mínimo de 6 meses lectivos; fase 4: un máximo de 24 horas"], "e": "La recogida de información y evidencias se desarrolla en 3 a 5 días hábiles; el análisis y la toma de decisiones emiten el dictamen en un máximo de 48 horas. El seguimiento (fase 7) dura un mínimo de 6 meses lectivos.", "f": "G"}, {"id": "g1-a018", "t": "g1", "lv": 2, "q": "Durante la fase 3, ¿por qué recomienda la guía hacer las entrevistas en parejas pedagógicas?", "o": ["Para garantizar objetividad, apoyo mutuo y veracidad del registro", "Para que uno entreviste a la víctima y otro al agresor a la vez", "Porque la ley obliga a que haya siempre un testigo policial"], "e": "El equipo de intervención actúa preferentemente en parejas pedagógicas (dos profesionales por entrevista) para garantizar la objetividad, el soporte mutuo y la veracidad del registro.", "f": "G"}, {"id": "g1-a019", "t": "g1", "lv": 2, "q": "Un alumno ha difundido fotos íntimas de una compañera sin su consentimiento. Según la fase 5 del protocolo, ¿a quién debe notificarse si los hechos pueden constituir delito?", "o": ["A la Fiscalía de Menores desde el primer momento, además de a las familias e Inspección", "Solo a la familia del alumno que difundió las fotos, para que tome medidas en casa", "A nadie fuera del centro, para proteger al máximo la intimidad de la víctima"], "e": "En la fase 5 se notifica a las familias, la Inspección y las unidades de convivencia; si los hechos pueden constituir delito, debe informarse desde el primer momento a la Fiscalía de Menores o a las fuerzas de seguridad. En ciberacoso puede pedirse asesoramiento a la Línea 017 de INCIBE.", "f": "G"}, {"id": "g1-a020", "t": "g1", "lv": 2, "q": "¿Por qué la guía recomienda un seguimiento mínimo de seis meses lectivos tras la intervención?", "o": ["Para verificar el cese del acoso, prevenir recaídas y revictimización y evaluar la reparación", "Porque es el plazo legal de prescripción de las faltas de convivencia en el centro", "Porque antes de que pase ese plazo no puede aplicarse ninguna medida educativa"], "e": "La fase 7 consiste en la supervisión sistemática para verificar la efectividad de los acuerdos, constatar el cese del acoso, prevenir recaídas o revictimización y evaluar si se ha reparado el tejido convivencial, con una memoria final que retroalimenta el Plan de Convivencia.", "f": "G"}, {"id": "g1-a021", "t": "g1", "lv": 2, "q": "El tema 5 sitúa el inicio del acoso en los 12-13 años y la guía recomienda planificar la transición de Primaria a Secundaria. ¿Qué medida es coherente con ambas fuentes?", "o": ["Formar los grupos de 1.º de ESO evitando el aislamiento y con referentes positivos entre iguales", "Mantener sin cambios los grupos de Primaria para no alterar la convivencia ya establecida", "No compartir información entre etapas para evitar etiquetar al alumnado al llegar al instituto"], "e": "La guía indica que las transiciones son momentos de especial vulnerabilidad y recomienda traspasar información relevante, detectar riesgos y componer los grupos evitando el aislamiento o la conflictividad previa, con referentes positivos entre iguales.", "f": "G"}, {"id": "g1-a022", "t": "g1", "lv": 2, "q": "Una víctima de acoso empieza a faltar a clase, tiene dolores de cabeza sin causa médica y ha bajado mucho su rendimiento. Según la guía, ¿qué tipos de consecuencias presenta?", "o": ["Físicas (somatizaciones) y académicas (absentismo y menor rendimiento)", "Solo sociales, derivadas del aislamiento que le impone el grupo", "Solo psicológicas, porque no presenta ninguna lesión física visible"], "e": "La guía describe consecuencias psicológicas, físicas (psicosomáticas, alteraciones del sueño), sociales y académicas (absentismo, déficit de atención, «muerte académica»), con un efecto dominó entre ellas.", "f": "G"}, {"id": "g1-a023", "t": "g1", "lv": 2, "q": "«Si no participas en el acoso, no tienes nada que ver». Según la guía, ¿qué demuestra el programa KiVa sobre esta idea?", "o": ["Que es un mito: el silencio o el refuerzo de los observadores perpetúan el acoso, y su intervención lo frena", "Que es cierto: solo el agresor y la víctima intervienen en la dinámica del acoso escolar", "Que los observadores solo influyen en el ciberacoso, nunca en el acoso presencial del centro"], "e": "La guía cita el programa KiVa (Universidad de Turku) para desmontar el mito: el acoso no se mantiene sin el contexto grupal y depende de la actitud de los observadores, cuyo silencio o refuerzo lo perpetúa y cuya intervención puede frenarlo.", "f": "G"}, {"id": "g2-001", "t": "g2", "lv": 1, "q": "¿Cuáles son los tres pilares que aborda la Guía de intervención psicológica en emergencias en el contexto escolar?", "o": ["Primeros Auxilios Psicológicos, gestión del duelo y comunicación de malas noticias", "Prevención primaria, detección temprana y seguimiento de casos de acoso y ciberacoso", "Primeros Auxilios Psicológicos, protocolo de acoso y derivación a servicios de salud mental"], "e": "La guía aborda los Primeros Auxilios Psicológicos (PAP), la gestión del duelo y la comunicación de malas noticias.", "f": "G"}, {"id": "g2-002", "t": "g2", "lv": 1, "q": "Los Primeros Auxilios Psicológicos (PAP) son:", "o": ["Una intervención breve, basada en evidencia, de apoyo inmediato y contención emocional ante una crisis", "Una terapia psicológica breve que solo pueden aplicar profesionales de la salud mental colegiados", "Un procedimiento de evaluación clínica para diagnosticar trastornos tras un evento traumático"], "e": "Los PAP son una intervención breve, basada en evidencia, que proporciona apoyo inmediato y contención emocional; buscan reducir la angustia inicial, restaurar el equilibrio y fortalecer el afrontamiento.", "f": "G"}, {"id": "g2-003", "t": "g2", "lv": 1, "q": "Según la guía de emergencias, ¿quién puede aplicar los PAP?", "o": ["Cualquier persona con información y entrenamiento adecuados y habilidades de empatía, incluidos docentes", "Solo profesionales de la psicología o la psiquiatría, porque se trata de una intervención terapéutica", "Solo el equipo directivo y la orientación, que son quienes tienen autoridad para coordinar la emergencia"], "e": "No es necesario ser profesional de la salud mental: cualquier persona puede aplicarlos con la información y el entrenamiento adecuados, y habilidades de empatía, compasión y calidez. Docentes, personal de apoyo, equipos directivos y estudiantes supervisados pueden formarse.", "f": "G"}, {"id": "g2-004", "t": "g2", "lv": 1, "q": "¿Qué premisa fundamental sustenta los PAP según la guía?", "o": ["Muchas reacciones ante eventos potencialmente traumáticos son respuestas normales ante situaciones anormales", "Toda reacción emocional intensa tras un suceso crítico es un síntoma que debe derivarse a salud mental", "Las crisis deben afrontarse sin apoyo externo para que la persona desarrolle su propia resiliencia"], "e": "Los PAP se basan en la premisa de que muchas reacciones psicológicas ante eventos potencialmente traumáticos son respuestas normales ante situaciones anormales.", "f": "G"}, {"id": "g2-005", "t": "g2", "lv": 1, "q": "¿Qué significa el acrónimo del protocolo R.E.S.C.A.T.E. diseñado por Jesús Rivero?", "o": ["Revisión, Entrada y escucha, Serenar, Categorizar necesidades, Asistencia y conexión, Transmitir pautas, Enlace y cierre", "Reconocer, Escuchar, Sostener, Contener, Acompañar, Tranquilizar y Evaluar la evolución del alumno", "Revisar el entorno, Explorar, Serenar, Comunicar, Atender, Tratar el trauma y Evaluar el riesgo"], "e": "R.E.S.C.A.T.E.: R Revisión y preparación; E Entrada y escucha activa; S Serenar y estabilizar; C Categorizar necesidades; A Asistencia práctica y conexión; T Transmitir pautas de afrontamiento; E Enlace y cierre.", "f": "G"}, {"id": "g2-006", "t": "g2", "lv": 1, "q": "En la fase R (Revisión y preparación) del protocolo R.E.S.C.A.T.E., lo primero que debe hacer el docente es:", "o": ["Autoevaluarse: comprobar si está en condiciones emocionales de ayudar o si debe buscar a otro colega", "Acercarse de inmediato al alumno más afectado para evitar que la situación empeore", "Comunicar la situación a la familia antes de cualquier contacto con el alumnado"], "e": "Antes de intervenir hay que evaluar el entorno y a uno mismo: autoevaluación emocional, seguridad del entorno y observación para identificar quién necesita ayuda más urgente.", "f": "G"}, {"id": "g2-007", "t": "g2", "lv": 1, "q": "Durante la observación inicial tras un incidente, ¿a quién debe priorizar el docente según la guía?", "o": ["A un alumno que está en silencio y con la mirada perdida, por posible shock", "Al alumno que llora con más intensidad, porque muestra el mayor nivel de angustia", "Al alumno que hace más preguntas, porque necesita información para tranquilizarse"], "e": "En la fase de revisión se identifica rápidamente quién necesita ayuda más urgente, por ejemplo un niño en silencio y con la mirada perdida (posible shock) frente a otros que solo miran.", "f": "G"}, {"id": "g2-008", "t": "g2", "lv": 1, "q": "En la fase E (Entrada y escucha activa), ¿cuánto tiempo recomienda dedicar la guía a escuchar si la persona desea hablar?", "o": ["Entre 10 y 20 minutos", "Entre 1 y 2 minutos", "Al menos una hora"], "e": "La guía recomienda dedicar entre 10 y 20 minutos a escuchar si la persona desea hablar, usando lenguaje corporal y sin presionar.", "f": "G"}, {"id": "g2-009", "t": "g2", "lv": 1, "q": "La técnica de reflejo que recomienda la guía en la fase de escucha consiste en:", "o": ["Identificar y nombrar el sentimiento de la persona: «Veo que esto te está doliendo mucho»", "Repetir lo que ha dicho la persona con sus mismas palabras para mostrar que se le escucha", "Proponer soluciones inmediatas al problema para reducir cuanto antes su malestar"], "e": "La guía diferencia el parafraseo (repetir lo dicho con sus palabras) del reflejo (identificar el sentimiento, por ejemplo «Veo que esto te está doliendo mucho y es muy difícil para ti»).", "f": "G"}, {"id": "g2-010", "t": "g2", "lv": 1, "q": "¿En qué consiste la técnica de respiración 4-4-7 que recoge la guía en la fase S (Serenar)?", "o": ["Inhalar en 4 tiempos, retener 4 tiempos y exhalar en 7 tiempos", "Inhalar en 7 tiempos, retener 4 tiempos y exhalar en 4 tiempos", "Inhalar en 4 tiempos, exhalar en 4 tiempos y descansar 7 tiempos"], "e": "La técnica 4-4-7 consiste en inhalar en 4 tiempos, retener 4 y exhalar en 7, repitiéndolo durante 5-10 minutos hasta que baje la agitación.", "f": "G"}, {"id": "g2-011", "t": "g2", "lv": 1, "q": "Si un alumno parece disociado o con la mirada perdida, ¿qué técnica recomienda la guía?", "o": ["Grounding: pedirle que nombre 5 objetos que ve, sonidos que escucha o que sienta sus pies en el suelo", "Pedirle que cuente con todo detalle lo ocurrido para que pueda procesar el suceso", "Respiración 4-4-7: inhalar 4 tiempos, retener 4 y exhalar 7 durante cinco minutos"], "e": "Las técnicas de grounding ayudan a conectar con el presente: nombrar 5 objetos que ve, sonidos que escucha o sentir los pies en el suelo.", "f": "G"}, {"id": "g2-012", "t": "g2", "lv": 1, "q": "En la fase C (Categorizar necesidades), el papel del docente es:", "o": ["Ayudar a ordenar el caos mental distinguiendo lo urgente de lo que puede esperar", "Decidir por el alumno qué debe hacer, ya que la confusión le impide tomar decisiones", "Valorar si presenta un trastorno para derivarlo cuanto antes a salud mental"], "e": "Tras un evento traumático suele haber confusión mental; el docente pregunta qué preocupa más y ayuda a jerarquizar: separar lo urgente (hablar con su madre) de lo secundario (la mochila perdida).", "f": "G"}, {"id": "g2-013", "t": "g2", "lv": 1, "q": "Según la guía, ¿cuál es el principal factor de recuperación tras un evento crítico?", "o": ["El apoyo social", "La medicación", "El olvido del suceso"], "e": "En la fase A (Asistencia práctica y conexión), la guía afirma que el apoyo social es el principal factor de recuperación, por lo que se facilita el reencuentro con familiares, amigos o comunidad.", "f": "G"}, {"id": "g2-014", "t": "g2", "lv": 1, "q": "En la fase A (Asistencia práctica), la guía indica: «No resuelvas todo por la persona». ¿Qué significa?", "o": ["Que hay que ayudarla a gestionar sus propios recursos, fomentando su autonomía", "Que no debe prestarse ayuda práctica para no crear dependencia del docente", "Que la asistencia práctica corresponde solo a los servicios de emergencia"], "e": "La guía pide ayudar a la persona a gestionar sus propios recursos: ejecutar los pasos acordados, facilitar llamadas o contactos y conectarla con su red de apoyo.", "f": "G"}, {"id": "g2-015", "t": "g2", "lv": 1, "q": "En la fase T (Transmitir pautas de afrontamiento), ¿qué se hace?", "o": ["Psicoeducación: informar de lo que puede ocurrir en los próximos días, recomendar autocuidado y recordar sus fortalezas", "Derivar a salud mental a todas las personas atendidas para asegurar un seguimiento profesional", "Pedir a la persona que relate de nuevo el suceso para comprobar que lo ha procesado"], "e": "La fase T incluye educación sobre síntomas (dificultad para dormir, irritabilidad, recuerdos intrusivos), higiene del sueño y autocuidado (evitar alcohol y drogas, mantener rutinas, limitar redes) y fomento de la resiliencia.", "f": "G"}, {"id": "g2-016", "t": "g2", "lv": 1, "q": "¿Cuándo debe derivarse inmediatamente a servicios especializados de salud mental en la fase E (Enlace y cierre)?", "o": ["Si se detecta riesgo suicida, agresividad extrema o la persona no logra estabilizarse", "Siempre que la persona llore o muestre temblor, porque son signos de un trastorno", "Nunca, porque los PAP sustituyen a la atención especializada en el contexto escolar"], "e": "La derivación inmediata procede si se detecta riesgo suicida, agresividad extrema o si la persona no logra estabilizarse. El cierre exige asegurar que queda acompañada y en un lugar seguro.", "f": "G"}, {"id": "g2-017", "t": "g2", "lv": 1, "q": "¿Cuál de las siguientes frases desaconseja la guía en la atención a una persona en crisis?", "o": ["«Cálmate, todo saldrá bien»", "«Es normal sentirse así ante esta situación»", "«¿Qué es lo que más te preocupa en este momento?»"], "e": "La guía desaconseja frases hechas como «Cálmate», «Todo saldrá bien», «No llores» o «Podría ser peor», y prometer cosas que no se pueden cumplir. Sí recomienda validar emociones y ayudar a priorizar.", "f": "G"}, {"id": "g2-018", "t": "g2", "lv": 1, "q": "¿Cuál de estas conductas figura en la lista de «qué NO hacer» de los PAP?", "o": ["Patologizar las reacciones, tratando a la persona como un enfermo mental", "Escuchar más que hablar y tolerar los silencios", "Respetar la dignidad, cultura y decisiones de la persona"], "e": "No hacer: presionar para que cuente detalles, usar frases hechas, prometer lo que no se puede cumplir, actuar impulsivamente sin escuchar y patologizar las reacciones.", "f": "G"}, {"id": "g2-019", "t": "g2", "lv": 1, "q": "Tras aplicar los PAP, ¿qué tres aspectos señala la guía?", "o": ["Seguimiento discreto, informar y coordinar con dirección y equipo de apoyo, y autocuidado del interviniente", "Archivar el caso, informar a todas las familias del centro y dar el suceso por cerrado", "Sancionar a los implicados, cambiar de grupo al afectado y redactar un informe judicial"], "e": "Después de la intervención: realizar un seguimiento, informar y coordinar la atención con dirección y apoyo escolar, y cuidar el bienestar psicológico de quien ha prestado los PAP.", "f": "G"}, {"id": "g2-020", "t": "g2", "lv": 1, "q": "Según Kübler-Ross, recogida en la guía, ¿cuáles son las cinco etapas del duelo?", "o": ["Negación, ira, negociación, depresión y aceptación", "Shock, tristeza, rabia, olvido y superación", "Aceptar la realidad, experimentar el dolor, adaptarse, recolocar y cerrar"], "e": "Kübler-Ross propone cinco etapas: negación, ira, negociación, depresión y aceptación.", "f": "G"}, {"id": "g2-021", "t": "g2", "lv": 1, "q": "¿Qué propone Worden sobre el duelo, según la guía?", "o": ["Cuatro tareas activas: aceptar la pérdida, experimentar el dolor, adaptarse a un mundo sin la persona y recolocarla emocionalmente", "Cinco etapas fijas (negación, ira, negociación, depresión y aceptación) que se recorren en orden", "Que el duelo es un proceso pasivo que se supera con el paso del tiempo sin necesidad de intervención"], "e": "Worden plantea cuatro tareas de elaboración activa: aceptar la realidad de la pérdida, experimentar el dolor, adaptarse a un mundo sin la persona fallecida y recolocar emocionalmente al ser querido.", "f": "G"}, {"id": "g2-022", "t": "g2", "lv": 1, "q": "¿Qué diferencia de enfoque hay entre Kübler-Ross y Worden según la guía?", "o": ["Kübler-Ross describe etapas; Worden plantea tareas en las que la persona participa activamente", "Worden propone etapas secuenciales; Kübler-Ross propone tareas que la persona elabora activamente", "Ambos proponen el mismo modelo de cinco etapas, aunque con nombres distintos"], "e": "Kübler-Ross propone etapas; Worden, tareas en las que el doliente participa activamente. La guía añade que el duelo es único, no necesariamente secuencial y variable en intensidad y duración.", "f": "G"}, {"id": "g2-023", "t": "g2", "lv": 1, "q": "¿Cómo evoluciona el concepto de muerte con la edad según la guía?", "o": ["Hasta los 2 años no hay concepto; de 2 a 7 se concibe como reversible; de 7 a 12 como permanente; en la adolescencia es similar al adulto", "Hasta los 7 años no hay concepto de muerte; de 7 a 12 se concibe como reversible y en la adolescencia como permanente", "Desde los 2 años se comprende que la muerte es irreversible y universal, igual que en la edad adulta"], "e": "Hasta los 2 años no hay concepto de muerte; entre 2 y 7 años se concibe como reversible; entre 7 y 12, como permanente; en la adolescencia el concepto es similar al adulto.", "f": "G"}, {"id": "g2-024", "t": "g2", "lv": 1, "q": "¿Qué tres conceptos deben integrarse para adquirir el concepto de muerte según la guía?", "o": ["Cesación de los procesos corporales, irreversibilidad y universalidad", "Edad del doliente, tipo de muerte y vínculo con el fallecido", "Creencias religiosas, contexto cultural y apoyo familiar"], "e": "Los conceptos de enfermedad y muerte se adquieren al integrar tres conceptos fundamentales: cesación de los procesos corporales, irreversibilidad y universalidad.", "f": "G"}, {"id": "g2-025", "t": "g2", "lv": 1, "q": "La relación entre la concepción de la muerte según la edad y la teoría de Piaget es coherente porque:", "o": ["La idea de la muerte como reversible entre los 2 y 7 años coincide con el estadio preoperacional, sin reversibilidad ni conservación consolidadas", "En el estadio sensoriomotor los niños ya comprenden la universalidad de la muerte por la permanencia del objeto", "Las operaciones formales dificultan entender la muerte porque el adolescente la piensa solo como hipótesis"], "e": "La guía indica que el sistema cognitivo infantil pasa por etapas. La concepción reversible de la muerte (2-7 años) coincide con el periodo preoperacional; la comprensión de la permanencia (7-12) coincide con las operaciones concretas.", "f": "G"}, {"id": "g2-026", "t": "g2", "lv": 1, "q": "Al comunicar a un grupo de alumnos el fallecimiento de un compañero, ¿qué recomienda la guía?", "o": ["Lenguaje claro, concreto y adaptado a la edad, evitando eufemismos como «se ha ido a dormir»", "Usar expresiones suaves como «se ha ido a dormir» para no asustar al alumnado más pequeño", "Dar la noticia sin admitir preguntas para evitar que el alumnado se angustie todavía más"], "e": "Se recomienda presentarse, usar un lenguaje claro y adaptado a la edad, evitar eufemismos que confundan, respetar las diferencias culturales, permitir preguntas y responder con honestidad, y ofrecer contención.", "f": "G"}, {"id": "g2-027", "t": "g2", "lv": 1, "q": "¿Cómo define Buckman (1992) una «mala noticia»?", "o": ["Cualquier información que produzca una alteración negativa en las expectativas de una persona sobre su presente y futuro", "Solo la comunicación del fallecimiento de un familiar cercano o de un miembro de la comunidad educativa", "Cualquier información desconocida que la persona recibe de un profesional sanitario o educativo"], "e": "Buckman (1992) define la mala noticia como cualquier información que produzca una alteración negativa en las expectativas de una persona sobre su presente y futuro.", "f": "G"}, {"id": "g2-028", "t": "g2", "lv": 1, "q": "¿Qué protocolo de comunicación de malas noticias es el más utilizado según la guía?", "o": ["SPIKES (EPICEE en español), de Buckman y colaboradores", "R.E.S.C.A.T.E., de Jesús Rivero y colaboradores", "ABCDE de Primeros Auxilios, de UNICEF"], "e": "El protocolo más utilizado es el de Buckman y colaboradores, que estructura el proceso en 6 pasos con el acrónimo SPIKES (en español, EPICEE).", "f": "G"}, {"id": "g2-029", "t": "g2", "lv": 1, "q": "¿Qué pasos componen el protocolo SPIKES/EPICEE?", "o": ["Entorno, Percepción, Invitación, Conocimiento, Emociones y Estrategia", "Escucha, Pregunta, Informa, Consuela, Explica, Evalúa", "Seguridad, Prevención, Intervención, Contención, Evaluación, Enlace"], "e": "SPIKES: Setting (entorno), Perception (percepción), Invitation (invitación a recibir información), Knowledge (conocimiento), Emotions (exploración y acogida de los sentimientos) y Strategy (estrategia futura).", "f": "G"}, {"id": "g2-030", "t": "g2", "lv": 1, "q": "¿Quién debe transmitir preferiblemente una mala noticia a un menor según la guía?", "o": ["Los progenitores o familiares cercanos, asesorados por los profesionales", "El tutor del centro, sin implicar a la familia, para proteger la intimidad del menor", "El orientador, porque es el único profesional formado para comunicar malas noticias"], "e": "Preferiblemente progenitores o familiares cercanos; los profesionales les asesoran para realizar la comunicación.", "f": "G"}, {"id": "g2-031", "t": "g2", "lv": 1, "q": "¿Cuándo debe comunicarse una mala noticia a un menor según la guía?", "o": ["Lo antes posible, porque postergarla da lugar a fantasías, desconfianza y a que la reciba por otras fuentes", "Cuando el menor pregunte por sí mismo, para respetar su ritmo y no adelantar el dolor", "Tras unas semanas, cuando el entorno familiar esté más tranquilo y preparado"], "e": "Lo antes posible: postergar la noticia da lugar a fantasías que pueden empeorar la situación, aumenta la desconfianza y la incertidumbre y se corre el riesgo de que la reciba por otras fuentes.", "f": "G"}, {"id": "g2-032", "t": "g2", "lv": 1, "q": "Un niño pregunta si su compañero fallecido «volverá cuando acabe el viaje». Según la guía, ¿cómo debe responderse?", "o": ["Sin dar falsas esperanzas: la muerte no es un viaje y la persona no va a regresar", "Dándole una esperanza moderada para no hacerle daño y explicándolo más adelante", "Cambiando de tema y esperando a que la familia aborde la cuestión en casa"], "e": "La guía indica no dar falsas esperanzas sobre el regreso (la muerte no es un viaje), no mentir, no usar eufemismos y estar dispuesto a repetir lo mismo muchas veces.", "f": "G"}, {"id": "g2-033", "t": "g2", "lv": 1, "q": "¿Qué recomienda la guía cuando una noticia es de extrema gravedad?", "o": ["Evitar comunicarla por teléfono", "Comunicarla por mensaje escrito para que el menor la lea con calma", "Comunicarla delante de toda la clase"], "e": "Cuando se trata de una noticia de extrema gravedad, se evitará comunicarla por teléfono, y se acompañará con escucha activa, respondiendo con sinceridad incluso cuando no tengamos respuesta.", "f": "G"}, {"id": "g2-034", "t": "g2", "lv": 1, "q": "¿Cuál de los siguientes NO figura entre los factores que influyen en el duelo según la guía?", "o": ["El rendimiento académico previo del doliente", "El tipo de muerte (natural, repentina, violenta, suicidio)", "El apoyo social disponible"], "e": "Factores que influyen en el duelo: tipo de muerte, vínculo con la persona fallecida, edad y desarrollo del doliente, circunstancias, apoyo social, creencias, contexto cultural y características personales e historia psicológica.", "f": "G"}, {"id": "g2-035", "t": "g2", "lv": 1, "q": "¿Cuándo recomienda la guía derivar a servicios especializados en el seguimiento tras una pérdida?", "o": ["Ante afectación intensa mantenida, síntomas disociativos, conductas de riesgo, retraimiento extremo o antecedentes relevantes", "Siempre que el alumno falte a clase, baje su rendimiento o llore en las semanas posteriores al suceso", "Nunca durante el primer curso, porque el duelo es un proceso natural que el centro debe acompañar sin derivar"], "e": "La guía recomienda la derivación cuando se detectan intensa afectación emocional mantenida, síntomas disociativos, conductas de riesgo, retraimiento extremo o antecedentes psicológicos relevantes.", "f": "G"}, {"id": "g2-a001", "t": "g2", "lv": 2, "q": "Tras un accidente en el patio, una profesora muy afectada porque el alumno herido es su sobrino quiere atender a los alumnos que lo han presenciado. Según el protocolo R.E.S.C.A.T.E., ¿qué debería hacer?", "o": ["Autoevaluarse en la fase R: si está desbordada, pedir que intervenga otro colega", "Intervenir de inmediato, porque es quien mejor conoce a los alumnos", "Esperar a que lleguen los psicólogos sin que nadie atienda a los alumnos"], "e": "La fase R (Revisión y preparación) empieza por la autoevaluación: si la persona está afectada por una crisis reciente o se siente desbordada, no debe intervenir para evitar el daño propio o a la víctima, y debe buscar a otro colega.", "f": "G"}, {"id": "g2-a002", "t": "g2", "lv": 2, "q": "Tras un incidente, un alumno respira muy deprisa y tiembla; otro está inmóvil, en silencio y con la mirada perdida. Según la guía, ¿a quién se atiende primero y con qué técnica?", "o": ["Al de la mirada perdida (posible shock), con técnicas de grounding; al otro, con respiración 4-4-7", "Al que respira deprisa, con grounding; al de la mirada perdida, con respiración", "A ninguno: hay que esperar a que se calmen solos"], "e": "En la observación inicial se prioriza a quien está en silencio y con la mirada perdida (posible shock). El grounding (nombrar objetos, sentir los pies en el suelo) ayuda a conectar con el presente; la respiración 4-4-7 se usa ante ansiedad elevada.", "f": "G"}, {"id": "g2-a003", "t": "g2", "lv": 2, "q": "Una alumna llora tras recibir una mala noticia y el profesor le dice: «Tranquila, no llores, todo va a salir bien». ¿Qué error comete según la guía?", "o": ["Usar frases hechas y prometer lo que no puede cumplir, en vez de validar sus emociones", "Ninguno: tranquilizar con optimismo es la base de los Primeros Auxilios Psicológicos", "Hablar demasiado poco y tolerar los silencios, que aumentan la angustia de la alumna"], "e": "La guía desaconseja frases como «cálmate», «no llores» o «todo saldrá bien», y prometer lo que no se puede cumplir. Recomienda validar las emociones («es normal sentirse así») y permitir el llanto.", "f": "G"}, {"id": "g2-a004", "t": "g2", "lv": 2, "q": "Un alumno en crisis dice: «Me han robado la mochila y no localizo a mi madre». Siguiendo la fase C (Categorizar necesidades), ¿qué haría el docente?", "o": ["Ayudarle a priorizar: primero localizar a su madre y luego la mochila", "Buscar primero la mochila para que se tranquilice y pueda pensar", "Decidir por él qué hacer, sin preguntarle qué le preocupa más"], "e": "La fase C ayuda a ordenar el caos mental: preguntar qué preocupa más y distinguir lo urgente (hablar con la madre) de lo secundario (la mochila).", "f": "G"}, {"id": "g2-a005", "t": "g2", "lv": 2, "q": "¿Qué diferencia hay entre la fase A (Asistencia práctica) y la fase E final (Enlace y cierre) del protocolo R.E.S.C.A.T.E.?", "o": ["En A se facilita el contacto con la red de apoyo; en E se deriva si hay riesgo y se asegura la compañía", "En A se deriva a salud mental a la persona; en E se le enseña la técnica de respiración 4-4-7", "En A se autoevalúa quien interviene; en E se presenta a la persona y le ofrece agua"], "e": "La fase A ejecuta los pasos acordados, facilita llamadas y el reencuentro con la red de apoyo (principal factor de recuperación). La fase E deriva a salud mental si hay riesgo suicida, agresividad extrema o no hay estabilización, y cierra asegurando compañía y lugar seguro.", "f": "G"}, {"id": "g2-a006", "t": "g2", "lv": 2, "q": "Integrando la guía de emergencias y el tema 2, ¿cómo debe adaptarse la comunicación de un fallecimiento a un niño de 5 años?", "o": ["Con palabras sencillas y sin eufemismos, sabiendo que a esa edad suele verla como reversible", "Con explicaciones abstractas y detalladas, porque a esa edad ya domina el pensamiento formal", "Diciéndole que la persona «se ha ido de viaje», para que pueda entenderlo mejor y no sufra"], "e": "La guía indica que entre los 2 y los 7 años la muerte se concibe como reversible y recomienda palabras sencillas, sin eufemismos ni explicaciones abstractas, sin falsas esperanzas de regreso. Coincide con el pensamiento preoperacional del tema 2.", "f": "G"}, {"id": "g2-a007", "t": "g2", "lv": 2, "q": "Un tutor de 3.º de ESO debe comunicar al grupo la muerte de un compañero. ¿Qué actuación se ajusta a la guía?", "o": ["Explicarlo con lenguaje claro, permitir preguntas, responder con honestidad y ofrecer contención", "Decir que el compañero «se ha ido a dormir» para suavizar el impacto en el grupo", "Dar la noticia rápidamente y seguir con la clase sin admitir preguntas del alumnado"], "e": "La guía recomienda presentarse, usar un lenguaje claro y adaptado a la edad, evitar eufemismos, respetar las diferencias culturales, permitir preguntas y responder con honestidad, y observar las reacciones ofreciendo contención.", "f": "G"}, {"id": "g2-a008", "t": "g2", "lv": 2, "q": "Según la guía, ¿por qué no conviene retrasar la comunicación de una mala noticia a un menor?", "o": ["Aumenta la desconfianza, da lugar a fantasías y puede recibirla por otras fuentes", "Porque la ley obliga a comunicarla en un plazo máximo de 24 horas", "Porque los menores olvidan las noticias si se les comunican tarde"], "e": "La guía indica no demorar la noticia: cuanto más tiempo pasa, aumentan la desconfianza y la incertidumbre, se generan fantasías que pueden empeorar la situación y se corre el riesgo de recibirla por otras fuentes.", "f": "G"}, {"id": "g2-a009", "t": "g2", "lv": 2, "q": "En el protocolo SPIKES/EPICEE, ¿qué paso consiste en averiguar qué sabe y entiende ya la persona antes de dar la información?", "o": ["Percepción", "Invitación", "Estrategia"], "e": "SPIKES: Setting (entorno), Perception (percepción de la persona sobre su situación), Invitation (invitación a recibir información), Knowledge (conocimiento), Emotions (acogida de emociones) y Strategy (estrategia futura).", "f": "G"}, {"id": "g2-a010", "t": "g2", "lv": 2, "q": "Una alumna muestra semanas después de la muerte de su padre síntomas disociativos y conductas de riesgo. Según la guía, ¿qué procede?", "o": ["Derivar a servicios especializados, porque son señales de duelo complicado", "Esperar, porque el duelo es natural y no requiere intervención", "Aplicar de nuevo la respiración 4-4-7 hasta que mejore"], "e": "En el seguimiento la guía recomienda derivar cuando hay intensa afectación emocional mantenida, síntomas disociativos, conductas de riesgo, retraimiento extremo o antecedentes psicológicos relevantes.", "f": "G"}, {"id": "g2-a011", "t": "g2", "lv": 2, "q": "¿Por qué la guía de emergencias incluye el autocuidado del interviniente tras aplicar los PAP?", "o": ["Para regular sus propias respuestas y prevenir el agotamiento psicológico", "Porque el interviniente debe recibir terapia obligatoria", "Porque así se cierra formalmente el caso ante la Inspección"], "e": "Tras la intervención es imprescindible que quien presta los PAP cuide su bienestar: reflexionar, hablar con un colega de confianza o aplicar técnicas de autocuidado para regular sus respuestas y prevenir el agotamiento psicológico.", "f": "G"}, {"id": "g2-a012", "t": "g2", "lv": 2, "q": "¿Qué diferencia de enfoque hay entre los PAP y una terapia psicológica según la guía?", "o": ["Los PAP son un apoyo breve de contención inicial que no exige ser profesional de la salud mental", "Los PAP son una terapia breve que solo pueden aplicar psicólogos y psiquiatras colegiados", "Los PAP sustituyen a la terapia psicológica en todos los casos atendidos en el centro"], "e": "Los PAP no son terapia psicológica ni requieren profesionales de la salud mental: son una atención inicial compasiva para mitigar el impacto y prevenir complicaciones. Si hay riesgo o no hay estabilización, se deriva.", "f": "G"}, {"id": "g2-a013", "t": "g2", "lv": 2, "q": "Un docente aplica PAP y, al final de la fase T, le dice al alumno: «Es posible que esta noche te cueste dormir; es parte de cómo tu mente procesa lo ocurrido». ¿Qué está haciendo?", "o": ["Psicoeducación: anticipar síntomas esperables para que no le asusten", "Patologizar la reacción del alumno tratándola como si fuera un trastorno", "Derivar al alumno a salud mental por riesgo de complicaciones"], "e": "La fase T (Transmitir pautas de afrontamiento) incluye educación sobre síntomas: informar de lo que puede ocurrir en los próximos días (dificultad para dormir, irritabilidad, recuerdos intrusivos) para que no se asuste.", "f": "G"}, {"id": "g2-a014", "t": "g2", "lv": 2, "q": "¿Qué tienen en común el modelo de Kübler-Ross y el de Worden según la guía, y en qué se diferencian?", "o": ["Ambos ven el duelo como proceso; Kübler-Ross propone etapas y Worden, tareas activas", "Ambos proponen cinco etapas fijas que la persona recorre siempre en el mismo orden", "Kübler-Ross propone tareas activas y Worden, etapas que se viven de forma pasiva"], "e": "Kübler-Ross propone cinco etapas (negación, ira, negociación, depresión, aceptación); Worden plantea cuatro tareas en las que la persona participa activamente. La guía subraya que el duelo es único y no necesariamente secuencial.", "f": "G"}, {"id": "g3-001", "t": "g3", "lv": 1, "q": "¿A qué población se dirige principalmente el cuaderno «Estimulación del pensamiento abstracto» de Isabel Domínguez Torrejón?", "o": ["A niños con dificultades en el lenguaje oral y escrito, aunque también puede usarse con niños sin estas dificultades", "Exclusivamente a alumnado de Secundaria con altas capacidades que necesita retos de razonamiento", "A adultos con deterioro cognitivo leve que necesitan mantener sus funciones de lenguaje"], "e": "La presentación indica que el libro recoge ejercicios fruto de años de trabajo con niños con dificultades en el lenguaje oral y escrito, y que también pueden usarse con niños sin problemas de lenguaje para agilizar el pensamiento abstracto y la categorización.", "f": "L"}, {"id": "g3-002", "t": "g3", "lv": 1, "q": "Según la autora del cuaderno, ¿por qué el niño con lento aprendizaje corre el peligro de verse limitado en su desarrollo?", "o": ["Por su resistencia al ejercicio intelectual mediante la lectura, que le priva de la estimulación que otros reciben", "Porque carece de memoria auditiva suficiente para seguir las instrucciones orales del profesorado", "Porque su ritmo de aprendizaje le impide acceder al pensamiento concreto hasta la adolescencia"], "e": "La presentación señala que estos niños se resisten al ejercicio intelectual mediante la lectura y a enriquecer sus conocimientos por el lenguaje escrito, y por eso pierden la estimulación, ejercitación e información que los demás reciben a través de la lectoescritura.", "f": "L"}, {"id": "g3-003", "t": "g3", "lv": 1, "q": "¿A qué funciones superiores del lenguaje se orientan las actividades del cuaderno?", "o": ["A la generalización y la abstracción", "A la articulación de fonemas aislados", "A la memoria visual de imágenes"], "e": "Las actividades se orientan a estimular el pensamiento abstracto y agilizar los procesos intelectuales para un desarrollo adecuado de las funciones superiores del lenguaje: la generalización y la abstracción.", "f": "L"}, {"id": "g3-004", "t": "g3", "lv": 1, "q": "El cuaderno propone trabajar las actividades por dos vías. ¿Cuáles?", "o": ["La visualización (lectura) y la audibilización (de forma puramente auditiva, a la orden del profesor)", "La escritura (copia de frases) y el dibujo (representación gráfica de las categorías)", "El juego libre y la dramatización de situaciones cotidianas en pequeño grupo"], "e": "La autora indica que las actividades pueden practicarse mediante la visualización, es decir, la lectura, o mediante la audibilización, realizándolas de forma puramente auditiva a la orden del profesor.", "f": "L"}, {"id": "g3-005", "t": "g3", "lv": 1, "q": "Un ejercicio del cuaderno pide indicar qué palabra no tiene relación con las demás («azul, amarillo, dulce, verde») y explicar por qué. ¿Qué capacidad trabaja principalmente?", "o": ["La categorización y la abstracción", "La memoria auditiva inmediata", "El ritmo"], "e": "Identificar el elemento que no pertenece a una categoría y justificarlo trabaja la categorización y la abstracción, uno de los bloques que más se repite en el índice del cuaderno.", "f": "L"}, {"id": "g3-006", "t": "g3", "lv": 1, "q": "Los ejercicios del tipo «Los peces nadan. Los aviones van por el mar. ¿Sí o no?» corresponden, según el índice del cuaderno, a:", "o": ["Absurdos verbales", "Analogías verbales", "Asociación de ideas"], "e": "El índice incluye, entre otros bloques, absurdos verbales, categoría-abstracción, analogías, noción temporal, secuencia auditiva, ritmo, rima, asociación de ideas, memoria auditiva, planteamiento de situaciones y razonamiento. Detectar afirmaciones absurdas corresponde a los absurdos verbales.", "f": "L"}];
const TOPICS = [{"id": "t1", "name": "T1 · Concepto de adolescencia", "short": "T1 Concepto de adolescencia"}, {"id": "t2", "name": "T2 · Desarrollo cognitivo", "short": "T2 Desarrollo cognitivo"}, {"id": "t3", "name": "T3 · Autoconcepto e identidad", "short": "T3 Autoconcepto e identidad"}, {"id": "t4", "name": "T4 · Desarrollo social y moral", "short": "T4 Desarrollo social y moral"}, {"id": "t5", "name": "T5 · Problemas en la adolescencia", "short": "T5 Problemas en la adolescencia"}, {"id": "t6", "name": "T6 · Contenidos del aprendizaje", "short": "T6 Contenidos del aprendizaje"}, {"id": "t7", "name": "T7-8 · Motivación", "short": "T7-8 Motivación"}, {"id": "g1", "name": "Guía · Acoso y ciberacoso", "short": "Guía acoso y ciberacoso"}, {"id": "g2", "name": "Guía · Emergencias en el centro", "short": "Guía emergencias escolares"}, {"id": "g3", "name": "Cuaderno · Pensamiento abstracto", "short": "Cuaderno pensamiento abstracto"}];
const SRC = {D:"Diapositivas",A:"Apuntes de clase",G:"Guía de lectura",L:"Cuaderno de ejercicios"};
const KEYS = ["A","B","C"];
const LS_PROG = "adp_progress_v1", LS_SESS = "adp_session_v1", LS_CFG = "adp_cfg_v1";
const byId = Object.fromEntries(BANK.map(q=>[q.id,q]));

/* ---------- estado ---------- */
let progress = loadLS(LS_PROG) || {};
let session = loadLS(LS_SESS);
let cfg = Object.assign({topics:TOPICS.map(t=>t.id), filter:"all", level:"all", count:"20", mode:"practice"}, loadLS(LS_CFG)||{});
cfg.topics = cfg.topics.filter(id=>TOPICS.some(t=>t.id===id));
let view = session && !session.finished ? "quiz" : "home";
let sideOpen = false;
let sync = {db:null, uid:null, state:"local", timer:null, writing:false, pending:false};

function loadLS(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function grade(ok,ko,n){if(!n)return 0;return Math.max(0,(ok-ko/2)/n*10)}
function fmt(x){return x.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})}

/* ---------- progreso y sincronización ---------- */
function record(qid,res){ // res: 1 acierto, 0 fallo, -1 blanco
  const p = progress[qid] || {c:0,w:0,b:0,l:null,t:0};
  if(res===1)p.c++; else if(res===0)p.w++; else p.b++;
  if(res!==-1)p.l=res;
  p.t=Date.now();
  progress[qid]=p;
  saveLS(LS_PROG,progress);
  scheduleSync();
}
function mergeProgress(a,b){
  const out = Object.assign({},a);
  for(const k in b){ if(!out[k] || (b[k].t||0) > (out[k].t||0)) out[k]=b[k]; }
  return out;
}
function scheduleSync(){
  if(!sync.db)return;
  clearTimeout(sync.timer);
  sync.timer=setTimeout(pushSync,1500);
}
async function pushSync(){
  if(!sync.db)return;
  if(sync.writing){sync.pending=true;return}
  sync.writing=true;
  try{
    await sync.db.doc("data/users/"+sync.uid+"/progress").set({p:progress,v:1,at:Date.now()});
    sync.state="cloud";
  }catch(e){ sync.state = "error"; }
  sync.writing=false;
  renderSide();
  if(sync.pending){sync.pending=false;pushSync()}
}
async function initSync(){
  try{
    if(!window.claude || !window.claude.use) return;
    const user = await window.claude.use("user");
    const db = await window.claude.use("db");
    if(!user || !db) return;
    const uid = await user.id();
    if(!uid) return;
    sync.db=db; sync.uid=uid;
    const snap = await db.doc("data/users/"+uid+"/progress").get();
    if(snap.exists){
      const remote = (snap.data()||{}).p || {};
      progress = mergeProgress(progress, remote);
      saveLS(LS_PROG,progress);
    }
    sync.state="cloud";
    if(Object.keys(progress).length) pushSync();
    render();
  }catch(e){ sync.state="error"; renderSide(); }
}

/* ---------- estadísticas ---------- */
function topicStats(tid){
  const qs = BANK.filter(q=>q.t===tid);
  let ok=0,ko=0;
  for(const q of qs){const p=progress[q.id]; if(p&&p.l===1)ok++; else if(p&&p.l===0)ko++;}
  return {n:qs.length,ok,ko,seen:ok+ko};
}
function globalStats(){
  let ok=0,ko=0,c=0,w=0;
  for(const q of BANK){const p=progress[q.id]; if(!p)continue; if(p.l===1)ok++; else if(p.l===0)ko++; c+=p.c; w+=p.w;}
  return {n:BANK.length,ok,ko,c,w};
}
function sessionStats(s){
  let ok=0,ko=0,bl=0,ans=0;
  for(const it of s.items){
    if(s.mode==="exam" && !s.finished){ if(it.chosen!=null) ans++; continue; }
    if(!it.done) continue;
    if(it.chosen==null) bl++; else if(it.perm[it.chosen]===0) ok++; else ko++;
  }
  return {ok,ko,bl,ans,n:s.items.length};
}

/* ---------- sesiones ---------- */
function pool(topics, filter, level){
  level = level || "all";
  return BANK.filter(q=>topics.includes(q.t)).filter(q=> level==="all" || (level==="adv" ? q.lv===2 : q.lv!==2)).filter(q=>{
    const p=progress[q.id];
    if(filter==="new") return !p || p.l==null;
    if(filter==="wrong") return p && p.l===0;
    return true;
  });
}
function start(opts){
  const o = Object.assign({}, cfg, opts||{});
  let qs = shuffle(pool(o.topics, o.filter, o.level));
  if(o.count!=="all") qs = qs.slice(0, parseInt(o.count,10));
  if(!qs.length){ showDialog("No hay preguntas con esa selección. Cambia los temas o el filtro.", [{t:"Entendido"}]); return; }
  session = {mode:o.mode, idx:0, finished:false, started:Date.now(),
    items: qs.map(q=>({id:q.id, perm:shuffle([0,1,2]), chosen:null, done:false}))};
  saveLS(LS_SESS,session);
