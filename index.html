<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Aprendizaje y Desarrollo de la Personalidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  /* Plan: banco de estudio tipo plataforma. Columna principal con la pregunta, panel lateral fijo con el progreso. */
  --ink:#1d2433; --muted:#5d6577; --line:#d9dde6; --paper:#f4f5f8; --card:#ffffff;
  --accent:#2f4a8a; --accent-soft:#e6ebf6;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --ko:#b3261e; --ko-soft:#fbe7e5; --blank:#8a8f9c; --blank-soft:#eceef2;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7e9f0; --muted:#a3a9b8; --line:#333a4a; --paper:#141822; --card:#1c2130;
    --accent:#8fa8e8; --accent-soft:#25304d;
    --ok:#5cc28f; --ok-soft:#173326; --ko:#f08479; --ko-soft:#3a1d1b; --blank:#9aa0ad; --blank-soft:#2a2f3c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7e9f0; --muted:#a3a9b8; --line:#333a4a; --paper:#141822; --card:#1c2130;
  --accent:#8fa8e8; --accent-soft:#25304d;
  --ok:#5cc28f; --ok-soft:#173326; --ko:#f08479; --ko-soft:#3a1d1b; --blank:#9aa0ad; --blank-soft:#2a2f3c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;max-width:1240px;margin:0 auto;padding:20px 20px 40px;min-height:100%}
header.top{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
header.top h1{font-family:var(--f-display);font-weight:600;font-size:1.45rem;margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:.9rem}
main{min-width:0}
aside{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big div{border-radius:8px;padding:8px 4px;font-variant-numeric:tabular-nums}
.big b{display:block;font-size:1.35rem;line-height:1.2}
.big span{font-size:.75rem;color:var(--muted)}
.b-ok{background:var(--ok-soft)} .b-ok b{color:var(--ok)}
.b-ko{background:var(--ko-soft)} .b-ko b{color:var(--ko)}
.b-bl{background:var(--blank-soft)} .b-bl b{color:var(--muted)}
.note{margin-top:10px;font-size:.9rem;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.note strong{font-size:1.05rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;max-height:260px;overflow:auto;padding:2px}
.tile{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:.78rem;font-variant-numeric:tabular-nums;cursor:pointer}
.tile.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tile.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.tile.bl{background:var(--blank-soft);border-color:var(--blank)}
.tile.ans{background:var(--accent-soft);border-color:var(--accent)}
.tile.cur{box-shadow:0 0 0 2px var(--accent)}
.topicrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.84rem;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.topicrow:first-of-type{border-top:0}
.topicrow .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem}
.bar{grid-column:1/-1;display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--blank-soft)}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--ko)}
.sync{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blank)}
.dot.on{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.card + .card{margin-top:16px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0 0 4px}
.card p.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:600;font-size:.9rem;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#10162a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#10162a}}
.chip small{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10162a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10162a}}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.shortcut{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);text-align:left;cursor:pointer}
.shortcut b{display:block;font-size:.95rem}
.shortcut span{font-size:.82rem;color:var(--muted)}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:.75rem;background:var(--accent-soft);color:var(--accent);font-weight:600}
.qtext{font-family:var(--f-display);font-size:1.22rem;line-height:1.45;margin:0 0 18px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.opt.wrong .k{background:var(--ko);border-color:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:10px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft)}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.ko{border-color:var(--ko);background:var(--ko-soft)}
.feedback.bl{border-color:var(--blank);background:var(--blank-soft)}
.feedback b{display:block;margin-bottom:4px}
.feedback p{margin:0;max-width:70ch}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.result-score{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;margin:8px 0 16px}
.result-score .grade{font-family:var(--f-display);font-size:3rem;font-weight:600;line-height:1}
.result-score .grade small{font-size:1.1rem;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.rv{border:1px solid var(--line);border-left:4px solid var(--blank);border-radius:8px;padding:12px 14px}
.rv.ok{border-left-color:var(--ok)} .rv.ko{border-left-color:var(--ko)}
.rv .q{font-weight:600;margin:0 0 6px}
.rv .a{font-size:.9rem;margin:2px 0}
.rv .e{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.muted{color:var(--muted)}
.dialog-back{position:fixed;inset:0;background:rgba(10,14,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--card);border-radius:12px;padding:20px;max-width:420px;border:1px solid var(--line)}
.dialog p{margin:0 0 16px}
.hint{font-size:.78rem;color:var(--muted);margin-top:12px}
.mobile-toggle{display:none}
@media (max-width: 960px){
  .app{grid-template-columns:1fr;padding:14px 16px 32px}
  aside{position:static;order:-1}
  aside .collapsible{display:none}
  aside.open .collapsible{display:block}
  .mobile-toggle{display:inline-block}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>Aprendizaje y Desarrollo de la Personalidad</h1>
    <span class="sub">MAES · UGR · Banco de preguntas tipo test (3 opciones, 2 fallos restan 1 acierto)</span>
  </header>
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<div id="dlg"></div>
<script>
const BANK = [{"id": "t1-001", "t": "t1", "lv": 1, "q": "Desde el punto de vista conceptual, ¿qué diferencia establece la asignatura entre pubertad y adolescencia?", "o": ["La pubertad es el fenómeno biológico de maduración sexual; la adolescencia, el proceso psicosocial de transición a la adultez que comienza con ella", "Pubertad y adolescencia son sinónimos: ambos términos designan los cambios físicos que se producen entre los 11 y los 20 años", "La adolescencia es el fenómeno biológico que da inicio a la pubertad, que es la etapa psicosocial posterior de construcción de la identidad"], "e": "La pubertad se define como el fenómeno biológico por el que el cuerpo experimenta transformaciones sexuales para alcanzar la plena capacidad sexual y reproductora. La adolescencia es una época de transición psicosocial (identidad, autonomía, ideas de futuro) que comienza en la pubertad, pero cuyo final no está claro.", "f": "D"}, {"id": "t1-002", "t": "t1", "lv": 1, "q": "El término adolescencia procede del verbo latino adolescere. ¿Qué implicación pedagógica se deriva de su significado?", "o": ["Que la adolescencia debe entenderse como un proceso de crecimiento hacia la madurez y no como un estado estático", "Que la adolescencia es esencialmente una etapa de carencia o «adolecer», por lo que el docente debe compensar déficits", "Que la adolescencia es un periodo breve de cambios lentos que no requiere adaptación de la práctica educativa"], "e": "Adolescere significa «crecer y desarrollarse hacia la madurez». Por eso las diapositivas subrayan que debe considerarse un proceso y que es una época de grandes cambios que se producen de forma rápida. La asociación con «adolecer» (carecer) es un error etimológico frecuente.", "f": "D"}, {"id": "t1-003", "t": "t1", "lv": 1, "q": "Según la definición de la asignatura, la adolescencia es una época de transición en la que se dan tres procesos. ¿Cuál de las siguientes opciones los recoge correctamente?", "o": ["Consolidación física y constitución de la identidad; adaptaciones bajo el proceso dependencia-independencia; ideas de futuro primarias", "Adquisición de las operaciones concretas; consolidación del apego con los padres; elección definitiva de la profesión", "Inicio de la pubertad; ruptura completa con la familia de origen; consolidación de una moral heterónoma"], "e": "Las diapositivas definen la adolescencia como una transición en la que se consolidan las transformaciones físicas de la pubertad y se constituye la identidad, se experimentan (y sufren) adaptaciones psicosociales bajo el proceso dependencia-independencia (autonomía) y se construyen ideas de futuro primarias (intenciones de futuro).", "f": "D"}, {"id": "t1-004", "t": "t1", "lv": 1, "q": "¿Cuál es la edad media de inicio de la pubertad que recoge la asignatura?", "o": ["12 años en las chicas y 14 en los chicos", "14 años en las chicas y 12 en los chicos", "10 años en ambos sexos"], "e": "Las diapositivas indican 12 años para las chicas y 14 para los chicos. Los apuntes de clase concretan los rangos (niñas 10-12, niños 12-14), lo que es coherente con que las chicas maduran antes.", "f": "D"}, {"id": "t1-005", "t": "t1", "lv": 1, "q": "¿Qué criterio utiliza la asignatura para determinar el final de la adolescencia?", "o": ["La asunción del rol adulto en función de los logros alcanzados, por lo que su final no es preciso", "El cumplimiento de los 18 años, que marca la mayoría de edad legal y el rol adulto", "La finalización de los cambios físicos de la pubertad y del crecimiento"], "e": "La adolescencia comienza con la pubertad, pero no está claro cuándo termina: finaliza cuando se asume el rol de adulto, en función de los logros. Por eso la duración se expresa con interrogación (de los 11-12 a los 19-20 años ¿?).", "f": "D"}, {"id": "t1-006", "t": "t1", "lv": 1, "q": "Afirmar que «la adolescencia es una construcción social» significa principalmente que:", "o": ["Que su existencia y duración dependen de las sociedades modernas e industrializadas y de factores sociales, culturales y personales", "Que es un periodo sin base biológica, inventado por la escuela, porque la pubertad apenas produce cambios relevantes", "Que su duración es idéntica en todas las culturas porque está fijada por la edad de escolarización obligatoria"], "e": "Las diapositivas la definen como una construcción social derivada del desarrollo de las sociedades modernas e industrializadas, cuya prolongación depende de la esperanza de vida, factores sociales, culturales y la adaptación personal. No niega la base biológica (la pubertad), sino que la etapa psicosocial varía según el contexto.", "f": "D"}, {"id": "t1-007", "t": "t1", "lv": 1, "q": "¿Cuál de los siguientes factores NO figura entre las causas del alargamiento actual de la adolescencia?", "o": ["El adelanto de la edad de emancipación económica de los jóvenes", "La ampliación del periodo escolar obligatorio", "La confusión de la permisividad y la transición de valores"], "e": "Entre las causas del alargamiento figuran: mayor exigencia de preparación y estudios, ampliación de la escolaridad obligatoria, prolongación de la dependencia de los padres, demora en la independencia y la estabilidad laboral, confusión de la permisividad (transición de valores) y dificultad para conseguir el primer empleo. La emancipación no se adelanta, se retrasa.", "f": "D"}, {"id": "t1-008", "t": "t1", "lv": 1, "q": "Dos tendencias históricas explican que hoy la adolescencia sea más larga. ¿Cuáles?", "o": ["La pubertad empieza antes que en épocas anteriores y la entrada en la edad adulta es más tardía", "La pubertad empieza más tarde que antes y la edad adulta se alcanza a la misma edad", "La pubertad y la edad adulta se adelantan, pero se amplía la escolaridad obligatoria"], "e": "Las diapositivas recogen ambas tendencias: la pubertad empieza de forma más temprana que en épocas anteriores y, en la actualidad, la entrada en la edad adulta es más tardía. El periodo intermedio se alarga por los dos extremos.", "f": "D"}, {"id": "t1-009", "t": "t1", "lv": 1, "q": "Según la asignatura, los adolescentes presentan un nivel de conflicto bajo cuando cuentan con:", "o": ["Buen apoyo afectivo, buena comunicación familiar y una estructura educativa coherente (coherencia proyectada)", "Normas estrictas, castigos proporcionados y escasa comunicación para no invadir su intimidad", "Plena libertad de decisión y ausencia de supervisión adulta"], "e": "La diapositiva sobre la adolescencia como posible etapa de crisis señala que el conflicto es bajo cuando existe buen apoyo afectivo, buena comunicación familiar y una coherente estructura educativa (coherencia proyectada). Esto cuestiona la idea de que la adolescencia sea necesariamente una etapa de crisis.", "f": "D"}, {"id": "t1-010", "t": "t1", "lv": 1, "q": "¿Cómo deberían vivirse, según la asignatura, los cambios físicos de la adolescencia?", "o": ["Como un proceso normalizado, sin miedo, vergüenza ni percepciones de rechazo o perpetuidad", "Como una crisis inevitable que el adolescente debe superar solo para fortalecer su carácter", "Como un tema que conviene no tratar en el aula para no aumentar la vergüenza del grupo"], "e": "Las diapositivas indican que los cambios físicos deberían vivirse como un proceso normalizado, sin miedos, vergüenza o sufrimiento, ni percepciones de rechazo o perpetuidad, que se asocian a baja autoestima.", "f": "D"}, {"id": "t1-011", "t": "t1", "lv": 1, "q": "¿Cuál de los siguientes NO es uno de los tres retos principales de la adolescencia que señala la asignatura?", "o": ["Alcanzar la estabilidad laboral y la independencia económica", "Adaptarse a su nueva imagen social y física (corporal)", "Integrarse socialmente a medida que se consolida la independencia de las antiguas relaciones familiares"], "e": "Los retos principales son: adaptarse a la nueva imagen social y física, ir definiendo la identidad a partir de nuevas experiencias y valores que se internalizan, e integrarse socialmente a medida que se consolida la independencia de la familia. La estabilidad laboral es una meta de la adultez, cuya demora alarga la adolescencia.", "f": "D"}, {"id": "t1-012", "t": "t1", "lv": 1, "q": "Una alumna de 2.º de ESO deja de contar sus problemas en casa y pasa la mayor parte del tiempo con su grupo de amigas. Desde la asignatura, esta conducta se interpreta como:", "o": ["Una manifestación normativa del establecimiento de nuevas relaciones, en la que la familia deja de ser el grupo principal de dependencia", "Un síntoma inequívoco de trastorno de conducta que requiere derivación inmediata al departamento de Orientación", "Una consecuencia directa de un estilo educativo autoritario, que debe comunicarse a la familia cuanto antes"], "e": "Las diapositivas describen el establecimiento de nuevas y diversas relaciones con otros grupos sociales: la familia deja de ser el grupo principal de dependencia y el adolescente se centra en conocer sus cambios personales, físicos, psicológicos y sociales. Es un proceso evolutivo esperable.", "f": "D"}, {"id": "t1-013", "t": "t1", "lv": 1, "q": "¿Qué efecto atribuye la asignatura a la mejora de la educación sobre los adolescentes actuales?", "o": ["Promueve la apertura de horizontes y el planteamiento de expectativas más adecuadas", "Reduce la duración de la adolescencia al acelerar la incorporación al mercado laboral", "Elimina la influencia de los medios de comunicación de masas"], "e": "La diapositiva indica que la mejora en la formación promueve la apertura de horizontes y el planteamiento de expectativas más adecuadas.", "f": "D"}, {"id": "t1-014", "t": "t1", "lv": 1, "q": "El efecto de los medios de comunicación de masas sobre la adolescencia actual se vincula en las diapositivas con:", "o": ["Un cambio cultural por la tecnología de la información y la inmediatez de las noticias (FOMO, adicción a RRSS, sedentarismo…)", "Una reducción del sedentarismo gracias a las aplicaciones de actividad física y a la información sobre salud", "Un retraso de la pubertad asociado a la exposición prolongada a pantallas desde la infancia"], "e": "La diapositiva vincula los medios de masas con un cambio de cultura por la tecnología de la información y la disponibilidad instantánea de noticias, y cita como ejemplos el FOMO, la adicción a las redes sociales y el sedentarismo.", "f": "D"}, {"id": "t1-015", "t": "t1", "lv": 1, "q": "El concepto FOMO, que aparece en el tema 1 asociado a los medios de comunicación, se refiere a:", "o": ["El miedo a perderse algo (fear of missing out) que impulsa la conexión constante a redes sociales", "Un trastorno alimentario asociado a la comparación de la imagen corporal en redes sociales", "Un tipo de aprendizaje observacional que se produce a través de los medios digitales"], "e": "FOMO (fear of missing out) es el miedo a perderse lo que otros están viviendo o compartiendo. La asignatura lo menciona como efecto del cambio cultural producido por la tecnología de la información, junto con la adicción a RRSS y el sedentarismo.", "f": "D"}, {"id": "t1-016", "t": "t1", "lv": 1, "q": "Entre los cambios en el tipo de relaciones de los adolescentes, la asignatura menciona:", "o": ["Más reconocimiento de necesidades y derechos, más acceso a recursos y confusión entre respeto y autoridad", "Menor reconocimiento de sus derechos, menos acceso a recursos y mayor obediencia a la autoridad familiar", "Desaparición de las «necesidades sociales» y mayor dependencia económica y afectiva de los padres"], "e": "La diapositiva recoge tres cambios: más reconocimiento de necesidades y derechos, mayores accesos a recursos económicos y «necesidades sociales», y la confusión entre el respeto y la autoridad.", "f": "D"}, {"id": "t1-017", "t": "t1", "lv": 1, "q": "¿Cuál de los siguientes elementos aparece en la asignatura como una mejora del bienestar adolescente?", "o": ["Acceso tardío a las redes sociales", "Disminución de la aceptación de roles sociales, sexuales y morales", "Reducción de la educación sobre el consumo de alcohol, drogas y sexo"], "e": "Como mejoras del bienestar se citan: aumento de la riqueza en la calidad de vida, mayor aceptación de roles sociales, sexuales y morales, mejora de las autopercepciones físicas y estéticas, mayor educación para la autorregulación en el consumo de alcohol, drogas y sexo, y acceso tardío a redes sociales.", "f": "D"}, {"id": "t1-018", "t": "t1", "lv": 1, "q": "Las diapositivas citan el mito «los adolescentes son sacos de hormonas sin control» (Dra. María Pérez Pascual). ¿Qué intención didáctica tiene incluirlo?", "o": ["Desmontar visiones estereotipadas que reducen la adolescencia a lo biológico e ignoran su potencial de desarrollo en múltiples dimensiones", "Confirmar que la conducta adolescente se explica sobre todo por factores hormonales que el docente no controla", "Justificar que el aula no es el lugar para intervenir sobre la conducta y que debe derivarse a la familia"], "e": "El apartado se titula «Desmontando falsos mitos de la adolescencia» y conecta con el objetivo 2 del tema: redescubrir la adolescencia como un periodo de desarrollo potencial en múltiples dimensiones.", "f": "D"}, {"id": "t1-019", "t": "t1", "lv": 1, "q": "¿Cuál de los siguientes NO es uno de los tres objetivos del tema 1?", "o": ["Clasificar los trastornos psicopatológicos más frecuentes de la adolescencia", "Conocer qué es y qué no es la adolescencia", "Conocer qué es aprender desde diferentes teorías del aprendizaje"], "e": "Los objetivos del tema 1 son: conocer qué es y qué no es la adolescencia; redescubrirla como un periodo de desarrollo potencial en múltiples dimensiones; conocer qué es aprender desde diferentes teorías del aprendizaje. Los trastornos se estudian en el tema 5.", "f": "D"}, {"id": "t1-020", "t": "t1", "lv": 1, "q": "Desde las perspectivas psicosociales, ¿qué examina la asignatura en la adolescencia?", "o": ["Variables que pueden explicar o potenciar las conductas y recursos para la adaptación social a lo largo de la adolescencia", "Exclusivamente los cambios hormonales y físicos asociados a la maduración sexual durante la pubertad", "Las bases genéticas de la inteligencia y su influencia en el rendimiento académico del alumnado"], "e": "Desde perspectivas psicosociales se examinan variables que pueden explicar o incidir en potenciar las conductas y recursos para la adaptación social a lo largo de la adolescencia: factores de riesgo y de protección, características de personalidad, relaciones con el contexto, etc.", "f": "D"}, {"id": "t1-021", "t": "t1", "lv": 1, "q": "¿Qué pareja de variables aparece agrupada en las diapositivas dentro de las características de personalidad que inciden en la adaptación adolescente?", "o": ["Autoeficacia y locus de control", "Pubertad y menarquia", "Asimilación y acomodación"], "e": "Las variables psicosociales que recoge la diapositiva son: factores de riesgo y de protección; características de personalidad; relaciones con el contexto (sociales y estructurales); autoestima, imagen social e imagen corporal; autoeficacia y locus de control; autoconcepto físico y hábitos duraderos.", "f": "D"}, {"id": "t1-022", "t": "t1", "lv": 1, "q": "Las relaciones con el contexto que se analizan desde la perspectiva psicosocial se dividen en las diapositivas en:", "o": ["Sociales y estructurales", "Biológicas y genéticas", "Conscientes e inconscientes"], "e": "La diapositiva de variables psicosociales subdivide las relaciones con el contexto en sociales y estructurales. Los apuntes en PDF añaden el sistema educativo.", "f": "D"}, {"id": "t1-023", "t": "t1", "lv": 1, "q": "En los apuntes de clase, el temperamento se describe como:", "o": ["Impulsos biológicos que no pasan por el juicio moral ni cognitivo, como la búsqueda de sensaciones o la evitación del daño", "Un conjunto de valores y normas aprendidos por modelado familiar que orientan el juicio moral del adolescente", "La evaluación afectiva que el adolescente hace de las características que incluye en su autoconcepto"], "e": "Según los apuntes de clase, el temperamento son impulsos puros, biológicos, que no entran en el juicio moral ni cognitivo (búsqueda de sensaciones, evitación del daño…). A medida que se avanza se adquieren herramientas de autorregulación.", "f": "A"}, {"id": "t1-024", "t": "t1", "lv": 1, "q": "Según los apuntes de clase, ¿qué sucede a medida que avanza el proceso temperamental en la adolescencia?", "o": ["Se van adquiriendo herramientas de autorregulación", "Desaparece por completo la búsqueda de sensaciones", "El temperamento queda definitivamente fijado por la familia"], "e": "Los apuntes recogen que cuanto más se avanza en el proceso temperamental, más herramientas de autorregulación se adquieren. Los patrones familiares forman de manera básica, pero la formación la termina la propia persona.", "f": "A"}, {"id": "t1-025", "t": "t1", "lv": 1, "q": "Un profesor de 1.º de ESO observa que una alumna muy desarrollada físicamente evita la clase de Educación Física. Desde el tema 1, ¿qué lectura es más ajustada?", "o": ["El exceso o defecto de madurez respecto a los iguales puede generar vergüenza y afectar al autoconcepto físico", "Es una conducta que solo puede explicarse por falta de interés por la asignatura", "Los cambios físicos no influyen en la conducta escolar, por lo que debe atribuirse a la familia"], "e": "Los apuntes de clase señalan que el exceso de madurez o de inmadurez puede dar lugar a ridículo o vergüenza, y que los cambios físicos pueden percibirse como injusticia (autoconcepto físico). La asignatura pide que estos cambios se vivan como un proceso normalizado.", "f": "A"}, {"id": "t1-026", "t": "t1", "lv": 1, "q": "¿Qué idea subyace a la afirmación de los apuntes de clase de que, si los alumnos se perciben competentes y en entornos donde pueden crecer, reforzarán su personalidad?", "o": ["Que la percepción de competencia y los contextos de crecimiento fortalecen la autoestima, el autoconcepto y la autoeficacia", "Que la personalidad adolescente está fijada genéticamente y apenas se modifica en el aula", "Que la autoestima debe trabajarse con elogios constantes, al margen del desempeño real"], "e": "Los apuntes de clase indican que, si los alumnos se consideran competentes y existen entornos en los que pueden crecer, aprender y mejorar, reforzarán su personalidad, autoestima, autoconcepto, autoconfianza y autoeficacia. Conecta con la idea del tema 3 de que la autoestima depende del desempeño en lo que importa.", "f": "A"}, {"id": "t1-027", "t": "t1", "lv": 1, "q": "La prolongación de la adolescencia depende, entre otros, de la «adaptación personal». En los apuntes de clase se matiza que esta adaptación:", "o": ["Tiene que ver con la utilidad que tenga para la función educativa; si no la tiene, puede convertirse en un problema", "Es irrelevante desde el punto de vista docente, porque depende solo de la esperanza de vida de cada sociedad", "Depende únicamente del nivel socioeconómico familiar y no puede modificarse desde la escuela"], "e": "Los apuntes de clase añaden que la adaptación personal remite a la utilidad docente que tenga para la función educativa: si no la tiene, puede convertirse en un problema.", "f": "A"}, {"id": "t1-028", "t": "t1", "lv": 1, "q": "Durante la adolescencia, el proceso dependencia-independencia se caracteriza por:", "o": ["Constantes adaptaciones psicosociales que se experimentan y se sufren en el camino hacia la autonomía", "Una ruptura inmediata y definitiva con la familia al comenzar la pubertad", "La ausencia de conflicto si el adolescente mantiene un buen rendimiento académico"], "e": "La definición del tema indica que en la adolescencia se experimentan (y sufren) constantes adaptaciones psicosociales bajo el proceso dependencia-independencia (autonomía). Es un proceso gradual, no una ruptura.", "f": "D"}, {"id": "t1-029", "t": "t1", "lv": 1, "q": "Un docente afirma: «La adolescencia es igual en todas las épocas; los chicos de hoy son como los de hace cincuenta años». Según el tema 1, esta afirmación es:", "o": ["Incorrecta: la pubertad se adelanta, la adultez se retrasa y los cambios sociales modifican la experiencia adolescente", "Correcta, porque la adolescencia es un fenómeno exclusivamente biológico que no cambia con la sociedad", "Correcta, porque la edad de la pubertad y la duración de la escolaridad se han mantenido estables"], "e": "El tema plantea si la experiencia adolescente es particular de nuestros tiempos y responde que sí: la pubertad comienza antes, la adultez llega más tarde, se amplía la escolaridad y los medios y la tecnología cambian la cultura. Además, es una construcción social.", "f": "D"}, {"id": "t1-030", "t": "t1", "lv": 1, "q": "¿Qué relación establece la asignatura entre las percepciones de rechazo o perpetuidad ante los cambios físicos y la autoestima?", "o": ["Esas percepciones se asocian a baja autoestima", "Esas percepciones fortalecen la autoestima al generar resiliencia", "No existe relación entre ambas"], "e": "La diapositiva señala que los cambios físicos deberían vivirse sin miedos, vergüenza o sufrimiento, ni percepciones de rechazo o perpetuidad, y entre paréntesis indica «baja autoestima».", "f": "D"}, {"id": "t1-031", "t": "t1", "lv": 1, "q": "Según el tema 1, ¿en qué se focaliza el adolescente al dejar de ser la familia su grupo principal de dependencia?", "o": ["En el conocimiento de sus cambios personales, físicos, psicológicos y sociales", "Exclusivamente en su rendimiento académico y en las expectativas que tienen sobre él sus profesores", "En la búsqueda de una pareja estable y en la planificación de su independencia económica"], "e": "La diapositiva indica que el adolescente se focaliza en el conocimiento de sus cambios personales, físicos, psicológicos y sociales.", "f": "D"}, {"id": "t1-032", "t": "t1", "lv": 1, "q": "¿Qué rango de duración aproximada atribuye la asignatura a la adolescencia?", "o": ["Desde los 11-12 años hasta los 19-20, con un final impreciso", "Desde los 8 hasta los 14 años, con un final preciso", "Desde los 14 hasta los 25 años, de forma fija"], "e": "La diapositiva indica una duración desde los 11-12 años hasta los 19-20 ¿?, con interrogación porque el final depende de la asunción del rol adulto.", "f": "D"}, {"id": "t1-a001", "t": "t1", "lv": 2, "q": "Una alumna de 11 años ya ha tenido la primera regla, pero sigue jugando como una niña y depende totalmente de sus padres. ¿Cómo debe interpretarse desde el tema 1?", "o": ["Ha iniciado la pubertad, pero la adolescencia como proceso psicosocial apenas comienza", "Ya ha completado la adolescencia, porque ha alcanzado la madurez reproductora", "Aún no ha iniciado la pubertad, porque su conducta sigue siendo infantil"], "e": "La pubertad es el fenómeno biológico que lleva a la capacidad reproductora; la adolescencia es una transición psicosocial que comienza con ella e incluye identidad, autonomía e ideas de futuro, y termina al asumir el rol adulto.", "f": "D"}, {"id": "t1-a002", "t": "t1", "lv": 2, "q": "Un joven de 27 años vive con sus padres, encadena contratos de prácticas y aún no ha definido su proyecto profesional. ¿Qué causas del tema 1 explican que su «adolescencia social» se prolongue?", "o": ["La dificultad para encontrar empleo, la demora en la estabilidad laboral y la dependencia de los padres", "El adelanto de la pubertad, la reducción de la escolaridad obligatoria y la mayor permisividad laboral", "La esperanza de vida más corta y la entrada cada vez más temprana en el mercado de trabajo"], "e": "Entre las causas del alargamiento de la adolescencia figuran la exigencia de más preparación, la ampliación de la escolaridad, la prolongación de la dependencia de los padres, la demora en la independencia y la estabilidad laboral, la confusión de la permisividad y la dificultad para conseguir el primer empleo.", "f": "D"}, {"id": "t1-a003", "t": "t1", "lv": 2, "q": "¿Por qué el tema 1 afirma que la adolescencia es una construcción social y no solo un hecho biológico?", "o": ["Porque su existencia y duración dependen de las sociedades industrializadas y de factores socioculturales", "Porque la pubertad no produce cambios físicos relevantes en la mayoría de los jóvenes actuales", "Porque su duración es exactamente la misma en todas las culturas y en todas las épocas"], "e": "La adolescencia deriva del desarrollo de las sociedades modernas e industrializadas, y su prolongación depende de la esperanza de vida, factores sociales, culturales y la adaptación personal. La pubertad sí es un fenómeno biológico.", "f": "D"}, {"id": "t1-a004", "t": "t1", "lv": 2, "q": "Un orientador afirma en una charla a familias: «La adolescencia es necesariamente una etapa de crisis y conflicto». ¿Cómo lo matizaría el tema 1?", "o": ["El conflicto es bajo con apoyo afectivo, buena comunicación familiar y una estructura educativa coherente", "Tiene razón: el conflicto es inevitable en esta etapa y no depende del entorno familiar ni educativo", "El conflicto solo aparece en las familias negligentes y nunca se da en las familias democráticas"], "e": "El tema plantea la pregunta «¿y qué, si la adolescencia implica una etapa de crisis?» y responde que los adolescentes tienen un nivel de conflicto bajo cuando cuentan con buen apoyo afectivo, buena comunicación familiar y una estructura educativa coherente (coherencia proyectada).", "f": "D"}, {"id": "t1-a005", "t": "t1", "lv": 2, "q": "Integrando los temas 1 y 4, ¿qué estilo educativo familiar se ajusta mejor a las condiciones que el tema 1 asocia a un bajo nivel de conflicto adolescente?", "o": ["El democrático, que combina apoyo afectivo, comunicación y normas coherentes", "El permisivo, que ofrece mucho afecto sin normas claras", "El autoritario, que mantiene normas firmes con poca comunicación"], "e": "El tema 1 asocia el bajo conflicto a un buen apoyo afectivo, buena comunicación y una estructura educativa coherente. El estilo democrático (tema 4) es el que combina alto afecto y comunicación con normas coherentes pero no rígidas.", "f": "D"}, {"id": "t1-a006", "t": "t1", "lv": 2, "q": "Un alumno de 1.º de ESO que ha madurado físicamente más tarde que sus compañeros se niega a cambiarse en el vestuario y dice que «nunca va a crecer». Según el tema 1, ¿qué riesgo implica su vivencia?", "o": ["Percibir los cambios con vergüenza y como algo perpetuo, lo que se asocia a baja autoestima", "Ninguno, porque los cambios físicos no influyen en la autoestima adolescente", "Un adelanto de la identidad, porque reflexiona sobre su cuerpo"], "e": "El tema indica que los cambios físicos deberían vivirse como un proceso normalizado, sin miedo, vergüenza, sufrimiento ni percepciones de rechazo o perpetuidad, que se asocian a baja autoestima. Los apuntes añaden que el defecto de madurez respecto a los iguales puede generar vergüenza.", "f": "D"}, {"id": "t1-a007", "t": "t1", "lv": 2, "q": "¿Qué medida docente responde mejor al reto adolescente de «adaptarse a su nueva imagen social y física»?", "o": ["Normalizar en el aula la diversidad de ritmos de maduración y evitar comentarios sobre el físico", "Separar al alumnado según su nivel de desarrollo físico en las actividades grupales", "Evitar cualquier referencia a los cambios corporales para que nadie se sienta incómodo"], "e": "Los retos de la etapa incluyen adaptarse a la nueva imagen social y física. El tema pide que los cambios se vivan como un proceso normalizado, sin miedo ni vergüenza; normalizar la diversidad de ritmos va en esa línea.", "f": "D"}, {"id": "t1-a008", "t": "t1", "lv": 2, "q": "Un alumno de 14 años se pasa horas en redes sociales y se angustia si no está conectado «por si se pierde algo». ¿Qué concepto del tema 1 describe su experiencia y qué factor la explica?", "o": ["FOMO, vinculado al cambio cultural producido por la tecnología de la información", "Identidad prematura, vinculada a la influencia de los padres", "Egocentrismo preoperacional, vinculado a la falta de pensamiento formal"], "e": "El tema relaciona el efecto de los medios de comunicación de masas con un cambio de cultura por la tecnología de la información y la disponibilidad instantánea de noticias, con ejemplos como el FOMO (miedo a perderse algo), la adicción a las RRSS y el sedentarismo.", "f": "D"}, {"id": "t1-a009", "t": "t1", "lv": 2, "q": "El tema 1 incluye el «acceso tardío a redes sociales» entre las mejoras del bienestar. ¿Qué relación tiene con el tema 5?", "o": ["Retrasarlo puede prevenir la dependencia de las TIC descrita por Echeburúa y Corral", "Retrasar el acceso aumenta el riesgo de aislamiento y de trastornos alimentarios", "Retrasar el acceso no guarda relación con ninguno de los problemas del tema 5"], "e": "El tema 1 sitúa el acceso tardío a RRSS entre las mejoras del bienestar, y el tema 5 trata la adicción a las TIC (Echeburúa y Corral, 2010) y propone limitar el tiempo de uso como estrategia de prevención.", "f": "D"}, {"id": "t1-a010", "t": "t1", "lv": 2, "q": "¿Qué cambio en las relaciones adolescentes recoge el tema 1 y puede generar conflictos en el aula?", "o": ["La confusión entre respeto y autoridad", "La obediencia incondicional a las figuras de autoridad", "La pérdida de interés por sus derechos"], "e": "Entre los cambios en el tipo de relaciones el tema recoge: más reconocimiento de necesidades y derechos, mayor acceso a recursos y «necesidades sociales», y confusión entre respeto y autoridad.", "f": "D"}, {"id": "t1-a011", "t": "t1", "lv": 2, "q": "Según el tema 1, ¿qué tres procesos definen la adolescencia como época de transición, y con qué temas de la asignatura se relaciona cada uno?", "o": ["Identidad (tema 3), autonomía frente a dependencia (tema 4) e ideas de futuro (tema 2)", "Conservación (tema 2), reforzamiento negativo (tema 6) y castigo positivo (tema 6)", "Anorexia (tema 5), estilo permisivo (tema 4) y regulación externa (tema 7-8)"], "e": "La adolescencia implica constituir la propia identidad (desarrollada en el tema 3), adaptaciones bajo el proceso dependencia-independencia (relaciones familiares, tema 4) y construir ideas de futuro, posibles gracias al pensamiento formal (tema 2).", "f": "D"}, {"id": "t1-a012", "t": "t1", "lv": 2, "q": "Según los apuntes de clase, ¿qué tienen en común el temperamento y la búsqueda de sensaciones en la adolescencia?", "o": ["Son impulsos biológicos sin juicio moral ni cognitivo que se van autorregulando", "Son valores aprendidos en la familia que se mantienen estables durante la adolescencia", "Son consecuencias directas de un estilo educativo familiar permisivo"], "e": "Los apuntes describen el temperamento como impulsos puros, biológicos, sin juicio moral ni cognitivo, como la búsqueda de sensaciones o la evitación del daño. Con el avance se adquieren herramientas de autorregulación.", "f": "A"}, {"id": "t1-a013", "t": "t1", "lv": 2, "q": "Integrando el tema 1 con los apuntes de clase del tema 2, ¿por qué la búsqueda de sensaciones es tan intensa en la adolescencia?", "o": ["Es un impulso temperamental y, además, la dopamina baja con muchos receptores e impulsa a buscar placer", "Porque el lóbulo prefrontal ya ha madurado del todo y prioriza la recompensa inmediata sobre el riesgo", "Porque el pensamiento formal elimina en esta etapa la capacidad temperamental de evitar el daño"], "e": "Los apuntes del tema 1 incluyen la búsqueda de sensaciones entre los impulsos temperamentales. Los del tema 2 explican que la dopamina baja manteniendo muchos receptores, por lo que el cerebro busca placer, y que el prefrontal aún no ha madurado.", "f": "A"}, {"id": "t1-a014", "t": "t1", "lv": 2, "q": "Una profesora quiere aplicar el objetivo 2 del tema 1 («redescubrir la adolescencia como un periodo de desarrollo potencial en múltiples dimensiones»). ¿Qué enfoque es coherente con él?", "o": ["Centrarse en las capacidades emergentes del alumnado (pensamiento formal, identidad, autonomía) y ofrecerle oportunidades de crecer", "Centrarse en controlar los problemas de conducta, porque la adolescencia es sobre todo una etapa de riesgo", "Esperar a que termine la adolescencia para proponer tareas exigentes"], "e": "El objetivo invita a ver la adolescencia como desarrollo potencial y no solo como problema. Los apuntes añaden que, si el alumnado se percibe competente y en entornos donde puede crecer, refuerza su autoestima, autoconcepto y autoeficacia.", "f": "A"}, {"id": "t1-a015", "t": "t1", "lv": 2, "q": "¿Qué factor explica, según el tema 1, que la entrada en la edad adulta sea cada vez más tardía?", "o": ["La sociedad exige más preparación y estudios y se demora la estabilidad laboral", "La pubertad se retrasa cada vez más por los cambios en la alimentación", "La escolaridad obligatoria se ha reducido en los últimos años"], "e": "Las causas del alargamiento incluyen que la sociedad exige más preparación y estudios (y con mayor rapidez), la ampliación de la escolaridad obligatoria, la dependencia prolongada de los padres y la demora en la estabilidad laboral. La pubertad se adelanta, no se retrasa.", "f": "D"}, {"id": "t1-a016", "t": "t1", "lv": 2, "q": "¿Por qué el tema 1 señala que la familia deja de ser el grupo principal de dependencia en la adolescencia, y qué implicación tiene para el docente?", "o": ["Aparecen nuevas relaciones con otros grupos; el docente debe considerar el peso del grupo de iguales", "Porque la familia deja de influir en todos los ámbitos; el docente debe asumir su papel educativo", "Porque el adolescente se aísla de todos los grupos; el docente debe evitar el trabajo en equipo"], "e": "El tema describe el establecimiento de nuevas y diversas relaciones con otros grupos sociales: la familia deja de ser el grupo principal de dependencia. El tema 4 desarrolla el papel clave del grupo de iguales en la adaptación.", "f": "D"}, {"id": "t1-a017", "t": "t1", "lv": 2, "q": "¿Qué indicador del tema 1 sugiere que la experiencia adolescente es distinta hoy que hace décadas?", "o": ["La pubertad empieza antes y la adultez llega más tarde, en un contexto de cambio tecnológico y educativo", "La pubertad empieza más tarde que antes y la adultez llega a edades más tempranas", "La experiencia adolescente no ha cambiado; solo han cambiado las tecnologías que usan"], "e": "El tema responde a «¿es la experiencia adolescente particular en nuestros tiempos?» señalando que la pubertad comienza antes, la entrada en la adultez es más tardía y que la educación y los medios han cambiado la cultura.", "f": "D"}, {"id": "t1-a018", "t": "t1", "lv": 2, "q": "Una alumna dice a su profesor: «Tengo derecho a opinar sobre las normas de clase». Según el tema 1, ¿qué tendencia refleja?", "o": ["Más reconocimiento de necesidades y derechos en las relaciones adolescentes", "Una moral preconvencional basada en el castigo", "Una identidad prematura que acepta las normas sin reflexión"], "e": "Entre los cambios en las relaciones adolescentes el tema recoge un mayor reconocimiento de necesidades y derechos. El tema 2 añade que en la adolescencia temprana se empieza a cuestionar la autoridad y las normas.", "f": "D"}, {"id": "t1-a019", "t": "t1", "lv": 2, "q": "¿Qué combinación de variables psicosociales del tema 1 está más directamente relacionada con la motivación del tema 7-8?", "o": ["Autoeficacia y locus de control", "Pubertad e imagen corporal", "Esperanza de vida y factores culturales"], "e": "La diapositiva de variables psicosociales incluye la autoeficacia y el locus de control, que el tema 7-8 desarrolla al explicar cómo la autoeficacia y las atribuciones (internas o externas, controlables o no) influyen en el esfuerzo y la persistencia.", "f": "D"}, {"id": "t1-a020", "t": "t1", "lv": 2, "q": "¿Cuál de estas afirmaciones sobre la duración de la adolescencia es correcta según el tema 1?", "o": ["Empieza con la pubertad, hacia los 11-12 años, y termina de forma imprecisa al asumir el rol adulto", "Empieza a los 14 años en ambos sexos y termina a los 18 años con la mayoría de edad legal", "Empieza y termina a la misma edad en todas las culturas, porque depende de la maduración"], "e": "La adolescencia comienza en la pubertad, pero no está claro cuándo finaliza: termina al asumir el rol de adulto en función de los logros. Su duración aproximada va de los 11-12 a los 19-20 años, con interrogación.", "f": "D"}, {"id": "t1-a021", "t": "t1", "lv": 2, "q": "Integrando los temas 1 y 3, ¿por qué el reto de «definir la identidad a partir de nuevas experiencias y valores» puede llevar a distintos niveles de identidad?", "o": ["Según cómo explore y se comprometa, el adolescente puede estar en moratoria, prematura, difusión, negativa o logro", "Porque todos los adolescentes alcanzan el logro de la identidad a la vez, al terminar la Educación Secundaria", "Porque la identidad depende solo de la maduración biológica, que sigue un ritmo distinto en cada adolescente"], "e": "El tema 1 plantea definir la identidad a partir de experiencias (+/-) y valores que se internalizan. El tema 3 describe cinco niveles según el grado de reflexión, exploración y compromiso.", "f": "D"}, {"id": "t2-001", "t": "t2", "lv": 1, "q": "¿Qué conjunto de procesos engloba el término cognición según la asignatura?", "o": ["Atención, percepción, memoria, pensamiento, razonamiento e intuición", "Emoción, motivación, temperamento, carácter, autoestima y voluntad", "Reflejos, hábitos motores, conductas condicionadas y respuestas automáticas"], "e": "Las diapositivas definen la cognición como una serie de procesos mentales complejos: atención, percepción, memoria, pensamiento, razonamiento e intuición.", "f": "D"}, {"id": "t2-002", "t": "t2", "lv": 1, "q": "La metacognición, cuyo aumento caracteriza la adolescencia, se define como:", "o": ["La capacidad de pensar en los procesos mentales que se utilizan para resolver un problema o hacer una tarea, lo que favorece la reflexión", "La capacidad de memorizar grandes cantidades de información en poco tiempo, que aumenta en la adolescencia", "La velocidad con que se procesa la información, que permite resolver más tareas en menos tiempo"], "e": "La diapositiva define la metacognición como la capacidad para pensar en los procesos mentales que utilizan para resolver un problema o hacer una tarea; su aumento favorece la reflexión.", "f": "D"}, {"id": "t2-003", "t": "t2", "lv": 1, "q": "¿Cuál de las siguientes NO aparece entre las características cognitivas de los adolescentes?", "o": ["Disminución de la velocidad de procesamiento por la poda sináptica", "Mejora de la atención selectiva, por ejemplo al estudiar con música", "Aumento del vocabulario y del dominio del lenguaje"], "e": "Las características cognitivas recogidas son: mejora de la atención selectiva, ampliación de las habilidades memorísticas, avance del lenguaje y del vocabulario, aumento de la velocidad de procesamiento, aumento de la metacognición y nuevas capacidades intelectuales (operaciones formales). La velocidad aumenta, no disminuye.", "f": "D"}, {"id": "t2-004", "t": "t2", "lv": 1, "q": "La diapositiva ilustra la mejora de la atención selectiva adolescente con el ejemplo de:", "o": ["Realizar tareas escolares mientras se escucha música", "Leer en voz alta en clase mientras el resto del grupo sigue el texto en silencio", "Memorizar listas de palabras sin distraerse con los estímulos del aula"], "e": "Entre paréntesis, la diapositiva indica «tareas escolares y música» como ejemplo de la mejora de la atención selectiva.", "f": "D"}, {"id": "t2-005", "t": "t2", "lv": 1, "q": "¿Qué cuatro factores combinados explican, según Piaget (1947), los cambios en el desarrollo cognitivo?", "o": ["Maduración cerebral, actividad, experiencias sociales y equilibrio", "Herencia, refuerzo, castigo y modelado", "Lenguaje, cultura, mediación y zona de desarrollo próximo"], "e": "Piaget defendió que los cambios cognitivos son el resultado de la combinación de maduración cerebral (cambios biológicos genéticamente programados), actividad (actuar sobre el ambiente y aprender de él), experiencias sociales (transmisión social) y equilibrio (modificar esquemas para incorporar conocimientos nuevos).", "f": "D"}, {"id": "t2-006", "t": "t2", "lv": 1, "q": "En la teoría de Piaget, el factor denominado «equilibrio» consiste en:", "o": ["Modificar los esquemas mentales anteriores para incorporar los conocimientos nuevos", "Mantener estables los esquemas previos para evitar el conflicto cognitivo", "Alcanzar el punto medio entre la maduración biológica y la actividad"], "e": "Según la diapositiva, el equilibrio consiste en modificar los esquemas mentales anteriores para incorporar los nuevos conocimientos. Implica los procesos de asimilación y acomodación.", "f": "D"}, {"id": "t2-007", "t": "t2", "lv": 1, "q": "En la teoría de Piaget, el factor «actividad» hace referencia a:", "o": ["La capacidad creciente del niño para actuar sobre el ambiente y aprender de él", "La cantidad de actividad física diaria, que favorece la maduración cerebral programada genéticamente", "La interacción con compañeros más capaces, que permite resolver tareas dentro de la ZDP"], "e": "La diapositiva define la actividad como la capacidad creciente del niño para actuar sobre el ambiente y aprender de él.", "f": "D"}, {"id": "t2-008", "t": "t2", "lv": 1, "q": "Para Piaget, las experiencias sociales contribuyen al desarrollo cognitivo porque:", "o": ["La interacción con los demás (transmisión social) conduce al progreso intelectual", "Sustituyen a la maduración biológica como motor del desarrollo", "Permiten interiorizar los instrumentos culturales en la zona de desarrollo próximo"], "e": "Piaget incluye las experiencias sociales como uno de los cuatro factores: la interacción con los demás (transmisión social) conduce al progreso intelectual. La interiorización de instrumentos culturales y la ZDP son conceptos de Vygotsky.", "f": "D"}, {"id": "t2-009", "t": "t2", "lv": 1, "q": "Un alumno que ha aprendido que «los mamíferos viven en tierra» clasifica a la ballena como pez. Cuando el profesor le explica que es un mamífero, el alumno reorganiza su esquema de «mamífero». Este último proceso corresponde a:", "o": ["Acomodación", "Asimilación", "Reversibilidad"], "e": "La asimilación consiste en encajar la experiencia nueva en las estructuras actuales (clasificarla como pez). La acomodación es la modificación de los esquemas existentes para ajustarse mejor a la realidad (reorganizar el concepto de mamífero).", "f": "A"}, {"id": "t2-010", "t": "t2", "lv": 1, "q": "Según los apuntes de clase, la asimilación se define como:", "o": ["Encajar las experiencias nuevas en términos de las estructuras cognitivas actuales", "Modificar los esquemas existentes para ajustarse mejor a los sucesos", "Retirar las ayudas de forma progresiva"], "e": "Los apuntes de clase definen la asimilación como encajar lo nuevo en las estructuras cognitivas actuales, y la acomodación como la modificación de los esquemas existentes para proporcionar una mejor aplicación a los sucesos.", "f": "A"}, {"id": "t2-011", "t": "t2", "lv": 1, "q": "¿Qué etapa de Piaget y qué rango de edad aparecen en las diapositivas para el estadio sensoriomotor?", "o": ["0-2 años", "2-7 años", "7-12 años"], "e": "Las diapositivas recogen: sensoriomotora (0-2), preoperacional (2-7), operaciones concretas (7-12) y operaciones formales (12…).", "f": "D"}, {"id": "t2-012", "t": "t2", "lv": 1, "q": "¿Qué logro es característico del estadio sensoriomotor?", "o": ["La permanencia de los objetos: saber que siguen existiendo aunque estén fuera de la vista", "La conservación de la cantidad: saber que el líquido no cambia al trasvasarlo a otro vaso", "El pensamiento simbólico plenamente desarrollado y la superación del egocentrismo"], "e": "En la etapa sensoriomotora los niños aprenden a través de los sentidos y la interacción con los objetos, pasan de conductas reflejas a acciones orientadas a metas y logran la permanencia de los objetos.", "f": "D"}, {"id": "t2-013", "t": "t2", "lv": 1, "q": "En la etapa preoperacional (2-7 años), el pensamiento se caracteriza por:", "o": ["La capacidad de simbolizar el mundo mediante palabras y símbolos, junto con un marcado egocentrismo", "El dominio de la lógica formal y la capacidad de razonar sobre hipótesis abstractas", "La conservación y la reversibilidad, junto con una comprensión plena de la perspectiva ajena"], "e": "En la etapa preoperacional se desarrollan habilidades para simbolizar el mundo en la mente con palabras y símbolos, pero el pensamiento es todavía muy egocéntrico: hay dificultades para entender la perspectiva de los demás.", "f": "D"}, {"id": "t2-014", "t": "t2", "lv": 1, "q": "Un niño de 5 años ve cómo se trasvasa agua de un vaso ancho a uno alto y estrecho, y afirma que ahora hay más agua. Según Piaget, esto se debe a:", "o": ["La ausencia del principio de conservación, propia del pensamiento preoperacional centrado en una sola dimensión", "La falta de permanencia del objeto, propia del estadio sensoriomotor, que le impide seguir el líquido", "El egocentrismo adolescente, que le lleva a juzgar la cantidad según su propio punto de vista"], "e": "El experimento de los líquidos ilustra la falta de conservación en la etapa preoperacional: el niño se centra en una sola dimensión (la altura) y no compensa con la anchura. La conservación y la reversibilidad se adquieren en las operaciones concretas.", "f": "A"}, {"id": "t2-015", "t": "t2", "lv": 1, "q": "La unidimensionalidad o centración, rasgos del pensamiento prelógico, consisten en:", "o": ["Utilizar una sola dimensión para comparar elementos o resolver un problema", "Pensar en varias hipótesis a la vez antes de resolver un problema", "Volver mentalmente al estado inicial de una transformación"], "e": "Los apuntes de clase describen la unidimensionalidad y el centrismo como respuestas basadas en una sola dimensión, por ejemplo, saber quién es la abuela y quién es mamá sin comprender que la abuela es la madre de mamá.", "f": "A"}, {"id": "t2-016", "t": "t2", "lv": 1, "q": "¿Cuál de los siguientes logros pertenece a las operaciones concretas (7-12 años)?", "o": ["Comprensión de la conservación y de las relaciones causa-efecto, con un pensamiento menos egocéntrico", "Razonamiento hipotético-deductivo sobre situaciones imposibles", "Permanencia del objeto y paso de los reflejos a las acciones intencionales"], "e": "En las operaciones concretas se desarrolla una comprensión más avanzada de las relaciones causa-efecto, la lógica y la conservación, y los niños comprenden mejor la perspectiva de los demás. El razonamiento hipotético es propio de las operaciones formales.", "f": "D"}, {"id": "t2-017", "t": "t2", "lv": 1, "q": "La reversibilidad, adquirida en las operaciones concretas, es:", "o": ["La posibilidad de regresar mentalmente al estado inicial de una transformación", "La capacidad de reflexionar sobre los propios procesos de pensamiento", "La capacidad de formular hipótesis sobre lo que podría ocurrir"], "e": "Los apuntes de clase definen la reversibilidad como la posibilidad de regresar al estado inicial, por ejemplo en el experimento de los líquidos.", "f": "A"}, {"id": "t2-018", "t": "t2", "lv": 1, "q": "La operación de compensación, según los apuntes de clase, consiste en:", "o": ["Comprender que un cambio en un sentido puede contrarrestarse con el mismo cambio en sentido opuesto", "Denominar de forma diferente el mismo objeto atendiendo a varios criterios", "Adoptar el punto de vista del otro para comprender su perspectiva"], "e": "La compensación implica que un cambio en un sentido puede ser contrarrestado por el mismo cambio en sentido opuesto (por ejemplo, suma y resta). La clasificación es denominar de diferente forma el mismo objeto atendiendo a varios criterios.", "f": "A"}, {"id": "t2-019", "t": "t2", "lv": 1, "q": "Un alumno de 10 años entiende que una misma persona puede ser «padre» y a la vez «hijo». ¿Qué operación ha adquirido?", "o": ["Clasificación según varios criterios", "Permanencia del objeto", "Pensamiento hipotético-deductivo"], "e": "Los apuntes de clase ponen como ejemplo de clasificación (operaciones concretas) el caso «padre e hijo»: denominar de distinta forma el mismo objeto atendiendo a varios criterios.", "f": "A"}, {"id": "t2-020", "t": "t2", "lv": 1, "q": "¿Cuál es la principal limitación del pensamiento en el estadio de operaciones concretas?", "o": ["La dificultad para operar de forma lógica con abstracciones", "La incapacidad para conservar cantidades ante cambios de forma", "La ausencia de lenguaje y de pensamiento simbólico"], "e": "En las operaciones concretas se desarrollan operaciones lógicas sobre objetos concretos (sumar, restar con objetos), pero hay dificultad para operar con abstracciones. Esa capacidad llega con las operaciones formales.", "f": "A"}, {"id": "t2-021", "t": "t2", "lv": 1, "q": "La diapositiva describe el pensamiento previo a la adolescencia como «empírico-inductivo». Esto significa que el niño:", "o": ["Saca conclusiones a partir de su experiencia", "Deduce consecuencias a partir de hipótesis abstractas", "Razona sin apoyarse en ningún dato"], "e": "Entre los rasgos del pensamiento previo (operaciones concretas) figura el pensamiento empírico-inductivo: en base a su experiencia, sacan conclusiones. El hipotético-deductivo es el propio de las operaciones formales.", "f": "D"}, {"id": "t2-022", "t": "t2", "lv": 1, "q": "¿Qué define el estadio de operaciones formales?", "o": ["La capacidad de pensar en abstracto, razonar hipotéticamente y planificar", "La capacidad de clasificar objetos concretos y comprender la conservación", "La aparición del lenguaje, el juego simbólico y el egocentrismo"], "e": "Las operaciones formales (desde los 12 años) suponen la capacidad de pensar de forma abstracta y de razonar hipotéticamente, así como habilidades para planificar y resolver problemas complejos.", "f": "D"}, {"id": "t2-023", "t": "t2", "lv": 1, "q": "«¿Qué pasaría si la Tierra no tuviera Luna?». Responder razonadamente a esta pregunta exige principalmente:", "o": ["Pensamiento hipotético-deductivo, propio de las operaciones formales", "Pensamiento empírico-inductivo, propio de las operaciones concretas", "Pensamiento simbólico, propio del estadio preoperacional"], "e": "Plantear «qué ocurriría si…» y deducir consecuencias implica comprender la realidad en términos de hipótesis, rasgo de las operaciones formales según los apuntes de clase.", "f": "A"}, {"id": "t2-024", "t": "t2", "lv": 1, "q": "Entre los 12 y los 18 años, según Piaget, ¿cuál de estas afirmaciones es correcta?", "o": ["Algunos adolescentes usan operaciones lógicas en tareas escolares mucho antes de poder aplicarlas a sus problemas personales", "Todos los adolescentes alcanzan el pensamiento formal a la vez, en torno a los 12 años, y lo aplican a todo", "Los problemas emocionales no afectan a la capacidad de pensar de forma compleja una vez alcanzada"], "e": "La diapositiva destaca que cada niño progresa a su propio ritmo, que cada uno desarrolla su visión del mundo, que algunos usan operaciones lógicas en tareas escolares antes que en sus problemas personales y que los problemas emocionales pueden interferir con el pensamiento complejo.", "f": "D"}, {"id": "t2-025", "t": "t2", "lv": 1, "q": "Una alumna de 4.º de ESO resuelve con soltura problemas de álgebra, pero ante un conflicto con sus amigas toma decisiones impulsivas sin considerar alternativas. Según el tema 2, esta situación:", "o": ["Es esperable: la lógica puede aplicarse antes a tareas escolares que a problemas personales, y las emociones interfieren", "Demuestra que no ha alcanzado ningún nivel de pensamiento formal y sigue en las operaciones concretas", "Indica un trastorno cognitivo que requiere una evaluación psicopedagógica antes de intervenir"], "e": "Las diapositivas señalan que algunos adolescentes utilizan operaciones lógicas en las tareas escolares mucho antes de poder usarlas en sus problemas personales y que los problemas emocionales pueden interferir con el pensamiento complejo.", "f": "D"}, {"id": "t2-026", "t": "t2", "lv": 1, "q": "La posibilidad que adquiere el adolescente de considerar posibilidades además de realidades afecta a la toma de decisiones:", "o": ["De maneras positivas o negativas", "Siempre de forma positiva, porque mejora la planificación", "Siempre de forma negativa, porque genera indecisión"], "e": "La diapositiva indica que la posibilidad de considerar posibilidades y realidades puede afectar a la toma de decisiones de maneras positivas o negativas.", "f": "D"}, {"id": "t2-027", "t": "t2", "lv": 1, "q": "¿Qué rasgo caracteriza el pensamiento en la adolescencia temprana?", "o": ["Comienza a cuestionar la autoridad y las normas sociales y a expresar sus propios puntos de vista", "Desarrolla pensamientos sobre conceptos globales como la justicia o el patriotismo", "Centra su pensamiento en decisiones sobre su carrera profesional"], "e": "En la adolescencia temprana el adolescente usa pensamientos más complejos en la toma de decisiones, empieza a usar operaciones formales en tareas escolares, comienza a cuestionar la autoridad y las normas sociales y a formar sus propios puntos de vista. Los conceptos globales y la carrera corresponden al final de la adolescencia.", "f": "D"}, {"id": "t2-028", "t": "t2", "lv": 1, "q": "«¿Qué me parece que es lo correcto?», «¿Quién soy yo?», «¿Qué es lo que quiero?». Estas preguntas caracterizan, según la asignatura, el pensamiento:", "o": ["A mitad de la adolescencia", "En la adolescencia temprana", "En el estadio de operaciones concretas"], "e": "A mitad de la adolescencia el adolescente comienza a formar su propio código de ética (¿qué es lo correcto?), su identidad (¿quién soy yo?) y a considerar metas futuras (¿qué quiero?), además de pensar a largo plazo y hacer sus propios planes.", "f": "D"}, {"id": "t2-029", "t": "t2", "lv": 1, "q": "¿Qué rasgo es propio del final de la adolescencia según las diapositivas?", "o": ["Desarrollar puntos de vista idealistas y poder mostrar intolerancia hacia puntos de vista opuestos", "Comenzar a cuestionar por primera vez las normas de los padres y la autoridad escolar", "Empezar a usar operaciones lógicas formales en las tareas escolares, pero no en las personales"], "e": "Al final de la adolescencia el pensamiento se centra en conceptos menos autocentrados, en conceptos globales (justicia, historia, política, patriotismo), puntos de vista idealistas, posible intolerancia hacia opiniones opuestas y decisiones sobre la carrera y los roles adultos.", "f": "D"}, {"id": "t2-030", "t": "t2", "lv": 1, "q": "Un alumno de 2.º de Bachillerato debate con vehemencia sobre justicia social y se muestra intolerante con quien opina distinto. Según el tema 2, esto es:", "o": ["Un rasgo propio del pensamiento al final de la adolescencia", "Un signo de regresión al egocentrismo preoperacional", "Un rasgo exclusivo de la adolescencia temprana"], "e": "Las diapositivas recogen que al final de la adolescencia aumentan los pensamientos sobre conceptos globales (justicia, política), aparecen visiones idealistas y se puede debatir y desarrollar intolerancia hacia puntos de vista opuestos.", "f": "D"}, {"id": "t2-031", "t": "t2", "lv": 1, "q": "«Utiliza el pensamiento sistemático para influir en sus relaciones con los demás» y «comienza a pensar a largo plazo» son rasgos que la asignatura sitúa:", "o": ["A mitad de la adolescencia", "Al final de la adolescencia", "En la adolescencia temprana"], "e": "Ambos rasgos figuran en la diapositiva «A mitad de la adolescencia», junto con las inquietudes filosóficas y futuristas, el código ético propio y la planificación.", "f": "D"}, {"id": "t2-032", "t": "t2", "lv": 1, "q": "¿Cuál era la posición de Vygotsky sobre la relación entre desarrollo y aprendizaje?", "o": ["El aprendizaje estimula el desarrollo; el desarrollo psicológico es resultado del aprendizaje", "El desarrollo es condición previa del aprendizaje: solo se aprende lo que la maduración permite", "Desarrollo y aprendizaje son procesos independientes que avanzan por caminos separados"], "e": "Vygotsky no compartía la idea de que el desarrollo fuera condición previa del aprendizaje. Defendía que «el aprendizaje estimula el proceso de desarrollo» y que el desarrollo psicológico es resultado del aprendizaje.", "f": "D"}, {"id": "t2-033", "t": "t2", "lv": 1, "q": "¿En qué se diferencia principalmente el planteamiento de Vygotsky del de Piaget según la asignatura?", "o": ["Vygotsky vincula el desarrollo con el aprendizaje y la cultura, a través de la interacción social y las herramientas culturales", "Vygotsky defiende que el desarrollo depende sobre todo de la maduración biológica y no de la cultura", "Vygotsky sostiene que el desarrollo es individual y que la interacción social solo lo acelera"], "e": "Vygotsky propuso una aproximación diferente al vincular el desarrollo cognitivo con el aprendizaje y la cultura: depende de las interacciones con los demás y de las herramientas que la cultura ofrece para apoyar el pensamiento.", "f": "D"}, {"id": "t2-034", "t": "t2", "lv": 1, "q": "Según Vygotsky, ¿en qué orden se desarrollan las funciones psicológicas superiores?", "o": ["Primero en el plano social (interpsicológico) y después en el individual", "Primero en el plano individual y después en el social", "Simultáneamente en ambos planos, sin relación entre ellos"], "e": "Los procesos mentales se construyen primero mediante la cooperación en actividades compartidas y después se interiorizan. El desarrollo de las funciones psicológicas superiores se da primero en el plano social y después en el individual.", "f": "D"}, {"id": "t2-035", "t": "t2", "lv": 1, "q": "Para Vygotsky, la interiorización consiste en:", "o": ["Transformar fenómenos sociales en fenómenos psicológicos", "Reprimir los impulsos y adaptarlos a las normas sociales", "Adaptar los esquemas previos a un nuevo estímulo"], "e": "Los procesos construidos en la interacción social se interiorizan: es la transformación de fenómenos sociales en fenómenos psicológicos.", "f": "D"}, {"id": "t2-036", "t": "t2", "lv": 1, "q": "¿Qué doble función atribuye Vygotsky al lenguaje?", "o": ["Vehículo social para comunicarse y herramienta de pensamiento para organizarlo", "Herramienta de memorización y medio de expresión de emociones", "Mecanismo de imitación y de condicionamiento del habla"], "e": "El desarrollo se produce al interiorizar instrumentos culturales, entre ellos el lenguaje, que tiene doble función: vehículo social (comunicarse) y herramienta de pensamiento (organizar el pensamiento).", "f": "D"}, {"id": "t2-037", "t": "t2", "lv": 1, "q": "El habla privada, según Vygotsky, es:", "o": ["Hablarse a uno mismo para dirigir el pensamiento y la acción, sobre todo ante tareas difíciles", "Un síntoma de inmadurez que debe corregirse en el aula porque interfiere con el trabajo del grupo", "La comunicación confidencial entre iguales que facilita el aprendizaje colaborativo"], "e": "Vygotsky destacó el habla privada como forma de dirigir el pensamiento y los actos. Cumple una función de autodirección cuando se necesita mayor esfuerzo cognitivo (por ejemplo, ante dificultades o confusión).", "f": "D"}, {"id": "t2-038", "t": "t2", "lv": 1, "q": "Durante un examen de Matemáticas, un alumno murmura los pasos del problema mientras lo resuelve. Desde Vygotsky, el docente debería:", "o": ["Permitirlo, porque la autoinstrucción cognitiva ayuda a autorregularse en tareas difíciles", "Prohibirlo, porque indica que el alumno no ha interiorizado el procedimiento", "Ignorarlo, porque el habla privada no tiene función cognitiva"], "e": "La autoinstrucción cognitiva consiste en permitir que el alumnado hable mientras resuelve problemas difíciles, ya que el habla privada cumple una función de autodirección.", "f": "D"}, {"id": "t2-039", "t": "t2", "lv": 1, "q": "El Nivel de Desarrollo Real (NDR) es:", "o": ["Lo que el alumno sabe, conoce y domina: lo que resuelve de forma independiente", "Lo que el alumno puede hacer con la ayuda de otra persona", "La distancia entre lo que sabe y lo que puede llegar a saber"], "e": "El NDR es lo que el alumno sabe, conoce y domina, es decir, su capacidad de resolver un problema de forma independiente.", "f": "D"}, {"id": "t2-040", "t": "t2", "lv": 1, "q": "La Zona de Desarrollo Próximo (ZDP) se define como:", "o": ["La distancia entre el Nivel de Desarrollo Real y el Nivel de Desarrollo Potencial", "Las tareas que el alumno ya domina y resuelve sin ayuda", "Las tareas que el alumno no podrá resolver ni siquiera con ayuda"], "e": "La ZDP es la distancia entre el NDR (lo que resuelve solo) y el NDP (lo que puede resolver con la guía de un adulto o un compañero más capaz). Representa lo que el alumno está próximo a lograr.", "f": "D"}, {"id": "t2-041", "t": "t2", "lv": 1, "q": "Una alumna no sabe plantear sola un comentario de texto, pero lo consigue cuando la profesora le da un guion con preguntas. Ese comentario se encuentra:", "o": ["En su Zona de Desarrollo Próximo", "En su Nivel de Desarrollo Real", "Fuera de su desarrollo potencial"], "e": "Lo que el alumno puede hacer con ayuda de otra persona, pero no solo, está en la ZDP: es lo que «está próximo a lograr». Allí debe situarse la ayuda docente.", "f": "D"}, {"id": "t2-042", "t": "t2", "lv": 1, "q": "¿Cuál de las siguientes NO es una de las tres formas de transmisión descritas por Vygotsky?", "o": ["Aprendizaje por condicionamiento", "Aprendizaje imitativo", "Aprendizaje colaborativo entre iguales"], "e": "Las tres formas de transmisión son: aprendizaje imitativo (imitar a otro), aprendizaje asistido (internalizar las instrucciones del maestro para autorregularse) y aprendizaje colaborativo (un grupo de compañeros se esfuerza por comprenderse y en el proceso aprende).", "f": "D"}, {"id": "t2-043", "t": "t2", "lv": 1, "q": "En el aprendizaje asistido, según Vygotsky, quienes aprenden:", "o": ["Internalizan las instrucciones del maestro y las utilizan para autorregularse", "Imitan la conducta de un modelo sin necesidad de comprender por qué la realizan", "Aprenden en grupo mientras se esfuerzan por comprenderse entre compañeros"], "e": "El aprendizaje asistido es aquel por el que quienes aprenden internalizan las instrucciones del maestro y las utilizan para autorregularse.", "f": "D"}, {"id": "t2-044", "t": "t2", "lv": 1, "q": "¿Cuál es el objetivo último del aprendizaje mediado o asistido?", "o": ["Que el alumno llegue a hacer las tareas por sí mismo", "Que el profesor resuelva las tareas como modelo permanente", "Que el alumno memorice las instrucciones literalmente"], "e": "El aprendizaje mediado o asistido pretende conseguir que el alumno haga las tareas por sí mismo. Para ello el profesor adapta tareas y materiales al nivel del alumnado y da las ayudas necesarias en el momento preciso, en la ZDP.", "f": "D"}, {"id": "t2-045", "t": "t2", "lv": 1, "q": "El andamiaje se define como:", "o": ["El conjunto de apoyos y ayudas que el profesor proporciona para que el alumno resuelva el problema o complete la tarea", "La organización del currículo en etapas que el profesor sigue para secuenciar los contenidos", "La secuencia de estadios del desarrollo cognitivo que delimita lo que el alumno puede aprender"], "e": "El andamiaje es el conjunto de apoyos y ayudas (indicios, pistas, recordatorios, división de la tarea en pasos, demostraciones, explicaciones…) que proporciona el profesor para que el alumno complete la tarea.", "f": "D"}, {"id": "t2-046", "t": "t2", "lv": 1, "q": "¿Cuál de los siguientes recursos NO es un ejemplo de andamiaje según las diapositivas?", "o": ["Resolver la tarea por el alumno para ahorrar tiempo", "Hacer demostraciones y explicaciones del procedimiento", "Dar pistas, indicios y recordatorios en el momento preciso"], "e": "Los ejemplos de andamiaje son indicios, pistas, recordatorios, división de la tarea en pasos, demostraciones y explicaciones. Resolver la tarea por el alumno anula el objetivo de que la haga por sí mismo.", "f": "D"}, {"id": "t2-047", "t": "t2", "lv": 1, "q": "¿Cuál es el orden correcto de las fases del aprendizaje mediado o asistido?", "o": ["Fase directiva → traspaso progresivo → finalización del traspaso", "Traspaso progresivo → fase directiva → finalización del traspaso", "Finalización del traspaso → fase directiva → traspaso progresivo"], "e": "Primero la fase directiva (el profesor conoce el nivel inicial, presenta la tarea y da las ayudas), después el traspaso progresivo (el alumno practica y el profesor retira gradualmente las ayudas con retroalimentación) y por último la finalización del traspaso (el alumno realiza la tarea de forma independiente).", "f": "D"}, {"id": "t2-048", "t": "t2", "lv": 1, "q": "En la fase directiva del aprendizaje asistido, el profesor:", "o": ["Conoce el nivel inicial del alumno para adaptar el contenido a su ZDP, presenta la tarea y da instrucciones y ayudas", "Retira la supervisión y deja que el alumno realice todos los pasos de la tarea por sí mismo", "Supervisa la práctica del alumno y retira gradualmente las ayudas mientras le da retroalimentación"], "e": "En la fase directiva el profesor evalúa el nivel inicial para ajustar el contenido a la ZDP y comienza presentando la tarea, dando instrucciones y ayudas (andamios).", "f": "D"}, {"id": "t2-049", "t": "t2", "lv": 1, "q": "Una profesora de Economía ha explicado cómo elaborar un presupuesto. Ahora los alumnos lo hacen en clase mientras ella revisa, comenta cómo lo están haciendo y les da cada vez menos indicaciones. ¿En qué fase se encuentra?", "o": ["Traspaso progresivo", "Fase directiva", "Finalización del traspaso"], "e": "En el traspaso progresivo el alumno practica y el profesor supervisa, retirando poco a poco las ayudas e informando de cómo lo están haciendo (retroalimentación).", "f": "D"}, {"id": "t2-050", "t": "t2", "lv": 1, "q": "¿Qué ocurre en la fase de finalización del traspaso?", "o": ["El profesor retira la supervisión y el alumno realiza todos los pasos de la tarea de forma independiente", "El profesor evalúa el nivel inicial del alumno para ajustar la tarea a su zona de desarrollo próximo", "El profesor supervisa la práctica y va retirando las ayudas de forma gradual"], "e": "En la finalización del traspaso el profesor retira la supervisión y el alumno consigue realizar todos los pasos de forma independiente.", "f": "D"}, {"id": "t2-051", "t": "t2", "lv": 1, "q": "Desde Vygotsky, ¿cuándo deben darse las ayudas docentes para que sean eficaces?", "o": ["En el momento preciso y dentro de la Zona de Desarrollo Próximo", "Únicamente cuando el alumno ha fracasado varias veces", "Antes de conocer el nivel del alumno, para anticipar errores"], "e": "El profesor debe adaptar las tareas al nivel del alumnado y dar las ayudas necesarias en el momento preciso, en la zona de desarrollo próximo.", "f": "D"}, {"id": "t2-052", "t": "t2", "lv": 1, "q": "Una actividad propuesta en clase consiste en pensar cómo fomentar el uso de las operaciones formales desde la propia asignatura. ¿Cuál de estas estrategias es coherente con ese objetivo?", "o": ["Plantear debates y problemas del tipo «¿qué ocurriría si…?» que exijan formular hipótesis", "Limitar las tareas a la memorización precisa de definiciones y fechas", "Trabajar solo con ejemplos concretos y manipulativos para evitar abstracciones"], "e": "Los apuntes de clase proponen debates y ponerse en el lugar del otro para cambiar de perspectiva. Las operaciones formales se fomentan con tareas que exigen razonamiento hipotético-deductivo y abstracción.", "f": "A"}, {"id": "t2-053", "t": "t2", "lv": 1, "q": "Según los apuntes de clase, ¿qué ocurre con la poda sináptica en la pubertad?", "o": ["El cerebro elimina conexiones que no se han utilizado o no resultan útiles, lo que cambia la manera de pensar", "Se multiplican las conexiones neuronales para aumentar la capacidad de memoria a largo plazo", "Se detiene el desarrollo cerebral hasta la edad adulta, cuando madura el lóbulo prefrontal"], "e": "Los apuntes de clase recogen que se produce una poda sináptica (en torno al 30 %): el cerebro elimina lo aprendido que no ha resultado útil o no se ha puesto en práctica, lo que cambia la forma de pensar.", "f": "A"}, {"id": "t2-054", "t": "t2", "lv": 1, "q": "Según los apuntes de clase, ¿por qué los adolescentes muestran una fuerte búsqueda de placer?", "o": ["Porque disminuye la dopamina pero siguen teniendo muchos receptores, por lo que el cerebro percibe que le falta", "Porque aumenta la dopamina por encima de los niveles adultos y el cerebro la busca constantemente", "Porque el lóbulo prefrontal ya está plenamente maduro y prioriza la recompensa inmediata"], "e": "Los apuntes explican que en la pubertad la dopamina baja, pero se mantienen muchos receptores, por lo que el cerebro siente que no tiene suficiente y aparece la necesidad de sentir placer.", "f": "A"}, {"id": "t2-055", "t": "t2", "lv": 1, "q": "Los apuntes de clase relacionan la mayor sensibilidad emocional adolescente con:", "o": ["El sistema límbico en desarrollo y un lóbulo prefrontal aún inmaduro (toma de decisiones, lógica, razonamiento)", "Un lóbulo prefrontal ya maduro que inhibe al sistema límbico, todavía inactivo en esta etapa", "La finalización del desarrollo cerebral a los 12 años, que deja paso a los cambios hormonales"], "e": "Según los apuntes, el sistema límbico termina de desarrollarse y se suma a los cambios hormonales, mientras el lóbulo prefrontal (toma de decisiones, lógica, razonamiento) aún no ha terminado de desarrollarse.", "f": "A"}, {"id": "t2-056", "t": "t2", "lv": 1, "q": "¿Qué diferencia esencial hay entre el pensamiento de operaciones concretas y el de operaciones formales en relación con lo posible?", "o": ["En las concretas el razonamiento se apoya en lo real y en la experiencia; en las formales se razona sobre lo posible mediante hipótesis", "En las concretas se razona sobre hipótesis y en las formales solo sobre objetos y experiencias presentes", "No hay diferencia: amb
