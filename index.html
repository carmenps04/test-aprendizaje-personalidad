as se apoyan en la manipulación de objetos, solo cambia la velocidad"], "e": "El pensamiento previo es empírico-inductivo (conclusiones a partir de la experiencia). El pensamiento formal permite pensar abstractamente y razonar de forma hipotético-deductiva, considerando posibilidades además de realidades.", "f": "D"}, {"id": "t2-057", "t": "t2", "lv": 1, "q": "¿Qué rasgos de pensamiento recogen las diapositivas como adquiridos antes de la adolescencia (operaciones concretas)?", "o": ["Manejar dos dimensiones, pensamiento reversible, adoptar otros puntos de vista y distinguir apariencia y realidad", "Razonamiento hipotético-deductivo, metacognición plena, pensamiento idealista y código ético propio", "Permanencia del objeto, paso de los reflejos a las acciones intencionales y primeras palabras"], "e": "La diapositiva enumera: manejar dos dimensiones simultáneamente, pensamiento reversible, adoptar otros puntos de vista, captar la causalidad física, distinguir apariencia y realidad, clasificar objetos y pensamiento empírico-inductivo.", "f": "D"}, {"id": "t2-058", "t": "t2", "lv": 1, "q": "Según los apuntes en PDF, ¿con qué autor se asocia el concepto de andamiaje?", "o": ["Jerome Bruner", "Jean Piaget", "Lawrence Kohlberg"], "e": "Los apuntes en PDF asocian el término andamiaje a Jerome Bruner, para quien el profesor guía y apoya al alumnado para que desarrolle destrezas y explore lo aprendido. Las diapositivas lo presentan dentro del enfoque de Vygotsky (ZDP). Este dato solo aparece en los apuntes.", "f": "A"}, {"id": "t2-a001", "t": "t2", "lv": 2, "q": "Un alumno de 1.º de ESO resuelve bien problemas de proporciones con objetos de la clase, pero se bloquea cuando el profesor le pide razonar sobre «una variable x cualquiera». Según Piaget, ¿qué explica mejor esta dificultad?", "o": ["Sigue apoyándose en lo concreto: aún no maneja con soltura las operaciones formales", "Aún no ha adquirido la conservación de la cantidad, propia del estadio preoperacional", "Presenta egocentrismo preoperacional y no puede adoptar el punto de vista del profesor"], "e": "Operar con objetos reales es propio de las operaciones concretas, que tienen dificultad para operar con abstracciones. Razonar sobre una variable abstracta exige pensamiento formal. Las diapositivas recuerdan que cada alumno progresa a su propio ritmo hacia el pensamiento formal.", "f": "D"}, {"id": "t2-a002", "t": "t2", "lv": 2, "q": "Ante la pregunta «¿Qué pasaría con los precios si todos los ciudadanos tuvieran el doble de dinero?», una alumna de 4.º de ESO plantea varias hipótesis y deduce sus consecuencias. ¿Qué capacidad manifiesta?", "o": ["Pensamiento hipotético-deductivo, propio de las operaciones formales", "Pensamiento empírico-inductivo, propio de las operaciones concretas", "Reversibilidad y compensación, propias de las operaciones concretas"], "e": "Razonar sobre lo posible formulando hipótesis y deduciendo consecuencias define las operaciones formales. El pensamiento empírico-inductivo saca conclusiones a partir de la experiencia, que es lo característico del estadio anterior.", "f": "D"}, {"id": "t2-a003", "t": "t2", "lv": 2, "q": "Un niño sabe que 7 + 5 = 12 y comprende sin dudar que 12 − 5 = 7. ¿Qué operación de las operaciones concretas pone de manifiesto?", "o": ["Reversibilidad: volver mentalmente al estado inicial", "Clasificación: agrupar según varios criterios", "Permanencia del objeto: saber que algo existe sin verlo"], "e": "La reversibilidad es la posibilidad de volver al estado inicial de una transformación. Los apuntes la ilustran con el trasvase de líquidos y, junto con la compensación, con la suma y la resta.", "f": "A"}, {"id": "t2-a004", "t": "t2", "lv": 2, "q": "¿Qué tienen en común el error del niño que cree que hay más agua en el vaso alto y el del niño que no entiende que su abuela es la madre de su madre?", "o": ["Ambos se centran en una sola dimensión o relación, rasgo del pensamiento preoperacional", "Ambos carecen de permanencia del objeto, propia del estadio sensoriomotor", "Ambos reflejan la intolerancia hacia otros puntos de vista del final de la adolescencia"], "e": "Los apuntes de clase describen la unidimensionalidad y el centrismo del pensamiento prelógico: respuestas basadas en una sola dimensión, como en el experimento de los líquidos o en el ejemplo de la abuela y mamá.", "f": "A"}, {"id": "t2-a005", "t": "t2", "lv": 2, "q": "Según Piaget (1947), un bebé que golpea un sonajero repetidamente y descubre que suena está desarrollándose sobre todo por el factor:", "o": ["Actividad: actuar sobre el ambiente y aprender de él", "Experiencias sociales: aprender de la transmisión de los demás", "Equilibrio: reorganizar esquemas para incorporar algo nuevo"], "e": "La actividad es la capacidad creciente del niño para actuar sobre el ambiente y aprender de él. Las experiencias sociales se refieren a la interacción con los demás, y el equilibrio a modificar esquemas previos.", "f": "D"}, {"id": "t2-a006", "t": "t2", "lv": 2, "q": "Una alumna creía que todos los metales son atraídos por un imán. Al comprobar que el aluminio no lo es, revisa su idea y concluye que solo algunos metales son magnéticos. Según Piaget, ¿qué proceso ha tenido lugar?", "o": ["Acomodación, dentro del factor equilibrio", "Asimilación, dentro del factor maduración", "Interiorización, dentro de la zona de desarrollo próximo"], "e": "Modificar un esquema existente para ajustarse a una experiencia que no encaja es acomodación. Forma parte del equilibrio, que consiste en modificar los esquemas anteriores para incorporar conocimientos nuevos. La interiorización es un concepto de Vygotsky.", "f": "A"}, {"id": "t2-a007", "t": "t2", "lv": 2, "q": "¿Cuál de estas situaciones ilustra la asimilación según la definición de los apuntes de clase?", "o": ["Un niño que conoce los perros llama «perro» al primer gato que ve", "Un niño que, tras ver un gato, crea una categoría nueva para él", "Un niño que imita a su hermano para aprender a atarse los cordones"], "e": "La asimilación consiste en encajar lo nuevo en las estructuras cognitivas actuales (el gato entra en el esquema de perro). Crear una categoría nueva sería acomodación. La imitación corresponde al aprendizaje imitativo de Vygotsky.", "f": "A"}, {"id": "t2-a008", "t": "t2", "lv": 2, "q": "Un alumno de 13 años escribe un excelente comentario sobre el razonamiento lógico de un texto filosófico, pero ante una discusión con su madre reacciona sin considerar alternativas. ¿Qué dos ideas de la diapositiva de Piaget explican el caso?", "o": ["La lógica formal puede aplicarse antes a tareas escolares que a problemas personales, y las emociones pueden interferir", "El pensamiento formal se adquiere a la vez en todos los ámbitos y no depende de las emociones", "La lógica formal solo se aplica a la vida personal, nunca a los contenidos escolares"], "e": "La diapositiva indica que algunos niños usan operaciones lógicas en las tareas escolares mucho antes de poder usarlas en sus problemas personales, y que los problemas emocionales pueden interferir con la capacidad de pensar de maneras complejas.", "f": "D"}, {"id": "t2-a009", "t": "t2", "lv": 2, "q": "Una alumna de 14 años empieza a cuestionar por qué tiene que volver a casa a las diez y a opinar sobre qué deportes y apariencia le gustan. Otra de 18 se preocupa por la justicia social y debate con vehemencia. ¿En qué momento del pensamiento adolescente sitúa la asignatura a cada una?", "o": ["La primera en la adolescencia temprana y la segunda al final de la adolescencia", "La primera a mitad de la adolescencia y la segunda en la adolescencia temprana", "Ambas a mitad de la adolescencia, cuando aparece el código ético propio"], "e": "Cuestionar normas y autoridad y formar opiniones sobre gustos y reglas es propio de la adolescencia temprana. Pensar en conceptos globales como la justicia, con idealismo y posible intolerancia, es propio del final de la adolescencia.", "f": "D"}, {"id": "t2-a010", "t": "t2", "lv": 2, "q": "¿Qué pregunta caracteriza, según las diapositivas, el pensamiento a mitad de la adolescencia y la conecta con el tema 3?", "o": ["«¿Quién soy yo?», que enlaza el pensamiento con la identidad y el autoconcepto", "«¿Qué me darán si lo hago?», propia de la moral preconvencional y del refuerzo", "«¿Qué dirán los demás de mí?», propia de la identidad prematura y del grupo"], "e": "A mitad de la adolescencia el adolescente piensa en las posibilidades y empieza a desarrollar su identidad («¿quién soy yo?»), su código ético y sus metas. El tema 3 explica que responder a «¿quién soy yo?» obliga a desarrollar un autoconcepto.", "f": "D"}, {"id": "t2-a011", "t": "t2", "lv": 2, "q": "Un profesor de Historia pregunta: «¿Qué habría pasado si la Revolución Industrial hubiera empezado en España?». Desde el tema 2, ¿qué pretende fomentar?", "o": ["El uso de las operaciones formales, al obligar a razonar sobre hipótesis", "La conservación de la cantidad, propia de las operaciones concretas", "El habla privada, propia de la autoinstrucción cognitiva"], "e": "La actividad de clase del tema pedía pensar cómo fomentar las operaciones formales desde cada asignatura. Las preguntas contrafácticas («¿qué habría pasado si…?») exigen razonamiento hipotético-deductivo.", "f": "D"}, {"id": "t2-a012", "t": "t2", "lv": 2, "q": "¿Qué diferencia fundamental establece la asignatura entre Piaget y Vygotsky respecto a la relación entre aprendizaje y desarrollo?", "o": ["Para Vygotsky el aprendizaje estimula el desarrollo; Piaget entendía el desarrollo como condición previa", "Para Piaget el aprendizaje estimula el desarrollo; Vygotsky lo entendía como condición previa", "Ambos defendían que aprendizaje y desarrollo son procesos independientes"], "e": "Las diapositivas indican que Vygotsky no compartía la idea de que el desarrollo fuera condición previa del aprendizaje y defendía que «el aprendizaje estimula el proceso de desarrollo».", "f": "D"}, {"id": "t2-a013", "t": "t2", "lv": 2, "q": "Piaget también incluye las «experiencias sociales» entre sus factores del desarrollo. ¿Qué distingue entonces la posición de Vygotsky?", "o": ["Que para Vygotsky la interacción social y la cultura son el origen de las funciones psicológicas superiores", "Que Vygotsky niega cualquier papel a la maduración y a la actividad", "Que Vygotsky considera la interacción social un simple acelerador del desarrollo individual"], "e": "Para Piaget la transmisión social es uno de cuatro factores. Para Vygotsky el desarrollo de las funciones psicológicas superiores se da primero en el plano social y después se interioriza: lo social es su origen.", "f": "D"}, {"id": "t2-a014", "t": "t2", "lv": 2, "q": "En una clase de Física, dos alumnos resuelven juntos un problema discutiendo en voz alta; días después, uno de ellos lo resuelve solo repitiéndose mentalmente los pasos que acordaron. Según Vygotsky, ¿qué proceso se ha producido?", "o": ["Interiorización de un proceso construido primero en el plano social", "Acomodación de un esquema por conflicto cognitivo individual", "Condicionamiento operante por el refuerzo del compañero"], "e": "Los procesos mentales se construyen primero en la cooperación con otros y después se interiorizan: los fenómenos sociales se transforman en fenómenos psicológicos. El lenguaje actúa como vehículo social y herramienta de pensamiento.", "f": "D"}, {"id": "t2-a015", "t": "t2", "lv": 2, "q": "¿Qué doble función del lenguaje se observa cuando una alumna explica a su compañera un problema y, más tarde, usa esas mismas frases para guiarse sola?", "o": ["Primero vehículo social de comunicación y después herramienta para organizar su pensamiento", "Primero herramienta de memorización y después medio de expresión emocional", "Primero mecanismo de imitación y después recompensa social"], "e": "Para Vygotsky el lenguaje tiene una doble función: vehículo social para comunicarse y herramienta de pensamiento para organizarlo.", "f": "D"}, {"id": "t2-a016", "t": "t2", "lv": 2, "q": "Un profesor regaña a un alumno de 2.º de ESO porque «murmura en voz baja» mientras resuelve ecuaciones difíciles. Desde Vygotsky, ¿qué error comete?", "o": ["Impedir el habla privada, que cumple una función de autodirección cuando la tarea exige más esfuerzo", "Permitir una conducta que demuestra que el alumno no ha alcanzado el pensamiento formal", "Ignorar que el habla privada solo es útil en Educación Infantil"], "e": "El habla privada cumple una función de autodirección en las situaciones que exigen mayor esfuerzo cognitivo. La autoinstrucción cognitiva consiste precisamente en permitir que el alumnado hable mientras resuelve problemas difíciles.", "f": "D"}, {"id": "t2-a017", "t": "t2", "lv": 2, "q": "Una alumna resuelve sola las ecuaciones de primer grado, resuelve las de segundo grado si el profesor le da pistas y no consigue resolver los sistemas no lineales ni con ayuda. ¿Dónde se sitúa cada contenido?", "o": ["Primer grado: NDR; segundo grado: ZDP; sistemas no lineales: fuera de la ZDP por ahora", "Primer grado: ZDP; segundo grado: NDR; sistemas no lineales: NDP inmediato", "Primer grado: NDP; segundo grado: NDR; sistemas no lineales: dentro de su ZDP"], "e": "El NDR es lo que resuelve sola. La ZDP es lo que consigue con ayuda: la distancia entre el NDR y el NDP. Lo que no logra ni con ayuda queda, de momento, más allá de su desarrollo potencial y no es el objetivo inmediato de la ayuda docente.", "f": "D"}, {"id": "t2-a018", "t": "t2", "lv": 2, "q": "¿En qué zona debe situar el profesor las tareas para que el andamiaje sea eficaz, según Vygotsky?", "o": ["En la ZDP: tareas que el alumno no resuelve solo, pero sí con ayuda", "En el NDR: tareas que el alumno ya resuelve solo, para asegurar el éxito", "Más allá del NDP: tareas muy difíciles, para maximizar el esfuerzo"], "e": "El profesor adapta las tareas al nivel del alumnado y da las ayudas necesarias en el momento preciso, en la zona de desarrollo próximo. Por debajo no hay aprendizaje nuevo; por encima la ayuda no basta.", "f": "D"}, {"id": "t2-a019", "t": "t2", "lv": 2, "q": "Una profesora explica cómo hacer un comentario de texto, hace uno delante de la clase y entrega un guion de preguntas. Después los alumnos los hacen con el guion mientras ella revisa y comenta, y al final los hacen solos en el examen. ¿Qué secuencia sigue?", "o": ["Fase directiva, traspaso progresivo y finalización del traspaso", "Traspaso progresivo, fase directiva y finalización del traspaso", "Finalización del traspaso, fase directiva y traspaso progresivo"], "e": "Primero se presenta la tarea con instrucciones y andamios (fase directiva), después se practica con supervisión y retirada gradual de ayudas con retroalimentación (traspaso progresivo) y finalmente el alumno la realiza de forma independiente (finalización del traspaso).", "f": "D"}, {"id": "t2-a020", "t": "t2", "lv": 2, "q": "Un profesor da a sus alumnos las mismas pistas detalladas durante todo el curso, incluso cuando ya resuelven solos los problemas. ¿Qué principio del aprendizaje asistido incumple?", "o": ["La retirada gradual de las ayudas durante el traspaso progresivo", "La adaptación inicial de la tarea a la ZDP en la fase directiva", "El uso de demostraciones como forma de andamiaje"], "e": "En el traspaso progresivo el profesor va retirando las ayudas de forma gradual mientras informa al alumno de cómo lo hace. Si los andamios nunca se retiran, no se llega a la finalización del traspaso (autonomía).", "f": "D"}, {"id": "t2-a021", "t": "t2", "lv": 2, "q": "¿Qué diferencia hay entre el aprendizaje asistido y el aprendizaje colaborativo en las tres formas de transmisión de Vygotsky?", "o": ["En el asistido el aprendiz internaliza las instrucciones del maestro; en el colaborativo, aprenden juntos al comprenderse", "En el asistido aprenden varios compañeros a la vez; en el colaborativo el aprendiz imita a un modelo experto", "En el asistido el aprendiz imita a otro; en el colaborativo recibe premios del maestro por cooperar"], "e": "Aprendizaje imitativo: imitar a otro. Asistido: internalizar las instrucciones del maestro para autorregularse. Colaborativo: un grupo de compañeros se esfuerza por comprenderse y en el proceso aprende.", "f": "D"}, {"id": "t2-a022", "t": "t2", "lv": 2, "q": "¿Por qué el andamiaje de Vygotsky es incompatible con «hacerle la tarea al alumno para que no se frustre»?", "o": ["Porque el objetivo del aprendizaje asistido es que el alumno llegue a hacer la tarea por sí mismo", "Porque el andamiaje solo admite demostraciones del profesor, nunca pistas ni ayudas parciales", "Porque en la ZDP el alumno debe trabajar siempre sin ninguna ayuda para que el aprendizaje sea real"], "e": "El aprendizaje mediado pretende que el alumno haga las tareas por sí mismo. El andamiaje son apoyos (pistas, recordatorios, división en pasos, demostraciones) que se retiran progresivamente, no la sustitución del alumno.", "f": "D"}, {"id": "t2-a023", "t": "t2", "lv": 2, "q": "¿Qué rasgo de la metacognición resulta especialmente útil para el docente de Secundaria, según el tema 2?", "o": ["Que su aumento favorece la reflexión sobre los propios procesos mentales al resolver tareas", "Que permite memorizar más contenido en menos tiempo antes de los exámenes", "Que sustituye a la atención selectiva, que deja de ser necesaria en la adolescencia"], "e": "La diapositiva define la metacognición como la capacidad de pensar en los procesos mentales usados para resolver un problema o una tarea, y señala que va aumentando y favorece la reflexión.", "f": "D"}, {"id": "t2-a024", "t": "t2", "lv": 2, "q": "Integrando el tema 2 con los apuntes de clase, ¿por qué un adolescente con buena capacidad de razonamiento puede tomar decisiones arriesgadas?", "o": ["Porque el prefrontal aún no ha madurado y la búsqueda de placer es intensa, aunque ya razone formalmente", "Porque el pensamiento formal impide valorar las consecuencias de las propias decisiones personales", "Porque la poda sináptica elimina en esta etapa la capacidad de razonamiento abstracto adquirida"], "e": "Los apuntes de clase explican que el lóbulo prefrontal (toma de decisiones, razonamiento) no ha terminado de madurar y que la dopamina baja con muchos receptores, lo que impulsa a buscar placer. La diapositiva añade que considerar posibilidades puede afectar a la toma de decisiones para bien o para mal.", "f": "A"}, {"id": "t2-a025", "t": "t2", "lv": 2, "q": "Según los apuntes de clase, ¿qué implicación educativa tiene la poda sináptica de la pubertad?", "o": ["Lo que no se usa tiende a eliminarse, por lo que conviene que los aprendizajes se practiquen y apliquen", "El cerebro deja de aprender hasta la edad adulta, así que no conviene introducir contenidos nuevos", "Se multiplican las conexiones, por lo que cualquier contenido se retiene sin necesidad de práctica"], "e": "Los apuntes explican que el cerebro realiza una poda de lo aprendido que no ha resultado útil o no se ha puesto en práctica, lo que cambia la manera de pensar. Se deduce la importancia de usar y aplicar lo aprendido.", "f": "A"}, {"id": "t2-a026", "t": "t2", "lv": 2, "q": "¿Qué rasgo de la etapa sensoriomotora y qué rasgo de la preoperacional se corresponden con la comprensión infantil de la muerte descrita en la guía de emergencias?", "o": ["Hasta los 2 años no hay concepto de muerte; entre 2 y 7 se concibe como reversible, sin reversibilidad lógica", "Hasta los 2 años la muerte se entiende como irreversible; entre 2 y 7 como universal", "Hasta los 7 años la muerte se comprende igual que en la edad adulta"], "e": "La guía de emergencias indica que hasta los 2 años no hay concepto de muerte, entre los 2 y los 7 años se concibe como reversible y entre los 7 y los 12 como permanente. Coincide con la ausencia de reversibilidad lógica en la etapa preoperacional.", "f": "G"}, {"id": "t2-a027", "t": "t2", "lv": 2, "q": "¿Qué conjunto de logros aparece en la diapositiva como propio del pensamiento previo a la adolescencia y NO del pensamiento formal?", "o": ["Manejar dos dimensiones, pensamiento reversible y conclusiones a partir de la propia experiencia", "Razonamiento hipotético-deductivo, idealismo y construcción de un código ético propio", "Inquietudes filosóficas, planificación a largo plazo y pensamiento sobre conceptos globales"], "e": "La diapositiva atribuye al pensamiento previo (operaciones concretas): manejar dos dimensiones, pensamiento reversible, adoptar otros puntos de vista, captar la causalidad física, distinguir apariencia y realidad, clasificar y razonar de forma empírico-inductiva.", "f": "D"}, {"id": "t2-a028", "t": "t2", "lv": 2, "q": "En una clase de 3.º de ESO, una alumna ya razona con hipótesis y otra todavía necesita ejemplos concretos para entender el mismo concepto. ¿Qué conclusión de la diapositiva de Piaget justifica adaptar la enseñanza?", "o": ["Cada alumno progresa a su propio ritmo en la capacidad de pensar de forma compleja", "Todo el alumnado de una misma edad tiene el mismo nivel de pensamiento", "El pensamiento formal se alcanza a los 12 años sin excepción"], "e": "La diapositiva subraya que cada niño progresa a su propio ritmo respecto a la capacidad de pensar de maneras más complejas y que cada uno desarrolla su propia visión del mundo.", "f": "D"}, {"id": "t2-a029", "t": "t2", "lv": 2, "q": "¿Qué combinación de conceptos de Vygotsky corresponde mejor a un profesor que primero evalúa lo que sabe el alumno y luego le ofrece pistas solo en lo que todavía no domina?", "o": ["Identificar el NDR y actuar en la ZDP mediante andamiaje", "Identificar el NDP y actuar en el NDR mediante imitación", "Identificar la ZDP y actuar fuera de ella con habla privada"], "e": "La fase directiva exige conocer el nivel inicial (NDR) para adaptar el contenido a la ZDP; las pistas son andamiaje aplicado en la zona donde el alumno puede avanzar con ayuda.", "f": "D"}, {"id": "t2-a030", "t": "t2", "lv": 2, "q": "En la etapa preoperacional, ¿qué limitación afectiva describen los apuntes de clase?", "o": ["El egocentrismo: le cuesta ponerse en el lugar del otro y actúa según sus propias necesidades", "La intolerancia hacia puntos de vista opuestos, propia del idealismo del final de la adolescencia", "La identidad negativa, que le lleva a oponerse a las expectativas de sus padres"], "e": "Los apuntes describen, en el nivel afectivo de la etapa preoperacional, el egocentrismo: es difícil ponerse en el lugar del otro y el niño sigue actuando en función de sus propias necesidades.", "f": "A"}, {"id": "t2-a031", "t": "t2", "lv": 2, "q": "Un profesor afirma: «No tiene sentido enseñar estadística en 2.º de ESO porque todavía no han madurado lo suficiente». ¿Qué crítica le haría Vygotsky?", "o": ["Que el aprendizaje bien situado en la ZDP impulsa el desarrollo, en lugar de esperar a que este ocurra", "Que la maduración biológica es el único factor que determina lo que se puede aprender", "Que la estadística solo puede aprenderse por condicionamiento operante"], "e": "Vygotsky rechazaba que el desarrollo fuera condición previa del aprendizaje: «el aprendizaje estimula el proceso de desarrollo». Con ayuda ajustada a la ZDP el alumnado puede lograr lo que todavía no hace solo.", "f": "D"}, {"id": "t2-a032", "t": "t2", "lv": 2, "q": "¿Qué enunciado sobre la atención selectiva adolescente recogen las diapositivas?", "o": ["Mejora, lo que permite por ejemplo hacer tareas escolares mientras se escucha música", "Empeora por la poda sináptica, lo que impide concentrarse con estímulos de fondo", "Se mantiene igual que en la infancia, sin cambios relevantes"], "e": "Entre las características cognitivas de los adolescentes, la diapositiva indica que la atención selectiva mejora (ejemplo: tareas escolares y música).", "f": "D"}, {"id": "t2-a033", "t": "t2", "lv": 2, "q": "Un alumno de 5 años dice que el sol le sigue cuando camina porque quiere jugar con él. ¿Qué rasgo del pensamiento preoperacional ilustra y por qué no se da en las operaciones concretas?", "o": ["Egocentrismo; en las operaciones concretas se comprende mejor la perspectiva de los demás y la causalidad física", "Falta de permanencia del objeto; en las operaciones concretas aparece por primera vez", "Pensamiento hipotético; en las operaciones concretas desaparece la capacidad de imaginar"], "e": "El pensamiento preoperacional es egocéntrico. En las operaciones concretas los niños comprenden mejor las perspectivas ajenas, captan la causalidad física y distinguen apariencia y realidad.", "f": "D"}, {"id": "t2-a034", "t": "t2", "lv": 2, "q": "¿Qué relación hay entre la ZDP de Vygotsky y la recomendación del tema 7-8 de proponer tareas «ni demasiado difíciles ni demasiado fáciles»?", "o": ["Ambas sitúan el reto donde el alumno puede tener éxito con esfuerzo y, si hace falta, con ayuda", "La ZDP recomienda tareas que el alumno ya domina, al contrario que el tema 7-8", "No hay relación: una es cognitiva y la otra solo afecta a la motivación"], "e": "La ZDP sitúa las tareas en lo que el alumno puede hacer con ayuda; el tema 7-8 recomienda tareas ajustadas a sus posibilidades porque se evitan las que tienen alta probabilidad de fracaso. Ambas apuntan al desafío óptimo.", "f": "D"}, {"id": "t2-a035", "t": "t2", "lv": 2, "q": "Según los apuntes de clase, ¿por qué el pensamiento simbólico se desarrolla antes cuando el niño está en contacto con adultos que con iguales?", "o": ["Ambas sitúan el reto donde el alumno puede lograrlo con esfuerzo y, si hace falta, con ayuda", "La ZDP recomienda tareas que el alumno ya domina, justo al contrario que el tema 7-8", "No hay relación: la ZDP es un concepto cognitivo y el tema 7-8 solo trata la motivación"], "e": "Los apuntes señalan que el pensamiento simbólico se desarrolla antes en contacto con adultos que con iguales. Es coherente con Vygotsky: la interacción con personas más capaces impulsa el desarrollo.", "f": "A"}, {"id": "t2-a036", "t": "t2", "lv": 2, "q": "Un alumno de 16 años empieza a construir su propio código ético y a pensar sistemáticamente en sus metas futuras. Integrando los temas 2 y 4, ¿con qué nivel moral de Kohlberg es más coherente este pensamiento?", "o": ["Con el posconvencional, que implica principios personales y control interno", "Con el preconvencional, basado en evitar castigos", "Con el convencional temprano, basado en agradar a los padres"], "e": "A mitad de la adolescencia el pensamiento formal permite construir un código ético propio («¿qué me parece correcto?»). Kohlberg sitúa a partir de los 13 años la moral posconvencional, con decisión personal sobre lo correcto y consideración de la naturaleza relativa de los valores.", "f": "D"}, {"id": "t2-a037", "t": "t2", "lv": 2, "q": "¿Cuál de estas tareas de Economía sería, según el tema 2, más adecuada para trabajar dentro de la ZDP de un grupo de 4.º de ESO que domina el cálculo de porcentajes pero no la interpretación de gráficos de inflación?", "o": ["Interpretar un gráfico de inflación con una guía de preguntas que se va retirando", "Repetir ejercicios de porcentajes que ya resuelven sin errores", "Analizar sin ayuda un informe técnico del Banco Central Europeo"], "e": "La ZDP es la distancia entre lo que el alumno resuelve solo (porcentajes) y lo que puede resolver con ayuda (gráficos con guía). Repetir lo dominado queda en el NDR; un informe técnico sin ayuda queda fuera de su alcance actual.", "f": "D"}, {"id": "t3-001", "t": "t3", "lv": 1, "q": "¿Cómo define el tema 3 el autoconcepto?", "o": ["La descripción que hacemos de nosotros mismos en diferentes dominios a los que concedemos importancia (personal, académico, laboral…)", "La evaluación afectiva que hacemos de las características que incluimos en nuestra descripción personal", "La creencia en la propia capacidad para afrontar con recursos suficientes una tarea concreta"], "e": "El autoconcepto es la descripción de uno mismo en distintos dominios importantes. La evaluación afectiva de esas características es la autoestima, y la creencia en la propia capacidad ante una situación específica es la autoeficacia (tema 7-8).", "f": "D"}, {"id": "t3-002", "t": "t3", "lv": 1, "q": "¿Qué pregunta obliga, según el tema 3, a desarrollar un autoconcepto?", "o": ["¿Quién soy yo?", "¿Qué quiero conseguir?", "¿Cuánto valgo?"], "e": "La respuesta a «¿quién soy yo?» nos obliga a desarrollar un autoconcepto.", "f": "D"}, {"id": "t3-003", "t": "t3", "lv": 1, "q": "Un alumno afirma: «Soy malo en Matemáticas, pero muy bueno en baloncesto». Esta afirmación ilustra que:", "o": ["El autoconcepto es multidimensional: sus dominios difieren entre sí", "El alumno tiene baja autoestima global", "El alumno se encuentra en una difusión de identidad"], "e": "Las diapositivas ponen precisamente este tipo de ejemplo (malo para las matemáticas, competente en el deporte) para mostrar que los dominios del autoconcepto difieren.", "f": "D"}, {"id": "t3-004", "t": "t3", "lv": 1, "q": "¿Por qué resulta especialmente difícil para los adolescentes concretar su autoconcepto?", "o": ["Por los cambios que experimentan y por el gran número de aspectos que se ven forzados a incluir en él", "Porque todavía no han superado el pensamiento preoperacional y su visión de sí mismos es egocéntrica", "Porque el autoconcepto solo se forma en la edad adulta, cuando se alcanza el logro de la identidad"], "e": "La diapositiva señala dos motivos: los cambios que experimentan y el gran número de aspectos que se ven forzados a incluir en ese autoconcepto.", "f": "D"}, {"id": "t3-005", "t": "t3", "lv": 1, "q": "El adolescente busca responder a «¿quién soy?» a partir de los cambios en varias áreas del desarrollo. ¿Qué opción las recoge correctamente según el tema 3?", "o": ["Biológico y físico, cognitivo, afectivo-emocional, social y moral, con influencia de la familia, los iguales y la cultura", "Exclusivamente el desarrollo académico, con la influencia del profesorado como factor principal", "El desarrollo físico y el cognitivo, con la influencia de los medios de comunicación como factor principal"], "e": "La diapositiva enumera el desarrollo biológico y físico, cognitivo, afectivo-emocional, social y moral, e indica la influencia de la familia, los iguales y la cultura.", "f": "D"}, {"id": "t3-006", "t": "t3", "lv": 1, "q": "La autoestima, según Woolfolk (2010), es:", "o": ["La evaluación afectiva que hacemos de las características incluidas en nuestro autoconcepto", "La descripción objetiva de nuestras capacidades", "La sensación de tener recursos suficientes para una situación específica"], "e": "Las diapositivas citan a Woolfolk (2010): la autoestima es la evaluación afectiva de las características incluidas en nuestro autoconcepto, es decir, los aspectos valorativos y afectivos ligados a él.", "f": "D"}, {"id": "t3-007", "t": "t3", "lv": 1, "q": "¿Cuál es la diferencia fundamental entre autoconcepto y autoestima?", "o": ["El autoconcepto es descriptivo (cómo me veo); la autoestima es valorativa y afectiva (cómo me siento con lo que veo)", "La autoestima describe cómo me veo y el autoconcepto expresa cómo me siento con esa imagen", "Son sinónimos que la psicología usa indistintamente para referirse a la imagen de uno mismo"], "e": "El autoconcepto describe; la autoestima evalúa afectivamente esa descripción. Por eso la asignatura plantea expresamente si son lo mismo y responde que no.", "f": "D"}, {"id": "t3-008", "t": "t3", "lv": 1, "q": "Según Reeve (2010), recogido en el tema 3, la baja autoestima es:", "o": ["Más una consecuencia que una causa de otros problemas", "La causa principal de la mayoría de los problemas de conducta", "Independiente del desempeño de la persona"], "e": "La diapositiva indica que la baja autoestima es más la consecuencia que la causa de otros problemas (Reeve, 2010).", "f": "D"}, {"id": "t3-009", "t": "t3", "lv": 1, "q": "Un orientador propone un taller de frases positivas para «subir la autoestima» de un alumno con suspensos repetidos. Según el tema 3, ¿qué alternativa sería más adecuada?", "o": ["Ayudarle a mejorar su desempeño en las áreas que le importan, porque la autoestima depende de cómo nos desempeñamos en ellas", "Mantener el taller, porque el abordaje directo de la autoestima es lo que mejora el rendimiento", "Evitar cualquier intervención, porque la autoestima es un rasgo estable que no cambia en la adolescencia"], "e": "La autoestima depende de cómo nos desempeñamos en los ámbitos que nos importan, y se prefiere la mejora de las áreas de la vida de la persona antes que el abordaje directo de la autoestima.", "f": "D"}, {"id": "t3-010", "t": "t3", "lv": 1, "q": "¿Cuáles son las dos funciones motivadoras del autoconcepto según Reeve (2010)?", "o": ["Actuar de forma coherente con el autoconcepto y reducir la distancia entre el yo real y un yo ideal alcanzable", "Buscar recompensas externas que confirmen nuestra imagen y evitar los castigos que la cuestionan", "Compararnos con los demás para situarnos por encima y reducir la distancia con el yo ideal de los otros"], "e": "El autoconcepto motiva porque tendemos a comportarnos de forma consistente con lo establecido en él y porque intentamos reducir la distancia entre el yo ideal y el yo real percibido, en la medida en que el yo ideal sea alcanzable.", "f": "D"}, {"id": "t3-011", "t": "t3", "lv": 1, "q": "Según el tema 3, el intento de reducir la distancia entre el yo real y el yo ideal motiva siempre que:", "o": ["El yo ideal sea alcanzable", "El yo ideal sea muy superior al real", "El yo ideal coincida con las expectativas de los padres"], "e": "La diapositiva matiza que intentaremos reducir esa distancia «en la medida que ese yo ideal sea alcanzable». Un ideal inalcanzable no cumple esa función motivadora.", "f": "D"}, {"id": "t3-012", "t": "t3", "lv": 1, "q": "Una alumna que se considera «buena estudiante» saca un 4 y decide estudiar más para el siguiente examen. Desde el tema 3, su conducta se explica por:", "o": ["La tendencia a comportarnos de forma consistente con nuestro autoconcepto", "La identidad negativa, que le lleva a reaccionar contra lo que se espera de ella", "El reforzamiento negativo, que le hace estudiar para retirar el suspenso"], "e": "La primera función motivadora del autoconcepto es la tendencia a comportarnos de forma consistente con lo que hemos establecido en él. Además, el suspenso genera disonancia, que puede reducirse cambiando la conducta.", "f": "D"}, {"id": "t3-013", "t": "t3", "lv": 1, "q": "¿Quién formuló la teoría de la disonancia cognitiva y en qué año, según la bibliografía del tema 3?", "o": ["Festinger (1957)", "Erikson (1968)", "Marcia (1966)"], "e": "La teoría de la disonancia cognitiva es de Leon Festinger (1957). Erikson (1968) y Marcia (1966, 1980) son la base de los niveles de identidad.", "f": "D"}, {"id": "t3-014", "t": "t3", "lv": 1, "q": "La teoría de la disonancia cognitiva sostiene que:", "o": ["Buscamos que nuestros pensamientos sean coherentes entre sí y con nuestra conducta", "Nuestras conductas se mantienen o se extinguen en función de las consecuencias que producen", "El aprendizaje se produce por asociación entre un estímulo neutro y uno incondicionado"], "e": "Según Festinger, todos perseguimos que nuestros pensamientos sean coherentes entre sí y con nuestra conducta. Cuando no lo son, aparece un malestar que tratamos de reducir.", "f": "D"}, {"id": "t3-015", "t": "t3", "lv": 1, "q": "¿Cuál de las siguientes NO es una de las tres vías de reducción de la disonancia cognitiva que recoge el tema 3?", "o": ["Aumentar la frecuencia de la conducta disonante", "Cambiar nuestra conducta", "Desacreditar la información contradictoria"], "e": "Las tres vías son: cambios en nuestra conducta, desacreditar la información contradictoria y realizar reajustes en nuestra forma de pensar.", "f": "D"}, {"id": "t3-016", "t": "t3", "lv": 1, "q": "Una persona que se considera ecologista lee un informe sobre el impacto ambiental de los viajes en avión que hace con frecuencia y concluye que «esos estudios están exagerados». ¿Qué vía de reducción de la disonancia emplea?", "o": ["Desacreditar la información contradictoria", "Cambiar su conducta", "Reajustar su forma de pensar sobre sí misma"], "e": "Restar validez al informe es desacreditar la información contradictoria. Cambiar la conducta sería dejar de volar, y reajustar el pensamiento sería, por ejemplo, decirse «no soy tan ecologista como pensaba».", "f": "A"}, {"id": "t3-017", "t": "t3", "lv": 1, "q": "Según los apuntes de clase, ¿qué vía de reducción de la disonancia resulta menos probable cuando afecta a la propia identidad (por ejemplo, «quizá no soy tan feminista»)?", "o": ["El reajuste de la forma de pensar sobre uno mismo", "El cambio de la conducta disonante", "Desacreditar la información contradictoria"], "e": "Los apuntes de clase señalan que la disonancia lleva a las personas a hacer cambios, pero que es poco probable que el reajuste afecte a la propia identidad («uy, a lo mejor no soy tan…»). Es más habitual cambiar la conducta o desacreditar la información.", "f": "A"}, {"id": "t3-018", "t": "t3", "lv": 1, "q": "¿En qué autores se basan los niveles de identidad que presenta el tema 3?", "o": ["Erikson (1968) y Marcia (1966; 1980)", "Piaget (1947) y Vygotsky (1934)", "Kohlberg (1969) y Eisenberg (2004)"], "e": "La bibliografía del tema cita a Erikson (1968), Identity: Youth and crisis, y a Marcia (1966; 1980) sobre los estatus de identidad.", "f": "D"}, {"id": "t3-019", "t": "t3", "lv": 1, "q": "¿Cuántos niveles de identidad distingue el tema 3?", "o": ["Cinco: prematura, negativa, difusión, moratoria y logro", "Cuatro: preconvencional, convencional, posconvencional y autónoma", "Tres: real, potencial y próxima"], "e": "El tema distingue cinco niveles: identidad prematura, identidad negativa, difusión de identidad, demora o moratoria y logro de la identidad.", "f": "D"}, {"id": "t3-020", "t": "t3", "lv": 1, "q": "Un alumno de 2.º de Bachillerato estudiará Medicina «porque en mi familia todos son médicos», sin haberse planteado otras opciones. Corresponde a:", "o": ["Identidad prematura", "Logro de la identidad", "Moratoria de identidad"], "e": "La identidad prematura caracteriza a jóvenes que aceptan sin excesiva reflexión los valores y objetivos de sus padres y no elaboran una identidad personal, sin contemplar que existan otros ámbitos más atractivos o talento para otros desempeños.", "f": "D"}, {"id": "t3-021", "t": "t3", "lv": 1, "q": "La identidad negativa se caracteriza por:", "o": ["Oponerse totalmente a lo que se espera de uno, por altas exigencias o por falta de atractivo de lo esperado", "Aceptar sin excesiva reflexión los valores y objetivos de los padres, sin elaborar una identidad propia", "Tomarse un periodo de exploración antes de comprometerse con unos valores y objetivos"], "e": "La identidad negativa es el extremo opuesto a la prematura: oponerse totalmente a lo que se espera de ellos, bien por altas exigencias o por falta de atractivo.", "f": "D"}, {"id": "t3-022", "t": "t3", "lv": 1, "q": "Una alumna, hija de dos abogados muy exigentes, rechaza de forma sistemática cualquier actividad relacionada con los estudios y declara que hará «justo lo contrario» de lo que esperan sus padres. Corresponde a:", "o": ["Identidad negativa", "Identidad prematura", "Logro de la identidad"], "e": "Oponerse totalmente a lo esperado, especialmente ante altas exigencias, define la identidad negativa.", "f": "D"}, {"id": "t3-023", "t": "t3", "lv": 1, "q": "Un joven de 19 años no estudia, no trabaja ni se plantea qué quiere hacer; muestra apatía y no asume responsabilidades. Corresponde a:", "o": ["Difusión de identidad", "Moratoria de identidad", "Identidad negativa"], "e": "La difusión de identidad es la falta absoluta de definición o compromiso sobre qué se quiere ser o conseguir, con apatía y un comportamiento sin responsabilidades ni objetivos a medio o largo plazo. Los apuntes de clase la relacionan con el «síndrome de Peter Pan».", "f": "D"}, {"id": "t3-024", "t": "t3", "lv": 1, "q": "¿Qué nivel de identidad relacionan los apuntes de clase con el «síndrome de Peter Pan»?", "o": ["Difusión de identidad", "Identidad prematura", "Logro de la identidad"], "e": "Los apuntes de clase asocian la difusión de identidad, caracterizada por la apatía y la falta de compromiso, con el síndrome de Peter Pan.", "f": "A"}, {"id": "t3-025", "t": "t3", "lv": 1, "q": "La demora o moratoria de identidad:", "o": ["Es un periodo para lograr la identidad que algunas sociedades promueven (en EE. UU., estudiar Medicina o Derecho)", "Es la renuncia definitiva a construir una identidad, con apatía y ausencia de compromiso", "Es la aceptación sin reflexión de la identidad y los objetivos que propone la familia"], "e": "La moratoria es una demora para alcanzar la identidad, a veces promovida socialmente (ejemplo de EE. UU.: estudiar Medicina o Derecho). Supone exploración antes del compromiso.", "f": "D"}, {"id": "t3-026", "t": "t3", "lv": 1, "q": "Una estudiante que termina el grado se toma un año para trabajar en distintos ámbitos y probar antes de decidir qué máster cursar. Corresponde a:", "o": ["Moratoria de identidad", "Difusión de identidad", "Identidad prematura"], "e": "La moratoria implica exploración activa antes del compromiso. A diferencia de la difusión, no hay apatía: se busca experiencia para poder decidir.", "f": "D"}, {"id": "t3-027", "t": "t3", "lv": 1, "q": "¿Qué caracteriza el logro de la identidad?", "o": ["Tener objetivos y valores propios, haber descartado otros y mantener un compromiso firme con los propósitos", "No haberse planteado alternativas y asumir los objetivos familiares sin cuestionarlos", "Mantener una exploración indefinida de opciones sin llegar a comprometerse con ninguna"], "e": "En el logro de la identidad se tienen objetivos y valores, se han descartado otros y hay un compromiso firme con los propósitos.", "f": "D"}, {"id": "t3-028", "t": "t3", "lv": 1, "q": "¿Cuándo se alcanza el logro de la identidad según el tema 3?", "o": ["A veces en la adolescencia, aunque se va logrando en la adultez, y no siempre", "Siempre al final de la ESO, con la elección del itinerario", "Únicamente en la edad adulta, nunca durante la adolescencia"], "e": "La diapositiva indica que a veces se alcanza en la adolescencia, aunque se va logrando en la adultez, y no siempre.", "f": "D"}, {"id": "t3-029", "t": "t3", "lv": 1, "q": "¿Qué dos niveles de identidad se presentan en el tema 3 como extremos opuestos?", "o": ["Identidad prematura e identidad negativa", "Moratoria y logro de la identidad", "Difusión y moratoria"], "e": "La diapositiva de identidad negativa la define como el extremo opuesto a la identidad prematura: aceptar todo lo esperado frente a oponerse a todo lo esperado.", "f": "D"}, {"id": "t3-030", "t": "t3", "lv": 1, "q": "¿Qué tres ámbitos de cambio a los que debe adaptarse el adolescente aparecen en el primer apartado del tema 3?", "o": ["Físicos, cognitivos y del centro educativo", "Económicos, laborales y familiares", "Hormonales, genéticos y nutricionales"], "e": "El apartado de adaptación a los cambios recoge los cambios físicos, cognitivos y los relacionados con el centro educativo (paso del colegio al instituto).", "f": "D"}, {"id": "t3-031", "t": "t3", "lv": 1, "q": "Según los apuntes de clase del tema 3, ¿qué relación existe entre el desarrollo físico, emocional y cognitivo?", "o": ["Van juntos y no son aspectos separados", "Se desarrollan de forma independiente y sucesiva", "El desarrollo cognitivo se completa antes de que empiece el emocional"], "e": "Los apuntes de clase abren el tema señalando que el desarrollo físico, emocional y cognitivo van juntos, no son aspectos separados.", "f": "A"}, {"id": "t3-032", "t": "t3", "lv": 1, "q": "La autoeficacia, el autoconcepto y la autoestima se relacionan pero no son lo mismo. ¿Cuál de las siguientes afirmaciones es correcta?", "o": ["El autoconcepto describe, la autoestima lo valora afectivamente y la autoeficacia se refiere a tener recursos ante una situación", "La autoestima describe, el autoconcepto valora afectivamente y la autoeficacia es la estima global de uno mismo", "Los tres términos son sinónimos y se refieren a la imagen global que tenemos de nosotros mismos"], "e": "Integrando los temas 3 y 7-8: autoconcepto = descripción en dominios; autoestima = evaluación afectiva del autoconcepto (Woolfolk); autoeficacia = sensación de tener recursos suficientes para una situación específica.", "f": "D"}, {"id": "t3-033", "t": "t3", "lv": 1, "q": "Una alumna con un yo ideal de «sacar matrícula en todo» y notas actuales de aprobado no se esfuerza más, sino que se desanima. Desde el tema 3, ¿qué explica este resultado?", "o": ["La distancia entre el yo real y el yo ideal solo motiva si el ideal es alcanzable", "La disonancia cognitiva siempre lleva a cambiar la conducta", "Su autoestima no influye en su motivación por estudiar"], "e": "Intentamos reducir la distancia entre el yo ideal y el yo real en la medida en que el yo ideal sea alcanzable. Un ideal percibido como inalcanzable no moviliza el esfuerzo.", "f": "D"}, {"id": "t3-a001", "t": "t3", "lv": 2, "q": "Elena dice: «Soy buena en Lengua y regular en Matemáticas». Pedro dice: «Me siento fatal conmigo mismo porque soy malo en Matemáticas». ¿Qué expresa cada uno según el tema 3?", "o": ["Elena describe su autoconcepto; Pedro expresa su autoestima, la valoración afectiva", "Elena expresa su autoestima académica; Pedro describe su autoconcepto en Matemáticas", "Ambos expresan su autoeficacia ante una tarea concreta de Matemáticas o de Lengua"], "e": "El autoconcepto es la descripción que hacemos de nosotros mismos en distintos dominios. La autoestima es la evaluación afectiva que hacemos de esas características (Woolfolk, 2010).", "f": "D"}, {"id": "t3-a002", "t": "t3", "lv": 2, "q": "Un alumno se considera «el gracioso de la clase» y, aunque está cansado, sigue haciendo bromas en todas las clases. ¿Qué función motivadora del autoconcepto explica su conducta?", "o": ["Tendemos a comportarnos de manera consistente con lo que hemos establecido en nuestro autoconcepto", "Intentamos reducir la distancia entre el yo real y un yo ideal que nos parece alcanzable", "Buscamos recompensas sociales externas que confirmen y eleven nuestra autoestima"], "e": "Reeve (2010) describe dos funciones motivadoras: comportarnos de forma consistente con nuestro autoconcepto y reducir la distancia entre el yo ideal y el yo real si el ideal es alcanzable. Mantener el papel de «gracioso» es actuar de forma consistente con él.", "f": "D"}, {"id": "t3-a003", "t": "t3", "lv": 2, "q": "Una alumna quiere mejorar su nivel de inglés y se propone pasar de un 5 a un 7 este trimestre, con un plan semanal. Otra quiere «ser bilingüe en un mes». ¿Qué predice el tema 3 sobre su motivación?", "o": ["La primera estará más motivada, porque la distancia entre yo real e ideal motiva si el ideal es alcanzable", "La segunda estará más motivada, porque un ideal más alto genera siempre más esfuerzo", "Ambas tendrán la misma motivación, porque el yo ideal no influye en la conducta real"], "e": "Intentaremos reducir la distancia entre el yo ideal y el yo real en la medida en que ese yo ideal sea alcanzable (Reeve, 2010). Un ideal inalcanzable no cumple esa función motivadora. Conecta con las metas específicas y moderadamente difíciles del tema 7-8.", "f": "D"}, {"id": "t3-a004", "t": "t3", "lv": 2, "q": "Un alumno que se considera «buen compañero» se ríe de un chico al que están ridiculizando. Después se siente incómodo. Según Festinger (1957), ¿qué opciones tiene para reducir esa disonancia?", "o": ["Cambiar su conducta, desacreditar la información contradictoria o reajustar su forma de pensar", "Aumentar la frecuencia de la conducta para normalizarla o pedir un refuerzo positivo", "Solo puede cambiar su conducta, porque la disonancia no admite otras salidas"], "e": "La disonancia cognitiva surge cuando pensamientos y conducta no son coherentes. Se reduce cambiando la conducta (pedir perdón, no volver a hacerlo), desacreditando la información contradictoria («solo era una broma») o reajustando la forma de pensar sobre uno mismo.", "f": "D"}, {"id": "t3-a005", "t": "t3", "lv": 2, "q": "En el ejemplo anterior, el alumno concluye: «Bueno, solo era una broma, a él no le importa». ¿Qué vía de reducción de la disonancia ha elegido?", "o": ["Desacreditar la información contradictoria", "Cambiar su conducta", "Reajustar su forma de pensar sobre sí mismo"], "e": "Restar importancia o validez a lo que contradice su autoconcepto («solo era una broma») es desacreditar la información contradictoria. Reajustar su forma de pensar sería, por ejemplo, admitir «quizá no soy tan buen compañero».", "f": "D"}, {"id": "t3-a006", "t": "t3", "lv": 2, "q": "¿Cómo puede un docente usar la disonancia cognitiva de forma educativa ante un alumno que defiende el respeto pero insulta a un compañero?", "o": ["Señalando con calma la contradicción entre lo que dice valorar y lo que ha hecho", "Ignorando la contradicción para no herir su autoestima ante el resto del grupo", "Castigándole sin explicación para que asocie el insulto con algo desagradable"], "e": "Los apuntes de clase señalan que la disonancia lleva a las personas a hacer cambios y que puede usarse para promoverlos. Hacer visible la incoherencia favorece que se reduzca cambiando la conducta. Conecta con la inducción del tema 4.", "f": "A"}, {"id": "t3-a007", "t": "t3", "lv": 2, "q": "Diego (17 años) estudiará Derecho porque «en mi familia todos son abogados», sin haberse planteado otras opciones. Marta (17) rechaza todo lo que sus padres, muy exigentes, esperan de ella. Iván (19) no estudia ni trabaja y no le interesa nada. ¿Qué niveles de identidad describen?", "o": ["Diego: prematura; Marta: negativa; Iván: difusión", "Diego: logro; Marta: moratoria; Iván: negativa", "Diego: moratoria; Marta: difusión; Iván: prematura"], "e": "Aceptar sin reflexión los objetivos familiares es identidad prematura; oponerse totalmente a lo esperado, por altas exigencias, es identidad negativa; la falta absoluta de compromiso con apatía es difusión de identidad.", "f": "D"}, {"id": "t3-a008", "t": "t3", "lv": 2, "q": "Lucía (22) se ha tomado un año para trabajar como voluntaria y en distintos empleos antes de decidir qué máster hacer. Carlos (25) ha descartado otras opciones y está comprometido con su carrera de docente. ¿Qué niveles de identidad representan?", "o": ["Lucía: moratoria; Carlos: logro de la identidad", "Lucía: difusión; Carlos: identidad prematura", "Lucía: identidad negativa; Carlos: moratoria"], "e": "La moratoria es un periodo de exploración para lograr la identidad (a veces promovido socialmente). El logro implica tener objetivos y valores, haber descartado otros y un compromiso firme.", "f": "D"}, {"id": "t3-a009", "t": "t3", "lv": 2, "q": "¿Qué diferencia esencial hay entre la moratoria y la difusión de identidad, si en ambas aún no hay un compromiso firme?", "o": ["En la moratoria hay exploración activa orientada a lograr la identidad; en la difusión hay apatía y falta de objetivos", "En la moratoria se aceptan sin reflexión los valores familiares; en la difusión se rechazan", "No hay diferencia: son dos nombres para el mismo nivel de identidad"], "e": "La moratoria es una demora para lograr la identidad, con exploración de opciones. La difusión es la falta absoluta de definición o compromiso, con apatía y comportamiento sin responsabilidades ni objetivos a medio o largo plazo.", "f": "D"}, {"id": "t3-a010", "t": "t3", "lv": 2, "q": "¿Qué diferencia esencial hay entre la identidad prematura y el logro de la identidad, si en ambas hay compromiso con unos objetivos?", "o": ["En el logro esos objetivos se han elegido tras considerar y descartar otros; en la prematura, sin reflexión", "En la prematura el compromiso es más firme que en el logro, porque está respaldado por la familia", "En el logro los objetivos coinciden siempre con los de la familia, aunque se hayan pensado más"], "e": "La identidad prematura acepta sin excesiva reflexión los valores y objetivos de los padres, sin contemplar otros ámbitos. El logro implica tener objetivos y valores propios, haber descartado otros y un compromiso firme.", "f": "D"}, {"id": "t3-a011", "t": "t3", "lv": 2, "q": "Un tutor detecta a un alumno de 2.º de Bachillerato con identidad prematura. ¿Qué intervención es más coherente con el tema 3?", "o": ["Ayudarle a explorar otros ámbitos y a valorar sus propios talentos antes de decidir", "Reforzar su decisión para evitarle dudas e inseguridad", "Dejar que siga sin intervenir, porque es el nivel más maduro de identidad"], "e": "La identidad prematura se caracteriza por no contemplar que existan ámbitos de mayor atractivo para uno mismo o que se tenga talento para otros desempeños. Favorecer la exploración le acerca a un logro de identidad propio.", "f": "D"}, {"id": "t3-a012", "t": "t3", "lv": 2, "q": "Según el tema 3, ¿qué influencias externas intervienen en la respuesta del adolescente a «¿quién soy yo?», además de su propio desarrollo?", "o": ["La familia, los iguales y la cultura", "Solo la familia, porque es el grupo de referencia principal", "Solo el profesorado, porque evalúa su rendimiento"], "e": "El adolescente busca la respuesta en los cambios de su desarrollo biológico, cognitivo, afectivo-emocional, social y moral, con la influencia de la familia, los iguales y la cultura.", "f": "D"}, {"id": "t3-a013", "t": "t3", "lv": 2, "q": "Integrando los temas 2 y 3, ¿qué capacidad cognitiva hace posible que a mitad de la adolescencia se plantee de forma sistemática «¿quién soy yo?»?", "o": ["El pensamiento formal, que permite considerar posibilidades y metas futuras", "La permanencia del objeto, que permite reconocerse como alguien estable", "La conservación, que permite mantener la identidad aunque cambie el aspecto"], "e": "A mitad de la adolescencia el pensamiento más complejo permite pensar en las diferentes posibilidades y empezar a desarrollar la propia identidad («¿quién soy yo?») y considerar metas futuras (tema 2). Esa pregunta obliga a desarrollar un autoconcepto (tema 3).", "f": "D"}, {"id": "t3-a014", "t": "t3", "lv": 2, "q": "¿Qué dos razones da el tema 3 para que al adolescente le resulte especialmente difícil concretar su autoconcepto?", "o": ["Los cambios que experimenta y el gran número de aspectos que se ve obligado a incluir", "La falta de pensamiento simbólico y la ausencia de relaciones con iguales", "La baja autoestima y la moral preconvencional propias de la edad"], "e": "La diapositiva señala dos motivos: los cambios que experimentan y el gran número de aspectos que se ven forzados a incluir en ese autoconcepto.", "f": "D"}, {"id": "t3-a015", "t": "t3", "lv": 2, "q": "Un alumno tiene baja autoestima y suspende casi todo. Su orientador decide trabajar primero sus técnicas de estudio en dos asignaturas que le importan. ¿Qué principio del tema 3 aplica?", "o": ["La baja autoestima es más consecuencia que causa: mejorar el desempeño en lo que importa la eleva", "La autoestima debe elevarse primero con elogios para que después mejore el rendimiento", "La autoestima es un rasgo estable que no puede cambiar, así que solo cabe compensarla"], "e": "Según Reeve (2010), la baja autoestima es más la consecuencia que la causa de otros problemas; la autoestima depende de cómo nos desempeñamos en los ámbitos que nos importan, por lo que se prefiere mejorar esas áreas al abordaje directo de la autoestima.", "f": "D"}, {"id": "t3-a016", "t": "t3", "lv": 2, "q": "Un alumno es brillante en Física pero se siente mal consigo mismo porque no destaca en fútbol, que es lo que valora su grupo. Según el tema 3, ¿qué explica su baja autoestima?", "o": ["La autoestima depende del desempeño en los ámbitos a los que la persona concede importancia", "La autoestima depende solo del rendimiento académico", "La autoestima es la descripción objetiva de las capacidades, al margen de su importancia"], "e": "El autoconcepto se refiere a dominios a los que concedemos importancia, y la autoestima depende de cómo nos desempeñamos en los ámbitos que nos importan. Si lo importante para él es el fútbol, su buen rendimiento en Física pesa menos.", "f": "D"}, {"id": "t3-a017", "t": "t3", "lv": 2, "q": "¿Qué relación hay entre autoconcepto, autoestima y autoeficacia en un alumno que dice «se me dan mal los idiomas, me siento torpe y creo que no podré aprobar el examen oral del viernes»?", "o": ["Autoconcepto: «se me dan mal»; autoestima: «me siento torpe»; autoeficacia baja: «no podré aprobar el oral»", "Autoconcepto: «me siento torpe»; autoestima: «no podré aprobar»; autoeficacia: «se me dan mal»", "Las tres frases expresan solo autoestima"], "e": "El autoconcepto describe («se me dan mal»), la autoestima evalúa afectivamente («me siento torpe») y la autoeficacia es la sensación de tener recursos para una situación específica (el examen del viernes).", "f": "D"}, {"id": "t3-a018", "t": "t3", "lv": 2, "q": "Según la bibliografía del tema 3, ¿a qué autores se atribuye cada concepto?", "o": ["Autoestima: Woolfolk; funciones motivadoras: Reeve; disonancia: Festinger; identidad: Erikson y Marcia", "Autoestima: Reeve; funciones motivadoras: Woolfolk; disonancia: Erikson; identidad: Festinger y Marcia", "Autoestima: Marcia; funciones motivadoras: Festinger; disonancia: Reeve; identidad: Erikson y Woolfolk"], "e": "El tema cita a Woolfolk (2010) para la definición de autoestima, a Reeve (2010) para la autoestima como consecuencia y las funciones motivadoras del autoconcepto, a Festinger (1957) para la disonancia cognitiva y a Erikson (1968) y Marcia (1966, 1980) para la identidad.", "f": "D"}, {"id": "t3-a019", "t": "t3", "lv": 2, "q": "Una alumna con identidad negativa rechaza estudiar porque sus padres esperan que sea médica. Integrando los temas 3 y 4, ¿qué estilo familiar es más probable que esté en el origen?", "o": ["Un estilo con altas exigencias y poco espacio para su autonomía, como el autoritario", "Un estilo permisivo, con pocas exigencias y mucho afecto", "Un estilo negligente, en el que los padres no esperan nada de ella"], "e": "El tema 3 explica que la identidad negativa surge por altas exigencias o falta de atractivo de lo esperado. El tema 4 asocia el estilo autoritario a altas exigencias y a rebeldía en la adolescencia para alcanzar la independencia.", "f": "D"}, {"id": "t3-a020", "t": "t3", "lv": 2, "q": "¿Qué tres ámbitos de cambio a los que debe adaptarse el adolescente presenta el tema 3?", "o": ["Cambios físicos, cognitivos y relacionados con el centro educativo", "Cambios económicos, laborales y familiares derivados de la emancipación", "Cambios hormonales, genéticos y nutricionales propios de la pubertad"], "e": "El primer apartado del tema 3 presenta la adaptación a los cambios físicos, cognitivos y del centro educativo (paso del colegio al instituto).", "f": "D"}, {"id": "t3-a021", "t": "t3", "lv": 2, "q": "Un alumno que se ve como «mal estudiante» saca por sorpresa un 9 y piensa «habrá sido suerte, el examen era muy fácil». ¿Qué fenómeno del tema 3 explica esta reacción?", "o": ["La disonancia cognitiva, reducida desacreditando lo que contradice su autoconcepto", "La moratoria de identidad, que retrasa su compromiso con los estudios", "El reforzamiento positivo, que aumentará a partir de ahora su conducta de estudio"], "e": "El 9 contradice su autoconcepto. Atribuirlo a la suerte o a la facilidad del examen es desacreditar la información contradictoria para mantener la coherencia. También refleja la primera función motivadora: la tendencia a mantener el autoconcepto.", "f": "D"}, {"id": "t3-a022", "t": "t3", "lv": 2, "q": "¿Qué riesgo educativo tiene la tendencia a comportarnos de forma consistente con nuestro autoconcepto en un alumno que se ve como «el malo de la clase»?", "o": ["Que mantenga conductas disruptivas por coherencia con esa imagen, aunque pueda actuar de otro modo", "Que mejore automáticamente su conducta para reducir la disonancia que le produce esa imagen", "Que alcance antes el logro de la identidad, porque ya tiene una imagen clara de sí mismo"], "e": "La primera función motivadora del autoconcepto es comportarnos de forma consistente con lo que hemos establecido en él (Reeve, 2010). Un autoconcepto negativo puede sostener conductas negativas, por lo que conviene ofrecer experiencias de desempeño que lo cuestionen.", "f": "D"}, {"id": "t3-a023", "t": "t3", "lv": 2, "q": "¿Qué indica el tema 3 sobre cuándo se alcanza el logro de la identidad, y qué implica para el docente de Secundaria?", "o": ["Que a veces llega en la adolescencia, pero suele lograrse en la adultez: es normal que aún exploren", "Que debe alcanzarse al final de la ESO, por lo que conviene forzar la decisión del alumnado", "Que se alcanza en la infancia, por lo que el docente de Secundaria apenas puede influir"], "e": "La diapositiva indica que el logro a veces se da en la adolescencia, aunque se va logrando en la adultez, y no siempre. Por eso la exploración (moratoria) en Secundaria es esperable.", "f": "D"}, {"id": "t3-a024", "t": "t3", "lv": 2, "q": "Según los apuntes de clase, ¿por qué el autoconcepto puede variar según el contexto?", "o": ["La percepción de uno mismo cambia con el contexto: extrovertido con desconocidos, introvertido en familia", "Porque el autoconcepto es un rasgo innato que no depende de la experiencia ni del entorno", "Porque solo existe un autoconcepto global y único, que se aplica igual a todas las situaciones"], "e": "Los apuntes de clase indican que el autoconcepto es cómo se percibe una persona y puede cambiar según el contexto (por ejemplo, extrovertido con personas ajenas e introvertido con la familia). Es coherente con la idea de dominios del tema 3.", "f": "A"}, {"id": "t3-a025", "t": "t3", "lv": 2, "q": "Un docente organiza actividades en las que un alumno con baja autoestima académica puede destacar en lo que más le importa (por ejemplo, el diseño gráfico de un proyecto). Integrando los temas 3 y 7-8, ¿qué variables mejora?", "o": ["Su autoestima, por el desempeño en algo que le importa, y su autoeficacia en esa tarea", "Solo su motivación extrínseca, porque recibe recompensas materiales por participar", "Solo su autoconcepto físico, porque mejora la imagen que proyecta ante el grupo"], "e": "El tema 3 indica que la autoestima mejora con el desempeño en lo que importa. El tema 7-8 señala que la información que incrementa la sensación de competencia aumenta la motivación intrínseca y que la autoeficacia se construye en situaciones concretas.", "f": "D"}, {"id": "t3-a026", "t": "t3", "lv": 2, "q": "¿Cuál de las siguientes afirmaciones sobre la autoestima es FALSA según el tema 3?", "o": ["Es la causa principal de la mayoría de los problemas, por lo que debe abordarse de forma directa", "Es la evaluación afectiva de las características incluidas en el autoconcepto", "Depende de cómo nos desempeñamos en los ámbitos que nos importan"], "e": "El tema afirma lo contrario: la baja autoestima es más la consecuencia que la causa de otros problemas, y se prefiere mejorar las áreas de la vida de la persona al abordaje directo de la autoestima (Reeve, 2010).", "f": "D"}, {"id": "t3-a027", "t": "t3", "lv": 2, "q": "Una alumna que siempre ha aceptado sin cuestionar lo que sus padres querían para ella empieza en 1.º de Bachillerato a explorar otras carreras y actividades. ¿Qué tránsito de identidad describe?", "o": ["De la identidad prematura a la moratoria", "De la moratoria a la difusión", "Del logro a la identidad negativa"], "e": "Pasar de aceptar sin reflexión los objetivos familiares (prematura) a explorar activamente alternativas antes de comprometerse (moratoria) es un avance hacia el logro de la identidad.", "f": "D"}, {"id": "t4-001", "t": "t4", "lv": 1, "q": "¿Cuál de los siguientes NO figura entre los retos sociales del adolescente al llegar a Secundaria?", "o": ["Un trato con el profesorado más individualizado que en Primaria", "Cambios en los niveles y la exigencia educativa", "El grupo de iguales como elemento clave para la adaptación"], "e": "Los retos citados son: cambio de centro (compañeros, profesores, normas), cambios en niveles y exigencia, un trato con el profesorado menos individualizado y el grupo de iguales como elemento clave.", "f": "D"}, {"id": "t4-002", "t": "t4", "lv": 1, "q": "Según el tema 4, el conflicto entre adolescentes y padres:", "o": ["Forma parte natural del proceso de individuación y va disminuyendo con la edad", "Es un indicador de patología familiar que debe derivarse a Orientación", "Aumenta progresivamente con la edad hasta la emancipación"], "e": "El proceso de individuación (Collins y Laursen, 2004) se acompaña de un aumento de conflictos, que es una parte natural del desarrollo, y los conflictos con los padres van disminuyendo con la edad.", "f": "D"}, {"id": "t4-003", "t": "t4", "lv": 1, "q": "¿Qué autores cita la diapositiva de transformación familiar al describir el tránsito de la dependencia infantil a la búsqueda de autonomía?", "o": ["Collins y Laursen (2004)", "Eisenberg y Morris (2004)", "Foxx y Azrin (1972)"], "e": "La diapositiva de transformación familiar cita a Collins y Laursen (2004). Eisenberg y Morris aparecen en el desarrollo moral y Foxx y Azrin en la sobrecorrección (tema 6).", "f": "D"}, {"id": "t4-004", "t": "t4", "lv": 1, "q": "¿En torno a qué temas suelen centrarse los conflictos entre adolescentes y padres?", "o": ["La independencia, las reglas, el tiempo libre y las responsabilidades", "La religión, la política y la elección de la carrera", "Las calificaciones escolares y la relación con el profesorado"], "e": "La diapositiva indica que los conflictos suelen centrarse en la independencia, las reglas, el tiempo libre y las responsabilidades.", "f": "D"}, {"id": "t4-005", "t": "t4", "lv": 1, "q": "En el balance supervisión-autonomía, ¿qué consecuencia se asocia a la sobresupervisión?", "o": ["Restringe el desarrollo de la autonomía", "Puede llevar a riesgos por exceso de libertad", "Fomenta un desarrollo saludable"], "e": "Sobresupervisión: restringe el desarrollo de la autonomía. Balance: fomenta un desarrollo saludable. Sobreautonomía: puede llevar a riesgos.", "f": "D"}, {"id": "t4-006", "t": "t4", "lv": 1, "q": "La ambivalencia del adolescente en sus relaciones familiares consiste en:", "o": ["Oscilar entre reafirmar su identidad e independencia y conservar el apoyo de los padres (culpa, vergüenza por responsabilidad social)", "Oscilar entre fomentar su propio desarrollo y mantener el control sobre sus hermanos menores", "Oscilar entre la influencia del grupo de iguales y la del profesorado en las decisiones de carrera"], "e": "El adolescente oscila entre reafirmar las necesidades de identidad e independencia y conservar el apoyo de los padres. La ambivalencia entre fomentar el desarrollo y mantener el control es la de los padres.", "f": "D"}, {"id": "t4-007", "t": "t4", "lv": 1, "q": "La ambivalencia de los padres se sitúa entre:", "o": ["Fomentar el desarrollo de sus hijos y mantener el cuidado, el control, la supervisión y la educación", "Ser amigos de sus hijos o mantener una autoridad rígida que marque las metas", "Delegar la educación en la escuela o asumirla en exclusiva dentro del hogar"], "e": "Los padres oscilan entre la independencia y la dependencia de sus hijos: fomentar su desarrollo frente a mantener el cuidado, el control, la supervisión y la educación.", "f": "D"}, {"id": "t4-008", "t": "t4", "lv": 1, "q": "¿Qué necesidades del adolescente recoge el tema 4 en la relación con la familia?", "o": ["Mayor libertad e independencia, y un trato más igualitario y menos autoritario", "Más control externo y normas más estrictas que le den seguridad en los cambios", "Menos comunicación con los padres y más trato con los profesores"], "e": "La diapositiva recoge dos necesidades: mayor libertad e independencia, y mayor trato igualitario y menos autoritario.", "f": "D"}, {"id": "t4-009", "t": "t4", "lv": 1, "q": "Según el tema 4, ¿quiénes suelen tener más roces con los padres?", "o": ["Los primogénitos", "Los hijos menores", "Los hijos únicos"], "e": "La diapositiva indica que los primogénitos suelen tener más roces.", "f": "D"}, {"id": "t4-010", "t": "t4", "lv": 1, "q": "Según la diapositiva sobre nuevos estilos de autoridad, las familias permisivas surgen:", "o": ["Como reacción ante las autoritarias, a partir de la revolución cultural de los años sesenta y setenta", "Como producto de una sociedad trabajo-adicta que delega la educación de los hijos en otros", "Como producto de una sociedad que vive con angustia, sin tejido social y con poca esperanza"], "e": "Las familias permisivas son una reacción a las autoritarias tras la revolución cultural de los sesenta y setenta; las abandónicas son producto de una sociedad trabajo-adicta; las sobreprotectoras, de una sociedad que vive con angustia, sin tejido social y con poca esperanza.", "f": "D"}, {"id": "t4-011", "t": "t4", "lv": 1, "q": "Según la diapositiva sobre transformaciones familiares, las familias «abandónicas» son producto de:", "o": ["Una sociedad trabajo-adicta", "La revolución cultural de los años sesenta", "Una sociedad con excesivo tejido social"], "e": "La diapositiva atribuye las familias abandónicas a una sociedad «trabajo-adicta».", "f": "D"}, {"id": "t4-012", "t": "t4", "lv": 1, "q": "¿Qué impacto de los cambios en la estructura familiar destaca la diapositiva?", "o": ["Se debilitan los vínculos y los niños, criados más encerrados en casa y con menos mediación, son más frágiles y menos autónomos", "Se fortalece el «nosotros» porque los hijos únicos reciben más atención y mediación de sus padres", "Los niños aprenden mejor a resolver conflictos porque pasan más tiempo en casa con la familia"], "e": "La diapositiva indica que se debilitan los vínculos (comunicación e interacción en el hogar); los niños, criados encerrados en casa con menor mediación de padres y hermanos, no aprenden a resolver conflictos y son más frágiles y menos autónomos. Con los hijos únicos se fortalece el «yo» y se debilita el «nosotros».", "f": "D"}, {"id": "t4-013", "t": "t4", "lv": 1, "q": "Los estilos educativos familiares se definen como la combinación de dos dimensiones. ¿Cuáles?", "o": ["Control (normas) y afecto (comunicación)", "Exigencia académica y nivel socioeconómico", "Edad de los padres y número de hijos"], "e": "La diapositiva define los estilos educativos como la combinación entre control y afecto, representados en un eje de normas y otro de afecto y comunicación.", "f": "D"}, {"id": "t4-014", "t": "t4", "lv": 1, "q": "¿Qué combinación corresponde al estilo autoritario?", "o": ["+ control, − afecto", "− control, + afecto", "+ control, + afecto"], "e": "Autoritario: exigentes y con poco afecto (+ control, − afecto). Permisivo: cariñosos y no exigentes (− control, + afecto). Negligente: − control, − afecto. Democrático: + control, + afecto.", "f": "D"}, {"id": "t4-015", "t": "t4", "lv": 1, "q": "¿Qué combinación corresponde al estilo democrático o responsable?", "o": ["+ control, + afecto", "+ control, − afecto", "− control, + afecto"], "e": "El estilo democrático marca límites, es cariñoso y se comunica bien con los hijos: exigente y receptivo a la vez (+ control, + afecto).", "f": "D"}, {"id": "t4-016", "t": "t4", "lv": 1, "q": "En el cuadrante de estilos educativos de la diapositiva, el estilo permisivo aparece también denominado:", "o": ["Sobreprotector", "Indiferente", "Responsable"], "e": "En el cuadrante, el estilo permisivo aparece como «permisivo sobreprotector» (poco exigentes, demasiado receptivos), el negligente como «indiferente» y el democrático como «responsable».", "f": "D"}, {"id": "t4-017", "t": "t4", "lv": 1, "q": "Unos padres no establecen normas claras, evitan castigar, hablan mucho con su hijo, pero apenas se implican en sus tareas escolares. ¿Qué estilo representan?", "o": ["Permisivo", "Negligente", "Autoritario"], "e": "El estilo permisivo combina poca exigencia y altos niveles de afecto: evita restricciones y castigos, no hay normas claras, hay mucha comunicación y baja implicación en las tareas escolares.", "f": "D"}, {"id": "t4-018", "t": "t4", "lv": 1, "q": "¿Qué característica de los hijos se asocia al estilo autoritario?", "o": ["Buena adaptación escolar con gran respeto por las normas, pero baja autoestima y escasa autonomía", "Espontaneidad, creatividad y buenas relaciones sociales, pero inmadurez y desobediencia", "Mayor probabilidad de éxito académico, alta autorregulación y buen desarrollo moral"], "e": "Los hijos de padres autoritarios presentan buena adaptación escolar (respeto por las normas), baja autoestima y autoconcepto, escasa autonomía (sumisión), menor iniciativa y creatividad, problemas de conducta en la adolescencia (rebeldía) y poca competencia social.", "f": "D"}, {"id": "t4-019", "t": "t4", "lv": 1, "q": "La paradoja del estilo autoritario es que sus hijos presentan buena adaptación escolar y, sin embargo:", "o": ["Problemas de conducta en la adolescencia por rebeldía para alcanzar la independencia", "Excelente competencia social y gran iniciativa en las relaciones", "Autoestima muy elevada y autonomía personal desde edades tempranas"], "e": "La diapositiva indica que, pese a la buena adaptación escolar, los hijos de padres autoritarios pueden presentar problemas de conducta en la adolescencia: rebeldía por alcanzar la independencia.", "f": "D"}, {"id": "t4-020", "t": "t4", "lv": 1, "q": "¿Qué rasgo del estilo autoritario aparece en la diapositiva y puede resultar contraintuitivo?", "o": ["Los padres están muy comprometidos con su tarea educativa (protectores y entrometidos)", "Los padres delegan la educación de sus hijos en otras personas", "Los padres complacen las peticiones materiales para evitar conflictos"], "e": "Aunque haya poco diálogo y mucha rigidez, la diapositiva señala que los padres autoritarios están muy comprometidos con su tarea educativa (protectores y entrometidos). La delegación y la complacencia material son del estilo negligente.", "f": "D"}, {"id": "t4-021", "t": "t4", "lv": 1, "q": "Unos padres delegan la educación de su hijo en abuelos y profesores, le dedican poco tiempo y le compran lo que pide para evitar que llore o se enfade. ¿Qué estilo es?", "o": ["Negligente", "Permisivo", "Democrático"], "e": "El estilo negligente se caracteriza por escasa dedicación educativa, baja exigencia, bajos niveles de afecto, delegación de la función educativa en otros y complacencia material para evitar la ira o el llanto ante una negativa.", "f": "D"}, {"id": "t4-022", "t": "t4", "lv": 1, "q": "¿Qué estilo educativo se asocia a mayor riesgo de conductas delictivas en la adolescencia?", "o": ["Negligente", "Democrático", "Autoritario"], "e": "Entre las características de los hijos de padres negligentes figuran bajo rendimiento escolar, escaso desarrollo de capacidades, riesgo de conductas delictivas, baja autoestima, poca competencia social y poco control de impulsos.", "f": "D"}, {"id": "t4-023", "t": "t4", "lv": 1, "q": "¿Qué conjunto de características de los hijos corresponde al estilo permisivo?", "o": ["Espontaneidad, creatividad, buenas relaciones sociales y autoestima elevada, pero dificultad para controlar impulsos, desobediencia e inmadurez", "Buena adaptación escolar y respeto por las normas, pero sumisión, baja autoestima y poca competencia social", "Bajo rendimiento, escaso desarrollo de capacidades, riesgo de conductas delictivas y baja autoestima"], "e": "Los hijos de padres permisivos muestran espontaneidad y creatividad, buenas relaciones sociales, baja implicación en responsabilidades, dificultades para controlar impulsos, desobediencia, autoestima elevada e inmadurez.", "f": "D"}, {"id": "t4-024", "t": "t4", "lv": 1, "q": "¿En qué dos estilos coinciden los hijos en presentar poca competencia social?", "o": ["Autoritario y negligente", "Permisivo y democrático", "Democrático y autoritario"], "e": "La poca competencia social aparece tanto en los hijos de padres autoritarios como en los de padres negligentes. Los permisivos tienen buenas relaciones sociales y los democráticos son competentes socialmente.", "f": "D"}, {"id": "t4-025", "t": "t4", "lv": 1, "q": "¿Qué estilo educativo se asocia a una autoestima elevada en los hijos, pero también a inmadurez?", "o": ["Permisivo", "Autoritario", "Negligente"], "e": "Autoestima elevada e inmadurez aparecen juntas en las características de los hijos de padres permisivos. Autoritario y negligente se asocian a baja autoestima.", "f": "D"}, {"id": "t4-026", "t": "t4", "lv": 1, "q": "Unos padres explican a su hija por qué debe volver a casa a las 22:00, escuchan sus argumentos, mantienen el límite y le dejan organizar su fin de semana asumiendo que puede equivocarse. ¿Qué estilo representan?", "o": ["Democrático", "Permisivo", "Autoritario"], "e": "El estilo democrático es exigente y firme (pone límites y hace respetar las normas), comprensivo, fomenta la comunicación, tiene normas coherentes pero no rígidas, prefiere el razonamiento a la imposición y fomenta la iniciativa asumiendo errores por inexperiencia.", "f": "D"}, {"id": "t4-027", "t": "t4", "lv": 1, "q": "¿Cuál de estas características corresponde a los hijos de padres democráticos?", "o": ["Mayor autorregulación, desarrollo moral, persistencia en las tareas y buen autocontrol", "Buena adaptación escolar, sumisión y menor iniciativa y creatividad", "Espontaneidad y creatividad, pero inmadurez y desobediencia"], "e": "Los hijos de padres democráticos tienen más probabilidad de éxito académico, son más felices y generosos, más competentes socialmente, con mayor autoestima, autonomía, responsabilidad, autorregulación y desarrollo moral, y son persistentes y con buen autocontrol.", "f": "D"}, {"id": "t4-028", "t": "t4", "lv": 1, "q": "¿Cuál de los siguientes es uno de los 5 principios de la disciplina positiva recogidos en el tema 4?", "o": ["Balance entre firmeza y amabilidad", "Castigo inmediato ante cualquier error", "Elogio constante para mantener la autoestima"], "e": "Los 5 principios de la disciplina positiva son: balance entre firmeza y amabilidad, experiencia revalorizadora de la familia para el infante, educar para toda la vida, enseñanza desde el respeto mutuo y generación de autoconfianza infantil.", "f": "D"}, {"id": "t4-029", "t": "t4", "lv": 1, "q": "Entre las herramientas de disciplina positiva figura «ofrecer aliento en lugar de elogiar». ¿Qué otra herramienta aparece en la misma lista?", "o": ["Conexión antes que corrección", "Tiempo fuera por aislamiento", "Retirada de afecto ante la desobediencia"], "e": "Las herramientas de disciplina positiva incluyen: conexión antes que corrección, escucha activa y reflexiva, contribución, enfoque a largo plazo, respeto mutuo y dignidad, amabilidad y firmeza al mismo tiempo, enfocarse en soluciones, preguntas de curiosidad, aliento en lugar de elogio, llegar a acuerdos y crear rutinas.", "f": "D"}, {"id": "t4-030", "t": "t4", "lv": 1, "q": "Según el tema 4, las amistades en la adolescencia:", "o": ["Se consideran más importantes y son más estables, duraderas, cercanas e intensas", "Pierden importancia frente a la familia, que sigue siendo el principal apoyo emocional", "Son más numerosas pero más superficiales, basadas en compartir actividades de ocio"], "e": "Las amistades adolescentes se consideran más importantes, son más estables y duraderas, más cercanas e intensas, y se basan en el apoyo mutuo, la confianza, la lealtad, la intimidad y el intercambio de pensamientos y sentimientos.", "f": "D"}, {"id": "t4-031", "t": "t4", "lv": 1, "q": "¿En qué se basan las relaciones de amistad adolescentes según el tema 4?", "o": ["En la intimidad, la comprensión interpersonal y el intercambio de pensamientos y sentimientos", "En compartir actividades lúdicas y aficiones comunes, sin intercambio de sentimientos", "En la obediencia al líder del grupo y en la adopción de su
