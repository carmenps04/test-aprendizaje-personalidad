f": "D"}, {"id": "t6-a021", "t": "t6", "lv": 2, "q": "El problema del capitán («26 ovejas y 10 cabras, ¿cuántos años tiene el capitán?») muestra un tipo de aprendizaje que conviene evitar. ¿Cuál?", "o": ["La aplicación mecánica de procedimientos sin comprensión del problema", "Aprendizaje por descubrimiento y memorístico, porque no construye él la información", "Aprendizaje por recepción y memorístico, porque escucha una explicación ya elaborada"], "e": "Responder 36 sumando los datos revela la aplicación de rutinas sin comprender el enunciado. La respuesta correcta es que con esos datos no se puede saber la edad.", "f": "D"}, {"id": "t6-a022", "t": "t6", "lv": 2, "q": "Según los apuntes en PDF, Ausubel distingue un eje memorístico-significativo y otro recepción-descubrimiento. ¿Qué combinación describe a un alumno que escucha una explicación y la relaciona con lo que ya sabe?", "o": ["Aprendizaje por recepción y significativo", "Aprendizaje por descubrimiento y memorístico", "Aprendizaje por recepción y memorístico"], "e": "Recibir la información ya elaborada (explicación) es aprendizaje por recepción; relacionarla con los conocimientos previos lo hace significativo. Ambos ejes son independientes: la recepción puede ser significativa.", "f": "A"}, {"id": "t6-a023", "t": "t6", "lv": 2, "q": "Un alumno aprende a resolver ecuaciones siguiendo siempre los mismos pasos hasta hacerlo sin pensar. ¿Qué tipo de contenido es y qué lo consolida?", "o": ["Procedimiento; la práctica lo automatiza", "Contenido verbal-conceptual; la elaboración semántica lo consolida", "Aprendizaje de sucesos; la asociación de estímulos lo consolida"], "e": "El aprendizaje de procedimientos y estrategias es la adquisición de una secuencia de pasos repetida, que con la práctica se ejecuta de forma automática.", "f": "D"}, {"id": "t6-a024", "t": "t6", "lv": 2, "q": "Un profesor enseña la Revolución Francesa con el mismo método que usa para enseñar a calcular porcentajes: repetir ejercicios. Según el tema 6, ¿qué falla?", "o": ["Trata un contenido conceptual como un procedimiento, cuando requiere relacionarlo con lo que se sabe", "Trata un procedimiento como un aprendizaje de sucesos, que se adquiere por asociación de estímulos", "No hay ningún problema: según el tema 6, todos los contenidos se aprenden de la misma manera"], "e": "El tema plantea que no aprendemos igual una raíz cuadrada que un hecho histórico. El hecho histórico es un aprendizaje verbal-conceptual que se beneficia de la elaboración y el aprendizaje significativo; la práctica repetida es propia de los procedimientos.", "f": "D"}, {"id": "t6-a025", "t": "t6", "lv": 2, "q": "Una alumna recibe el reforzador «¡Estoy muy orgullosa de cómo has resuelto este problema!». Según la diapositiva de reforzadores del tema 6, ¿qué clasificación le corresponde por su naturaleza?", "o": ["Social, porque lo emite otra persona", "Material, porque tiene un valor tangible", "De actividad, porque se vincula a una tarea"], "e": "Por su naturaleza, los reforzadores sociales son los emitidos por otras personas (elogios, afecto). Los materiales son objetos y los de actividad, actividades placenteras.", "f": "D"}, {"id": "t6-a026", "t": "t6", "lv": 2, "q": "¿Qué diferencia hay entre un reforzador primario y uno secundario según su origen?", "o": ["El primario tiene valor innato (comer, afecto); el secundario, valor aprendido (dinero)", "El primario se presenta antes de la conducta y el secundario, después de ella", "El primario es un estímulo interno y el secundario, un estímulo externo al sujeto"], "e": "Según el origen del valor reforzante: primario o incondicionado (valor innato) y secundario o condicionado (valor aprendido, como el dinero). La distinción interno-externo corresponde al proceso (intrínseco-extrínseco).", "f": "D"}, {"id": "t6-a027", "t": "t6", "lv": 2, "q": "¿Qué tienen en común el castigo positivo y el castigo negativo?", "o": ["Ambos reducen la frecuencia, duración o intensidad de la conducta", "Ambos consisten en presentar un estímulo aversivo tras la conducta inadecuada", "Ambos aumentan directamente la frecuencia de la conducta deseada en el aula"], "e": "Todo castigo reduce la conducta. El positivo presenta un estímulo aversivo; el negativo retira un reforzador positivo.", "f": "D"}, {"id": "t6-a028", "t": "t6", "lv": 2, "q": "Una profesora retira la ficha de «encargado de la pizarra» a un alumno por insultar y le dice que la recuperará en cuanto pase un día sin insultos. ¿Qué premisas del coste de respuesta está respetando?", "o": ["Retirada contingente y reforzadores fácilmente recuperables con conductas adecuadas", "Tiempo breve de aplicación y un lugar de espera que no resulte reforzante", "Combinación con castigo positivo y una respuesta emocional visible del docente"], "e": "El coste de respuesta exige que la retirada sea contingente a la conducta problema, proporcional, sin carga emocional y que los reforzadores sean fácilmente recuperables al realizar conductas adecuadas.", "f": "D"}, {"id": "t6-a029", "t": "t6", "lv": 2, "q": "El juez Calatayud condena a un joven que quemó papeleras a trabajar con los bomberos. ¿Por qué se considera un castigo con práctica positiva y no un simple castigo aversivo?", "o": ["Porque sustituye el castigo aversivo por una tarea socialmente útil ligada a la falta", "Porque retira al joven un reforzador de forma contingente y proporcional a la falta", "Porque aparta al joven de su entorno habitual durante un periodo de tiempo breve"], "e": "Las sentencias de Calatayud se presentan como castigos con práctica positiva: la consecuencia es una tarea socialmente apropiada que guarda relación con la conducta y corrige la situación.", "f": "D"}, {"id": "t6-a030", "t": "t6", "lv": 2, "q": "¿Qué combinación de tema 6 y tema 4 resulta más coherente ante una agresión entre alumnos?", "o": ["Inducción para que comprenda el daño y restitución para que lo repare", "Afirmación del poder y castigo positivo sin explicación", "Retirada de afecto y tiempo fuera prolongado"], "e": "La inducción (tema 4) explica por qué la conducta es reprobable y cómo reparar el daño; la restitución (tema 6) exige restaurar el daño y mejorar la situación. La afirmación del poder y la retirada de afecto interfieren en el desarrollo moral.", "f": "D"}, {"id": "t6-a031", "t": "t6", "lv": 2, "q": "Un alumno deja de recibir quejas de sus padres cuando aprueba, y estudia más. Otro deja de estudiar porque, cuando lo hacía, sus amigos se burlaban de él. ¿Qué procesos describen?", "o": ["El primero, reforzamiento negativo; el segundo, castigo positivo", "El primero, castigo negativo; el segundo, reforzamiento positivo", "El primero, reforzamiento positivo; el segundo, castigo negativo"], "e": "Retirar un estímulo aversivo (las quejas) aumenta la conducta: reforzamiento negativo. Presentar un estímulo aversivo (las burlas) tras la conducta la reduce: castigo positivo.", "f": "D"}, {"id": "t6-a032", "t": "t6", "lv": 2, "q": "¿Qué limitación del castigo explica que un alumno sancionado por interrumpir deje de hacerlo, pero no aprenda a pedir la palabra?", "o": ["El castigo suprime respuestas inadecuadas, pero no enseña las deseables", "El castigo nunca llega a eliminar conductas, solo las retrasa en el tiempo", "El castigo solo funciona cuando se combina con reforzadores materiales"], "e": "El tema indica que el castigo es útil para suprimir respuestas inadecuadas, pero no para enseñar las deseables; por eso se combina con el refuerzo de conductas alternativas (como pedir la palabra).", "f": "D"}, {"id": "t6-a033", "t": "t6", "lv": 2, "q": "¿Qué modelo teórico explicaría mejor que un alumno aprenda el concepto de oferta y demanda relacionándolo con sus experiencias de compra?", "o": ["La teoría del aprendizaje significativo de Ausubel", "El condicionamiento operante, porque el alumno recibe una nota por aprenderlo", "El condicionamiento clásico, porque asocia el concepto a situaciones de compra"], "e": "El aprendizaje verbal y conceptual se explica en el tema 6 con la teoría del aprendizaje significativo de Ausubel: lo nuevo se relaciona con lo que ya se sabe y se facilita la elaboración.", "f": "D"}, {"id": "t6-a034", "t": "t6", "lv": 2, "q": "Un profesor da una golosina a cada alumno que responde bien. Al tercer día la golosina ya no motiva y la clase se interrumpe cada vez que la reparte. ¿Qué inconvenientes de los reforzadores materiales aparecen?", "o": ["Fácil saciación e interrupción del programa", "Baja potencia al principio y olvido del administrador", "Retraso en el tiempo y difícil administración inmediata"], "e": "La tabla del tema 6 recoge como inconvenientes de los reforzadores materiales la fácil saciación, la interrupción de la aplicación del programa y la necesidad de acordar que se den solo tras la respuesta deseada.", "f": "D"}, {"id": "t6-a035", "t": "t6", "lv": 2, "q": "¿Por qué el tema 6 considera el aprendizaje de sucesos y conductas «aprendizajes básicos»?", "o": ["Porque los compartimos con muchas especies y nos permiten predecir lo que ocurrirá", "Porque son los únicos aprendizajes que se producen en el contexto escolar", "Porque solo se producen durante la infancia, antes del pensamiento formal"], "e": "Son aprendizajes básicos porque los compartimos con muchas especies, y nos evocan predicciones sobre lo que puede ocurrir por la presencia de estímulos o por las consecuencias de nuestra conducta.", "f": "D"}, {"id": "t6-a036", "t": "t6", "lv": 2, "q": "Una alumna se pone nerviosa al ver al jefe de estudios, porque las veces que la llamó fue para sancionarla, aunque esta vez viene a felicitarla. ¿Qué explica su reacción?", "o": ["Su asociación previa del jefe de estudios con consecuencias aversivas (condicionamiento clásico)", "El reforzamiento negativo de su conducta de evitarle por los pasillos", "La sobrecorrección por restitución aplicada en sus sanciones anteriores"], "e": "La figura del jefe de estudios se ha convertido en un estímulo condicionado por su asociación repetida con experiencias aversivas, y provoca ansiedad por sí sola, al margen de la intención actual.", "f": "D"}, {"id": "t7-001", "t": "t7", "lv": 1, "q": "¿Cuál de estas definiciones de motivación NO aparece en el tema 7-8?", "o": ["La capacidad para memorizar contenidos con rapidez", "Aquello que dirige y mantiene el comportamiento", "La disposición favorable para participar en las actividades planteadas"], "e": "El tema define la motivación como la fuerza que impulsa la actividad para conseguir un objetivo, la disposición favorable para participar, aquello que dirige y mantiene el comportamiento y el por qué y para qué quiero trabajar.", "f": "D"}, {"id": "t7-002", "t": "t7", "lv": 1, "q": "Según el tema 7-8, dos estudiantes con las mismas capacidades y conocimientos:", "o": ["Pueden tener un rendimiento diferente según su motivación", "Tendrán siempre el mismo rendimiento académico", "Solo se diferenciarán por su inteligencia general"], "e": "La diapositiva indica que, dependiendo de la motivación, estudiantes con las mismas capacidades y conocimientos pueden tener un rendimiento diferente.", "f": "D"}, {"id": "t7-003", "t": "t7", "lv": 1, "q": "La motivación intrínseca se asocia a:", "o": ["Actividades gratificantes en sí mismas, en las que no hacen falta incentivos ni castigos", "Conductas dirigidas a obtener recompensas externas o a evitar castigos", "Actuar para agradar a los padres o al profesorado"], "e": "La motivación intrínseca se asocia a actividades gratificantes en sí mismas: es la tendencia natural a buscar y vencer desafíos y perseguir intereses personales, sin necesidad de incentivos ni castigos.", "f": "D"}, {"id": "t7-004", "t": "t7", "lv": 1, "q": "Un alumno estudia Historia para que sus padres le compren un móvil. Su motivación es:", "o": ["Extrínseca", "Intrínseca", "Amotivación"], "e": "La motivación extrínseca dirige la conducta a obtener algo que tiene poco que ver con la propia tarea (recompensas, evitar castigos, agradar a los padres).", "f": "D"}, {"id": "t7-005", "t": "t7", "lv": 1, "q": "¿Con qué resultados se relaciona la motivación intrínseca según el tema 7-8?", "o": ["Buen rendimiento académico, creatividad, comprensión y disfrute por la lectura", "Mayor tendencia a copiar y procesamiento superficial de la información", "Orgullo por las calificaciones y comparación con los demás"], "e": "La motivación intrínseca se relaciona con resultados positivos en la escuela, buen rendimiento académico, creatividad, comprensión y disfrute por la lectura.", "f": "D"}, {"id": "t7-006", "t": "t7", "lv": 1, "q": "¿Cómo podemos crear motivación intrínseca por las tareas académicas según el tema 7-8?", "o": ["Conectando con los intereses del alumnado y fomentando el desarrollo de sus capacidades", "Aumentando los premios materiales para que la tarea resulte más atractiva", "Presionando con plazos y calificaciones para que el alumnado se implique"], "e": "La diapositiva indica que podemos crear motivación intrínseca conectando con los intereses de los estudiantes y fomentando el desarrollo de sus capacidades.", "f": "D"}, {"id": "t7-007", "t": "t7", "lv": 1, "q": "Según el tema 7-8, la motivación que experimentamos en un momento concreto es:", "o": ["Por lo general, una combinación de factores intrínsecos y extrínsecos", "Por lo general, puramente intrínseca cuando la tarea es interesante", "Por lo general, puramente extrínseca en el contexto escolar"], "e": "La diapositiva afirma que la motivación en un momento específico es, por lo general, una combinación de factores extrínsecos e intrínsecos.", "f": "D"}, {"id": "t7-008", "t": "t7", "lv": 1, "q": "¿De qué tres aspectos puede depender la motivación por aprender según el tema 7-8?", "o": ["De cómo ve el material, de su confianza en su competencia y de si el esfuerzo le merece la pena", "Del nivel socioeconómico familiar, la edad y el sexo del estudiante", "De la duración de las clases, el horario y el número de alumnos por aula"], "e": "La motivación por aprender puede depender de cómo ve el estudiante el material (si es interesante), de lo que confía en su competencia y de si cree que el esfuerzo merece la pena.", "f": "D"}, {"id": "t7-009", "t": "t7", "lv": 1, "q": "¿Qué relación establece el tema 7-8 entre motivación y rendimiento?", "o": ["Es directa: a mayor motivación, mayor rendimiento", "Es inversa: a mayor motivación, menor rendimiento", "No existe relación"], "e": "La diapositiva indica que la relación entre motivación y rendimiento es directa: a mayor motivación, mayor rendimiento.", "f": "D"}, {"id": "t7-010", "t": "t7", "lv": 1, "q": "Según el tema 7-8, ¿qué suele aumentar la motivación intrínseca?", "o": ["Toda información que incremente la sensación de competencia del alumno", "Presionar al alumno para que actúe con plazos más cortos", "Comparar públicamente sus notas con las de los demás"], "e": "Toda información que incremente la sensación de competencia suele aumentar la motivación intrínseca. Si presionamos al alumnado, experimenta menos control y su motivación intrínseca baja.", "f": "D"}, {"id": "t7-011", "t": "t7", "lv": 1, "q": "¿Qué ocurre con la motivación intrínseca si presionamos al alumnado para que actúe?", "o": ["Baja, porque experimenta menos control", "Sube, porque aumenta la urgencia", "No cambia"], "e": "La diapositiva indica que si los presionamos para actuar experimentarán menos control y su motivación intrínseca bajará.", "f": "D"}, {"id": "t7-012", "t": "t7", "lv": 1, "q": "¿Cuál de los siguientes factores aparece en el tema 7-8 como influyente en la motivación intrínseca a través del sentido de competencia?", "o": ["Los recordatorios de la fecha límite de entrega de trabajos", "La edad del profesor y su experiencia docente", "El tamaño del aula y el número de alumnos"], "e": "Factores que influyen en la motivación intrínseca afectando al sentido de competencia: experiencia del estudiante, elogios, críticas, recordatorios de fechas límite, calificaciones y reglas (información).", "f": "D"}, {"id": "t7-013", "t": "t7", "lv": 1, "q": "¿En qué tres intereses coincide la mayoría de las personas según el tema 7-8?", "o": ["Ser competentes, relacionarnos con otros y controlar nuestro comportamiento", "Obtener reconocimiento, superar a los demás y evitar el fracaso", "Evitar el esfuerzo, la evaluación y la crítica de los demás"], "e": "La mayoría de las personas tenemos interés por ser competentes, relacionarnos con otros y tener control sobre nuestro comportamiento. Coincide con las necesidades básicas de la Teoría de la Autodeterminación (competencia, relación, autonomía).", "f": "D"}, {"id": "t7-014", "t": "t7", "lv": 1, "q": "La necesidad de relación se define en el tema 7-8 como:", "o": ["El deseo de establecer vínculos emocionales cercanos y de apego con los demás", "La necesidad de controlar el propio comportamiento y tomar decisiones", "La necesidad de sentirse competente al superar desafíos"], "e": "La necesidad de relación es el deseo de establecer vínculos emocionales cercanos y de apego. Las relaciones cordiales con los profesores aumentan la probabilidad de éxito académico en Bachillerato y universidad.", "f": "D"}, {"id": "t7-015", "t": "t7", "lv": 1, "q": "¿Qué efecto tienen las relaciones cordiales con el profesorado en Bachillerato y universidad según el tema 7-8?", "o": ["Aumentan la probabilidad de éxito académico", "Reducen la exigencia académica", "Disminuyen la motivación intrínseca"], "e": "La diapositiva indica que las relaciones cordiales con los profesores aumentan la probabilidad del éxito académico del alumnado de Bachillerato y universidad.", "f": "D"}, {"id": "t7-016", "t": "t7", "lv": 1, "q": "¿Qué tipo de tareas requiere el alumnado según el tema 7-8, dado que evita las actividades con alta probabilidad de fracaso?", "o": ["Tareas ajustadas a sus posibilidades, ni demasiado difíciles ni demasiado fáciles", "Tareas muy difíciles para que el esfuerzo sea mayor y la motivación aumente", "Tareas muy fáciles para asegurar el éxito y proteger su autoestima"], "e": "Los estudiantes están menos dispuestos a participar en actividades con alta probabilidad de fracaso, por lo que requieren tareas que se ajusten a sus posibilidades y estén a su alcance (ni demasiado difíciles ni demasiado fáciles).", "f": "D"}, {"id": "t7-017", "t": "t7", "lv": 1, "q": "¿Cuál de las siguientes es una forma de captar el interés del alumnado según el tema 7-8?", "o": ["Actividades relacionadas con problemas de la vida real y resaltar la utilidad de la materia", "Dictar los apuntes literalmente para que el alumnado tenga toda la información", "Evaluar solo con exámenes finales para que la nota sea el principal incentivo"], "e": "Formas de captar el interés: actividades relacionadas con problemas de la vida real, actividades distintas y proyectos de laboratorio, juegos con desafíos y resaltar la utilidad de la materia.", "f": "D"}, {"id": "t7-018", "t": "t7", "lv": 1, "q": "Según el tema 7-8, una meta es:", "o": ["Un objetivo por el que se lucha y que motiva a reducir la distancia entre dónde se está y dónde se quiere llegar", "Una recompensa material que el profesor entrega cuando el alumno termina la tarea", "Una norma de conducta que el grupo acuerda al inicio del curso"], "e": "La meta es el objetivo que una persona lucha por alcanzar; las metas motivan a actuar para reducir la discrepancia entre dónde están y dónde quieren llegar.", "f": "D"}, {"id": "t7-019", "t": "t7", "lv": 1, "q": "¿Qué tipo de metas incrementan la motivación y la persistencia según el tema 7-8?", "o": ["Metas específicas y moderadamente difíciles", "Metas vagas y muy ambiciosas a largo plazo", "Metas muy fáciles para asegurar el éxito"], "e": "Las metas específicas y moderadamente difíciles tienen altas probabilidades de lograrse y suelen incrementar la motivación y la persistencia.", "f": "D"}, {"id": "t7-020", "t": "t7", "lv": 1, "q": "El ejemplo de Alcohólicos Anónimos («dejar de beber solo por hoy») ilustra que:", "o": ["Que las metas moderadas a corto plazo animan a lograr algo a más largo plazo", "Las metas deben plantearse siempre a largo plazo para que mantengan la motivación", "Las metas generales y poco concretas son más eficaces porque no generan presión"], "e": "La diapositiva usa este ejemplo para mostrar que las metas moderadas representan un desafío a corto plazo que anima a conseguir algo a más largo plazo.", "f": "D"}, {"id": "t7-021", "t": "t7", "lv": 1, "q": "¿Cuántas orientaciones principales hacia las metas distingue el tema 7-8?", "o": ["Cuatro: aprendizaje o dominio, rendimiento o desempeño, evitación del trabajo y sociales", "Dos: metas intrínsecas y metas extrínsecas, según el origen del incentivo", "Tres: metas cooperativas, competitivas e individualistas, según la estructura del aula"], "e": "Hay cuatro orientaciones principales: metas de aprendizaje o dominio, de rendimiento o desempeño, de evitación del trabajo y sociales. Cooperativa, competitiva e individualista son estructuras de metas.", "f": "D"}, {"id": "t7-022", "t": "t7", "lv": 1, "q": "Las metas de aprendizaje o dominio se caracterizan por:", "o": ["Orientarse a la tarea y a desarrollar nuevas habilidades, con un procesamiento estratégico y profundo", "Orientarse a obtener calificaciones y demostrar algo a los demás, con un procesamiento repetitivo", "Orientarse a evitar el trabajo y terminar rápido, con el mínimo esfuerzo posible"], "e": "Las metas de aprendizaje o dominio se orientan al aprendizaje y a la tarea en sí, buscan la satisfacción propia, se dirigen a desarrollar habilidades y superar retos y conllevan un procesamiento estratégico-profundo que favorece el éxito académico.", "f": "D"}, {"id": "t7-023", "t": "t7", "lv": 1, "q": "¿Qué tipo de procesamiento de la información provocan las metas de rendimiento según el tema 7-8?", "o": ["Repetitivo y superficial", "Estratégico y profundo", "Creativo e innovador"], "e": "Las metas de rendimiento, orientadas a las calificaciones y a demostrar algo a los demás, provocan un procesamiento de la información repetitivo y superficial.", "f": "D"}, {"id": "t7-024", "t": "t7", "lv": 1, "q": "Un estudiante percibe una tarea como aburrida, como un castigo, y piensa a quién pedirle el trabajo del curso anterior. ¿Qué meta tiene?", "o": ["Evitación del trabajo", "Aprendizaje o dominio", "Rendimiento"], "e": "Es el estudiante 2 de la actividad del tema: las metas de evitación del trabajo se dirigen a acabar rápido o no trabajar, haciendo las tareas sin esfuerzo.", "f": "D"}, {"id": "t7-025", "t": "t7", "lv": 1, "q": "Un estudiante percibe una tarea como interesante para su formación y piensa en posibles formas de hacerla. ¿Qué meta tiene?", "o": ["Aprendizaje o dominio", "Evitación del trabajo", "Social"], "e": "Es el estudiante 3 de la actividad del tema: percibe la tarea como interesante para su formación, lo que corresponde a una meta de aprendizaje o dominio.", "f": "D"}, {"id": "t7-026", "t": "t7", "lv": 1, "q": "Un estudiante piensa «esto es muy complicado, no sé si voy a ser capaz», percibe la tarea como una amenaza y tiene miedo al fracaso. Según la tabla de emociones del tema 7-8, ¿qué emociones se asocian a su orientación?", "o": ["Ansiedad, vergüenza y desesperanza, propias de la evitación del desempeño", "Disfrute y satisfacción, propios de la orientación al dominio", "Orgullo, propio de la orientación al rendimiento"], "e": "El miedo al fracaso y la percepción de amenaza corresponden a la evitación del desempeño, que incrementa ansiedad, vergüenza y desesperanza, con enfoque en el resultado y falta de control.", "f": "D"}, {"id": "t7-027", "t": "t7", "lv": 1, "q": "Las metas sociales se dirigen a:", "o": ["La búsqueda de relaciones sociales y de intercambio con otros", "La obtención de calificaciones altas que demuestren su valía", "Evitar el esfuerzo y terminar la tarea lo antes posible"], "e": "Las metas sociales se dirigen a la búsqueda de relaciones sociales y de intercambio. Al acercarse a la adolescencia aparecen metas como deportes, citas o divertirse, y hay un subtipo de metas para honrar a la familia o al equipo, que a veces favorecen el aprendizaje.", "f": "D"}, {"id": "t7-028", "t": "t7", "lv": 1, "q": "¿Qué subtipo de metas sociales puede favorecer el aprendizaje según el tema 7-8?", "o": ["Las metas para honrar a la familia o al equipo", "Las metas de evitación del trabajo en grupo", "Las metas de citas, deporte y diversión"], "e": "Dentro de las metas sociales hay un subtipo, las metas para honrar a la familia o al equipo, que a veces favorecen el aprendizaje.", "f": "D"}, {"id": "t7-029", "t": "t7", "lv": 1, "q": "En la tabla comparativa del tema 7-8, ¿cómo se ven los errores desde una meta de aprendizaje?", "o": ["Como información, parte del aprendizaje", "Como fracaso y evidencia de falta de habilidad", "Como algo que hay que ocultar"], "e": "En las metas de aprendizaje los errores son información y parte del aprendizaje; en las de rendimiento son fracaso, evidencia de falta de habilidad o trabajo.", "f": "D"}, {"id": "t7-030", "t": "t7", "lv": 1, "q": "Según la tabla del tema 7-8, ¿qué criterio de evaluación se asocia a las metas de rendimiento?", "o": ["Normas y comparación social con otros", "Criterio absoluto y evidencia de progreso", "Ausencia de evaluación"], "e": "Metas de aprendizaje: criterio absoluto, evidencia de progreso. Metas de rendimiento: normas, comparación social con otros.", "f": "D"}, {"id": "t7-031", "t": "t7", "lv": 1, "q": "Según la tabla del tema 7-8, ¿cómo se define el éxito desde una meta de rendimiento?", "o": ["Calificaciones elevadas, mejor ejecución que los otros, ganar a cualquier precio", "Mejora, progreso, dominio, creatividad, innovación y aprendizaje", "Terminar la tarea lo antes posible y con el mínimo esfuerzo posible"], "e": "En las metas de rendimiento el éxito se define como calificaciones elevadas, mejor ejecución que otros, alto rendimiento en tests estandarizados y ganar a cualquier precio. En las de aprendizaje, como mejora, progreso, dominio, creatividad, innovación y aprendizaje.", "f": "D"}, {"id": "t7-032", "t": "t7", "lv": 1, "q": "¿En qué ponen el valor los estudiantes con metas de rendimiento según la tabla del tema 7-8?", "o": ["En evitar el fracaso", "En el esfuerzo y en intentar tareas desafiantes", "En el significado personal de la actividad"], "e": "Valor puesto en: metas de aprendizaje → esfuerzo e intentar tareas desafiantes; metas de rendimiento → evitar el fracaso. Razones para el esfuerzo: significado intrínseco y personal frente a demostrar el propio valor.", "f": "D"}, {"id": "t7-033", "t": "t7", "lv": 1, "q": "¿Qué tipo de metas suele adoptar el alumnado en grupos competitivos según el tema 7-8?", "o": ["Metas de rendimiento (notas)", "Metas de aprendizaje o dominio", "Metas sociales de cooperación"], "e": "En los grupos competitivos el alumnado suele tener metas de rendimiento; en las clases con buen compañerismo y cooperación se potencian las metas de aprendizaje o dominio.", "f": "D"}, {"id": "t7-034", "t": "t7", "lv": 1, "q": "¿Qué ocurre, según el tema 7-8, cuando los profesores se enfocan en el rendimiento, las calificaciones altas y la competencia?", "o": ["Los alumnos asumen metas de rendimiento, se interfiere en su capacidad de aprender y baja su compromiso", "Los alumnos adoptan metas de aprendizaje y aumenta su compromiso con la tarea", "Los alumnos adoptan metas sociales y mejora el compañerismo en el aula"], "e": "Cuando el profesorado se centra en el rendimiento y fomenta la competencia, los alumnos asumen metas de rendimiento, se interfiere en sus capacidades para aprender y baja su compromiso.", "f": "D"}, {"id": "t7-035", "t": "t7", "lv": 1, "q": "¿Qué características deben tener las metas para que el alumnado esté más predispuesto a asumirlas?", "o": ["Claras, específicas, razonables, moderadamente difíciles y alcanzables a corto plazo", "Ambiciosas, generales y planteadas a largo plazo para mantener la motivación", "Fáciles, abiertas y sin plazo de cumplimiento para evitar la presión"], "e": "Los estudiantes asumen mejor las metas claras, específicas, razonables, moderadamente difíciles y alcanzables a corto plazo.", "f": "D"}, {"id": "t7-036", "t": "t7", "lv": 1, "q": "En una estructura de metas cooperativa, el alumnado considera que:", "o": ["Su meta es alcanzable si los otros también la alcanzan", "Solo alcanzará su meta si los demás no lo consiguen", "Su meta no está relacionada con la de los demás"], "e": "Cooperativa: la meta es alcanzable si los otros también lo hacen (triunfo del equipo). Competitiva: solo si los demás no lo consiguen (concurso, carrera). Individualista: no está relacionada con la de los demás (aprender un idioma, perder peso).", "f": "D"}, {"id": "t7-037", "t": "t7", "lv": 1, "q": "Aprender un nuevo idioma o disfrutar de un museo son ejemplos, según el tema 7-8, de estructura de metas:", "o": ["Individualista", "Competitiva", "Cooperativa"], "e": "En la estructura individualista el alumno cree que su intento por alcanzar la meta no está relacionado con el de los demás (aprender un idioma, disfrutar de un museo, perder peso).", "f": "D"}, {"id": "t7-038", "t": "t7", "lv": 1, "q": "Un concurso de debate en el que solo gana un equipo es un ejemplo de estructura de metas:", "o": ["Competitiva", "Cooperativa", "Individualista"], "e": "En la estructura competitiva los estudiantes creen que alcanzarán la meta solo si los demás no lo consiguen (concurso, competición, carrera).", "f": "D"}, {"id": "t7-039", "t": "t7", "lv": 1, "q": "La autoeficacia se define en el tema 7-8 como:", "o": ["La sensación de tener recursos suficientes para hacer frente a una situación específica", "La evaluación afectiva global que hacemos de nosotros mismos", "La descripción de uno mismo en los dominios que considera importantes"], "e": "La autoeficacia es la sensación de sentirse con recursos suficientes para hacer frente a una situación específica. No debe confundirse con la autoestima (evaluación afectiva) ni con el autoconcepto (descripción).", "f": "D"}, {"id": "t7-040", "t": "t7", "lv": 1, "q": "¿En qué aspectos influye el grado de autoeficacia según el tema 7-8?", "o": ["En qué actividades participamos, cuánto nos esforzamos y perseveramos y cómo reaccionamos", "Únicamente en la memoria a corto plazo y en la velocidad de procesamiento", "En la edad de inicio de la pubertad y en el desarrollo físico"], "e": "La autoeficacia influye en qué actividades participamos, cuánto nos esforzamos, cuánto tiempo perseveramos y cómo son nuestras reacciones emocionales; también en mantener el esfuerzo pese a los obstáculos.", "f": "D"}, {"id": "t7-041", "t": "t7", "lv": 1, "q": "Una alumna con alta autoeficacia suspende un examen. Según el tema 7-8, lo más probable es que lo atribuya a:", "o": ["Causas internas y controlables, como no haber estudiado suficiente", "Su falta de capacidad para la materia, que considera difícil de cambiar", "La mala suerte o la dificultad del examen, que no dependen de ella"], "e": "Las personas con buen sentido de autoeficacia atribuyen sus fracasos a causas internas y controlables (falta de esfuerzo, mala interpretación de las instrucciones, no haber estudiado suficiente).", "f": "D"}, {"id": "t7-042", "t": "t7", "lv": 1, "q": "Un alumno con baja autoeficacia suspende y dice «es que no valgo para esto». Según el tema 7-8, esta atribución es:", "o": ["A una causa estable e incontrolable, la falta de capacidad, asociada a sentimientos depresivos", "A una causa interna y controlable, como no haber estudiado suficiente", "A una causa externa e inestable, como un examen especialmente difícil"], "e": "Las personas con bajo sentido de autoeficacia atribuyen sus fracasos a causas estables e incontrolables, como la falta de capacidad. La baja autoeficacia se relaciona con sentimientos de inutilidad, autodevaluación y tristeza típicos de la depresión.", "f": "D"}, {"id": "t7-043", "t": "t7", "lv": 1, "q": "Según el tema 7-8, ¿qué ha demostrado la neurociencia sobre las emociones y el aprendizaje?", "o": ["Que las emociones son causa y consecuencia del aprendizaje", "Que las emociones no influyen en el aprendizaje", "Que solo las emociones negativas favorecen la memoria"], "e": "La diapositiva indica que la neurociencia ha demostrado que las emociones son causa y consecuencia del aprendizaje; prestamos más atención y recordamos mejor lo que nos provoca emociones positivas.", "f": "D"}, {"id": "t7-044", "t": "t7", "lv": 1, "q": "¿Por qué las emociones negativas pueden interferir en el aprendizaje según el tema 7-8?", "o": ["Porque ocupan la atención o el espacio de la memoria de trabajo, necesaria para aprender", "Porque borran los recuerdos previos y obligan a reaprender los contenidos", "Porque aumentan la velocidad de procesamiento y provocan errores por precipitación"], "e": "Las emociones negativas a veces interfieren al ocupar la atención o el espacio de la memoria de trabajo, que es necesario para aprender.", "f": "D"}, {"id": "t7-045", "t": "t7", "lv": 1, "q": "¿En qué tres momentos aparecen las emociones asociadas al rendimiento según el tema 7-8?", "o": ["Al prever un reto (un examen), al afrontarlo y al conocer su resultado", "Solo después de recibir la calificación, como orgullo o vergüenza", "Solo durante la realización del examen, como ansiedad o bloqueo"], "e": "Las emociones asociadas al rendimiento aparecen cuando el alumno prevé un reto futuro (examen), cuando lo afronta (mientras lo hace) y cuando se enfrenta a su resultado (calificación).", "f": "D"}, {"id": "t7-046", "t": "t7", "lv": 1, "q": "¿De qué dependen las emociones asociadas al rendimiento según el tema 7-8?", "o": ["Del valor que demos a los conocimientos que vamos a aprender y de las expectativas de éxito", "Exclusivamente del temperamento y de los rasgos de personalidad del alumno", "Del número de horas de estudio que ha dedicado a la materia antes del examen"], "e": "Estas emociones dependen del valor que le demos a los conocimientos y de las expectativas de éxito.", "f": "D"}, {"id": "t7-047", "t": "t7", "lv": 1, "q": "Según la tabla de emociones del tema 7-8, ¿qué emoción incrementa la orientación al rendimiento (notas)?", "o": ["El orgullo", "El disfrute de la actividad", "La desesperanza"], "e": "Dominio: disfrute y satisfacción, y disminuyen el aburrimiento y el enojo. Rendimiento: incrementa el orgullo. Evitación del desempeño: incrementa ansiedad, vergüenza y desesperanza.", "f": "D"}, {"id": "t7-048", "t": "t7", "lv": 1, "q": "Según la tabla de emociones del tema 7-8, ¿qué emociones disminuyen con una orientación al dominio?", "o": ["El aburrimiento y el enojo", "El orgullo y la satisfacción", "La esperanza y el disfrute"], "e": "La orientación al dominio (enfoque en la actividad, controlable, valoración positiva) aumenta el disfrute y la satisfacción y disminuye el aburrimiento y el enojo.", "f": "D"}, {"id": "t7-049", "t": "t7", "lv": 1, "q": "¿Cómo pueden incrementarse las emociones de logro según el tema 7-8?", "o": ["Ajustando la dificultad al nivel del alumnado y dando opciones que aumenten su control", "Aumentando la competitividad entre el alumnado y premiando a los mejores", "Reduciendo la retroalimentación para no presionar al alumnado"], "e": "Para incrementar las emociones de logro (aumentando la confianza en uno mismo): ajustar la dificultad al nivel del alumnado y dar alternativas u opciones que incrementen su sensación de control.", "f": "D"}, {"id": "t7-050", "t": "t7", "lv": 1, "q": "¿Cuál de estas pautas para motivar aparece en el resumen del tema 7-8?", "o": ["Hacer hincapié en la comparación consigo mismos y no con los demás", "Dar la máxima importancia a las calificaciones y a la competición", "Señalar los errores ante el grupo para que no se repitan"], "e": "El resumen incluye: estimular la curiosidad, mostrar relevancia y utilidad, desafío óptimo, reducir el riesgo de fracaso, modelar el entusiasmo, evaluar comprensión, progreso, esfuerzo y creatividad, no ridiculizar errores, comparar consigo mismos y no dar demasiada importancia a las notas ni a la competitividad.", "f": "D"}, {"id": "t7-051", "t": "t7", "lv": 1, "q": "«Criticar hechos, no personas» es una pauta del tema 7-8 relacionada con:", "o": ["No ridiculizar al alumnado por sus errores", "La técnica del tiempo fuera, que aparta al alumno de la actividad", "El reforzamiento negativo, que retira un estímulo aversivo"], "e": "Entre las pautas para motivar figura no ridiculizar por los errores, criticando los hechos y no a las personas.", "f": "D"}, {"id": "t7-052", "t": "t7", "lv": 1, "q": "¿Qué pauta del resumen del tema 7-8 conecta con la autodeterminación?", "o": ["Fomentar la autonomía dando el máximo de opciones posibles y valorando su opinión", "Usar recompensas externas para que el alumnado elija las tareas", "Imponer las tareas sin explicación para evitar distracciones"], "e": "El resumen incluye fomentar la autonomía (autodeterminación): dar el máximo de opciones posibles y valorar su opinión.", "f": "D"}, {"id": "t7-053", "t": "t7", "lv": 1, "q": "¿Qué recomienda el tema 7-8 sobre las habilidades académicas?", "o": ["Enfatizar que pueden mejorar y que son específicas de la tarea", "Transmitir que son innatas y estables para ajustar las expectativas", "Evitar hablar de ellas para no generar comparaciones"], "e": "El resumen recomienda enfatizar que las habilidades académicas pueden mejorar y que son específicas de la tarea, lo que favorece atribuciones controlables.", "f": "D"}, {"id": "t7-054", "t": "t7", "lv": 1, "q": "Una profesora recuerda a un alumno los problemas que antes no resolvía y ahora sí. ¿Qué principio motivacional aplica?", "o": ["La comparación consigo mismo y no con los demás", "La estructura de metas competitiva", "El reforzamiento negativo del esfuerzo"], "e": "La diapositiva propone hacer hincapié en la comparación consigo mismos y no con los demás (recordar lo que antes no resolvían y ahora sí).", "f": "D"}, {"id": "t7-055", "t": "t7", "lv": 1, "q": "¿Quiénes son los autores de la Teoría de la Autodeterminación que aparece en el tema 7-8?", "o": ["Richard M. Ryan y Edward L. Deci", "Albert Bandura y Julian Rotter", "Bernard Weiner y Carol Dweck"], "e": "Las diapositivas muestran el libro Self-Determination Theory: Basic Psychological Needs in Motivation, Development, and Wellness, de Richard M. Ryan y Edward L. Deci.", "f": "D"}, {"id": "t7-056", "t": "t7", "lv": 1, "q": "En el continuo de autodeterminación de Ryan y Deci, ¿qué tipo de motivación se sitúa en el extremo no autodeterminado?", "o": ["La amotivación", "La motivación intrínseca", "La regulación integrada"], "e": "El continuo va de la conducta no autodeterminada (amotivación, sin regulación, locus impersonal) a la autodeterminada (motivación intrínseca), pasando por cuatro tipos de regulación extrínseca.", "f": "D"}, {"id": "t7-057", "t": "t7", "lv": 1, "q": "¿Cuál es el orden correcto de los tipos de regulación extrínseca, de menos a más autodeterminada?", "o": ["Externa → introyectada → identificada → integrada", "Introyectada → externa → integrada → identificada", "Identificada → integrada → externa → introyectada"], "e": "En la tabla de Ryan y Deci la motivación extrínseca incluye, de menor a mayor autodeterminación: regulación externa, introyectada, identificada e integrada. Después viene la regulación intrínseca.", "f": "D"}, {"id": "t7-058", "t": "t7", "lv": 1, "q": "La amotivación se caracteriza, según la tabla de Ryan y Deci, por:", "o": ["Ausencia de regulación, locus impersonal, conducta no intencional e incompetencia percibida", "Locus algo externo, con autocontrol, implicación del ego y recompensas y castigos internos", "Locus externo, con obediencia, recompensas externas y castigos"], "e": "La amotivación tiene un tipo de regulación «sin regulación», locus de causalidad impersonal y procesos reguladores como no intencional, no valorado, incompetencia y pérdida de control.", "f": "D"}, {"id": "t7-059", "t": "t7", "lv": 1, "q": "Un alumno hace los deberes solo para evitar que le castiguen. Según el continuo de Ryan y Deci, ¿qué regulación presenta?", "o": ["Regulación externa", "Regulación identificada", "Regulación intrínseca"], "e": "La regulación externa tiene un locus de causalidad externo y sus procesos son la obediencia, las recompensas externas y los castigos.", "f": "D"}, {"id": "t7-060", "t": "t7", "lv": 1, "q": "Una alumna estudia porque se sentiría culpable y avergonzada si no lo hiciera. Según Ryan y Deci, su regulación es:", "o": ["Introyectada", "Integrada", "Identificada"], "e": "La regulación introyectada tiene un locus algo externo y sus procesos son el autocontrol, la implicación del ego y las recompensas y castigos internos (culpa, vergüenza, orgullo).", "f": "D"}, {"id": "t7-061", "t": "t7", "lv": 1, "q": "Un alumno estudia Estadística porque, aunque no le divierte, valora conscientemente su importancia para su futuro profesional. Su regulación es:", "o": ["Identificada", "Introyectada", "Intrínseca"], "e": "La regulación identificada tiene un locus algo interno y sus procesos son la importancia personal y la valoración consciente. Sigue siendo extrínseca porque la actividad no resulta gratificante en sí misma.", "f": "D"}, {"id": "t7-062", "t": "t7", "lv": 1, "q": "¿Qué tipo de regulación extrínseca está más próxima a la motivación intrínseca, con locus interno y congruencia y síntesis con uno mismo?", "o": ["Regulación integrada", "Regulación identificada", "Regulación introyectada"], "e": "La regulación integrada tiene un locus interno y sus procesos son congruencia, consciencia y síntesis con uno mismo. Es la forma más autodeterminada de motivación extrínseca.", "f": "D"}, {"id": "t7-063", "t": "t7", "lv": 1, "q": "¿Qué procesos reguladores caracterizan la motivación intrínseca en la tabla de Ryan y Deci?", "o": ["Interés, disfrute y satisfacción inherente", "Obediencia, recompensas externas y castigos", "Autocontrol, implicación del ego y culpa"], "e": "La motivación intrínseca (regulación intrínseca, locus interno) se caracteriza por interés, disfrute y satisfacción inherente.", "f": "D"}, {"id": "t7-064", "t": "t7", "lv": 1, "q": "¿Cuál es el locus de causalidad de la regulación introyectada en la tabla de Ryan y Deci?", "o": ["Algo externo", "Algo interno", "Impersonal"], "e": "Locus de causalidad: amotivación → impersonal; externa → externo; introyectada → algo externo; identificada → algo interno; integrada → interno; intrínseca → interno.", "f": "D"}, {"id": "t7-065", "t": "t7", "lv": 1, "q": "La macroteoría de la autodeterminación se concreta, según la diapositiva, en:", "o": ["Seis subteorías", "Cuatro estadios", "Tres niveles morales"], "e": "La diapositiva indica que la macroteoría de la autodeterminación se concreta a través de seis subteorías: evaluación cognitiva, integración orgánica, orientación de causalidad, necesidades básicas, contenidos de meta y motivación de las relaciones.", "f": "D"}, {"id": "t7-066", "t": "t7", "lv": 1, "q": "¿Qué subteoría de la autodeterminación desarrolla el concepto de necesidades psicológicas innatas, universales y esenciales (autonomía, competencia y relaciones sociales)?", "o": ["Teoría de las necesidades básicas", "Teoría de la evaluación cognitiva", "Teoría de la orientación de causalidad"], "e": "La teoría de las necesidades básicas desarrolla el concepto de necesidad referido a aspectos psicológicos innatos, universales y esenciales para el crecimiento, la integridad y el bienestar: autonomía, competencia y relaciones sociales.", "f": "D"}, {"id": "t7-067", "t": "t7", "lv": 1, "q": "¿Qué subteoría de la autodeterminación se centra en la motivación intrínseca (actividades realizadas por el simple placer que suponen)?", "o": ["Teoría de la evaluación cognitiva", "Teoría de la integración orgánica", "Teoría de los contenidos de meta"], "e": "La teoría de la evaluación cognitiva hace referencia a la motivación intrínseca, la que se da en actividades realizadas por el simple placer y satisfacción que suponen.", "f": "D"}, {"id": "t7-068", "t": "t7", "lv": 1, "q": "¿Qué subteoría establece que la motivación es un continuo de niveles de autodeterminación, de la conducta no autodeterminada a la autodeterminada?", "o": ["Teoría de la integración orgánica", "Teoría de las necesidades básicas", "Teoría de la motivación de las relaciones"], "e": "La teoría de la integración orgánica establece que la motivación es un continuo caracterizado por distintos niveles de autodeterminación.", "f": "D"}, {"id": "t7-069", "t": "t7", "lv": 1, "q": "¿Qué subteoría de la autodeterminación analiza las diferencias individuales en las orientaciones causales (autonomía, control e impersonal)?", "o": ["Teoría de la orientación de causalidad", "Teoría de la evaluación cognitiva", "Teoría de los contenidos de meta"], "e": "La teoría de la orientación de causalidad se centra en las diferencias individuales en la tendencia hacia un comportamiento autodeterminado, con tres orientaciones causales: autonomía, control e impersonal.", "f": "D"}, {"id": "t7-070", "t": "t7", "lv": 1, "q": "¿Qué subteoría de la autodeterminación se centra en las diferencias entre metas intrínsecas y extrínsecas y su impacto en la motivación y el bienestar?", "o": ["Teoría de los contenidos de meta", "Teoría de la integración orgánica", "Teoría de las necesidades básicas"], "e": "La teoría de los contenidos de meta se centra en las diferencias entre metas intrínsecas y extrínsecas y su impacto en la motivación y el bienestar de las personas.", "f": "D"}, {"id": "t7-071", "t": "t7", "lv": 1, "q": "En el puzle de los cuatro componentes que muestra la diapositiva de autodeterminación, ¿cuáles son?", "o": ["Ser capaz, ser autónomo, organizarse y conocerse", "Atención, memoria, razonamiento e intuición", "Curiosidad, aprendizaje, búsqueda y destrucción"], "e": "La diapositiva presenta cuatro componentes: ser capaz (empoderamiento psicológico), ser autónomo, organizarse (autorregulación) y conocerse (realización personal).", "f": "D"}, {"id": "t7-072", "t": "t7", "lv": 1, "q": "¿Con qué se asocia el componente «organizarse» en el puzle de la autodeterminación?", "o": ["Con la autorregulación: adaptarse, anticipar, planificar y evaluar", "Con el empoderamiento psicológico: conocimiento, autoestima y confianza en uno mismo", "Con la realización personal: saber quién eres, lo que te gusta y lo que no"], "e": "En el puzle, «organizarse» corresponde a la autorregulación (capacidad de adaptarse, anticipar, planificar, evaluar; funciones ejecutivas). «Ser capaz» es el empoderamiento psicológico y «conocerse», la realización personal.", "f": "D"}, {"id": "t7-073", "t": "t7", "lv": 1, "q": "Un docente quiere favorecer una regulación más autodeterminada en su alumnado. ¿Qué estrategia es más coherente con el tema 7-8?", "o": ["Dar opciones, explicar el valor de la tarea, ajustar la dificultad y cuidar la relación", "Aumentar las recompensas materiales y los castigos para orientar la conducta", "Presionar con fechas límite y comparar las notas del alumnado en público"], "e": "Satisfacer las necesidades de autonomía (opciones), competencia (dificultad ajustada) y relación (vínculo cordial) favorece regulaciones más autodeterminadas. Presionar reduce la sensación de control y la motivación intrínseca.", "f": "D"}, {"id": "t7-a001", "t": "t7", "lv": 2, "q": "Lucía estudia Matemáticas porque, si suspende, siente que defrauda a su familia y se avergüenza. Pablo estudia Matemáticas porque quiere ser ingeniero y sabe que las necesitará, aunque no le gustan. Según Ryan y Deci, ¿qué regulación presenta cada uno?", "o": ["Lucía, introyectada; Pablo, identificada", "Lucía, externa; Pablo, integrada", "Lucía, identificada; Pablo, intrínseca"], "e": "La culpa y la vergüenza (recompensas y castigos internos, implicación del ego) definen la regulación introyectada. Valorar conscientemente la importancia personal de una actividad que no resulta placentera es regulación identificada. Ninguno estudia por disfrute, así que no es intrínseca.", "f": "D"}, {"id": "t7-a002", "t": "t7", "lv": 2, "q": "Marcos lee novelas de historia porque disfruta con ellas; su compañera Irene lee las mismas novelas porque leer forma parte de cómo se ve a sí misma como futura profesora de Historia, aunque no siempre disfruta. Según Ryan y Deci:", "o": ["Marcos tiene regulación intrínseca e Irene integrada", "Marcos tiene regulación integrada e Irene intrínseca", "Ambos tienen regulación identificada"], "e": "Interés, disfrute y satisfacción inherente definen la regulación intrínseca. La regulación integrada (congruencia, consciencia, síntesis con uno mismo) es la forma más autodeterminada de motivación extrínseca: la conducta encaja con la identidad, pero no se realiza por el placer de la actividad.", "f": "D"}, {"id": "t7-a003", "t": "t7", "lv": 2, "q": "Un alumno dice: «No sé para qué hago esto; da igual lo que haga, voy a suspender». En la tabla de Ryan y Deci, ¿qué tipo de motivación y qué locus de causalidad corresponden?", "o": ["Amotivación, con locus de causalidad impersonal", "Regulación externa, con locus de causalidad externo", "Regulación introyectada, con locus de causalidad algo externo"], "e": "La amotivación implica ausencia de regulación, conducta no intencional y no valorada, sensación de incompetencia y pérdida de control, con locus impersonal. Conecta con la baja autoeficacia y las atribuciones a causas estables e incontrolables.", "f": "D"}, {"id": "t7-a004", "t": "t7", "lv": 2, "q": "Una profesora reparte puntos canjeables por subir nota a quien entregue los deberes. Desde la Teoría de la Autodeterminación, ¿qué tipo de regulación promueve directamente esta medida?", "o": ["Regulación externa, basada en recompensas externas", "Regulación integrada, basada en la congruencia con uno mismo", "Regulación intrínseca, basada en el disfrute de la tarea"], "e": "Las recompensas externas y los castigos son los procesos de la regulación externa, la forma menos autodeterminada de motivación extrínseca. Desde el tema 6, los puntos canjeables son reforzadores simbólicos.", "f": "D"}, {"id": "t7-a005", "t": "t7", "lv": 2, "q": "¿Qué orden de los tipos de motivación, de menor a mayor autodeterminación, recoge la tabla de Ryan y Deci?", "o": ["Amotivación → regulación externa → introyectada → identificada → integrada → motivación intrínseca", "Amotivación → introyectada → externa → integrada → identificada → motivación intrínseca", "Regulación externa → amotivación → identificada → introyectada → intrínseca → integrada"], "e": "El continuo va de la conducta no autodeterminada (amotivación) a la autodeterminada (motivación intrínseca), pasando por las regulaciones externa, introyectada, identificada e integrada.", "f": "D"}, {"id": "t7-a006", "t": "t7", "lv": 2, "q": "¿Qué tienen en común las regulaciones introyectada e identificada en la tabla de Ryan y Deci?", "o": ["Ambas son formas de motivación extrínseca, aunque la identificada es más autodeterminada", "Ambas tienen un locus de causalidad interno y se basan en el disfrute", "Ambas son formas de amotivación con distinto grado de control"], "e": "Las dos son tipos de motivación extrínseca: la introyectada (locus algo externo; autocontrol, ego, recompensas y castigos internos) y la identificada (locus algo interno; importancia personal, valoración consciente). La identificada está más cerca del extremo autodeterminado.", "f": "D"}, {"id": "t7-a007", "t": "t7", "lv": 2, "q": "Un docente quiere que su alumnado pase de una regulación externa a una identificada en la asignatura de Economía. ¿Qué estrategia del tema 7-8 resulta más coherente?", "o": ["Mostrar la relevancia y utilidad de los contenidos para su vida y conectarlos con sus intereses", "Aumentar la frecuencia de exámenes sorpresa para que la presión mantenga su atención en la materia", "Premiar con puntos extra a quien saque las notas más altas para que todos aspiren a ese reconocimiento"], "e": "La regulación identificada se basa en la importancia personal y la valoración consciente. Mostrar la relevancia y la utilidad (valor instrumental para la vida y otras materias) y conectar con sus intereses favorece esa valoración. Presión y premios mantienen la regulación externa.", "f": "D"}, {"id": "t7-a008", "t": "t7", "lv": 2, "q": "¿Qué subteoría de la autodeterminación explicaría que un alumno muy autónomo en un contexto sea mucho más dependiente del control externo que otro en la misma clase?", "o": ["La teoría de la orientación de causalidad, centrada en las diferencias individuales", "La teoría de la evaluación cognitiva, centrada en la motivación intrínseca", "La teoría de la integración orgánica, centrada en el continuo de regulación"], "e": "La teoría de la orientación de causalidad se centra en las diferencias individuales en la tendencia hacia un comportamiento autodeterminado, con tres orientaciones causales: autonomía, control e impersonal.", "f": "D"}, {"id": "t7-a009", "t": "t7", "lv": 2, "q": "Un centro quiere aplicar la teoría de las necesidades básicas de Ryan y Deci. ¿Qué tres necesidades debe atender?", "o": ["Autonomía, competencia y relaciones sociales", "Seguridad, pertenencia y autorrealización", "Logro, poder y afiliación"], "e": "La teoría de las necesidades básicas desarrolla el concepto de necesidades psicológicas innatas, universales y esenciales para el crecimiento y el bienestar: autonomía, competencia y relaciones sociales. Coinciden con los tres intereses del tema 7-8: ser competentes, relacionarnos con otros y tener control sobre nuestro comportamiento.", "f": "D"}, {"id": "t7-a010", "t": "t7", "lv": 2, "q": "En una clase, la profesora permite elegir entre tres temas para el trabajo, adapta la dificultad a cada nivel y dedica tiempo a conocer a sus alumnos. Desde la teoría de las necesidades básicas, ¿qué necesidad atiende cada medida?", "o": ["Elegir tema: autonomía; adaptar la dificultad: competencia; conocerlos: relación", "Elegir tema: competencia; adaptar la dificultad: relación; conocerlos: autonomía", "Elegir tema: relación; adaptar la dificultad: autonomía; conocerlos: competencia"], "e": "Dar opciones satisface la autonomía; ajustar la dificultad al nivel permite experimentar competencia; el vínculo cercano satisface la necesidad de relación.", "f": "D"}, {"id": "t7-a011", "t": "t7", "lv": 2, "q": "Ante un trabajo nuevo, Ana piensa «no lo he hecho nunca, seguro que me sale mal»; Rubén piensa «qué aburrido, le pediré el del año pasado a mi primo»; y Sara piensa «esto me puede servir, voy a ver cómo lo planteo». ¿Qué orientaciones de meta reflejan?", "o": ["Ana: evitación del desempeño; Rubén: evitación del trabajo; Sara: aprendizaje", "Ana: rendimiento por miedo a la nota; Rubén: social; Sara: aprendizaje", "Ana: evitación del trabajo; Rubén: rendimiento; Sara: meta social"], "e": "El caso reproduce la actividad del tema: el miedo al fracaso y la percepción de amenaza corresponden a la evitación del desempeño; buscar acabar sin esforzarse (copiar el trabajo anterior) es evitación del trabajo; percibir la tarea como interesante para su formación es meta de aprendizaje o dominio.", "f": "D"}, {"id": "t7-a012", "t": "t7", "lv": 2, "q": "Siguiendo la tabla de emociones del tema 7-8, ¿qué emociones son más probables en Ana (miedo al fracaso), Rubén (meta de rendimiento centrada en la nota) y Sara (meta de dominio)?", "o": ["Ana: ansiedad y vergüenza; Rubén: orgullo; Sara: disfrute y satisfacción", "Ana: orgullo por esforzarse; Rubén: disfrute de la tarea; Sara: ansiedad ante el reto", "Ana: aburrimiento y enojo; Rubén: desesperanza y vergüenza; Sara: orgullo"], "e": "La evitación del desempeño incrementa la ansiedad, la vergüenza y la desesperanza; la orientación al rendimiento incrementa el orgullo; el dominio aumenta el disfrute y la satisfacción y reduce el aburrimiento y el enojo.", "f": "D"}, {"id": "t7-a013", "t": "t7", "lv": 2, "q": "Según la tabla del tema 7-8, ¿qué diferencia a la orientación al rendimiento de la evitación del desempeño, si ambas se centran en el resultado?", "o": ["En el rendimiento hay control y se valora el resultado; en la evitación, falta de control y valoración negativa", "En el rendimiento se valora la actividad en sí; en la evitación del desempeño se valora el resultado final", "En el rendimiento predominan la ansiedad y la vergüenza; en la evitación del desempeño predomina el orgullo"], "e": "La tabla describe el rendimiento como enfoque en el resultado, de carácter controlable y con valoración del resultado (orgullo); la evitación del desempeño, como enfoque en el resultado con falta de control y valoración negativa (ansiedad, vergüenza, desesperanza).", "f": "D"}, {"id": "t7-a014", "t": "t7", "lv": 2, "q": "Un alumno con metas de rendimiento saca un 9 copiando parte del examen y se siente orgulloso. Integrando los temas 4 y 7-8, ¿qué explica mejor su conducta?", "o": ["Las metas de rendimiento valoran el resultado por encima del aprendizaje y se asocian a más trampas", "Las metas de aprendizaje llevan a buscar el éxito a cualquier precio, incluso copiando en los exámenes", "La alta autoeficacia lleva a copiar para confirmar ante los demás la propia competencia académica"], "e": "Desde una meta de rendimiento el éxito se define como calificaciones elevadas y ganar a cualquier precio, y la emoción asociada es el orgullo. El tema 4 indica que los estudiantes con metas de desempeño copian más que los de metas de aprendizaje.", "f": "D"}, {"id": "t7-a015", "t": "t7", "lv": 2, "q": "En una clase el profesor publica un ranking semanal de notas. Según el tema 7-8, ¿qué efecto es más probable?", "o": ["Que el alumnado asuma metas de rendimiento, se interfiera su aprendizaje y baje su compromiso", "Que el alumnado adopte metas de aprendizaje y aumente su compromiso con la tarea", "Que el alumnado adopte metas cooperativas al compararse entre sí"], "e": "Cuando el profesorado se enfoca en el rendimiento, las calificaciones altas y la competencia, los alumnos asumen metas de rendimiento, se interfiere en su capacidad de aprender y baja su compromiso. En grupos competitivos predominan las metas de rendimiento.", "f": "D"}, {"id": "t7-a016", "t": "t7", "lv": 2, "q": "Una profesora quiere fomentar metas de aprendizaje en su grupo. Según el tema 7-8, ¿qué clima de aula debe crear?", "o": ["Un clima de compañerismo y cooperación, con desafío, apoyo mutuo y enfoque en el aprendizaje", "Un clima competitivo con premios para los mejores, que estimule el esfuerzo individual", "Un clima individualista en el que cada alumno trabaje sin relación con los demás"], "e": "En las clases con buen compañerismo y cooperación se potencian las metas de aprendizaje o dominio; el desafío, el apoyo mutuo y el enfoque al aprendizaje crean un ambiente positivo. La competición favorece metas de rendimiento.", "f": "D"}, {"id": "t7-a017", "t": "t7", "lv": 2, "q": "En un proyecto de aula la nota del grupo depende de que todos sus miembros dominen el contenido. ¿Qué estructura de metas se está aplicando?", "o": ["Cooperativa: cada alumno alcanza su meta si los demás también la alcanzan", "Competitiva: cada alumno alcanza su meta solo si los demás no lo hacen", "Individualista: la meta de cada alumno no depende de la de los demás"], "e": "En la estructura cooperativa los alumnos consideran que su meta es alcanzable si los otros también la alcanzan (triunfo del equipo).", "f": "D"}, {"id": "t7-a018", "t": "t7", "lv": 2, "q": "Tras suspender, Clara dice «no estudié lo suficiente y entendí mal las instrucciones; la próxima vez lo haré mejor». Daniel dice «no valgo para esto». ¿Qué relación con la autoeficacia establece el tema 7-8?", "o": ["Clara, alta autoeficacia (causa interna y controlable); Daniel, baja (causa estable e incontrolable)", "Clara, baja autoeficacia porque se culpa del suspenso; Daniel, alta porque protege su autoestima", "Ambos muestran alta autoeficacia, porque los dos asumen su responsabilidad en el suspenso"], "e": "Las personas con buena autoeficacia atribuyen sus fracasos a causas internas y controlables (falta de esfuerzo, mala interpretación de las instrucciones). Las de baja autoeficacia los atribuyen a causas estables e incontrolables, como la falta de capacidad, y presentan sentimientos de inutilidad típicos de la depresión.", "f": "D"}, {"id": "t7-a019", "t": "t7", "lv": 2, "q": "¿Por qué el tema 7-8 recomienda enfatizar que las habilidades académicas pueden mejorar y son específicas de la tarea?", "o": ["Porque favorece atribuir los fracasos a causas controlables y mantener la autoeficacia", "Porque permite comparar a cada alumno con los compañeros más capaces y fijar un modelo", "Porque reduce la importancia del esfuerzo y centra la evaluación en la capacidad"], "e": "Si las habilidades se presentan como mejorables y específicas, el alumno puede atribuir el fracaso a causas internas y controlables (esfuerzo, estrategia), lo que caracteriza a la alta autoeficacia y sostiene la persistencia.", "f": "D"}, {"id": "t7-a020", "t": "t7", "lv": 2, "q": "Una alumna con alta autoeficacia en Lengua pero baja en Matemáticas evita apuntarse a la olimpiada matemática, aunque se apunta a todos los concursos de escritura. ¿Qué aspecto de la autoeficacia ilustra?", "o": ["Que es específica de la situación e influye en qué actividades elegimos participar", "Que es un rasgo global que afecta por igual a todas las materias", "Que solo influye en las reacciones emocionales, no en la conducta"], "e": "La autoeficacia es la sensación de tener recursos para una situación específica, e influye en qué actividades participamos, cuánto nos esforzamos, cuánto perseveramos y cómo reaccionamos emocionalmente.", "f": "D"}, {"id": "t7-a021", "t": "t7", "lv": 2, "q": "Un alumno se bloquea en los exámenes: la ansiedad le impide recordar lo que sabía. ¿Qué explicación ofrece el tema 7-8?", "o": ["Las emociones negativas pueden ocupar la atención y la memoria de trabajo que necesita para recordar", "La ansiedad mejora siempre el rendimiento, porque aumenta la activación durante el examen", "Las emociones solo influyen después de recibir la calificación, no mientras se realiza la prueba"], "e": "El tema indica que las emociones negativas a veces interfieren en el aprendizaje al ocupar la atención o el espacio de la memoria de trabajo. Además, las emociones de rendimiento aparecen antes, durante y después del examen.", "f": "D"}, {"id": "t7-a022", "t": "t7", "lv": 2, "q": "¿Cuál de estas medidas incrementa con más probabilidad las emociones de logro según el tema 7-8?", "o": ["Ajustar la dificultad al nivel del alumnado y dar opciones que aumenten su sensación de control", "Elevar la dificultad por encima de su nivel para que el éxito sea más valioso", "Reducir la retroalimentación para no influir en su autonomía"], "e": "Para incrementar las emociones de logro (aumentando la confianza en uno mismo) el tema propone ajustar la dificultad de la tarea al nivel del alumnado y dar alternativas u opciones que incrementen la sensación de control.", "f": "D"}, {"id": "t7-a023", "t": "t7", "lv": 2, "q": "Un profesor recuerda a su grupo cada día la fecha de entrega, corrige con críticas duras y pone notas con mucha frecuencia. Según el tema 7-8, ¿por qué podría estar afectando a la motivación intrínseca?", "o": ["Porque críticas, recordatorios y notas afectan al sentido de competencia, y la presión resta control", "Porque la motivación intrínseca depende solo de las recompensas materiales que reciba el alumno", "Porque la motivación intrínseca es un rasgo estable que no puede modificarse desde el aula"], "e": "El tema recoge como factores que influyen en la motivación intrínseca, al afectar al sentido de competencia, la experiencia, los elogios, las críticas, los recordatorios de fechas límite, las calificaciones y las reglas. Además, si presionamos, el alumnado experimenta menos control y su motivación intrínseca baja.", "f": "D"}, {"id": "t7-a024", "t": "t7", "lv": 2, "q": "¿Qué meta resulta más eficaz para un alumno que ha suspendido todas las evaluaciones de Inglés, según el tema 7-8?", "o": ["Aprobar el próximo control de vocabulario de la unidad 5", "Llegar a un nivel C1 al terminar el Bachillerato", "Mejorar en Inglés en general este curso"], "e": "Las metas claras, específicas, razonables, moderadamente difíciles y alcanzables a corto plazo incrementan la motivación y la persistencia, y animan a lograr algo a más largo plazo (como en el ejemplo de «solo por hoy»).", "f": "D"}, {"id": "t7-a025", "t": "t7", "lv": 2, "q": "¿Qué relación establece el tema 7-8 entre la necesidad de relación y el rendimiento en Bachillerato y universidad?", "o": ["Las relaciones cordiales con los profesores aumentan la probabilidad de éxito académico", "La relación con el profesorado no influye en el rendimiento a partir de Bachillerato", "Las relaciones cordiales reducen la exigencia y empeoran el rendimiento"], "e": "La necesidad de relación es el deseo de vínculos emocionales cercanos. El tema indica que las relaciones cordiales con los profesores aumentan la probabilidad de éxito académico del alumnado de Bachillerato y universidad.", "f": "D"}, {"id": "t7-a026", "t": "t7", "lv": 2, "q": "Un docente justifica que no adapta sus tareas «porque los buenos estudiantes deben enfrentarse a retos difíciles desde el principio». Según el tema 7-8, ¿qué problema tiene su planteamiento?", "o": ["El alumnado evita las actividades con alta probabilidad de fracaso; las tareas deben estar a su alcance", "Las tareas difíciles aumentan siempre la motivación intrínseca, sea cual sea el nivel del alumno", "Las tareas deben ser muy fáciles para garantizar que todo el alumnado tenga éxito desde el principio"], "e": "Los estudiantes están menos dispuestos a participar en actividades con alta probabilidad de fracaso, por lo que necesitan tareas ajustadas a sus posibilidades: ni demasiado difíciles ni demasiado fáciles (desafío óptimo).", "f": "D"}, {"id": "t7-a027", "t": "t7", "lv": 2, "q": "¿Qué pauta del resumen del tema 7-8 conecta con la regulación de la evitación del desempeño y su ansiedad asociada?", "o": ["Reducir el riesgo de fracaso y no ridiculizar los errores, criticando hechos y no personas", "Dar más importancia a las calificaciones para que el alumnado se esfuerce", "Comparar públicamente los resultados para aumentar la motivación"], "e": "La evitación del desempeño se asocia al temor al fracaso y a ser considerado incapaz. Reducir el riesgo de fracaso y no ridiculizar los errores (criticar hechos, no personas) disminuye esa amenaza.", "f": "D"}, {"id": "t7-a028", "t": "t7", "lv": 2, "q": "La profesora de Economía de 4.º de ESO plantea: «Tenéis 1.000 € para montar una empresa en el instituto, ¿qué haríais?». Según el resumen del tema 7-8, ¿qué estrategia motivacional aplica principalmente?", "o": ["Estimular la curiosidad con un problema que resolver y mostrar la utilidad para su vida", "Reducir la autonomía para que el alumnado siga instrucciones claras", "Usar la competición para generar metas de rendimiento"], "e": "El resumen propone estimular la curiosidad e interés planteando cuestiones y problemas que resolver, y mostrar la relevancia y utilidad relacionando los contenidos con sus intereses y su vida. Coincide con las actividades relacionadas con problemas de la vida real.", "f": "D"}, {"id": "t7-a029", "t": "t7", "lv": 2, "q": "Según el tema 7-8, ¿qué rasgo distingue la motivación extrínseca de la intrínseca?", "o": ["Que la conducta busca algo que tiene poco que ver con la propia tarea", "Que la conducta se mantiene sin necesidad de incentivos ni castigos", "Que se asocia a la creatividad y al disfrute por la lectura"], "e": "En la motivación extrínseca la conducta se dirige a obtener algo ajeno a la tarea (evitar castigos, agradar a los padres, recompensas). La intrínseca no necesita incentivos ni castigos porque la actividad es gratificante en sí misma y se asocia a creatividad, comprensión y disfrute.", "f": "D"}, {"id": "t7-a030", "t": "t7", "lv": 2, "q": "Un alumno con alta motivación intrínseca por la Historia empieza a recibir 1 € por cada sobresaliente. Al cabo de un tiempo dice que solo estudia «por el dinero». Desde la teoría de la evaluación cognitiva y el tema 7-8, ¿cómo se explica?", "o": ["La recompensa traslada el motivo de su conducta al exterior y reduce su motivación intrínseca", "La recompensa externa convierte su motivación en regulación identificada, más autodeterminada", "La motivación intrínseca es estable y no puede verse afectada por recompensas externas"], "e": "La teoría de la evaluación cognitiva se refiere a la motivación intrínseca. El tema 7-8 indica que, si el alumnado experimenta menos control sobre su conducta, la motivación intrínseca baja. Una recompensa externa contingente puede desplazar el motivo de la actividad a la recompensa (regulación externa).", "f": "D"}, {"id": "t7-a031", "t": "t7", "lv": 2, "q": "En el puzle de los cuatro componentes de la autodeterminación, ¿qué componente se describe como «intentar, cometer errores y volver a intentarlo para mejorar» y con la autoestima y la confianza en uno mismo?", "o": ["Ser capaz (empoderamiento psicológico)", "Organizarse (autorregulación)", "Conocerse (realización personal)"], "e": "«Ser capaz» o empoderamiento psicológico incluye el conocimiento, la autoestima y la confianza en uno mismo, intentar, equivocarse y volver a intentar, y saber comunicar las opciones propias. Organizarse se asocia a la autorregulación y las funciones ejecutivas; conocerse, a saber quién eres.", "f": "D"}, {"id": "t7-a032", "t": "t7", "lv": 2, "q": "Según la diapositiva de los cuatro componentes, ¿qué afirmación sobre «ser autónomo» es correcta?", "o": ["Es hacer las cosas por uno mismo, pero no solo: depende también del entorno y de la cooperación", "Es actuar siempre sin ayuda de nadie para demostrar a los demás la propia independencia", "Es lo mismo que la regulación externa, porque depende de las normas que impone el entorno"], "e": "La diapositiva indica que ser autónomo es hacer las cosas por uno mismo, pero no solo; la autonomía también es resultado de un entorno propicio, de una responsabilidad colectiva y de la cooperación de quienes te rodean, y significa saber elegir y comunicar.", "f": "D"}, {"id": "t7-a033", "t": "t7", "lv": 2, "q": "Un docente plantea a su clase: «Hoy decidís el orden de las actividades y cómo presentaréis el trabajo». ¿Qué pauta del tema 7-8 aplica y con qué subteoría de la autodeterminación se relaciona?", "o": ["Fomentar la autonomía dando opciones; teoría de las necesidades básicas", "Desafío óptimo; teoría de los contenidos de meta", "Comparación consigo mismos; teoría de la orientación de causalidad"], "e": "El resumen del tema propone fomentar la autonomía (autodeterminación) dando el máximo de opciones posibles y valorando su opinión. La autonomía es una de las tres necesidades básicas (junto con competencia y relación).", "f": "D"}, {"id": "t7-a034", "t": "t7", "lv": 2, "q": "¿Qué subteoría de la autodeterminación se centraría en comparar a un alumno que estudia para ayudar a los demás en el futuro con otro que estudia para ganar mucho dinero?", "o": ["La teoría de los contenidos de meta (metas intrínsecas frente a extrínsecas)", "La teoría de la integración orgánica (continuo de autodeterminación)", "La teoría de la evaluación cognitiva (motivación intrínseca por la actividad)"], "e": "La teoría de los contenidos de meta se centra en las diferencias entre metas intrínsecas y extrínsecas y su impacto en la motivación y el bienestar de las personas.", "f": "D"}, {"id": "t7-a035", "t": "t7", "lv": 2, "q": "¿Qué pauta del resumen del tema 7-8 resulta más coherente con una evaluación orientada a metas de aprendizaje?", "o": ["Evaluar la comprensión, el progreso, el esfuerzo y la creatividad", "Evaluar solo con exámenes finales que comparen al alumnado", "Evaluar la rapidez con la que se termina la tarea"], "e": "El resumen propone procedimientos de evaluación basados en la comprensión, el progreso, el esfuerzo y la creatividad, en coherencia con el criterio absoluto y la evidencia de progreso de las metas de aprendizaje.", "f": "D"}, {"id": "t7-a036", "t": "t7", "lv": 2, "q": "Un alumno de 2.º de ESO empieza a estudiar más desde que su grupo de amigos organiza tardes de estudio juntos. ¿Qué tipo de meta explica mejor ese cambio según el tema 7-8?", "o": ["Metas sociales, dirigidas a la relación y el intercambio con otros", "Metas de evitación del trabajo, para terminar antes", "Metas de rendimiento, para superar a sus amigos en nota"], "e": "Las metas sociales se dirigen a buscar relaciones e intercambio con otros; conforme se acercan a la adolescencia ganan peso. El tema 4 añade que la presión de grupo puede tener efectos positivos, como estudiar para los exámenes.", "f": "D"}, {"id": "t7-a037", "t": "t7", "lv": 2, "q": "¿Cómo debe interpretarse que el tema 7-8 sitúe el entusiasmo del profesor entre las pautas para motivar?", "o": ["Como modelado de la motivación: el docente muestra el valor de la materia con su actitud", "Como una recompensa externa que sustituye a la motivación intrínseca del alumnado", "Como una estrategia de competición entre el profesorado para mejorar las notas"], "e": "El resumen incluye modelar la motivación por aprender y el entusiasmo del profesor. Conecta con el modelamiento del tema 4: los modelos influyen en las actitudes y conductas del alumnado.", "f": "D"}, {"id": "t7-a038", "t": "t7", "lv": 2, "q": "Una alumna con metas de dominio se equivoca en un problema. ¿Cómo interpretará el error según la tabla del tema 7-8?", "o": ["Como información y parte del aprendizaje", "Como prueba de su falta de capacidad", "Como un fracaso que debe ocultar a los demás"], "e": "Desde las metas de aprendizaje los errores se ven como información y parte del aprendizaje; desde las metas de rendimiento, como fracaso y evidencia de falta de habilidad o trabajo.", "f": "D"}, {"id": "t7-a039", "t": "t7", "lv": 2, "q": "Un orientador observa a un alumno que repite «da igual, no sirvo», se aísla y está triste desde hace semanas. Integrando los temas 5 y 7-8, ¿qué lectura es más adecuada?", "o": ["La baja autoeficacia, con atribuciones a la falta de capacidad, puede asociarse a síntomas depresivos que conviene vigilar", "Es un problema exclusivamente motivacional que se resolverá ofreciéndole recompensas externas por su esfuerzo", "Es la reacción esperable de una meta de dominio ante un error, por lo que no requiere ninguna atención"], "e": "El tema 7-8 relaciona la baja autoeficacia con sentimientos de inutilidad, autodevaluación y tristeza típicos de la depresión. El tema 5 señala el aislamiento social y el pesimismo como señales de depresión en la pubertad y pide identificar las primeras señales.", "f": "D"}, {"id": "g1-001", "t": "g1", "lv": 1, "q": "Según la guía del Ministerio, ¿qué tres características deben concurrir, como necesarias y suficientes, para hablar de acoso escolar?", "o": ["Intencionalidad, reiteración y desequilibrio de poder", "Agresión física, testigos y denuncia formal", "Conflicto previo, venganza y anonimato"], "e": "La guía establece tres características básicas: intencionalidad (conducta agresiva deliberada), reiteración (patrón de maltrato) y desequilibrio de poder (físico, psicológico o social) que impide a la víctima salir por sus propios medios.", "f": "G"}, {"id": "g1-002", "t": "g1", "lv": 1, "q": "¿Qué diferencia esencial establece la guía entre conflicto escolar y acoso escolar?", "o": ["En el conflicto las partes están en un plano de igualdad; el acoso es violencia sistemática basada en una relación asimétrica de dominio-sumisión", "El conflicto requiere siempre intervención disciplinaria; el acoso se resuelve mediante diálogo y mediación entre las partes implicadas", "El conflicto es continuado y con desequilibrio de poder; el acoso es puntual y surge de un malentendido entre iguales"], "e": "El conflicto es inherente a la convivencia y se da entre iguales; el acoso no es una confrontación entre iguales, sino violencia sistemática basada en una relación asimétrica de dominio-sumisión.", "f": "G"}, {"id": "g1-003", "t": "g1", "lv": 1, "q": "Según la guía, ¿por qué no deben aplicarse la mediación o los encuentros cara a cara en un caso de acoso?", "o": ["Porque pueden revictimizar al alumnado afectado al tratar como entre iguales una relación de desequilibrio de poder", "Porque la mediación solo es válida cuando el agresor reconoce su culpa por escrito ante la dirección del centro", "Porque los encuentros cara a cara retrasan los plazos del protocolo y solo pueden hacerse tras la fase de seguimiento"], "e": "Tratar el acoso como un conflicto ordinario, promoviendo encuentros cara a cara o mediación, puede revictimizar a la víctima. En el acoso se prioriza la protección de quien sufre el daño, sin negociación en términos de igualdad.", "f": "G"}, {"id": "g1-004", "t": "g1", "lv": 1, "q": "Según la guía, ¿cuándo empieza la reiteración que define el acoso?", "o": ["Con la primera repetición: si hay intención y desigualdad, dos episodios ya son señal suficiente para activar el protocolo", "Cuando las agresiones se mantienen de forma continuada durante al menos un trimestre y quedan documentadas por el tutor", "Desde el primer episodio aislado, aunque no exista intención de dañar ni desigualdad entre las partes"], "e": "La «regla de oro» de la guía es que la reiteración comienza con la primera repetición: si hay intención y desigualdad, dos episodios no son una coincidencia. Esperar a que el maltrato sea prolongado es un error pedagógico.", "f": "G"}, {"id": "g1-005", "t": "g1", "lv": 1, "q": "Para Ortega (2015), recogida en la guía, la reiteración en el acoso:", "o": ["No es una cuestión de cantidad sino de pervivencia de la estructura: al repetirse la agresión, el rol se «cristaliza»", "Exige un mínimo de agresiones documentadas antes de considerar que el rol de víctima y agresor se ha consolidado", "Solo es relevante cuando las agresiones se extienden durante meses, porque un patrón breve no altera los roles del grupo"], "e": "Cerezo (2009) y Ortega (2015) entienden la reiteración como evidencia de una dinámica de dominancia; para Ortega, una vez que se repite la agresión, se cristaliza el rol.", "f": "G"}, {"id": "g1-006", "t": "g1", "lv": 1, "q": "¿Cuál de las siguientes es una característica secundaria (no básica) del acoso según la guía?", "o": ["Presencia de personas espectadoras", "Intencionalidad de la conducta agresiva", "Desequilibrio de poder entre las partes"], "e": "Características secundarias: indefensión, personalización, componente grupal, presencia de personas espectadoras y falta de supervisión adulta. Las básicas son intencionalidad, reiteración y desequilibrio de poder.", "f": "G"}, {"id": "g1-007", "t": "g1", "lv": 1, "q": "La «indefensión», como característica secundaria del acoso, consiste en que la víctima:", "o": ["Siente que no puede escapar del maltrato, que haga lo que haga todo seguirá igual o que solo saldrá comportándose también de forma agresiva", "Carece de testigos que puedan confirmar su relato, por lo que el centro no puede activar el protocolo de actuación", "Se siente culpable del daño causado a otros compañeros y evita comunicarlo a los adultos por miedo a represalias"], "e": "La indefensión es la sensación de la víctima de no poder escapar del maltrato, de que todo seguirá igual o de que la única salida es comportarse también de forma agresiva.", "f": "G"}, {"id": "g1-008", "t": "g1", "lv": 1, "q": "¿Cómo define la guía el ciberacoso (Ortega et al., 2012)?", "o": ["Una agresión intencional y repetida mediante dispositivos electrónicos contra alguien que no puede defenderse fácilmente", "Cualquier mensaje ofensivo enviado por redes sociales, aunque sea aislado y entre personas con el mismo poder", "Un conflicto entre usuarios de internet que se resuelve mediante el bloqueo de perfi
